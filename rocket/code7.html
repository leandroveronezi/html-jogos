    <script>

        // --- Configurações Globais ---
        const INPUT_NODES = 7;
        const HIDDEN_NODES = 8;
        const OUTPUT_NODES = 3;
        const POPULATION_SIZE = 500;
        const MUTATION_RATE = 0.6;
        const SIMULATION_TIMEOUT_FRAMES = 1200;
        const NUM_WORKERS = Math.max(1, (navigator.hardwareConcurrency || 4) - 1);
        const LOCALSTORAGE_KEY_NN = 'bestRocketNN_v3'; // Mantido v3, mas com fitness ajustado
        const SEED_COUNT_ON_START = 5; // Quantas cópias/mutações da bestNN usar para semear

        // --- Estado Global (Main Thread) ---
        let canvas, ctx, nnCanvas, nnCtx;
        let fuelDisplay, speedDisplay, angleDisplay, fuelBarPercent, positionDisplay, windInfoDisplay, aiStatusDisplay, trainingInfoDisplay, startTrainingBtn, stopTrainingBtn, useBestAIBtn, saveBestAIBtn, loadSavedAIBtn, exportBestAIBtn, importAIBtn, importFileInput, storageStatusDisplay, clearSavedAIBtn; // Adicionado clearSavedAIBtn
        let population = [];
        let bestNN = null;
        let bestFitnessEver = -Infinity;
        let currentGeneration = 0;
        let isTraining = false;
        let aiControlled = false;
        let activeAI = null;
        let lastOutputs = [0, 0, 0];
        let gameIsOverState = false;
        let frameCount = 0;

        // Estado do foguete na Main Thread
        const rocket = {
            x: 0,
            y: 0,
            width: 20,
            height: 80,
            fuel: 0,
            speedX: 0,
            speedY: 0,
            angle: Math.PI,
            isThrusting: false,
            thrustingLeft: false,
            thrustingRight: false
        };

        const landingPad = {
            x: 0,
            y: 0,
            width: 70,
            height: 10
        };

        let windStrength = 0;
        let windDirection = 0;
        let clouds = [];
        let cloudsHeight = 0;
        const fuelMax = 200;
        const gravity = -0.05;
        const thrust = 0.15;
        const sideThrust = 0.015;
        const maxSpeedX = 5;
        const maxSpeedY = 10;

        // Estado do Treinamento Paralelo
        let workers = [];
        let tasksQueue = [];
        let resultsReceivedCount = 0;
        let populationFitness = {};
        let workersBusy = [];

        // --- Classe NeuralNetwork (sem alterações desde v3) ---
        class NeuralNetwork {
            constructor(inputNodes, hiddenNodes, outputNodes, id = null) {
                this.id = id === null ? Math.random().toString(36).substring(2, 9) : id;
                this.inputNodes = inputNodes;
                this.hiddenNodes = hiddenNodes;
                this.outputNodes = outputNodes;
                this.weights_ih = this.createMatrix(this.hiddenNodes, this.inputNodes);
                this.weights_ho = this.createMatrix(this.outputNodes, this.hiddenNodes);
                this.bias_h = this.createMatrix(this.hiddenNodes, 1);
                this.bias_o = this.createMatrix(this.outputNodes, 1);
                this.fitness = -Infinity;
            }
            createMatrix(rows, cols) {
                let m = [];
                for (let i = 0; i < rows; i++) {
                    m[i] = new Array(cols).fill(0);
                }
                return m;
            }
            randomizeMatrix(matrix) {
                for (let i = 0; i < matrix.length; i++) {
                    for (let j = 0; j < matrix[0].length; j++) {
                        matrix[i][j] = Math.random() * 2 - 1;
                    }
                }
            }
            map(matrix, func) {
                let r = this.createMatrix(matrix.length, matrix[0].length);
                for (let i = 0; i < matrix.length; i++) {
                    for (let j = 0; j < matrix[0].length; j++) {
                        r[i][j] = func(matrix[i][j]);
                    }
                }
                return r;
            }
            copyMatrix(matrix) {
                let nM = this.createMatrix(matrix.length, matrix[0].length);
                for (let i = 0; i < matrix.length; i++) {
                    for (let j = 0; j < matrix[0].length; j++) {
                        nM[i][j] = matrix[i][j];
                    }
                }
                return nM;
            }
            mapMatrices(matrixA, matrixB, func) {
                let r = this.createMatrix(matrixA.length, matrixA[0].length);
                for (let i = 0; i < matrixA.length; i++) {
                    for (let j = 0; j < matrixA[0].length; j++) {
                        r[i][j] = func(matrixA[i][j], matrixB[i][j]);
                    }
                }
                return r;
            }
            getSerializableData() {
                return {
                    id: this.id,
                    inputNodes: this.inputNodes,
                    hiddenNodes: this.hiddenNodes,
                    outputNodes: this.outputNodes,
                    weights_ih: this.weights_ih,
                    weights_ho: this.weights_ho,
                    bias_h: this.bias_h,
                    bias_o: this.bias_o,
                    fitness: this.fitness
                };
            }
            copy() {
                const newNN = new NeuralNetwork(this.inputNodes, this.hiddenNodes, this.outputNodes, this.id + '-c');
                newNN.weights_ih = this.copyMatrix(this.weights_ih);
                newNN.weights_ho = this.copyMatrix(this.weights_ho);
                newNN.bias_h = this.copyMatrix(this.bias_h);
                newNN.bias_o = this.copyMatrix(this.bias_o);
                newNN.fitness = this.fitness;
                return newNN;
            }
            mutate(mutationRate) {
                const mutateValue = (val) => {
                    if (Math.random() < mutationRate) {
                        // Usar distribuição normal (Box-Muller) para mutações mais centradas
                        let u = 0, v = 0;
                        while (u === 0) u = Math.random(); //Evita log(0)
                        while (v === 0) v = Math.random();
                        let num = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
                        // Ajustar a força da mutação (desvio padrão)
                        let offset = num * 0.15; // Reduzido um pouco a força padrão
                        return val + offset;
                    }
                    return val;
                };
                this.weights_ih = this.map(this.weights_ih, mutateValue);
                this.weights_ho = this.map(this.weights_ho, mutateValue);
                this.bias_h = this.map(this.bias_h, mutateValue);
                this.bias_o = this.map(this.bias_o, mutateValue);
            }
            crossover(partner) {
                const child = new NeuralNetwork(this.inputNodes, this.hiddenNodes, this.outputNodes, this.id.split('-')[0] + '-x' + Math.random().toString(36).substring(2, 5));
                // Crossover uniforme simples
                const crossoverValue = (valA, valB) => (Math.random() < 0.5 ? valA : valB);

                // Crossover por média ponderada (exemplo, pode ser mais complexo)
                // const crossoverValue = (valA, valB) => {
                //     const weight = Math.random();
                //     return valA * weight + valB * (1 - weight);
                // };

                child.weights_ih = this.mapMatrices(this.weights_ih, partner.weights_ih, crossoverValue);
                child.weights_ho = this.mapMatrices(this.weights_ho, partner.weights_ho, crossoverValue);
                child.bias_h = this.mapMatrices(this.bias_h, partner.bias_h, crossoverValue);
                child.bias_o = this.mapMatrices(this.bias_o, partner.bias_o, crossoverValue);
                return child;
            }
            predict(inputArray) {
                // Funções internas otimizadas para performance (sem validação excessiva)
                const activation = x => 1 / (1 + Math.exp(-x)); // Sigmoid
                // const activation = x => Math.tanh(x); // Tanh (alternativa)
                // const activation = x => Math.max(0, x); // ReLU (alternativa)

                const createMatrix = (r, c) => {
                    let m = [];
                    for (let i = 0; i < r; i++) m[i] = new Array(c).fill(0);
                    return m;
                };
                const arrayToMatrix = (arr) => {
                    let m = createMatrix(arr.length, 1);
                    for (let i = 0; i < arr.length; i++) m[i][0] = arr[i];
                    return m;
                };
                const matrixToArray = (m) => {
                    let a = [];
                    for (let i = 0; i < m.length; i++) a.push(m[i][0]);
                    return a;
                };
                const multiply = (mA, mB) => {
                    const rA = mA.length, cA = mA[0].length, cB = mB[0].length;
                    let res = createMatrix(rA, cB);
                    for (let i = 0; i < rA; i++) {
                        for (let j = 0; j < cB; j++) {
                            let s = 0;
                            for (let k = 0; k < cA; k++) {
                                s += mA[i][k] * mB[k][j]; // Otimizado para j=0 no caso de vetor
                            }
                            res[i][j] = s;
                        }
                    }
                    return res;
                };
                const add = (mA, mB) => {
                    let res = createMatrix(mA.length, mA[0].length);
                    for (let i = 0; i < mA.length; i++)
                        for (let j = 0; j < mA[0].length; j++) res[i][j] = mA[i][j] + mB[i][j];
                    return res;
                };
                const map = (m, fn) => {
                    let res = createMatrix(m.length, m[0].length);
                    for (let i = 0; i < m.length; i++)
                        for (let j = 0; j < m[0].length; j++) res[i][j] = fn(m[i][j]);
                    return res;
                };

                // Processamento Feedforward
                let inputs = arrayToMatrix(inputArray);
                let hidden = multiply(this.weights_ih, inputs);
                hidden = add(hidden, this.bias_h);
                hidden = map(hidden, activation);

                let output = multiply(this.weights_ho, hidden);
                output = add(output, this.bias_o);
                output = map(output, activation); // Usa a mesma ativação na saída

                return matrixToArray(output);
            }
            static fromData(data) {
                if (!data || !data.weights_ih || !data.bias_o || !data.inputNodes || !data.hiddenNodes || !data.outputNodes) {
                    console.error("Dados incompletos ou inválidos para NeuralNetwork.fromData:", data);
                    return null;
                }
                try {
                    const nn = new NeuralNetwork(data.inputNodes, data.hiddenNodes, data.outputNodes, data.id || 'loaded-' + Math.random().toString(36).substring(2, 7));

                    // Verificação básica de dimensões (adapte se necessário)
                    if (data.weights_ih.length !== nn.hiddenNodes || data.weights_ih[0].length !== nn.inputNodes ||
                        data.weights_ho.length !== nn.outputNodes || data.weights_ho[0].length !== nn.hiddenNodes ||
                        data.bias_h.length !== nn.hiddenNodes || data.bias_h[0].length !== 1 ||
                        data.bias_o.length !== nn.outputNodes || data.bias_o[0].length !== 1) {
                        console.warn(`Incompatibilidade de dimensões ao carregar NN (ID: ${data.id}). Configuração atual: ${nn.inputNodes}-${nn.hiddenNodes}-${nn.outputNodes}. Dados: Configuração talvez diferente. Tentando carregar mesmo assim.`);
                        // Poderia lançar um erro aqui se a incompatibilidade for crítica
                    }

                    nn.weights_ih = nn.copyMatrix(data.weights_ih);
                    nn.weights_ho = nn.copyMatrix(data.weights_ho);
                    nn.bias_h = nn.copyMatrix(data.bias_h);
                    nn.bias_o = nn.copyMatrix(data.bias_o);
                    nn.fitness = data.fitness !== undefined ? data.fitness : -Infinity;
                    return nn;
                } catch (error) {
                    console.error("Erro ao reconstruir NN a partir dos dados:", error, data);
                    return null;
                }
            }
        }

        // --- Código do Web Worker (string - FITNESS AJUSTADO) ---
        // --- Código do Web Worker (string - COM PENALIDADE PARA POUSO PASSIVO) ---
        const workerCode = `
// --- Constantes (serão recebidas da main thread) ---
let INPUT_NODES, HIDDEN_NODES, OUTPUT_NODES;
let SIMULATION_TIMEOUT_FRAMES;
let canvasWidth, canvasHeight; // Tamanho lógico do canvas
let gravity, thrust, sideThrust, maxSpeedX, maxSpeedY, fuelMax;
let landingPadWidth, landingPadHeight; // Dimensões do pad

// --- Funções Utilitárias do Worker (idênticas) ---
const activation = x => 1 / (1 + Math.exp(-x));
const createMatrix = (rows, cols) => {
    let m = [];
    for (let i = 0; i < rows; i++) {
        m[i] = new Array(cols).fill(0);
    }
    return m;
};
const arrayToMatrix = (arr) => {
    let m = createMatrix(arr.length, 1);
    for (let i = 0; i < arr.length; i++) {
        m[i][0] = arr[i];
    }
    return m;
};
const matrixToArray = (matrix) => {
    let arr = [];
    for (let i = 0; i < matrix.length; i++) {
        arr.push(matrix[i][0]);
    }
    return arr;
};
const multiply = (mA, mB) => {
    const rA = mA.length, cA = mA[0].length, rB = mB.length, cB = mB[0].length;
    if (cA !== rB) return null;
    let res = createMatrix(rA, cB);
    for (let i = 0; i < rA; i++) {
        for (let j = 0; j < cB; j++) {
            let s = 0;
            for (let k = 0; k < cA; k++) {
                s += mA[i][k] * (cB === 1 ? mB[k][0] : mB[k][j]);
            }
            res[i][j] = s;
        }
    }
    return res;
};
const add = (mA, mB) => {
    if (mA.length !== mB.length || mA[0].length !== mB[0].length) return null;
    let res = createMatrix(mA.length, mA[0].length);
    for (let i = 0; i < mA.length; i++)
        for (let j = 0; j < mA[0].length; j++) res[i][j] = mA[i][j] + mB[i][j];
    return res;
};
const map = (m, fn) => {
    let res = createMatrix(m.length, m[0].length);
    for (let i = 0; i < m.length; i++)
        for (let j = 0; j < m[0].length; j++) res[i][j] = fn(m[i][j]);
    return res;
};

// --- Lógica de Predição da Rede Neural (dentro do worker - idêntica) ---
function predict(inputArray, nnData) {
    let inputs = arrayToMatrix(inputArray);
    let hidden = multiply(nnData.weights_ih, inputs);
    hidden = add(hidden, nnData.bias_h);
    hidden = map(hidden, activation);
    let output = multiply(nnData.weights_ho, hidden);
    output = add(output, nnData.bias_o);
    output = map(output, activation);
    return matrixToArray(output);
}

// --- Função Principal de Simulação no Worker (COM RASTREAMENTO DE PROPULSORES) ---
function runSimulationForNN(nnData, simConfig) {
    // Estado inicial da simulação específica
    let r = {
        x: simConfig.startX,
        y: simConfig.startY,
        width: 20,
        height: 80,
        fuel: fuelMax,
        speedX: simConfig.startSpeedX,
        speedY: simConfig.startSpeedY,
        angle: simConfig.startAngle,
        isThrusting: false,
        thrustingLeft: false,
        thrustingRight: false
    };
    const pad = {
        x: simConfig.landingPadX,
        y: 0, // Base do canvas é y=0
        width: landingPadWidth,
        height: landingPadHeight
    };
    const currentWindStrength = simConfig.windStrength;
    const currentWindDirection = simConfig.windDirection;
    let localFrameCount = 0;
    let gameOver = false;
    let success = false;
    let reason = "";

    // *** Rastreamento de uso dos propulsores ***
    let usedMainThruster = false;
    let usedSideThruster = false;
    // ******************************************

    // Loop de simulação
    while (!gameOver && localFrameCount < SIMULATION_TIMEOUT_FRAMES) {
        localFrameCount++;
        // 1. Controle IA
        if (r.fuel > 0) {
            const normX = (r.x + r.width / 2) / canvasWidth;
            const normY = Math.max(0, Math.min(1, r.y / canvasHeight));
            const normVx = Math.max(-1, Math.min(1, r.speedX / maxSpeedX));
            const normVy = Math.max(-1, Math.min(1, r.speedY / maxSpeedY));
            let normAngle = (r.angle - Math.PI) / Math.PI;
            if (normAngle > 1) normAngle -= 2;
            if (normAngle < -1) normAngle += 2;
            const normAng = Math.max(-1, Math.min(1, normAngle));
            const targetCenterX = pad.x + pad.width / 2;
            const distToTargetX = (targetCenterX - (r.x + r.width / 2)) / (canvasWidth / 2);
            const normDistX = Math.max(-1, Math.min(1, distToTargetX));
            const normWind = Math.max(-1, Math.min(1, currentWindStrength * currentWindDirection * 2));
            const inputs = [normX, normY, normVx, normVy, normAng, normDistX, normWind];
            const outputs = predict(inputs, nnData);
            const threshold = 0.55;
            r.isThrusting = outputs[0] > threshold;
            r.thrustingLeft = outputs[1] > threshold;
            r.thrustingRight = outputs[2] > threshold;
            if (r.thrustingLeft && r.thrustingRight) {
                if (outputs[1] > outputs[2]) r.thrustingRight = false;
                else r.thrustingLeft = false;
            }

            // *** Atualiza flags de uso dos propulsores ***
            if (r.isThrusting) usedMainThruster = true;
            if (r.thrustingLeft || r.thrustingRight) usedSideThruster = true;
            // ******************************************

        } else {
            r.isThrusting = false;
            r.thrustingLeft = false;
            r.thrustingRight = false;
        }
        // 2. Física (Idêntica)
        r.speedY += gravity;
        const windEffect = currentWindStrength * currentWindDirection * 0.015 * Math.max(0.1, r.y / canvasHeight);
        r.speedX += windEffect;
        if (r.isThrusting && r.fuel > 0) {
            const angle = r.angle;
            r.speedX += thrust * Math.sin(angle);
            r.speedY += -thrust * Math.cos(angle);
            r.fuel -= 0.35;
        }
        if (r.thrustingLeft && r.fuel > 0) {
            r.angle += sideThrust;
            r.fuel -= 0.08;
        }
        if (r.thrustingRight && r.fuel > 0) {
            r.angle -= sideThrust;
            r.fuel -= 0.08;
        }
        r.angle = (r.angle + 2 * Math.PI) % (2 * Math.PI);
        r.speedX = Math.max(-maxSpeedX, Math.min(maxSpeedX, r.speedX));
        r.speedY = Math.max(-maxSpeedY * 1.5, Math.min(maxSpeedY, r.speedY));
        r.y += r.speedY;
        r.x += r.speedX;

        // 3. Fim de Jogo (Idêntico na lógica de colisão/pouso)
        const rBY = r.y;
        const safeLandSpeedY = 1.5;
        const safeLandSpeedX = 1.0;
        const angleTolerance = 15 * (Math.PI / 180);
        const angleDiff = Math.abs(r.angle - Math.PI);
        const isAngleSafe = (angleDiff <= angleTolerance || Math.abs(angleDiff - 2 * Math.PI) <= angleTolerance);

        if (r.x <= 0 || r.x + r.width >= canvasWidth) {
            gameOver = true;
            success = false;
            reason = "Colidiu Lateralmente";
        } else if (rBY <= pad.height) {
            if (r.x + r.width > pad.x && r.x < pad.x + pad.width) {
                if (Math.abs(r.speedY) <= safeLandSpeedY && Math.abs(r.speedX) <= safeLandSpeedX && isAngleSafe) {
                    gameOver = true;
                    success = true; // Sucesso inicial pela física
                    reason = "Pouso Suave!";
                } else {
                    let cr = "";
                    if (Math.abs(r.speedY) > safeLandSpeedY) cr += 'VelY alta (' + (-r.speedY * 10).toFixed(1) + '). ';
                    if (Math.abs(r.speedX) > safeLandSpeedX) cr += 'VelX alta (' + (r.speedX * 10).toFixed(1) + '). ';
                    if (!isAngleSafe) {
                        let deg = (r.angle * 180 / Math.PI) - 180;
                        deg = (deg + 360) % 360; if (deg > 180) deg -= 360;
                        cr += 'Ângulo ruim (' + Math.round(deg) + '°).';
                    }
                    gameOver = true;
                    success = false;
                    reason = "Crash Plataforma: " + cr;
                }
            } else {
                gameOver = true;
                success = false;
                reason = "Caiu fora.";
            }
        }
    } // Fim do loop while

    if (!gameOver && localFrameCount >= SIMULATION_TIMEOUT_FRAMES) {
        gameOver = true;
        success = false;
        reason = "Timeout";
    }

    // 4. Avaliação Final e Fitness

    // **** Penalidade por Pouso Passivo ****
    // Verifica APÓS o loop, se o pouso foi sucesso pela física, mas não houve manobra
    if (success && (!usedMainThruster || !usedSideThruster)) {
        //success = false; // Marca como falha
        reason = "Falha: Pouso passivo sem manobra (Req: Principal E Lateral)";
        // Opcional: Log específico no console do worker
        // console.log(\`Simulação \${nnData.id} penalizada por pouso passivo.\`);
    }
    // *************************************

    // Calcula o fitness baseado no status final (success pode ter sido modificado)
    const fitness = calculateFitnessWorker(success, reason, r, pad);
    return {
        fitness: fitness,
        success: success, // Retorna o status final de sucesso/falha
        reason: reason
    };
}


// --- Cálculo de Fitness (Usando a versão ajustada v3.1) ---
function calculateFitnessWorker(landedSuccess, reason, rocketState, padState) {
    let fitness = 0;

    const targetCenterX = padState.x + padState.width / 2;
    const distToPadCenter = Math.abs((rocketState.x + rocketState.width / 2) - targetCenterX);
    const finalSpeedYAbs = Math.abs(rocketState.speedY);
    const finalSpeedXAbs = Math.abs(rocketState.speedX);
    const angleDiff = Math.abs(rocketState.angle - Math.PI);
    const angleError = Math.min(angleDiff, Math.abs(angleDiff - 2 * Math.PI)); // Erro absoluto do ângulo ideal (0)

    if (landedSuccess) {
        // Pouso bem-sucedido E com manobra (verificação feita antes)
        fitness = 8000; // Bônus base
        fitness += 6000 / (1 + distToPadCenter * 0.4); // Bônus precisão X (alto)
        fitness += 2000 / (1 + finalSpeedYAbs * 10);  // Bônus vel Y baixa
        fitness += 1500 / (1 + finalSpeedXAbs * 15); // Bônus vel X baixa
        //fitness -= angleError * 500; // Penalidade ângulo imperfeito
        fitness += Math.max(0, rocketState.fuel) * 0.5; // Bônus combustível (baixo)

        if (reason.includes("Pouso passivo")) fitness -= 8000; // Penalidade extra específica

    } else {
        // Falha (crash, caiu fora, timeout OU pouso passivo)
        fitness -= 500; // Penalidade base por falha
        fitness -= 100 * distToPadCenter; // Penalidade distância
        fitness -= finalSpeedYAbs * 15; // Penalidade vel Y alta
        fitness -= finalSpeedXAbs * 10; // Penalidade vel X alta

        if (reason.includes("Timeout")) fitness -= 600;
        if (reason.includes("Lateral")) fitness -= 400;
        if (reason.includes("Pouso passivo")) fitness -= 2000; // Penalidade extra específica

        fitness -= angleError * 20; // Penalidade forte por ângulo ruim
        fitness -= (fuelMax - Math.max(0, rocketState.fuel)) * 0.5; // Penalidade gastar combustível e falhar
        fitness = Math.max(-8000, fitness); // Limite inferior
    }

    return isNaN(fitness) ? -Infinity : fitness;
}

                        ? data.fitness.toFixed(3)
                        : 'N/A';

                    storageStatusDisplay.style.color = '#006400'; // Verde escuro

                    storageStatusDisplay.innerText = `IA local: Erro ao ler dados`;
                    storageStatusDisplay.style.color = '#8B0000'; // Vermelho escuro

        }

        function updateWindInfo() {

        function resetWind() {
            // Chance maior de ter algum vento
            if (Math.random() < 0.15) { // 15% chance de sem vento
                windStrength = 0;
                windDirection = 0;
            } else {
                // Distribuição mais provável para ventos leves/moderados
                windStrength = Math.random() * Math.random() * 0.9 + 0.1; // Varia de 0.1 a 1.0, com bias para valores menores
                windDirection = Math.random() < 0.5 ? -1 : 1; // 50/50 Direita/Esquerda
            }
            // console.log(`Vento resetado: Força=${windStrength.toFixed(2)}, Direção=${windDirection}`);
        }

        // --- Lógica do Jogo (Main Thread - sem alterações) ---
        function updateGameLogic() {
            // Não atualiza se o jogo acabou ou está treinando
            if (gameIsOverState || isTraining) return;

            frameCount++;

            // Aplica gravidade
            rocket.speedY += gravity;

            // Aplica efeito do vento (dependente da altura)
            const windEffect = windStrength * windDirection * 0.015 * Math.max(0.1, rocket.y / canvas.height);
            rocket.speedX += windEffect;

            // Aplica propulsão principal se ativa e com combustível
            if (rocket.isThrusting && rocket.fuel > 0) {
                const angle = rocket.angle; // Ângulo em radianos (0 = direita, PI/2 = cima, PI = esquerda, etc.)
                // Decompõe o empuxo nas componentes X e Y baseado no ângulo
                rocket.speedX += thrust * Math.sin(angle);
                rocket.speedY += -thrust * Math.cos(angle); // Cosseno negativo porque Y aumenta para baixo
                rocket.fuel -= 0.35; // Consome combustível
                rocket.fuel = Math.max(0, rocket.fuel); // Garante que não fique negativo
            }

            // Aplica propulsão lateral esquerda (gira anti-horário)
            if (rocket.thrustingLeft && rocket.fuel > 0) {
                rocket.angle += sideThrust; // Aumenta o ângulo
                rocket.fuel -= 0.08; // Consome menos combustível
                rocket.fuel = Math.max(0, rocket.fuel);
            }

            // Aplica propulsão lateral direita (gira horário)
            if (rocket.thrustingRight && rocket.fuel > 0) {
                rocket.angle -= sideThrust; // Diminui o ângulo
                rocket.fuel -= 0.08;
                rocket.fuel = Math.max(0, rocket.fuel);
            }

            // Mantém o ângulo dentro de 0 a 2*PI
            rocket.angle = (rocket.angle + 2 * Math.PI) % (2 * Math.PI);

            // Limita as velocidades máximas
            rocket.speedX = Math.max(-maxSpeedX, Math.min(maxSpeedX, rocket.speedX));
            rocket.speedY = Math.max(-maxSpeedY * 1.5, Math.min(maxSpeedY, rocket.speedY)); // Permite cair um pouco mais rápido

            // Atualiza a posição do foguete
            rocket.y += rocket.speedY;
            rocket.x += rocket.speedX;

            // Verifica condições de fim de jogo
            checkGameOverConditions();
        }

        function checkGameOverConditions() {
            // Só verifica se o jogo está rodando e não treinando
            if (gameIsOverState || isTraining) return;

            const rBY = rocket.y; // Posição Y da base do foguete (aproximado)
            const safeLandSpeedY = 1.5; // Velocidade vertical máxima segura para pouso
            const safeLandSpeedX = 1.0; // Velocidade horizontal máxima segura para pouso
            const angleTolerance = 15 * (Math.PI / 180); // Tolerância angular (15 graus)

            // Calcula a diferença absoluta do ângulo atual para o ângulo ideal (PI = reto para cima)
            const angleDiff = Math.abs(rocket.angle - Math.PI);
            // Verifica se o ângulo está dentro da tolerância, considerando a volta (360 graus)
            const isAngleSafe = angleDiff <= angleTolerance || Math.abs(angleDiff - 2 * Math.PI) <= angleTolerance;

            let landedSafely = false;
            let crashReason = "";

            // 1. Colisão com as bordas laterais do canvas
            if (rocket.x <= 0 || rocket.x + rocket.width >= canvas.width) {
                endSimulation(false, "Colidiu Lateralmente");
                return; // Fim de jogo
            }

            // 2. Colisão com o chão (y <= altura do pad)
            // A coordenada Y 0 é a base do canvas transladado, então checar <= pad.height
            if (rBY <= landingPad.height) {
                // Verifica se a colisão ocorreu horizontalmente sobre a plataforma
                if (rocket.x + rocket.width > landingPad.x && rocket.x < landingPad.x + landingPad.width) {
                    // Pousou na plataforma. Verificar segurança:
                    if (Math.abs(rocket.speedY) <= safeLandSpeedY &&
                        Math.abs(rocket.speedX) <= safeLandSpeedX &&
                        isAngleSafe) {
                        // Pouso seguro!
                        landedSafely = true;
                    } else {
                        // Pouso ruim (crash) na plataforma. Montar a razão:
                        if (Math.abs(rocket.speedY) > safeLandSpeedY) {
                            crashReason += `VelY alta (${(-rocket.speedY * 3.6).toFixed(1)} km/h). `;
                        }
                        if (Math.abs(rocket.speedX) > safeLandSpeedX) {
                            crashReason += `VelX alta (${(rocket.speedX * 3.6).toFixed(1)} km/h). `;
                        }
                        if (!isAngleSafe) {
                            let deg = (rocket.angle * 180 / Math.PI) - 180;
                            deg = (deg + 360) % 360;
                            if (deg > 180) deg -= 360;
                            crashReason += `Ângulo ruim (${Math.round(deg)}°).`;
                        }
                        crashReason = "Crash Plataforma: " + crashReason;
                    }
                    // Fim de jogo (pouso ou crash na plataforma)
                    endSimulation(landedSafely, landedSafely ? "Pouso Suave!" : crashReason);
                } else {
                    // Caiu no chão fora da plataforma
                    endSimulation(false, "Caiu fora da plataforma.");
                }
            }
            // Se nenhuma condição de fim foi atingida, o jogo continua
        }

        function endSimulation(success, message) {
            // Só encerra uma vez e se não estiver treinando
            if (gameIsOverState || isTraining) return;

            gameIsOverState = true;
            // Desliga motores visualmente
            rocket.isThrusting = false;
            rocket.thrustingLeft = false;
            rocket.thrustingRight = false;

            // Exibe a mensagem após um pequeno delay para o último frame renderizar
            setTimeout(() => {
                alert(message + `\n(Pressione R para reiniciar)`);
                // Não reseta automaticamente, espera o usuário pressionar R
                // resetGame();
            }, 150);
        }

        function getCurrentNNInputs(rocketState, padState, currentWindStrength, currentWindDirection) {
            // Normaliza as entradas para a rede neural (geralmente entre -1 e 1 ou 0 e 1)

            // Posição X normalizada (0 a 1)
            const normX = (rocketState.x + rocketState.width / 2) / canvas.width;

            // Posição Y normalizada (0 a 1+, clampado em 0 e 1 talvez?)
            // Clampado entre 0 e 1.1 para dar uma margem acima da tela
            const normY = Math.max(0, Math.min(1.1, rocketState.y / canvas.height));

            // Velocidade X normalizada (-1 a 1)
            const normVx = Math.max(-1, Math.min(1, rocketState.speedX / maxSpeedX));

            // Velocidade Y normalizada (-1 a 1)
            const normVy = Math.max(-1, Math.min(1, rocketState.speedY / maxSpeedY));

            // Ângulo normalizado (-1 a 1), onde 0 rad = PI (reto pra cima)
            let normAngle = (rocketState.angle - Math.PI) / Math.PI;
            // Ajusta o wrap around para manter em [-1, 1]
            if (normAngle > 1) normAngle -= 2;
            if (normAngle < -1) normAngle += 2;
            const normAng = Math.max(-1, Math.min(1, normAngle));

            // Distância horizontal normalizada do centro do foguete ao centro do pad (-1 a 1)
            const targetCenterX = padState.x + padState.width / 2;
            const rocketCenterX = rocketState.x + rocketState.width / 2;
            // Distância relativa à metade da largura da tela (para escala)
            const distToTargetX = (targetCenterX - rocketCenterX) / (canvas.width / 2);
            const normDistX = Math.max(-1, Math.min(1, distToTargetX));

            // Força e direção do vento combinadas e normalizadas (-1 a 1)
            // Multiplicar por 2 ajuda a usar a faixa -1 a 1 mais efetivamente se windStrength for 0 a 1
            const normWind = Math.max(-1, Math.min(1, currentWindStrength * currentWindDirection * 2));

            return [normX, normY, normVx, normVy, normAng, normDistX, normWind];
        }


        function controlRocketWithAI() {
            // Só controla se a IA está ativa, tem combustível, jogo rodando e não treinando
            if (!aiControlled || !activeAI || rocket.fuel <= 0 || gameIsOverState || isTraining) {
                // Garante que os motores estejam desligados se a IA não puder controlar
                if (!isTraining) { // Só desliga se não estiver treinando (no treino não há controle ativo)
                    rocket.isThrusting = false;
                    rocket.thrustingLeft = false;
                    rocket.thrustingRight = false;
                }
                lastOutputs = [0, 0, 0]; // Reseta as últimas saídas
                return;
            }

            try {
                // 1. Obter as entradas normalizadas para a rede neural
                const inputs = getCurrentNNInputs(rocket, landingPad, windStrength, windDirection);

                // 2. Fazer a predição usando a rede neural ativa
                const outputs = activeAI.predict(inputs);
                lastOutputs = outputs; // Armazena as saídas para visualização

                // 3. Interpretar as saídas da rede neural para controlar os motores
                const threshold = 0.55; // Limiar de ativação (ajustável)

                rocket.isThrusting = outputs[0] > threshold;
                rocket.thrustingLeft = outputs[1] > threshold;
                rocket.thrustingRight = outputs[2] > threshold;

                // Lógica para evitar acionar ambos os motores laterais simultaneamente
                // Se ambos estiverem acima do limiar, ativa apenas o que tiver maior saída
                if (rocket.thrustingLeft && rocket.thrustingRight) {
                    if (outputs[1] > outputs[2]) {
                        rocket.thrustingRight = false;
                    } else {
                        rocket.thrustingLeft = false;
                    }
                }
            } catch (error) {
                console.error("Erro ao controlar foguete com IA:", error, activeAI);
                // Desativa a IA em caso de erro para evitar loop de falhas
                aiControlled = false;
                activeAI = null;
                aiStatusDisplay.innerText = `Controle: Humano (Erro IA)`;
                rocket.isThrusting = false;
                rocket.thrustingLeft = false;
                rocket.thrustingRight = false;
            }
        }

        // --- Lógica do Algoritmo Genético (nextGeneration - sem alterações desde v3) ---
        function nextGeneration() {
            currentGeneration++;
            console.log(`%c--- Processando Geração ${currentGeneration - 1} para ${currentGeneration} ---`, 'color: blue; font-weight: bold');

            // 1. Atribuir Fitness e Validar
            let foundValidFitness = false;
            let minFitness = Infinity;
            let maxFitness = -Infinity;
            population.forEach(nn => {
                const fitness = populationFitness[nn.id];
                // Atribui fitness, tratando NaN ou undefined como -Infinity
                nn.fitness = (fitness !== undefined && fitness !== null && !isNaN(fitness)) ? fitness : -Infinity;

                if (nn.fitness > -Infinity) {
                    foundValidFitness = true;
                    if (nn.fitness < minFitness) minFitness = nn.fitness;
                    if (nn.fitness > maxFitness) maxFitness = nn.fitness;
                }
            });

            // Se nenhum indivíduo teve fitness válido, é um erro grave
            if (!foundValidFitness) {
                console.error(`ERRO CRÍTICO: Nenhum fitness válido encontrado para G ${currentGeneration - 1}. Parando o treinamento.`);
                stopTraining();
                alert("Erro crítico no cálculo de fitness. Treinamento interrompido.");
                return;
            }
            console.log(`G ${currentGeneration - 1} Fitness Range: ${minFitness.toFixed(3)} a ${maxFitness.toFixed(3)}`);

            // 2. Ordenar por Fitness (Decrescente)
            population.sort((a, b) => b.fitness - a.fitness);

            // 3. Atualizar Melhor Global (Elitismo Global)
            if (population[0].fitness > bestFitnessEver) {
                bestFitnessEver = population[0].fitness;
                bestNN = population[0].copy(); // Copia o melhor da geração atual
                bestNN.id = `best-G${currentGeneration - 1}`; // Renomeia para indicar a origem
                console.log(`%cNovo Melhor Fitness Global (G${currentGeneration - 1}): ${bestFitnessEver.toFixed(3)} por ${population[0].id}`, 'color: green; font-weight: bold;');
                updateButtonStates(); // Habilita salvar/exportar etc.
            } else if (bestNN) {
                // Log para acompanhar o melhor da geração vs o melhor global
                console.log(`Melhor Fitness G ${currentGeneration - 1}: ${population[0].fitness.toFixed(3)} (ID: ${population[0].id}). Melhor global ainda é ${bestFitnessEver.toFixed(3)} (ID: ${bestNN.id})`);
            } else {
                // Caso raro: primeira geração ou bestNN foi resetado
                bestFitnessEver = population[0].fitness;
                bestNN = population[0].copy();
                bestNN.id = `best-G${currentGeneration - 1}`;
                console.log(`%cDefinido Primeiro Melhor Fitness Global (G${currentGeneration - 1}): ${bestFitnessEver.toFixed(3)} por ${population[0].id}`, 'color: green; font-weight: bold;');
                updateButtonStates();
            }


            // 4. Seleção e Criação da Nova Geração
            const newPopulation = [];

            // 4.1 Elitismo Local: Mantém os melhores da geração atual diretamente
            const eliteCount = Math.max(1, Math.floor(POPULATION_SIZE * 0.05)); // 5% de elite
            for (let i = 0; i < eliteCount && i < population.length; i++) {
                let eliteCopy = population[i].copy();
                eliteCopy.id = `G${currentGeneration}-elite-${i}`; // Novo ID para a nova geração
                newPopulation.push(eliteCopy);
            }

            // 4.2 Seleção por Roleta (ou Torneio) e Crossover
            const selectionPool = [];
            // Normaliza fitness para seleção por roleta (evita fitness negativo)
            // Adiciona 1 para garantir que mesmo o pior tenha uma pequena chance se minFitness for 0
            const fitnessOffset = minFitness <= 0 ? Math.abs(minFitness) + 1 : 0;
            let totalNormalizedFitness = 0;
            population.forEach(nn => {
                if (nn.fitness > -Infinity) { // Considera apenas os que têm fitness válido
                    totalNormalizedFitness += (nn.fitness + fitnessOffset);
                }
            });


            if (totalNormalizedFitness > 0) {
                // Cria o pool de seleção baseado no fitness normalizado (Roleta)
                // Cada indivíduo entra N vezes proporcionalmente ao seu fitness
                population.forEach(nn => {
                    if (nn.fitness > -Infinity) {
                        const normalizedFitness = nn.fitness + fitnessOffset;
                        const numCopies = Math.ceil((normalizedFitness / totalNormalizedFitness) * POPULATION_SIZE * 1.2); // Fator 1.2 para inflar um pouco o pool
                        for (let j = 0; j < numCopies && selectionPool.length < POPULATION_SIZE * 5; j++) { // Limita tamanho do pool
                            selectionPool.push(nn);
                        }
                    }
                });
            }

            // Fallback: Se a roleta falhar (fitness muito baixo ou homogêneo), usa seleção por torneio ou ranking
            if (selectionPool.length < 2) {
                console.warn("Pool de seleção por roleta muito pequeno ou vazio. Usando os melhores 50% como pool.");
                const halfSize = Math.max(2, Math.ceil(population.length / 2));
                for (let i = 0; i < halfSize; i++) {
                    selectionPool.push(population[i]);
                    selectionPool.push(population[i]); // Adiciona duas vezes para aumentar chance
                }
            }
            if (selectionPool.length < 2 && population.length >= 2) {
                console.error("Falha crítica na seleção. Usando população antiga como pool.");
                selectionPool.push(...population); // Último recurso
            }


            // 4.3 Gerar Filhos por Crossover e Mutação
            while (newPopulation.length < POPULATION_SIZE && selectionPool.length > 1) {
                // Seleciona dois pais aleatoriamente do pool
                let parentA = selectionPool[Math.floor(Math.random() * selectionPool.length)];
                let parentB = selectionPool[Math.floor(Math.random() * selectionPool.length)];
                let attempts = 0;
                // Tenta garantir que os pais sejam diferentes (se possível)
                while (parentA === parentB && selectionPool.length > 1 && attempts < 10) {
                    parentB = selectionPool[Math.floor(Math.random() * selectionPool.length)];
                    attempts++;
                }

                // Gera o filho através do crossover
                let child = parentA.crossover(parentB);
                child.id = `G${currentGeneration}-child-${newPopulation.length}`; // Novo ID

                // Aplica mutação no filho
                child.mutate(MUTATION_RATE);

                newPopulation.push(child);
            }

            // 4.4 Preenchimento (se necessário)
            // Se faltarem indivíduos, preenche com mutações da elite ou aleatórios
            if (newPopulation.length < POPULATION_SIZE && newPopulation.length > 0) {
                const missing = POPULATION_SIZE - newPopulation.length;
                console.warn(`Preenchendo ${missing} indivíduos faltantes com mutações da elite.`);
                for (let i = 0; i < missing; i++) {
                    let eliteParent = newPopulation[Math.floor(Math.random() * Math.min(eliteCount, newPopulation.length))]; // Pega um da elite já na nova população
                    let fillerChild = eliteParent.copy();
                    fillerChild.id = `G${currentGeneration}-filler-${newPopulation.length}`;
                    fillerChild.mutate(MUTATION_RATE * 1.5); // Mutação um pouco mais forte para diversificar
                    newPopulation.push(fillerChild);
                }
            } else if (newPopulation.length === 0) {
                console.error("ERRO CRÍTICO: Nova população ficou vazia após seleção/crossover. Parando.");
                stopTraining();
                alert("Erro crítico: Nova população vazia. Treinamento interrompido.");
                return;
            }


            // 5. Atualizar a População e Resetar Estado da Geração
            population = newPopulation;
            populationFitness = {}; // Limpa os fitness antigos
            resultsReceivedCount = 0; // Zera a contagem de resultados recebidos

            console.log(`Nova População G${currentGeneration} criada. Tamanho: ${population.length}`);
        }

        // --- Gerenciamento dos Workers e Treinamento (sem alterações desde v3) ---
        function createWorkers() {
            console.log(`Criando ${NUM_WORKERS} workers...`);
            let workerUrl = '';
            try {
                // Cria um Blob com o código do worker
                const workerBlob = new Blob([workerCode], {
                    type: 'application/javascript'
                });
                // Cria uma URL para o Blob
                workerUrl = URL.createObjectURL(workerBlob);
            } catch (e) {
                console.error("Falha ao criar Blob/URL para o worker:", e);
                alert("Erro ao preparar o código do worker. Verifique o console.");
                return false; // Indica falha
            }

            workers = []; // Array para armazenar as instâncias dos workers
            workersBusy = []; // Array para rastrear se cada worker está ocupado
            // Mensagem de inicialização com as configurações do jogo/simulação
            const configMessage = {
                type: 'init',
                config: {
                    INPUT_NODES, HIDDEN_NODES, OUTPUT_NODES,
                    SIMULATION_TIMEOUT_FRAMES,
                    canvasWidth: canvas.width, canvasHeight: canvas.height,
                    gravity, thrust, sideThrust, maxSpeedX, maxSpeedY, fuelMax,
                    landingPadWidth: landingPad.width, landingPadHeight: landingPad.height
                }
            };

            // Cria cada worker
            for (let i = 0; i < NUM_WORKERS; i++) {
                try {
                    const worker = new Worker(workerUrl);

                    // Handler para erros no worker
                    worker.onerror = (error) => {
                        console.error(`Erro no Worker ${i}:`, error.message, error);
                        // Marca como não ocupado e tenta designar nova tarefa se houver
                        workersBusy[i] = false;
                        assignTaskToWorker(i);
                        checkForGenerationCompletion(); // Verifica se a geração acabou por causa do erro
                    };

                    // Handler para mensagens recebidas do worker
                    worker.onmessage = (event) => handleWorkerMessage(i, event.data);

                    // Envia a mensagem de configuração inicial para o worker
                    worker.postMessage(configMessage);

                    workers.push(worker);
                    workersBusy.push(false); // Inicialmente, nenhum worker está ocupado
                } catch (e) {
                    console.error(`Falha ao criar worker ${i}:`, e);
                    // Pode acontecer se houver limites de workers ou outros problemas
                }
            }

            console.log(`${workers.length} de ${NUM_WORKERS} workers criados com sucesso.`);
            // Revoga a URL do Blob após criar os workers (não é mais necessária)
            URL.revokeObjectURL(workerUrl);

            // Verifica se algum worker foi realmente criado
            if (workers.length === 0 && NUM_WORKERS > 0) {
                alert("Falha crítica: Nenhum Web Worker pôde ser criado. O treinamento paralelo não funcionará.");
                return false; // Indica falha
            }
            return true; // Indica sucesso
        }

        function terminateWorkers() {
            console.log("Terminando workers...");
            workers.forEach((worker, index) => {
                try {
                    worker.terminate(); // Encerra o worker
                } catch (e) {
                    console.warn(`Erro ao terminar worker ${index}:`, e);
                }
            });
            // Limpa os arrays de workers
            workers = [];
            workersBusy = [];
            console.log("Workers terminados.");
        }

        function handleWorkerMessage(workerIndex, message) {
            // Ignora mensagens se o treinamento não estiver ativo
            if (!isTraining) return;

            if (message.type === 'result') {
                // Encontra a NN correspondente na população atual pelo ID
                // Nota: Se a geração mudou enquanto a tarefa estava rodando, a NN pode não ser encontrada
                const correspondingNN = population.find(nn => nn.id === message.id);

                if (!correspondingNN) {
                    // console.warn(`Resultado recebido para NN ${message.id} não encontrada na pop atual (G${currentGeneration}). Ignorando.`);
                    // Mesmo que não encontre, libera o worker
                    workersBusy[workerIndex] = false;
                    assignTaskToWorker(workerIndex); // Tenta dar nova tarefa
                    return; // Sai sem processar o resultado
                }

                // Verifica se o fitness é válido antes de incrementar a contagem
                if (message.fitness !== undefined && message.fitness !== null && !isNaN(message.fitness)) {
                    resultsReceivedCount++;
                    populationFitness[message.id] = message.fitness;

                    // Atualiza o melhor fitness global *imediatamente* se um resultado melhor chegar
                    if (message.fitness > bestFitnessEver) {
                        bestFitnessEver = message.fitness;
                        // Encontra a NN na população para copiar (pode ser diferente da correspondingNN se a pop mudou?)
                        // É mais seguro buscar novamente
                        const currentNN = population.find(n => n.id === message.id);
                        if (currentNN) {
                            bestNN = currentNN.copy(); // Cria uma cópia para evitar alterações posteriores
                            bestNN.fitness = message.fitness; // Garante que o fitness copiado está correto
                            bestNN.id = `best-G${currentGeneration}`; // Atualiza ID para refletir a geração
                            console.log(`%cNovo Melhor Global (intra-geração G${currentGeneration}): ${bestFitnessEver.toFixed(3)} por ${message.id}`, 'color: purple; font-weight: bold;');
                            updateButtonStates(); // Atualiza botões (salvar/exportar pode ficar disponível)
                        }
                    }
                } else {
                    console.warn(`Fitness inválido recebido do worker ${workerIndex} para NN ${message.id}:`, message.fitness);
                    // Atribui fitness muito baixo para penalizar
                    populationFitness[message.id] = -Infinity;
                    // Incrementa a contagem mesmo assim para a geração poder terminar
                    resultsReceivedCount++;
                }


                // Libera o worker
                workersBusy[workerIndex] = false;
                // Tenta atribuir uma nova tarefa ao worker liberado
                assignTaskToWorker(workerIndex);
                // Verifica se a geração terminou
                checkForGenerationCompletion();

            } else {
                console.log(`Mensagem inesperada recebida do Worker ${workerIndex}:`, message.type, message);
            }
        }

        function assignTaskToWorker(workerIndex) {
            // Não atribui se: não está treinando, worker está ocupado, não há tarefas na fila, ou índice inválido
            if (!isTraining || workersBusy[workerIndex] || tasksQueue.length === 0 || workerIndex >= workers.length) {
                return;
            }

            // Pega a próxima tarefa da fila (FIFO)
            const taskData = tasksQueue.shift();
            // Marca o worker como ocupado
            workersBusy[workerIndex] = true;

            // Gera configuração de simulação aleatória para esta avaliação
            const simConfig = {
                // Posição inicial com variação
                startX: canvas.width / 2 + (Math.random() - 0.5) * (canvas.width * 0.7), // Aumenta um pouco a variação X
                startY: canvas.height * 0.8 + (Math.random() - 0.5) * 200, // Aumenta variação Y
                // Velocidade inicial com variação
                startSpeedX: (Math.random() - 0.5) * 5, // Aumenta variação Vel X
                startSpeedY: (Math.random() - 0.5) * 4, // Aumenta variação Vel Y
                // Ângulo inicial com variação (em torno de PI = reto para cima)
                startAngle: Math.PI + (Math.random() - 0.5) * (Math.PI / 2.5), // Aumenta variação angular (até +/- 36 graus)
                // Posição do Landing Pad aleatória
                landingPadX: Math.random() * (canvas.width - landingPad.width * 1.5) + landingPad.width * 0.25, // Pad não muito perto das bordas
                // Vento aleatório (com chance de ser zero)
                windStrength: Math.random() < 0.15 ? 0 : Math.random() * Math.random() * 1.0, // Bias para ventos mais fracos
                windDirection: Math.random() < 0.5 ? -1 : 1
            };

            // Tenta enviar a tarefa para o worker
            try {
                workers[workerIndex].postMessage({
                    type: 'evaluate',
                    task: {
                        nnData: taskData.nnData, // Envia os dados serializados da NN
                        simConfig: simConfig      // Envia a configuração da simulação
                    }
                });
            } catch (postError) {
                // Se falhar ao enviar (worker pode ter morrido), marca como livre e devolve a tarefa para a fila
                console.error(`Erro ao enviar postMessage para Worker ${workerIndex} (NN ID: ${taskData.id}):`, postError);
                workersBusy[workerIndex] = false; // Libera o worker
                tasksQueue.unshift(taskData); // Devolve a tarefa ao início da fila
                // Poderia tentar reiniciar o worker aqui se erros forem frequentes
            }
        }

        function checkForGenerationCompletion() {
            // Verifica se está treinando e se todos os resultados da população atual foram recebidos
            if (isTraining && resultsReceivedCount >= POPULATION_SIZE) {
                console.log(`%cGeração ${currentGeneration} concluída (${resultsReceivedCount} resultados recebidos). Processando...`, 'color: #888');
                // Usa setTimeout para permitir que a UI atualize antes do processamento pesado da próxima geração
                setTimeout(processGenerationResults, 50); // Delay pequeno (50ms)
            }
            // Atualiza a UI para mostrar o progresso mesmo que a geração não tenha terminado
            updateTrainingInfo();
            updateButtonStates();
        }

        function processGenerationResults() {
            // Confirma novamente que está treinando e que todos os resultados chegaram
            // (pode ter sido parado enquanto o setTimeout esperava)
            if (!isTraining || resultsReceivedCount < POPULATION_SIZE) return;

            // 1. Calcula a próxima geração (seleção, crossover, mutação)
            nextGeneration();

            // Se 'nextGeneration' parou o treino (por erro), não continua
            if (!isTraining) return;

            // 2. Prepara a fila de tarefas para a nova geração
            tasksQueue = population.map(nn => ({
                id: nn.id,
                nnData: nn.getSerializableData() // Serializa cada NN da nova população
            }));

            // Verifica se a fila foi criada corretamente
            if (tasksQueue.length !== POPULATION_SIZE) {
                console.error(`Erro crítico: Fila de tarefas para G${currentGeneration} tem tamanho incorreto (${tasksQueue.length}/${POPULATION_SIZE}). Parando.`);
                stopTraining();
                alert("Erro crítico ao preparar tarefas para a nova geração. Treinamento interrompido.");
                return;
            }

            console.log(`Iniciando avaliação da Geração ${currentGeneration} (${tasksQueue.length} indivíduos).`);

            // 3. Reinicia o estado dos workers e distribui as primeiras tarefas
            workersBusy.fill(false); // Marca todos os workers como livres
            for (let i = 0; i < workers.length; i++) {
                assignTaskToWorker(i); // Atribui tarefas aos workers disponíveis
            }

            // Atualiza a UI imediatamente após iniciar a nova geração
            updateTrainingInfo();
            updateButtonStates();
        }

        // --- Funções de Controle de Treinamento (MODIFICADO startTraining) ---
        function startTraining() {
            if (isTraining) return;
            console.log("Iniciando Treinamento (com seeding)...");
            isTraining = true;
            aiControlled = false; // Garante que o controle manual/IA ativa seja desligado
            activeAI = null;
            aiStatusDisplay.innerText = "Treinando IA (Workers)...";
            aiStatusDisplay.style.backgroundColor = 'rgba(255, 165, 0, 0.8)'; // Laranja durante treino

            // --- LÓGICA DE INICIALIZAÇÃO/SEEDING DA POPULAÇÃO ---
            // Cria uma nova população se for o início ou se a população atual não tiver o tamanho certo
            if (population.length !== POPULATION_SIZE || currentGeneration === 0) {
                console.log("Criando/Resetando população inicial...");
                population = []; // Limpa população antiga
                currentGeneration = 0; // Reseta contador de geração

                // 1. Adiciona cópias/mutações da bestNN (se existir e SEED_COUNT > 0)
                let seededCount = 0;
                if (bestNN && SEED_COUNT_ON_START > 0) {
                    console.log(`%cSemeando população com ${SEED_COUNT_ON_START} cópias/mutações de ${bestNN.id} (Fit: ${bestNN.fitness.toFixed(3)})`, 'color: #2980b9; font-weight: bold');

                    // Adiciona a cópia exata da melhor NN
                    let bestCopy = bestNN.copy();
                    bestCopy.id = `G0-seed-0`; // ID indica que é da semeadura inicial
                    population.push(bestCopy);
                    seededCount++;

                    // Adiciona cópias mutadas
                    for (let i = 1; i < SEED_COUNT_ON_START && population.length < POPULATION_SIZE; i++) {
                        let mutatedCopy = bestNN.copy();
                        mutatedCopy.id = `G0-seed-${i}`;
                        // Aplica uma mutação um pouco maior para diversificar os seeds iniciais
                        mutatedCopy.mutate(MUTATION_RATE * 1.5); // Mutação 50% mais forte
                        population.push(mutatedCopy);
                        seededCount++;
                    }
                    console.log(`${seededCount} indivíduos semeados a partir da melhor IA.`);
                } else if (bestNN) {
                    console.log("SEED_COUNT_ON_START é 0 ou bestNN não é válida, não semeando.");
                } else {
                    console.log("Nenhuma bestNN encontrada para semear a população inicial.");
                }

                // 2. Preenche o resto com indivíduos aleatórios
                const randomCount = POPULATION_SIZE - population.length;
                if (randomCount > 0) {
                    console.log(`Preenchendo com ${randomCount} indivíduos aleatórios.`);
                    for (let i = 0; i < randomCount; i++) {
                        let nn = new NeuralNetwork(INPUT_NODES, HIDDEN_NODES, OUTPUT_NODES, `G0-rand-${i}`);
                        // Inicializa os pesos e biases aleatoriamente
                        nn.randomizeMatrix(nn.weights_ih);
                        nn.randomizeMatrix(nn.weights_ho);
                        nn.randomizeMatrix(nn.bias_h);
                        nn.randomizeMatrix(nn.bias_o);
                        population.push(nn);
                    }
                }
            } else {
                // Se continuar treino (sem recarregar página), mantém a população anterior mas reseta fitness
                console.log(`Continuando treino a partir da Geração ${currentGeneration} (população existente). Resetando fitness.`);
                population.forEach(nn => nn.fitness = -Infinity); // Fitness precisa ser recalculado
                // Poderia opcionalmente reiniciar currentGeneration para 0 aqui se desejado
                // currentGeneration = 0;
                // Poderia também introduzir a bestNN na população atual se ela não estiver lá
                // if (bestNN && !population.some(nn => nn.id === bestNN.id)) {
                //    population[population.length - 1] = bestNN.copy(); // Substitui o pior
                // }
            }
            // --- FIM DA LÓGICA DE INICIALIZAÇÃO ---

            resultsReceivedCount = 0; // Zera contagem de resultados para a nova geração/treino
            populationFitness = {};   // Limpa mapa de fitness

            // Prepara a fila de tarefas com a população inicial (ou continuada)
            tasksQueue = population.map(nn => ({
                id: nn.id,
                nnData: nn.getSerializableData() // Serializa cada NN para enviar aos workers
            }));

            // Cria os workers e inicia a distribuição de tarefas
            if (createWorkers()) {
                console.log(`Distribuindo tarefas iniciais para Geração ${currentGeneration}...`);
                const initialTasks = Math.min(tasksQueue.length, workers.length);
                for (let i = 0; i < initialTasks; i++) {
                    assignTaskToWorker(i); // Envia as primeiras tarefas
                }
            } else {
                // Se a criação de workers falhar, interrompe o início do treinamento
                console.error("Falha ao criar workers. Abortando início do treinamento.")
                isTraining = false; // Reverte o estado de treinamento
                aiStatusDisplay.innerText = `Controle: Humano (Erro Workers)`;
                aiStatusDisplay.style.backgroundColor = 'rgba(255, 223, 186, 0.9)'; // Cor normal
                updateButtonStates();
                return;
            }

            resetGame(); // Reseta o estado do jogo visual na thread principal
            updateUI(); // Atualiza a UI para refletir o início do treino
        }

        function stopTraining() {
            // Só para se estiver treinando
            if (!isTraining) return;

            console.log("Parando Treinamento...");
            isTraining = false; // Define o estado como não treinando

            // Encerra os workers
            terminateWorkers();

            // Limpa a fila de tarefas pendentes
            tasksQueue = [];

            // Restaura o controle para humano e limpa IA ativa
            aiControlled = false;
            activeAI = null;
            aiStatusDisplay.innerText = `Controle: Humano (C)`;
            aiStatusDisplay.style.backgroundColor = 'rgba(255, 223, 186, 0.9)'; // Cor normal

            resetGame(); // Reseta o estado do jogo visual
            updateUI();  // Atualiza a UI para refletir o fim do treino
            console.log("Treinamento parado.");
        }

        // --- Funções de Gerenciamento da IA (Modificado e Adicionado) ---
        function saveBestNN() {
            if (!bestNN) {
                alert("Nenhuma 'Melhor IA' foi encontrada ou treinada para salvar.");
                return;
            }

            try {
                // Obtém os dados serializáveis da melhor rede neural
                const dataToSave = bestNN.getSerializableData();
                // Converte para string JSON
                const jsonString = JSON.stringify(dataToSave);
                // Salva no localStorage usando a chave definida
                localStorage.setItem(LOCALSTORAGE_KEY_NN, jsonString);

                console.log(`Melhor IA (ID: ${bestNN.id}, Fit: ${bestNN.fitness.toFixed(3)}) salva no localStorage.`);

                if (error.name === 'QuotaExceededError') {
                    alert("Erro: O armazenamento local está cheio. Não foi possível salvar a IA.");
                }
            }

        function loadBestNN() {

            if (isTraining) {
                alert("Pare o treinamento antes de carregar uma IA salva.");

            // Obtém os dados salvos do localStorage
            const jsonString = localStorage.getItem(LOCALSTORAGE_KEY_NN);

                updateButtonStates();
                return;
            }

                const loadedData = JSON.parse(jsonString);

                // Tenta reconstruir a rede neural a partir dos dados carregados
                const loadedNN = NeuralNetwork.fromData(loadedData);

                if (loadedNN) {
                    // Se a reconstrução foi bem-sucedida, define como a 'bestNN' atual
                    bestNN = loadedNN;
                    // Atualiza o melhor fitness conhecido com o valor carregado

                    // localStorage.removeItem(LOCALSTORAGE_KEY_NN);
                    // updateStorageStatus();
                }
            } catch (error) {
                console.error("Erro ao carregar ou parsear a IA do localStorage:", error);
                alert("Falha ao carregar a IA. Os dados salvos podem estar corrompidos ou em formato inválido. Verifique o console.");

            }

        function exportBestNN() {
            if (!bestNN) {
                alert("Nenhuma 'Melhor IA' para exportar.");
                return;
            }

            try {
                // Obtém os dados serializáveis da melhor rede
                const dataToExport = bestNN.getSerializableData();
                // Converte para JSON formatado (com indentação para legibilidade)
                const jsonString = JSON.stringify(dataToExport, null, 2); // null, 2 para indentação
                // Cria um Blob (Binary Large Object) com o JSON
                const blob = new Blob([jsonString], { type: "application/json" });
                // Cria uma URL temporária para o Blob
                const url = URL.createObjectURL(blob);

                // Cria um link (<a>) invisível para iniciar o download
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                // Define o nome do arquivo para download
                const fitnessStr = bestNN.fitness !== -Infinity ? Math.round(bestNN.fitness) : 'na';
                a.download = `rocket_ai_fit_${fitnessStr}_id_${bestNN.id.substring(0, 8)}.json`; // Nome sugestivo

                // Adiciona o link ao corpo do documento, clica nele e remove
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                // Libera a URL do Blob (importante para liberar memória)
                URL.revokeObjectURL(url);

                console.log(`Melhor IA (ID: ${bestNN.id}) exportada para arquivo JSON.`);
                alert("Arquivo da Melhor IA preparado para download.");

            } catch (error) {
                console.error("Erro ao exportar a Melhor IA:", error);
                alert("Falha ao exportar a Melhor IA. Verifique o console para detalhes.");
            }
        }

        function importNN() {
            // Não importa durante o treino
            if (isTraining) {
                alert("Pare o treinamento antes de importar uma IA.");

            // Dispara o clique no input de arquivo oculto
            importFileInput.click();

        function handleFileImport(event) {
            const file = event.target.files[0]; // Pega o primeiro arquivo selecionado
            if (!file) {
                console.log("Nenhum arquivo selecionado para importação.");
                return; // Sai se nenhum arquivo foi escolhido
            }

            // Verifica se o tipo de arquivo é JSON (embora o 'accept' já filtre)
            if (file.type !== "application/json") {
                alert(`Tipo de arquivo inválido: ${file.type}. Por favor, selecione um arquivo .json.`);
                event.target.value = null; // Limpa o input
                return;
            }


            const reader = new FileReader();

            // Callback para quando a leitura do arquivo for concluída
            reader.onload = function (e) {
                try {
                    const jsonString = e.target.result; // Conteúdo do arquivo como string
                    const importedData = JSON.parse(jsonString); // Tenta fazer o parse do JSON

                    // Validação básica da estrutura dos dados importados
                    if (!importedData || typeof importedData !== 'object' || !importedData.weights_ih || typeof importedData.fitness === 'undefined' || !importedData.inputNodes || !importedData.hiddenNodes || !importedData.outputNodes) {
                        throw new Error("Arquivo JSON não contém os dados esperados de uma Rede Neural (pesos, biases, fitness, configuração de nós).");
                    }

                    // Tenta reconstruir a NN a partir dos dados importados
                    const importedNN = NeuralNetwork.fromData(importedData);

                    if (importedNN) {
                        // Sucesso! Define a NN importada como a 'bestNN' atual
                        bestNN = importedNN;
                        bestFitnessEver = importedNN.fitness; // Atualiza o melhor fitness conhecido

                        console.log(`IA importada do arquivo "${file.name}" (ID: ${bestNN.id}, Fit: ${bestFitnessEver.toFixed(3)}).`);
                        alert(`IA importada com sucesso!\nFitness: ${bestFitnessEver.toFixed(3)}\nID: ${bestNN.id}`);

                        // Reseta o estado do jogo/UI
                        aiControlled = false; // Volta para controle humano
                        activeAI = null;
                        aiStatusDisplay.innerText = `Controle: Humano (C)`;
                        aiStatusDisplay.style.backgroundColor = 'rgba(255, 223, 186, 0.9)';

                        resetGame(); // Reseta o jogo com a nova 'bestNN'
                        updateStorageStatus(); // Atualiza se a importada é a mesma que a salva
                        updateButtonStates();

                    } else {
                        // fromData retornou null
                        alert("Falha ao reconstruir a IA a partir do arquivo JSON. O formato pode ser incompatível ou corrompido.");
                    }
                } catch (error) {
                    console.error("Erro ao importar ou processar o arquivo JSON:", error);
                    alert(`Falha ao importar a IA: ${error.message}. Verifique o console.`);
                } finally {
                    // Limpa o valor do input de arquivo para permitir importar o mesmo arquivo novamente
                    event.target.value = null;
                }
            };

            // Callback para erros durante a leitura do arquivo
            reader.onerror = function (e) {
                console.error("Erro ao ler o arquivo:", e);
                alert("Ocorreu um erro ao tentar ler o arquivo selecionado.");
                event.target.value = null; // Limpa o input
            };

            // Inicia a leitura do arquivo como texto
            reader.readAsText(file);
        }
