        // --- Reset e Inicialização do Jogo (sem alterações desde v3) ---
        function resetGameState() {
            // Posição inicial centralizada horizontalmente, na parte superior
            rocket.x = canvas.width / 2 - rocket.width / 2; // Centraliza o foguete
            rocket.y = canvas.height * 0.8; // Começa a 80% da altura

            // Zera velocidades
            rocket.speedX = 0;
            rocket.speedY = 0;

            // Reseta combustível e ângulo inicial (reto para cima)
            rocket.fuel = fuelMax;
            rocket.angle = Math.PI; // PI radianos = 180 graus

            // Desliga motores
            rocket.isThrusting = false;
            rocket.thrustingLeft = false;
            rocket.thrustingRight = false;

            // Reposiciona o Landing Pad aleatoriamente (evitando cantos)
            const minPadX = landingPad.width * 0.25;
            const maxPadX = canvas.width - landingPad.width * 1.25;
            landingPad.x = Math.random() * (maxPadX - minPadX) + minPadX;
            // landingPad.y é sempre 0 (base do canvas transladado)

            // Reseta o vento
            resetWind();

            // Gera nuvens se for a primeira vez ou se necessário
            if (!clouds.length && canvas) generateClouds();

            // Reseta o estado de fim de jogo e contadores
            gameIsOverState = false;
            frameCount = 0;
            lastOutputs = [0, 0, 0]; // Reseta as últimas saídas da IA
            // console.log("Estado do jogo resetado.");
        }

        function resetGame() {
            resetGameState(); // Reseta a física e posições

            // Lógica específica dependendo se está treinando ou não
            if (!isTraining) {
                // Se não está treinando, verifica se a IA deve controlar
                if (aiControlled && bestNN) {
                    // Se IA está ligada e existe uma bestNN, ativa-a
                    activeAI = bestNN.copy(); // Usa uma cópia da melhor IA
                    lastOutputs = [0, 0, 0];
                    aiStatusDisplay.innerText = `Controle: Melhor IA (C)`;
                    aiStatusDisplay.style.backgroundColor = 'rgba(144, 238, 144, 0.9)'; // Verde claro para IA ativa
                } else {
                    // Se IA está desligada ou não há bestNN
                    activeAI = null; // Nenhuma IA ativa
                    // Se estava tentando usar IA mas não tinha, volta pra Humano
                    if (aiControlled && !bestNN) {
                        aiControlled = false;
                        aiStatusDisplay.innerText = `Controle: Humano (C)`;
                        aiStatusDisplay.style.backgroundColor = 'rgba(255, 223, 186, 0.9)';
                    } else if (!aiControlled) {
                        // Se já estava como Humano, apenas confirma
                        aiStatusDisplay.innerText = `Controle: Humano (C)`;
                        aiStatusDisplay.style.backgroundColor = 'rgba(255, 223, 186, 0.9)';
                    }
                }
            } else {
                // Se está treinando, nenhuma IA controla o jogo principal
                activeAI = null;
                aiStatusDisplay.innerText = `Treinando IA (Workers)...`;
                aiStatusDisplay.style.backgroundColor = 'rgba(255, 165, 0, 0.8)'; // Laranja
            }
            updateUI(); // Atualiza a UI após o reset
        }

        // --- Loop Principal (Main Thread - sem alterações desde v3) ---
        function gameLoop() {
            // Verificação inicial de segurança
            if (!ctx || !canvas) {
                console.error("Contexto Canvas principal (ctx) ou Canvas não encontrado. Interrompendo loop.");
                return;
            }

            // Limpa o canvas inteiro antes de redesenhar
            // Salva o estado atual (sem transformações), limpa, restaura
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reseta transformações temporariamente
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.restore(); // Volta para o estado com translação/escala Y

            // Lógica principal do frame
            if (isTraining) {
                // Durante o treinamento, apenas desenha elementos estáticos ou
                // talvez um foguete "fantasma" representando a melhor IA atual (opcional)
                // Desenha cenário básico
                drawSea();
                if (clouds.length) drawClouds(); // Desenha nuvens se existirem
                drawLandingPad();
                drawFlag();
                // Poderia desenhar um foguete parado ou a melhor IA rodando sem física real
                // drawRocket(); // Desenha o foguete na posição resetada (ou controlada por bestNN sem física)
                // Por simplicidade, pode não desenhar o foguete durante o treino pesado.

            } else {
                // Se não está treinando, executa a lógica normal do jogo

                // 1. Controle (Humano ou IA)
                if (aiControlled) {
                    controlRocketWithAI(); // IA decide as ações
                }
                // Controles humanos são tratados por eventos de teclado (keydown/keyup)

                // 2. Atualização da Física e Estado do Jogo
                updateGameLogic(); // Move o foguete, aplica física, verifica colisões

                // 3. Desenho dos Elementos do Jogo
                drawSea();
                drawClouds();
                drawLandingPad();
                drawFlag();
                drawRocket(); // Desenha o foguete na sua posição atualizada
            }

            // 4. Atualização da Interface do Usuário (Informações, NN, etc.)
            updateUI();

            // 5. Solicita o próximo frame da animação
            requestAnimationFrame(gameLoop);
        }
        // --- Inicialização (Modificada) ---
        window.onload = () => {
            console.log("Página carregada. Iniciando Jogo de Pouso de Foguete v3.1...");
            // Referências DOM
            canvas = document.getElementById('gameCanvas');
            nnCanvas = document.getElementById('nnCanvas');
            fuelDisplay = document.getElementById('fuelDisplay');
            speedDisplay = document.getElementById('speedDisplay');
            angleDisplay = document.getElementById('angleDisplay');
            fuelBarPercent = document.getElementById('fuelBarPercent');
            positionDisplay = document.getElementById('positionDisplay');
            windInfoDisplay = document.getElementById('windInfo');
            aiStatusDisplay = document.getElementById('aiStatus');
            trainingInfoDisplay = document.getElementById('trainingInfo');
            startTrainingBtn = document.getElementById('startTrainingBtn');
            stopTrainingBtn = document.getElementById('stopTrainingBtn');
            useBestAIBtn = document.getElementById('useBestAIBtn');
            saveBestAIBtn = document.getElementById('saveBestAIBtn');
            loadSavedAIBtn = document.getElementById('loadSavedAIBtn');
            exportBestAIBtn = document.getElementById('exportBestAIBtn');
            importAIBtn = document.getElementById('importAIBtn');
            importFileInput = document.getElementById('importFileInput');
            storageStatusDisplay = document.getElementById('storageStatus');
            clearSavedAIBtn = document.getElementById('clearSavedAIBtn'); // <<< Referência novo botão

            // Verificação robusta dos elementos essenciais
            const requiredElements = { canvas, nnCanvas, fuelDisplay, speedDisplay, angleDisplay, fuelBarPercent, positionDisplay, windInfoDisplay, aiStatusDisplay, trainingInfoDisplay, startTrainingBtn, stopTrainingBtn, useBestAIBtn, saveBestAIBtn, loadSavedAIBtn, exportBestAIBtn, importAIBtn, importFileInput, storageStatusDisplay, clearSavedAIBtn };
            let missingElement = false;
            for (const key in requiredElements) {
                if (!requiredElements[key]) {
                    console.error(`Erro Crítico: Elemento da UI não encontrado: #${key}`);
                    missingElement = true;
                }
            }
            if (missingElement) {
                alert("Erro: Elementos essenciais da página não foram encontrados. O jogo não pode iniciar. Verifique o console (F12).");
                return;
            }


            // Config Canvas
            try {
                // Define tamanho do canvas baseado na janela, com limites
                const maxWidth = 1200;
                const maxHeight = 800;
                canvas.width = Math.min(window.innerWidth * 0.8, maxWidth);
                canvas.height = Math.min(window.innerHeight * 0.75, maxHeight);

                ctx = canvas.getContext('2d');
                if (!ctx) throw new Error("Falha ao obter contexto 2D principal (ctx).");

                // Translada a origem para o canto inferior esquerdo e inverte o eixo Y
                ctx.translate(0, canvas.height); // Move (0,0) para baixo
                ctx.scale(1, -1); // Inverte Y (agora Y cresce para cima)

                nnCtx = nnCanvas.getContext('2d');
                if (!nnCtx) throw new Error("Falha ao obter contexto 2D do visualizador NN (nnCtx).");

                cloudsHeight = canvas.height * 0.5; // Define altura base das nuvens
                console.log(`Canvas principal inicializado: ${canvas.width}x${canvas.height}`);
                console.log(`Canvas NN inicializado: ${nnCanvas.width}x${nnCanvas.height}`);

            } catch (e) {
                alert(`Erro durante a inicialização do Canvas: ${e.message}\nVerifique o console.`);
                console.error("Erro na Inicialização do Canvas:", e);
                return; // Não continua se o canvas falhar
            }

            // --- Event Listeners ---

            // Teclado - Ações
            document.addEventListener('keydown', (event) => {
                // Ignora repetições de tecla pressionada
                if (event.repeat) return;

                // Controles do Foguete (apenas se não treinando e controle humano)
                if (!isTraining && !aiControlled) {
                    if (event.code === 'ArrowUp' || event.code === 'KeyW') rocket.isThrusting = true;
                    if (event.code === 'ArrowLeft' || event.code === 'KeyA') rocket.thrustingLeft = true;
                    if (event.code === 'ArrowRight' || event.code === 'KeyD') rocket.thrustingRight = true;
                }

                // Atalhos Globais
                switch (event.code) {
                    case 'KeyC': // Trocar Controle Humano/IA
                        if (!isTraining) { // Só funciona se não estiver treinando
                            aiControlled = !aiControlled; // Inverte o estado
                            if (aiControlled) {
                                if (bestNN) {
                                    activeAI = bestNN.copy(); // Ativa a cópia da melhor IA
                                    aiStatusDisplay.innerText = `Controle: Melhor IA (C)`;
                                    aiStatusDisplay.style.backgroundColor = 'rgba(144, 238, 144, 0.9)';// Verde
                                    resetGame(); // Reinicia o jogo com IA ativa
                                } else {
                                    aiControlled = false; // Volta pra humano se não tem IA
                                    activeAI = null;
                                    aiStatusDisplay.innerText = `Controle: Humano (Sem IA)`;
                                    aiStatusDisplay.style.backgroundColor = 'rgba(255, 223, 186, 0.9)'; // Normal
                                    alert("Nenhuma 'Melhor IA' treinada ou carregada para usar.");
                                }
                            } else {
                                // Voltando para controle humano
                                activeAI = null;
                                aiStatusDisplay.innerText = `Controle: Humano (C)`;
                                aiStatusDisplay.style.backgroundColor = 'rgba(255, 223, 186, 0.9)'; // Normal
                                // Desliga motores ao trocar para humano
                                rocket.isThrusting = false;
                                rocket.thrustingLeft = false;
                                rocket.thrustingRight = false;
                                resetGame(); // Reinicia o jogo
                            }
                        } else {
                            console.log("Não é possível trocar controle durante o treinamento.");
                        }
                        break;

                    case 'KeyR': // Resetar Jogo
                        // Permite resetar se não estiver treinando OU se o jogo acabou (mesmo treinando)
                        if (!isTraining || gameIsOverState) {
                            console.log("Resetando o jogo (tecla R)...");
                            resetGame();
                        } else {
                            console.log("Reset bloqueado durante treinamento ativo.");
                        }
                        break;

                    case 'KeyT': // Iniciar/Parar Treinamento
                        if (isTraining) {
                            if (!stopTrainingBtn.disabled) stopTraining(); // Usa o estado do botão como segurança extra
                        } else {
                            if (!startTrainingBtn.disabled) startTraining();
                        }
                        break;
                }
            });

            // Teclado - Soltar Tecla
            document.addEventListener('keyup', (event) => {
                // Desliga motores correspondentes ao soltar tecla (se controle humano)
                if (!isTraining && !aiControlled) {
                    if (event.code === 'ArrowUp' || event.code === 'KeyW') rocket.isThrusting = false;
                    if (event.code === 'ArrowLeft' || event.code === 'KeyA') rocket.thrustingLeft = false;
                    if (event.code === 'ArrowRight' || event.code === 'KeyD') rocket.thrustingRight = false;
                }
            });

            // Listeners dos Botões
            startTrainingBtn.addEventListener('click', startTraining);
            stopTrainingBtn.addEventListener('click', stopTraining);
            useBestAIBtn.addEventListener('click', () => {
                if (bestNN && !isTraining) {
                    aiControlled = true; // Ativa controle por IA
                    activeAI = bestNN.copy(); // Carrega a cópia da melhor IA
                    aiStatusDisplay.innerText = `Controle: Melhor IA (C)`;
                    aiStatusDisplay.style.backgroundColor = 'rgba(144, 238, 144, 0.9)'; // Verde
                    resetGame(); // Reinicia o jogo com a IA ativa
                    console.log("Usando a 'Melhor IA' para controle:", bestNN.id);
                } else if (isTraining) {
                    alert("Pare o treinamento antes de usar a 'Melhor IA'.");
                } else {
                    alert("Nenhuma 'Melhor IA' treinada ou carregada está disponível.");
                }
            });
            saveBestAIBtn.addEventListener('click', saveBestNN);
            loadSavedAIBtn.addEventListener('click', loadBestNN);
            exportBestAIBtn.addEventListener('click', exportBestNN);
            importAIBtn.addEventListener('click', importNN);
            importFileInput.addEventListener('change', handleFileImport);
            clearSavedAIBtn.addEventListener('click', clearSavedNN); // <<< Listener novo botão

            // --- Inicialização Final do Jogo ---
            console.log("Tentando carregar IA salva...");
            loadBestNN(); // Tenta carregar IA salva do localStorage ao iniciar
            console.log("Resetando estado inicial do jogo...");
            resetGame(); // Configura o estado inicial do jogo (foguete, pad, etc.)
            console.log("Jogo inicializado. Iniciando loop principal...");
            gameLoop(); // Inicia o loop principal de jogo/renderização
        };

        // --- Handlers Globais de Erro ---
        // Captura erros não tratados no escopo global
        window.onerror = function (message, source, lineno, colno, error) {
            console.error("Erro Global Não Capturado:", message, "em", source, `Linha: ${lineno}, Coluna: ${colno}`, error);
            // Poderia enviar este erro para um serviço de logging
            // alert("Ocorreu um erro inesperado. Verifique o console (F12)."); // Evitar alerts em produção
        };
        // Captura rejeições de Promises não tratadas
        window.onunhandledrejection = function (event) {
            console.error("Rejeição de Promise Não Tratada:", event.reason);
            // alert("Ocorreu um erro assíncrono inesperado. Verifique o console (F12)."); // Evitar alerts em produção
        };

    </script>
