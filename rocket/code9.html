<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Pouso de Foguete - IA (Sidebar Layout)</title>
    <style>
        /* Estilos CSS (Layout Sidebar) */
        body {
            margin: 0;
            background-color: #87CEEB;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            /* Necessário para container principal */
            min-height: 100vh;
            padding: 10px;
            /* Espaçamento geral */
            box-sizing: border-box;
        }

        #mainContainer {
            display: flex;
            width: 100%;
            gap: 15px;
            /* Espaço entre sidebar e área do jogo */
        }

        #trainingPanel {
            width: 280px;
            /* Largura fixa da sidebar */
            flex-shrink: 0;
            /* Evita que a sidebar encolha */
            background-color: rgba(200, 230, 255, 0.9);
            border: 1px solid #aaa;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            color: black;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            position: relative;
            /* Para posicionar o botão de toggle */
            transition: all 0.3s ease-in-out;
            /* Transição suave */
            height: calc(100vh - 20px);
            /* Tenta ocupar a altura (considerando padding do body) */
            overflow-y: auto;
            /* Scroll se conteúdo for maior */
            overflow-x: hidden;
            /* Evita scroll horizontal */
            display: flex;
            flex-direction: column;
        }

        #toggleTrainingPanelBtn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid #aaa;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            padding: 2px 5px;
            z-index: 5;
            /* Acima do conteúdo do painel */
        }

        /* Estilos para o painel minimizado */
        #trainingPanel.collapsed {
            width: 25px;
            /* Largura mínima para mostrar o botão */
            padding: 5px 5px 5px 5px;
            /* Ajusta padding */
            overflow: hidden;
            /* Esconde conteúdo */
            border-right: none;
        }

        #trainingPanel.collapsed>*:not(#toggleTrainingPanelBtn) {
            display: none;
            /* Esconde todo o conteúdo exceto o botão */
        }

        #trainingPanel.collapsed #toggleTrainingPanelBtn {
            position: static;
            /* Volta ao fluxo normal dentro do mini-painel */
            margin: 0;
        }

        #gameArea {
            flex-grow: 1;
            /* Ocupa o espaço restante */
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Centraliza canvas e controles */
            justify-content: flex-start;
            /* Alinha no topo */
            position: relative;
            /* Necessário para paineis de info absolutos */
            min-width: 0;
            /* Previne overflow no flex container */
        }

        canvas#gameCanvas {
            background-color: #87CEEB;
            border: 1px solid black;
            display: block;
            max-width: 100%;
        }

        .infoPanel {
            position: absolute;
            color: black;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            padding: 5px;
            font-size: 11px;
            border: 1px solid #ccc;
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
            z-index: 10;
            /* Abaixo do NN Visualizer */
        }

        /* Posicionamento dos paineis de info */
        #speedDisplay {
            top: 35px;
            left: 10px;
        }

        #positionDisplay {
            top: 60px;
            left: 10px;
        }

        #angleDisplay {
            top: 85px;
            left: 10px;
        }

        #fuelDisplay {
            top: 110px;
            left: 10px;
        }

        #aiStatus {
            top: 160px;
            left: 10px;
            background-color: rgba(255, 223, 186, 0.9);
        }

        #windInfo {
            top: 185px;
            left: 10px;
        }

        #fuelBar {
            position: absolute;
            top: 135px;
            left: 10px;
            width: 100px;
            height: 18px;
            background-color: white;
            border-radius: 5px;
            padding: 2px;
            border: 1px solid black;
            z-index: 10;
        }

        #fuelBarPercent {
            height: 100%;
            width: 0%;
            background-color: red;
            transition: width 0.1s;
            border-radius: 3px;
        }

        /* Visualizador NN no topo direito */
        #nnVisualizerContainer {
            /*position: absolute;*/
            top: 10px;
            right: 10px;
            width: 250px;
            height: 170px;
            background-color: rgba(200, 200, 200, 0.8);
            border: 1px solid black;
            border-radius: 5px;
            z-index: 11;
            margin-bottom: 10px;
            /* Acima dos outros painéis */
        }

        #nnCanvas {
            display: block;
        }


        /* Ajustes internos do painel de treino */
        #trainingPanel button {
            margin: 3px 2px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
        }

        #trainingPanel button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        #trainingOptions {
            margin-top: 5px;
            font-size: 11px;
        }

        #trainingInfo {
            margin-top: 8px;
            line-height: 1.4;
            font-size: 11.5px;
            text-align: left;
        }

        /* Alinha texto à esquerda */
        #storageStatus {
            font-size: 10px;
            margin-top: 4px;
            font-style: italic;
            color: #333;
            text-align: left;
        }

        .button-group {
            margin-top: 6px;
            border-top: 1px solid #ccc;
            padding-top: 6px;
            text-align: left;
        }

        .button-group button {
            margin: 2px 1px;
        }

        #clearSavedAIBtn {
            background-color: #ffdddd;
            border-color: #ffaaaa;
        }

        #controlsContainer {
            margin-top: 10px;
            padding: 5px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            color: black;
            font-size: 12px;
            text-align: center;
            width: 90%;
            max-width: 800px;
            /* Limita largura */
        }
    </style>
</head>

<body>

    <script>
        // --- Configurações Globais ---
        const INPUT_NODES = 7;
        const HIDDEN_NODES = 8;
        const OUTPUT_NODES = 3;
        const POPULATION_SIZE = 500;
        const MUTATION_RATE = 0.2;
        const SIMULATION_TIMEOUT_FRAMES = 1200;
        const NUM_WORKERS = Math.max(1, (navigator.hardwareConcurrency || 4) - 1);
        const LOCALSTORAGE_KEY_NN = 'bestRocketNN_v3';
        const SEED_COUNT_ON_START = 5;
        // --- Estado Global (Main Thread) ---
        let canvas, ctx, nnCanvas, nnCtx;
        let fuelDisplay, speedDisplay, angleDisplay, fuelBarPercent, positionDisplay, windInfoDisplay, aiStatusDisplay, trainingInfoDisplay, startTrainingBtn, stopTrainingBtn, useBestAIBtn, saveBestAIBtn, loadSavedAIBtn, exportBestAIBtn, importAIBtn, importFileInput, storageStatusDisplay, clearSavedAIBtn;
        let toggleTrainingPanelBtn; // <<< NOVO: Referência para o botão de toggle
        let population = [];
        let bestNN = null;
        let bestFitnessEver = -Infinity;
        let currentGeneration = 0;
        let isTraining = false;
        let aiControlled = false;
        let activeAI = null;
        let lastOutputs = [0, 0, 0];
        let gameIsOverState = false;
        let frameCount = 0;
        const rocket = {
            x: 0,
            y: 0,
            width: 20,
            height: 80,
            fuel: 0,
            speedX: 0,
            speedY: 0,
            angle: Math.PI,
            isThrusting: false,
            thrustingLeft: false,
            thrustingRight: false
        };
        const landingPad = {
            x: 0,
            y: 0,
            width: 70,
            height: 10
        };
        let windStrength = 0;
        let windDirection = 0;
        let clouds = [];
        let cloudsHeight = 0;
        const fuelMax = 200;
        const gravity = -0.05;
        const thrust = 0.15;
        const sideThrust = 0.015;
        const maxSpeedX = 5;
        const maxSpeedY = 10;
        let workers = [];
        let tasksQueue = [];
        let resultsReceivedCount = 0;
        let populationFitness = {};
        let workersBusy = [];


        class NeuralNetwork {
            constructor(inputNodes, hiddenNodes, outputNodes, id = null) {
                this.id = id === null ? Math.random().toString(36).substring(2, 9) : id;
                this.inputNodes = inputNodes;
                this.hiddenNodes = hiddenNodes;
                this.outputNodes = outputNodes;
                this.weights_ih = this.createMatrix(this.hiddenNodes, this.inputNodes);
                this.weights_ho = this.createMatrix(this.outputNodes, this.hiddenNodes);
                this.bias_h = this.createMatrix(this.hiddenNodes, 1);
                this.bias_o = this.createMatrix(this.outputNodes, 1);
                this.fitness = -Infinity;
            }
            createMatrix(rows, cols) {
                let m = [];
                for (let i = 0; i < rows; i++) {
                    m[i] = new Array(cols).fill(0);
                }
                return m;
            }
            randomizeMatrix(matrix) {
                for (let i = 0; i < matrix.length; i++) {
                    for (let j = 0; j < matrix[0].length; j++) {
                        matrix[i][j] = Math.random() * 2 - 1;
                    }
                }
            }
            map(matrix, func) {
                let r = this.createMatrix(matrix.length, matrix[0].length);
                for (let i = 0; i < matrix.length; i++) {
                    for (let j = 0; j < matrix[0].length; j++) {
                        r[i][j] = func(matrix[i][j]);
                    }
                }
                return r;
            }
            copyMatrix(matrix) {
                let nM = this.createMatrix(matrix.length, matrix[0].length);
                for (let i = 0; i < matrix.length; i++) {
                    for (let j = 0; j < matrix[0].length; j++) {
                        nM[i][j] = matrix[i][j];
                    }
                }
                return nM;
            }
            mapMatrices(matrixA, matrixB, func) {
                let r = this.createMatrix(matrixA.length, matrixA[0].length);
                for (let i = 0; i < matrixA.length; i++) {
                    for (let j = 0; j < matrixA[0].length; j++) {
                        r[i][j] = func(matrixA[i][j], matrixB[i][j]);
                    }
                }
                return r;
            }
            getSerializableData() {
                return {
                    id: this.id,
                    inputNodes: this.inputNodes,
                    hiddenNodes: this.hiddenNodes,
                    outputNodes: this.outputNodes,
                    weights_ih: this.weights_ih,
                    weights_ho: this.weights_ho,
                    bias_h: this.bias_h,
                    bias_o: this.bias_o,
                    fitness: this.fitness
                };
            }
            copy() {
                const newNN = new NeuralNetwork(this.inputNodes, this.hiddenNodes, this.outputNodes, this.id + '-c');
                newNN.weights_ih = this.copyMatrix(this.weights_ih);
                newNN.weights_ho = this.copyMatrix(this.weights_ho);
                newNN.bias_h = this.copyMatrix(this.bias_h);
                newNN.bias_o = this.copyMatrix(this.bias_o);
                newNN.fitness = this.fitness;
                return newNN;
            }
            mutate(mutationRate) {
                const mutateValue = (val) => {
                    if (Math.random() < mutationRate) {
                        let u = 0,
                            v = 0;
                        while (u === 0) u = Math.random();
                        while (v === 0) v = Math.random();
                        let num = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
                        let offset = num * 0.15;
                        return val + offset;
                    }
                    return val;
                };
                this.weights_ih = this.map(this.weights_ih, mutateValue);
                this.weights_ho = this.map(this.weights_ho, mutateValue);
                this.bias_h = this.map(this.bias_h, mutateValue);
                this.bias_o = this.map(this.bias_o, mutateValue);
            }
            crossover(partner) {
                const child = new NeuralNetwork(this.inputNodes, this.hiddenNodes, this.outputNodes, this.id.split('-')[0] + '-x' + Math.random().toString(36).substring(2, 5));
                const crossoverValue = (valA, valB) => (Math.random() < 0.5 ? valA : valB);
                child.weights_ih = this.mapMatrices(this.weights_ih, partner.weights_ih, crossoverValue);
                child.weights_ho = this.mapMatrices(this.weights_ho, partner.weights_ho, crossoverValue);
                child.bias_h = this.mapMatrices(this.bias_h, partner.bias_h, crossoverValue);
                child.bias_o = this.mapMatrices(this.bias_o, partner.bias_o, crossoverValue);
                return child;
            }
            predict(inputArray) {
                const activation = x => 1 / (1 + Math.exp(-x));
                const createMatrix = (r, c) => {
                    let m = [];
                    for (let i = 0; i < r; i++) m[i] = new Array(c).fill(0);
                    return m;
                };
                const arrayToMatrix = (arr) => {
                    let m = createMatrix(arr.length, 1);
                    for (let i = 0; i < arr.length; i++) m[i][0] = arr[i];
                    return m;
                };
                const matrixToArray = (m) => {
                    let a = [];
                    for (let i = 0; i < m.length; i++) a.push(m[i][0]);
                    return a;
                };
                const multiply = (mA, mB) => {
                    const rA = mA.length,
                        cA = mA[0].length,
                        cB = mB[0].length;
                    let res = createMatrix(rA, cB);
                    for (let i = 0; i < rA; i++) {
                        for (let j = 0; j < cB; j++) {
                            let s = 0;
                            for (let k = 0; k < cA; k++) {
                                s += mA[i][k] * mB[k][j];
                            }
                            res[i][j] = s;
                        }
                    }
                    return res;
                };
                const add = (mA, mB) => {
                    let res = createMatrix(mA.length, mA[0].length);
                    for (let i = 0; i < mA.length; i++)
                        for (let j = 0; j < mA[0].length; j++) res[i][j] = mA[i][j] + mB[i][j];
                    return res;
                };
                const map = (m, fn) => {
                    let res = createMatrix(m.length, m[0].length);
                    for (let i = 0; i < m.length; i++)
                        for (let j = 0; j < m[0].length; j++) res[i][j] = fn(m[i][j]);
                    return res;
                };
                let inputs = arrayToMatrix(inputArray);
                let hidden = multiply(this.weights_ih, inputs);
                hidden = add(hidden, this.bias_h);
                hidden = map(hidden, activation);
                let output = multiply(this.weights_ho, hidden);
                output = add(output, this.bias_o);
                output = map(output, activation);
                return matrixToArray(output);
            }
            static fromData(data) {
                if (!data || !data.weights_ih || !data.bias_o || !data.inputNodes || !data.hiddenNodes || !data.outputNodes) {
                    console.error("Dados incompletos/inválidos para NN.fromData:", data);
                    return null;
                }
                try {
                    const nn = new NeuralNetwork(data.inputNodes, data.hiddenNodes, data.outputNodes, data.id || 'loaded-' + Math.random().toString(36).substring(2, 7));
                    if (data.weights_ih.length !== nn.hiddenNodes || data.weights_ih[0].length !== nn.inputNodes || data.weights_ho.length !== nn.outputNodes || data.weights_ho[0].length !== nn.hiddenNodes || data.bias_h.length !== nn.hiddenNodes || data.bias_h[0].length !== 1 || data.bias_o.length !== nn.outputNodes || data.bias_o[0].length !== 1) {
                        console.warn(`Incompatibilidade dimensões NN (ID: ${data.id}).`);
                    }
                    nn.weights_ih = nn.copyMatrix(data.weights_ih);
                    nn.weights_ho = nn.copyMatrix(data.weights_ho);
                    nn.bias_h = nn.copyMatrix(data.bias_h);
                    nn.bias_o = nn.copyMatrix(data.bias_o);
                    nn.fitness = data.fitness !== undefined ? data.fitness : -Infinity;
                    return nn;
                } catch (error) {
                    console.error("Erro ao reconstruir NN:", error, data);
                    return null;
                }
            }
        }

        // --- Código do Web Worker (INALTERADO - usando v3.1 com penalidade passiva) ---
        const workerCode = `
// --- Constantes (serão recebidas da main thread) ---
let INPUT_NODES, HIDDEN_NODES, OUTPUT_NODES;
let SIMULATION_TIMEOUT_FRAMES;
let canvasWidth, canvasHeight; // Tamanho lógico do canvas
let gravity, thrust, sideThrust, maxSpeedX, maxSpeedY, fuelMax;
let landingPadWidth, landingPadHeight; // Dimensões do pad

// --- Funções Utilitárias do Worker (idênticas) ---
const activation = x => 1 / (1 + Math.exp(-x));
const createMatrix = (rows, cols) => {
    let m = [];
    for (let i = 0; i < rows; i++) {
        m[i] = new Array(cols).fill(0);
    }
    return m;
};
const arrayToMatrix = (arr) => {
    let m = createMatrix(arr.length, 1);
    for (let i = 0; i < arr.length; i++) {
        m[i][0] = arr[i];
    }
    return m;
};
const matrixToArray = (matrix) => {
    let arr = [];
    for (let i = 0; i < matrix.length; i++) {
        arr.push(matrix[i][0]);
    }
    return arr;
};
const multiply = (mA, mB) => {
    const rA = mA.length, cA = mA[0].length, rB = mB.length, cB = mB[0].length;
    if (cA !== rB) return null;
    let res = createMatrix(rA, cB);
    for (let i = 0; i < rA; i++) {
        for (let j = 0; j < cB; j++) {
            let s = 0;
            for (let k = 0; k < cA; k++) {
                s += mA[i][k] * (cB === 1 ? mB[k][0] : mB[k][j]);
            }
            res[i][j] = s;
        }
    }
    return res;
};
const add = (mA, mB) => {
    if (mA.length !== mB.length || mA[0].length !== mB[0].length) return null;
    let res = createMatrix(mA.length, mA[0].length);
    for (let i = 0; i < mA.length; i++)
        for (let j = 0; j < mA[0].length; j++) res[i][j] = mA[i][j] + mB[i][j];
    return res;
};
const map = (m, fn) => {
    let res = createMatrix(m.length, m[0].length);
    for (let i = 0; i < m.length; i++)
        for (let j = 0; j < m[0].length; j++) res[i][j] = fn(m[i][j]);
    return res;
};

// --- Lógica de Predição da Rede Neural (dentro do worker - idêntica) ---
function predict(inputArray, nnData) {
    let inputs = arrayToMatrix(inputArray);
    let hidden = multiply(nnData.weights_ih, inputs);
    hidden = add(hidden, nnData.bias_h);
    hidden = map(hidden, activation);
    let output = multiply(nnData.weights_ho, hidden);
    output = add(output, nnData.bias_o);
    output = map(output, activation);
    return matrixToArray(output);
}

// --- Função Principal de Simulação no Worker (COM RASTREAMENTO DE PROPULSORES) ---
function runSimulationForNN(nnData, simConfig) {
    // Estado inicial da simulação específica
    let r = {
        x: simConfig.startX,
        y: simConfig.startY,
        width: 20,
        height: 80,
        fuel: fuelMax,
        speedX: simConfig.startSpeedX,
        speedY: simConfig.startSpeedY,
        angle: simConfig.startAngle,
        isThrusting: false,
        thrustingLeft: false,
        thrustingRight: false
    };
    const pad = {
        x: simConfig.landingPadX,
        y: 0, // Base do canvas é y=0
        width: landingPadWidth,
        height: landingPadHeight
    };
    const currentWindStrength = simConfig.windStrength;
    const currentWindDirection = simConfig.windDirection;
    let localFrameCount = 0;
    let gameOver = false;
    let success = false;
    let reason = "";

    // *** Rastreamento de uso dos propulsores ***
    let usedMainThruster = false;
    let usedSideThruster = false;
    // ******************************************

    // Loop de simulação
    while (!gameOver && localFrameCount < SIMULATION_TIMEOUT_FRAMES) {
        localFrameCount++;
        // 1. Controle IA
        if (r.fuel > 0) {
            const normX = (r.x + r.width / 2) / canvasWidth;
            const normY = Math.max(0, Math.min(1, r.y / canvasHeight));
            const normVx = Math.max(-1, Math.min(1, r.speedX / maxSpeedX));
            const normVy = Math.max(-1, Math.min(1, r.speedY / maxSpeedY));
            let normAngle = (r.angle - Math.PI) / Math.PI;
            if (normAngle > 1) normAngle -= 2;
            if (normAngle < -1) normAngle += 2;
            const normAng = Math.max(-1, Math.min(1, normAngle));
            const targetCenterX = pad.x + pad.width / 2;
            const distToTargetX = (targetCenterX - (r.x + r.width / 2)) / (canvasWidth / 2);
            const normDistX = Math.max(-1, Math.min(1, distToTargetX));
            const normWind = Math.max(-1, Math.min(1, currentWindStrength * currentWindDirection * 2));
            const inputs = [normX, normY, normVx, normVy, normAng, normDistX, normWind];
            const outputs = predict(inputs, nnData);
            const threshold = 0.55;
            r.isThrusting = outputs[0] > threshold;
            r.thrustingLeft = outputs[1] > threshold;
            r.thrustingRight = outputs[2] > threshold;
            if (r.thrustingLeft && r.thrustingRight) {
                if (outputs[1] > outputs[2]) r.thrustingRight = false;
                else r.thrustingLeft = false;
            }

            // *** Atualiza flags de uso dos propulsores ***
            if (r.isThrusting) usedMainThruster = true;
            if (r.thrustingLeft || r.thrustingRight) usedSideThruster = true;
            // ******************************************

    };

// --- Cálculo de Fitness (Usando a versão ajustada v3.1) ---
function calculateFitnessWorker(landedSuccess, reason, rocketState, padState) {
    let fitness = 0;

    const targetCenterX = padState.x + padState.width / 2;
    const distToPadCenter = Math.abs((rocketState.x + rocketState.width / 2) - targetCenterX);
    const finalSpeedYAbs = Math.abs(rocketState.speedY);
    const finalSpeedXAbs = Math.abs(rocketState.speedX);
    const angleDiff = Math.abs(rocketState.angle - Math.PI);
    const angleError = Math.min(angleDiff, Math.abs(angleDiff - 2 * Math.PI)); // Erro absoluto do ângulo ideal (0)

    if (landedSuccess) {

        fitness = 8000; // Bônus base
        fitness += 6000 / (1 + distToPadCenter * 0.4); // Bônus precisão X (alto)
        fitness += 2000 / (1 + finalSpeedYAbs * 10);  // Bônus vel Y baixa
        fitness += 1500 / (1 + finalSpeedXAbs * 15); // Bônus vel X baixa
        fitness -= angleError * 200; // Penalidade ângulo imperfeito
        fitness += Math.max(0, rocketState.fuel) * 0.5; // Bônus combustível (baixo)

        if (reason.includes("Pouso passivo")) fitness -= 2000; // Penalidade extra específica

    } else {

        fitness -= 500; // Penalidade base por falha
        fitness -= 100 * distToPadCenter; // Penalidade distância
        fitness -= finalSpeedYAbs * 15; // Penalidade vel Y alta
        fitness -= finalSpeedXAbs * 10; // Penalidade vel X alta

        if (reason.includes("Timeout")) fitness -= 600;
        if (reason.includes("Lateral")) fitness -= 400;
        if (reason.includes("Pouso passivo")) fitness -= 500; // Penalidade extra específica

        fitness -= angleError * 20; // Penalidade forte por ângulo ruim
        fitness -= (fuelMax - Math.max(0, rocketState.fuel)) * 0.5; // Penalidade gastar combustível e falhar
        fitness = Math.max(-8000, fitness); // Limite inferior
    }

    return isNaN(fitness) ? -Infinity : fitness;
}

                    ctx.lineTo(hiddenCoord.x - nodeRadius, hiddenCoord.y);
                    ctx.stroke();
                }
            }

            // Conexões: Hidden -> Output
            for (let i = 0; i < nn.hiddenNodes; i++) {
                const hiddenCoord = hiddenNodeCoords[i];
                for (let j = 0; j < nn.outputNodes; j++) {
                    const outputCoord = outputNodeCoords[j];
                    const weight = nn.weights_ho[j][i];
                    ctx.strokeStyle = weightColor(weight);
                    const absWeight = Math.abs(weight);
                    const intensity = Math.min(1, absWeight / MAX_WEIGHT_VISUALIZATION);
                    ctx.lineWidth = 0.3 + intensity * 1.2;
                    ctx.beginPath();
                    ctx.moveTo(hiddenCoord.x + nodeRadius, hiddenCoord.y);
                    ctx.lineTo(outputCoord.x - nodeRadius, outputCoord.y);
                    ctx.stroke();
                }
            }

            ctx.lineWidth = 1; // Restaura espessura padrão
        }

        // --- Lógica do Jogo (INALTERADA) ---
        function updateGameLogic() {
            if (gameIsOverState || isTraining) return;
            frameCount++;
            rocket.speedY += gravity;
            const windEffect = windStrength * windDirection * 0.015 * Math.max(0.1, rocket.y / canvas.height);
            rocket.speedX += windEffect;
            if (rocket.isThrusting && rocket.fuel > 0) {
                const angle = rocket.angle;
                rocket.speedX += thrust * Math.sin(angle);
                rocket.speedY += -thrust * Math.cos(angle);
                rocket.fuel -= 0.35;
                rocket.fuel = Math.max(0, rocket.fuel);
            }
            if (rocket.thrustingLeft && rocket.fuel > 0) {
                rocket.angle += sideThrust;
                rocket.fuel -= 0.08;
                rocket.fuel = Math.max(0, rocket.fuel);
            }
            if (rocket.thrustingRight && rocket.fuel > 0) {
                rocket.angle -= sideThrust;
                rocket.fuel -= 0.08;
                rocket.fuel = Math.max(0, rocket.fuel);
            }
            rocket.angle = (rocket.angle + 2 * Math.PI) % (2 * Math.PI);
            rocket.speedX = Math.max(-maxSpeedX, Math.min(maxSpeedX, rocket.speedX));
            rocket.speedY = Math.max(-maxSpeedY * 1.5, Math.min(maxSpeedY, rocket.speedY));
            rocket.y += rocket.speedY;
            rocket.x += rocket.speedX;
            checkGameOverConditions();
        }

        function checkGameOverConditions() {
            if (gameIsOverState || isTraining) return;
            const rBY = rocket.y;
            const safeLandSpeedY = 1.5,
                safeLandSpeedX = 1.0,
                angleTolerance = 15 * (Math.PI / 180);
            const angleDiff = Math.abs(rocket.angle - Math.PI);
            const isAngleSafe = angleDiff <= angleTolerance || Math.abs(angleDiff - 2 * Math.PI) <= angleTolerance;
            let landedSafely = false,
                crashReason = "";
            if (rocket.x <= 0 || rocket.x + rocket.width >= canvas.width) {
                endSimulation(false, "Colidiu Lateralmente");
                return;
            }
            if (rBY <= landingPad.height) {
                if (rocket.x + rocket.width > landingPad.x && rocket.x < landingPad.x + landingPad.width) {
                    if (Math.abs(rocket.speedY) <= safeLandSpeedY && Math.abs(rocket.speedX) <= safeLandSpeedX && isAngleSafe) {
                        landedSafely = true;
                    } else {
                        if (Math.abs(rocket.speedY) > safeLandSpeedY) crashReason += `VelY alta. `;
                        if (Math.abs(rocket.speedX) > safeLandSpeedX) crashReason += `VelX alta. `;
                        if (!isAngleSafe) crashReason += `Ângulo ruim.`;
                        crashReason = "Crash Plataforma: " + crashReason;
                    }
                    endSimulation(landedSafely, landedSafely ? "Pouso Suave!" : crashReason);
                } else {
                    endSimulation(false, "Caiu fora da plataforma.");
                }
            }
        }

        function endSimulation(success, message) {
            if (gameIsOverState || isTraining) return;
            gameIsOverState = true;
            rocket.isThrusting = false;

        function getCurrentNNInputs(rS, pS, windS, windD) {
            const normX = (rS.x + rS.width / 2) / canvas.width;
            const normY = Math.max(0, Math.min(1.1, rS.y / canvas.height));
            const normVx = Math.max(-1, Math.min(1, rS.speedX / maxSpeedX));
            const normVy = Math.max(-1, Math.min(1, rS.speedY / maxSpeedY));
            let normAngle = (rS.angle - Math.PI) / Math.PI;
            if (normAngle > 1) normAngle -= 2;
            if (normAngle < -1) normAngle += 2;
            const normAng = Math.max(-1, Math.min(1, normAngle));
            const targetCenterX = pS.x + pS.width / 2;
            const rocketCenterX = rS.x + rS.width / 2;
            const distToTargetX = (targetCenterX - rocketCenterX) / (canvas.width / 2);
            const normDistX = Math.max(-1, Math.min(1, distToTargetX));
            const normWind = Math.max(-1, Math.min(1, windS * windD * 2));
            return [normX, normY, normVx, normVy, normAng, normDistX, normWind];
        }

        function controlRocketWithAI() {
            if (!aiControlled || !activeAI || rocket.fuel <= 0 || gameIsOverState || isTraining) {
                if (!isTraining) {
                    rocket.isThrusting = false;
                    rocket.thrustingLeft = false;
                    rocket.thrustingRight = false;
                }
                lastOutputs = [0, 0, 0];
                return;
            }
            try {
                const inputs = getCurrentNNInputs(rocket, landingPad, windStrength, windDirection);
                const outputs = activeAI.predict(inputs);
                lastOutputs = outputs;
                const threshold = 0.55;
                rocket.isThrusting = outputs[0] > threshold;
                rocket.thrustingLeft = outputs[1] > threshold;
                rocket.thrustingRight = outputs[2] > threshold;
                if (rocket.thrustingLeft && rocket.thrustingRight) {
                    if (outputs[1] > outputs[2]) rocket.thrustingRight = false;
                    else rocket.thrustingLeft = false;
                }
            } catch (error) {
                console.error("Erro controle IA:", error, activeAI);
                aiControlled = false;
                activeAI = null;
                aiStatusDisplay.innerText = `Controle: Humano (Erro IA)`;
                rocket.isThrusting = false;
                rocket.thrustingLeft = false;
                rocket.thrustingRight = false;
            }
        }
        // --- Lógica do Algoritmo Genético (INALTERADA) ---
        function nextGeneration() {
            currentGeneration++;
            console.log(`%c--- Gen ${currentGeneration - 1} -> ${currentGeneration} ---`, 'color: blue; font-weight: bold');
            let foundValid = false,
                minFit = Infinity,
                maxFit = -Infinity;
            population.forEach(nn => {
                const fit = populationFitness[nn.id];
                nn.fitness = (fit !== undefined && fit !== null && !isNaN(fit)) ? fit : -Infinity;
                if (nn.fitness > -Infinity) {
                    foundValid = true;
                    if (nn.fitness < minFit) minFit = nn.fitness;
                    if (nn.fitness > maxFit) maxFit = nn.fitness;
                }
            });
            if (!foundValid) {
                console.error(`ERRO: Nenhum fitness válido G ${currentGeneration - 1}. Parando.`);
                stopTraining();
                alert("Erro fitness. Treino parado.");
                return;
            }
            console.log(`G ${currentGeneration - 1} Fit Range: ${minFit.toFixed(3)} a ${maxFit.toFixed(3)}`);
            population.sort((a, b) => b.fitness - a.fitness);
            if (population[0].fitness > bestFitnessEver) {
                bestFitnessEver = population[0].fitness;
                bestNN = population[0].copy();
                bestNN.id = `best-G${currentGeneration - 1}`;
                console.log(`%cNovo Melhor Global (G${currentGeneration - 1}): ${bestFitnessEver.toFixed(3)} por ${population[0].id}`, 'color: green; font-weight: bold;');
                updateButtonStates();
            } else if (bestNN) {
                console.log(`Melhor G ${currentGeneration - 1}: ${population[0].fitness.toFixed(3)} (ID: ${population[0].id}). Global: ${bestFitnessEver.toFixed(3)} (ID: ${bestNN.id})`);
            } else {
                bestFitnessEver = population[0].fitness;
                bestNN = population[0].copy();
                bestNN.id = `best-G${currentGeneration - 1}`;
                console.log(`%cDefinido Melhor Global (G${currentGeneration - 1}): ${bestFitnessEver.toFixed(3)} por ${population[0].id}`, 'color: green; font-weight: bold;');
                updateButtonStates();
            }
            const newPopulation = [];
            const eliteCount = Math.max(1, Math.floor(POPULATION_SIZE * 0.05));
            for (let i = 0; i < eliteCount && i < population.length; i++) {
                let eliteCopy = population[i].copy();
                eliteCopy.id = `G${currentGeneration}-elite-${i}`;
                newPopulation.push(eliteCopy);
            }
            const selectionPool = [];
            const fitnessOffset = minFit <= 0 ? Math.abs(minFit) + 1 : 0;
            let totalNormFit = 0;
            population.forEach(nn => {
                if (nn.fitness > -Infinity) totalNormFit += (nn.fitness + fitnessOffset);
            });
            if (totalNormFit > 0) {
                population.forEach(nn => {
                    if (nn.fitness > -Infinity) {
                        const normFit = nn.fitness + fitnessOffset;
                        const numCopies = Math.ceil((normFit / totalNormFit) * POPULATION_SIZE * 1.2);
                        for (let j = 0; j < numCopies && selectionPool.length < POPULATION_SIZE * 5; j++) selectionPool.push(nn);
                    }
                });
            }
            if (selectionPool.length < 2) {
                console.warn("Pool roleta pequeno. Usando top 50%.");
                const halfSize = Math.max(2, Math.ceil(population.length / 2));
                for (let i = 0; i < halfSize; i++) {
                    selectionPool.push(population[i]);
                    selectionPool.push(population[i]);
                }
            }
            if (selectionPool.length < 2 && population.length >= 2) {
                console.error("Falha seleção. Usando pop antiga.");
                selectionPool.push(...population);
            }
            while (newPopulation.length < POPULATION_SIZE && selectionPool.length > 1) {
                let pA = selectionPool[Math.floor(Math.random() * selectionPool.length)];
                let pB = selectionPool[Math.floor(Math.random() * selectionPool.length)];
                let attempts = 0;
                while (pA === pB && selectionPool.length > 1 && attempts < 10) {
                    pB = selectionPool[Math.floor(Math.random() * selectionPool.length)];
                    attempts++;
                }
                let child = pA.crossover(pB);
                child.id = `G${currentGeneration}-child-${newPopulation.length}`;
                child.mutate(MUTATION_RATE);
                newPopulation.push(child);
            }
            if (newPopulation.length < POPULATION_SIZE && newPopulation.length > 0) {
                const missing = POPULATION_SIZE - newPopulation.length;
                console.warn(`Preenchendo ${missing} com mutações elite.`);
                for (let i = 0; i < missing; i++) {
                    let eliteParent = newPopulation[Math.floor(Math.random() * Math.min(eliteCount, newPopulation.length))];
                    let filler = eliteParent.copy();
                    filler.id = `G${currentGeneration}-filler-${newPopulation.length}`;
                    filler.mutate(MUTATION_RATE * 1.5);
                    newPopulation.push(filler);
                }
            } else if (newPopulation.length === 0) {
                console.error("ERRO: População nova vazia. Parando.");
                stopTraining();
                alert("Erro: População vazia. Treino parado.");
                return;
            }
            population = newPopulation;
            populationFitness = {};
            resultsReceivedCount = 0;
            console.log(`Nova Pop G${currentGeneration} criada. Tam: ${population.length}`);
        }
        // --- Gerenciamento dos Workers e Treinamento (INALTERADO) ---
        function createWorkers() {
            console.log(`Criando ${NUM_WORKERS} workers...`);
            let workerUrl = '';
            try {
                const blob = new Blob([workerCode], {
                    type: 'application/javascript'
                });
                workerUrl = URL.createObjectURL(blob);
            } catch (e) {
                console.error("Falha Blob/URL worker:", e);
                alert("Erro worker code.");
                return false;
            }
            workers = [];
            workersBusy = [];
            const configMsg = {
                type: 'init',
                config: {
                    INPUT_NODES,
                    HIDDEN_NODES,
                    OUTPUT_NODES,
                    SIMULATION_TIMEOUT_FRAMES,
                    canvasWidth: canvas.width,
                    canvasHeight: canvas.height,
                    gravity,
                    thrust,
                    sideThrust,
                    maxSpeedX,
                    maxSpeedY,
                    fuelMax,
                    landingPadWidth: landingPad.width,
                    landingPadHeight: landingPad.height
                }
            };
            for (let i = 0; i < NUM_WORKERS; i++) {
                try {
                    const worker = new Worker(workerUrl);
                    worker.onerror = (error) => {
                        console.error(`Erro Worker ${i}:`, error.message, error);
                        workersBusy[i] = false;
                        assignTaskToWorker(i);
                        checkForGenerationCompletion();
                    };
                    worker.onmessage = (event) => handleWorkerMessage(i, event.data);
                    worker.postMessage(configMsg);
                    workers.push(worker);
                    workersBusy.push(false);
                } catch (e) {
                    console.error(`Falha criar worker ${i}:`, e);
                }
            }
            console.log(`${workers.length}/${NUM_WORKERS} workers criados.`);
            URL.revokeObjectURL(workerUrl);
            if (workers.length === 0 && NUM_WORKERS > 0) {
                alert("Falha: Nenhum worker criado.");
                return false;
            }
            return true;
        }

        function terminateWorkers() {
            console.log("Terminando workers...");
            workers.forEach((w, i) => {
                try {
                    w.terminate();
                } catch (e) {
                    console.warn(`Erro terminar worker ${i}:`, e);
                }
            });
            workers = [];
            workersBusy = [];
            console.log("Workers terminados.");
        }

        function handleWorkerMessage(workerIndex, message) {
            if (!isTraining) return;
            if (message.type === 'result') {
                const nn = population.find(n => n.id === message.id);
                if (!nn) {
                    workersBusy[workerIndex] = false;
                    assignTaskToWorker(workerIndex);
                    return;
                }
                if (message.fitness !== undefined && message.fitness !== null && !isNaN(message.fitness)) {
                    resultsReceivedCount++;
                    populationFitness[message.id] = message.fitness;
                    if (message.fitness > bestFitnessEver) {
                        bestFitnessEver = message.fitness;
                        const currentNN = population.find(n => n.id === message.id);
                        if (currentNN) {
                            bestNN = currentNN.copy();
                            bestNN.fitness = message.fitness;
                            bestNN.id = `best-G${currentGeneration}`;
                            console.log(`%cNovo Melhor Global (intra G${currentGeneration}): ${bestFitnessEver.toFixed(3)} por ${message.id}`, 'color: purple; font-weight: bold;');
                            updateButtonStates();
                        }
                    }
                } else {
                    console.warn(`Fitness inválido W${workerIndex} NN ${message.id}:`, message.fitness);
                    populationFitness[message.id] = -Infinity;
                    resultsReceivedCount++;
                }
                workersBusy[workerIndex] = false;
                assignTaskToWorker(workerIndex);
                checkForGenerationCompletion();
            } else {
                console.log(`Msg inesperada W${workerIndex}:`, message.type, message);
            }
        }

        function assignTaskToWorker(workerIndex) {
            if (!isTraining || workersBusy[workerIndex] || tasksQueue.length === 0 || workerIndex >= workers.length) return;
            const taskData = tasksQueue.shift();
            workersBusy[workerIndex] = true;
            const simConfig = {
                startX: canvas.width / 2 + (Math.random() - 0.5) * (canvas.width * 0.7),
                startY: canvas.height * 0.8 + (Math.random() - 0.5) * 200,
                startSpeedX: (Math.random() - 0.5) * 5,
                startSpeedY: (Math.random() - 0.5) * 4,
                startAngle: Math.PI + (Math.random() - 0.5) * (Math.PI / 2.5),
                landingPadX: Math.random() * (canvas.width - landingPad.width * 1.5) + landingPad.width * 0.25,
                windStrength: Math.random() < 0.15 ? 0 : Math.random() * Math.random() * 1.0,
                windDirection: Math.random() < 0.5 ? -1 : 1
            };
            try {
                workers[workerIndex].postMessage({
                    type: 'evaluate',
                    task: {
                        nnData: taskData.nnData,
                        simConfig: simConfig
                    }
                });
            } catch (postError) {
                console.error(`Erro postMessage W${workerIndex} (NN ${taskData.id}):`, postError);
                workersBusy[workerIndex] = false;
                tasksQueue.unshift(taskData);
            }
        }

        function checkForGenerationCompletion() {
            if (isTraining && resultsReceivedCount >= POPULATION_SIZE) {
                console.log(`%cG${currentGeneration} concluída (${resultsReceivedCount} resultados). Processando...`, 'color: #888');
                setTimeout(processGenerationResults, 50);
            }
            updateTrainingInfo();
            updateButtonStates();
        }

        function processGenerationResults() {
            if (!isTraining || resultsReceivedCount < POPULATION_SIZE) return;
            nextGeneration();
            if (!isTraining) return;
            tasksQueue = population.map(nn => ({
                id: nn.id,
                nnData: nn.getSerializableData()
            }));
            if (tasksQueue.length !== POPULATION_SIZE) {
                console.error(`Erro: Fila G${currentGeneration} tam incorreto (${tasksQueue.length}/${POPULATION_SIZE}). Parando.`);
                stopTraining();
                alert("Erro tarefas nova geração.");
                return;
            }
            console.log(`Iniciando avaliação G ${currentGeneration} (${tasksQueue.length} inds).`);
            workersBusy.fill(false);
            for (let i = 0; i < workers.length; i++) assignTaskToWorker(i);
            updateTrainingInfo();
            updateButtonStates();
        }

        function startTraining() {
            if (isTraining) return;
            console.log("Iniciando Treinamento (com seeding)...");
            isTraining = true;
            aiControlled = false;
            activeAI = null;
            aiStatusDisplay.innerText = "Treinando IA (Workers)...";
            aiStatusDisplay.style.backgroundColor = 'rgba(255, 165, 0, 0.8)';
            if (population.length !== POPULATION_SIZE || currentGeneration === 0) {
                console.log("Criando/Resetando população inicial...");
                population = [];
                currentGeneration = 0;
                let seededCount = 0;
                if (bestNN && SEED_COUNT_ON_START > 0) {
                    console.log(`%cSemeando pop com ${SEED_COUNT_ON_START} de ${bestNN.id} (Fit: ${bestNN.fitness.toFixed(3)})`, 'color: #2980b9; font-weight: bold');
                    let bestCopy = bestNN.copy();
                    bestCopy.id = `G0-seed-0`;
                    population.push(bestCopy);
                    seededCount++;
                    for (let i = 1; i < SEED_COUNT_ON_START && population.length < POPULATION_SIZE; i++) {
                        let mutatedCopy = bestNN.copy();
                        mutatedCopy.id = `G0-seed-${i}`;
                        mutatedCopy.mutate(MUTATION_RATE * 1.5);
                        population.push(mutatedCopy);
                        seededCount++;
                    }
                    console.log(`${seededCount} semeados.`);
                } else {
                    console.log("Não semeando.");
                }
                const randomCount = POPULATION_SIZE - population.length;
                if (randomCount > 0) {
                    console.log(`Preenchendo ${randomCount} aleatórios.`);
                    for (let i = 0; i < randomCount; i++) {
                        let nn = new NeuralNetwork(INPUT_NODES, HIDDEN_NODES, OUTPUT_NODES, `G0-rand-${i}`);
                        nn.randomizeMatrix(nn.weights_ih);
                        nn.randomizeMatrix(nn.weights_ho);
                        nn.randomizeMatrix(nn.bias_h);
                        nn.randomizeMatrix(nn.bias_o);
                        population.push(nn);
                    }
                }
            } else {
                console.log(`Continuando treino G ${currentGeneration}. Resetando fitness.`);
                population.forEach(nn => nn.fitness = -Infinity);
            }
            resultsReceivedCount = 0;
            populationFitness = {};
            tasksQueue = population.map(nn => ({
                id: nn.id,
                nnData: nn.getSerializableData()
            }));
            if (createWorkers()) {
                console.log(`Distribuindo tarefas G ${currentGeneration}...`);
                const initialTasks = Math.min(tasksQueue.length, workers.length);
                for (let i = 0; i < initialTasks; i++) assignTaskToWorker(i);
            } else {
                console.error("Falha workers. Abortando treino.");
                isTraining = false;
                aiStatusDisplay.innerText = `Controle: Humano (Erro Workers)`;
                aiStatusDisplay.style.backgroundColor = 'rgba(255, 223, 186, 0.9)';
                updateButtonStates();
                return;
            }
            resetGame();
            updateUI();
        }

        function stopTraining() {
            if (!isTraining) return;
            console.log("Parando Treinamento...");
            isTraining = false;
            terminateWorkers();
            tasksQueue = [];
            aiControlled = false;
            activeAI = null;
            aiStatusDisplay.innerText = `Controle: Humano (C)`;
            aiStatusDisplay.style.backgroundColor = 'rgba(255, 223, 186, 0.9)';
            resetGame();
            updateUI();
            console.log("Treinamento parado.");
        }
        // --- Funções de Gerenciamento da IA (INALTERADAS) ---
        function saveBestNN() {
            if (!bestNN) {
                alert("Nenhuma 'Melhor IA' para salvar.");

            }
            try {
                const dataToSave = bestNN.getSerializableData();
                const jsonString = JSON.stringify(dataToSave);

        function loadBestNN() {

                alert("Pare treino antes de carregar.");

            }

        function exportBestNN() {
            if (!bestNN) {
                alert("Nenhuma 'Melhor IA' para exportar.");
                return;
            }
            try {
                const dataToExport = bestNN.getSerializableData();
                const jsonString = JSON.stringify(dataToExport, null, 2);
                const blob = new Blob([jsonString], {
                    type: "application/json"
                });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                const fitStr = bestNN.fitness !== -Infinity ? Math.round(bestNN.fitness) : 'na';
                a.download = `rocket_ai_fit_${fitStr}_id_${bestNN.id.substring(0, 8)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                console.log(`Melhor IA (ID: ${bestNN.id}) exportada.`);
                alert("Arquivo da Melhor IA pronto para download.");

                console.error("Erro ao exportar IA:", error);

        function importNN() {
            if (isTraining) {
                alert("Pare treino antes de importar.");
                return;
            }
            importFileInput.click();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.type !== "application/json") {
                alert(`Tipo inválido: ${file.type}. Selecione .json.`);
                event.target.value = null;
                return;
            }
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const jsonString = e.target.result;
                    const importedData = JSON.parse(jsonString);
                    if (!importedData || typeof importedData !== 'object' || !importedData.weights_ih || typeof importedData.fitness === 'undefined' || !importedData.inputNodes || !importedData.hiddenNodes || !importedData.outputNodes) {
                        throw new Error("Arquivo JSON não contém dados esperados.");
                    }
                    const importedNN = NeuralNetwork.fromData(importedData);
                    if (importedNN) {
                        bestNN = importedNN;
                        bestFitnessEver = importedNN.fitness;
                        console.log(`IA importada "${file.name}" (ID: ${bestNN.id}, Fit: ${bestFitnessEver.toFixed(3)}).`);
                        alert(`IA importada!\nFit: ${bestFitnessEver.toFixed(3)}\nID: ${bestNN.id}`);
                        aiControlled = false;
                        activeAI = null;
                        aiStatusDisplay.innerText = `Controle: Humano (C)`;
                        aiStatusDisplay.style.backgroundColor = 'rgba(255, 223, 186, 0.9)';
                        resetGame();
                        updateStorageStatus();
                        updateButtonStates();
                    } else {
                        alert("Falha ao reconstruir IA do arquivo.");
                    }
                } catch (error) {
                    console.error("Erro ao importar/processar JSON:", error);
                    alert(`Falha ao importar IA: ${error.message}.`);
                } finally {
                    event.target.value = null;
                }
            };
            reader.onerror = function (e) {
                console.error("Erro ao ler arquivo:", e);
                alert("Erro ao ler arquivo.");
                event.target.value = null;
            };
            reader.readAsText(file);
        }

                    if (event.code === 'ArrowUp' || event.code === 'KeyW') rocket.isThrusting = false;
                    if (event.code === 'ArrowLeft' || event.code === 'KeyA') rocket.thrustingLeft = false;
                    if (event.code === 'ArrowRight' || event.code === 'KeyD') rocket.thrustingRight = false;
                }
            });
            startTrainingBtn.addEventListener('click', startTraining);
            stopTrainingBtn.addEventListener('click', stopTraining);
            useBestAIBtn.addEventListener('click', () => {
                if (bestNN && !isTraining) {
                    aiControlled = true;
                    activeAI = bestNN.copy();
                    aiStatusDisplay.innerText = `Controle: Melhor IA (C)`;
                    aiStatusDisplay.style.backgroundColor = 'rgba(144, 238, 144, 0.9)';
                    resetGame();
                } else if (isTraining) alert("Pare treino antes.");
                else alert("Nenhuma Melhor IA disponível.");
            });
            saveBestAIBtn.addEventListener('click', saveBestNN);
            loadSavedAIBtn.addEventListener('click', loadBestNN);
            exportBestAIBtn.addEventListener('click', exportBestNN);
            importAIBtn.addEventListener('click', importNN);
            importFileInput.addEventListener('change', handleFileImport);
            clearSavedAIBtn.addEventListener('click', clearSavedNN);
            toggleTrainingPanelBtn.addEventListener('click', toggleTrainingPanel); // <<< Listener para o botão
            window.addEventListener('resize', resizeCanvas); // <<< Listener para redimensionar janela
            // --- Inicialização Final ---
            console.log("Tentando carregar IA salva...");
            loadBestNN();
            console.log("Ajustando tamanho inicial do canvas...");
            resizeCanvas(); // <<< Chama o resize inicial
            console.log("Resetando estado inicial do jogo...");
            resetGame();
            console.log("Jogo inicializado. Loop principal...");
            gameLoop();
        };
        // --- Handlers Globais de Erro (INALTERADO) ---
        window.onerror = function (message, source, lineno, colno, error) {
            console.error("Erro Global:", message, "em", source, `L:${lineno}, C:${colno}`, error);
        };
        window.onunhandledrejection = function (event) {
            console.error("Rejeição Promise:", event.reason);
        };
    </script>
</body>

</html>
