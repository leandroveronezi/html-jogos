<!DOCTYPE html>
<html>
<head>
    <title>Jogo de Pouso Lunar</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #hud { position: absolute; top: 20px; left: 20px; color: white; font-family: Arial; z-index: 10; }
        #target { position: absolute; color: #0f0; font-weight: bold; }
    </style>
</head>
<body>
    <div id="hud">
        Combustível: <span id="fuel">100</span>%<br>
        Velocidade X: <span id="velocityX">0.0</span>m/s<br>
        Velocidade Y: <span id="velocityY">0.0</span>m/s<br>
        Ângulo: <span id="angle">0</span>°<br>
        Vento: <span id="wind">0</span>m/s<br>
        Pontuação: <span id="score">0</span><br>
        Nível: <span id="level">1</span>
    </div>
    <div id="target">PAD: --</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // Configuração do Canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Variáveis do jogo
        let fuel = 100;
        let posX = canvas.width / 2;
        let posY = 50;
        let velocityX = 0;
        let velocityY = 0;
        let angle = 0;
        let angularVelocity = 0;
        let wind = 0;
        let score = 0;
        let gameOver = false;
        let thrusting = false;
        let level = 1;
        const gravity = 0.08;
        const thrustPower = 0.12;
        const terrain = [];
        const angularDamping = 0.95;
        let landingPad = { x: 0, width: 80 };
        const dustParticles = [];

        // Geração de terreno com plataforma
        function generateTerrain() {
            terrain.length = 0;
            let yValues = [];

            // Cria plataforma de pouso
            const padPosition = Math.random() * (canvas.width - 200) + 100;
            landingPad.x = padPosition;

            for (let x = 0; x < canvas.width; x++) {
                let y = 0;
                y += noise(x/200, level) * 100;
                y += noise(x/50, level) * 30;
                y += noise(x/10, level) * 10;
                yValues.push(canvas.height - 200 + y);
            }

            // Cria área plana para o pouso
            for(let i = Math.floor(padPosition - 40); i < padPosition + 40; i++) {
                yValues[i] = Math.min(...yValues) + 10;
            }

            for (let x = 0; x < canvas.width; x++) {
                terrain.push({x, y: yValues[x]});
            }
        }

        // Função de ruído Perlin simplificada
        function noise(x, y) {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            x -= Math.floor(x);
            y -= Math.floor(y);
            const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
            const lerp = (a, b, t) => a + t * (b - a);
            const grad = (hash, x, y) => {
                const h = hash & 15;
                const u = h < 8 ? x : y;
                const v = h < 4 ? y : h === 12 || h === 14 ? x : 0;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            };
            const p = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,
                       140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247];
            const perm = new Array(512);
            for(let i=0; i<256; i++) perm[i] = p[i];
            for(let i=0; i<256; i++) perm[256+i] = p[i];

            const xi = Math.floor(x);
            const yi = Math.floor(y);
            const xf = x - xi;
            const yf = y - yi;
            const u = fade(xf);
            const v = fade(yf);
            const aa = perm[perm[xi] + yi];
            const ab = perm[perm[xi] + yi + 1];
            const ba = perm[perm[xi + 1] + yi];
            const bb = perm[perm[xi + 1] + yi + 1];
            return lerp(
                lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u),
                lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u),
                v
            );
        }

        // Desenha nave com trem de pouso
        function drawRocket() {
            ctx.save();
            ctx.translate(posX, posY);
            ctx.rotate(angle * Math.PI / 180);

            // Sombra
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 20, 20, 10, 0, 0, Math.PI*2);
            ctx.fill();

            // Corpo principal
            ctx.fillStyle = '#cccccc';
            ctx.beginPath();
            ctx.moveTo(-15, -25);
            ctx.lineTo(15, -25);
            ctx.lineTo(25, 0);
            ctx.lineTo(15, 20);
            ctx.lineTo(-15, 20);
            ctx.lineTo(-25, 0);
            ctx.closePath();
            ctx.fill();

            // Trem de pouso animado
            ctx.fillStyle = '#666666';
            ctx.fillRect(-18, 15, 8, 5);
            ctx.fillRect(10, 15, 8, 5);

            // Articulações
            ctx.fillStyle = '#444';
            ctx.fillRect(-20, 18, 4, 4);
            ctx.fillRect(12, 18, 4, 4);

            // Efeito de propulsão
            if (thrusting && fuel > 0) {
                ctx.fillStyle = '#ff4422';
                for(let i = 0; i < 10; i++) {
                    ctx.beginPath();
                    ctx.arc(
                        -10 + Math.random()*20,
                        25 + Math.random()*15,
                        Math.random()*3,
                        0, Math.PI*2
                    );
                    ctx.fill();
                }
            }

            // Luz de navegação
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(-2, -28, 4, 4);
            ctx.restore();
        }

        // Partículas de poeira
        function createDust() {
            for (let i = 0; i < 20; i++) {
                dustParticles.push({
                    x: posX + Math.random() * 30 - 15,
                    y: posY + 20 + Math.random() * 10,
                    vx: Math.random() * 4 - 2,
                    vy: Math.random() * 2 + 1,
                    life: Math.random() * 30 + 10
                });
            }
        }

        function updateDust() {
            dustParticles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 1;

                if (p.life <= 0) {
                    dustParticles.splice(index, 1);
                }
            });
        }

        function drawDust() {
            dustParticles.forEach(p => {
                ctx.fillStyle = `rgba(255,255,255,${p.life / 50})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Desenha o fundo estrelado
        function drawBackground() {
            const gradient = ctx.createRadialGradient(
                canvas.width/2, canvas.height + 200, 100,
                canvas.width/2, canvas.height + 200, canvas.height*2
            );
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(0.5, '#2a2a4e');
            gradient.addColorStop(1, '#0a0a1e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i = 0; i < 200; i++) {
                const size = Math.random() * 2;
                const alpha = 0.2 + Math.random() * 0.8;
                ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                ctx.fillRect(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    size, size
                );
            }

            ctx.fillStyle = 'rgba(50, 50, 200, 0.1)';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
        }

        // Desenha o terreno
        function drawTerrain() {
            const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
            gradient.addColorStop(0, '#4a4a4a');
            gradient.addColorStop(0.5, '#6a6a6a');
            gradient.addColorStop(1, '#8a8a8a');
            ctx.fillStyle = gradient;

            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            terrain.forEach(point => ctx.lineTo(point.x, point.y));
            ctx.lineTo(canvas.width, canvas.height);
            ctx.fill();

            ctx.fillStyle = '#3a3a3a';
            for(let i = 0; i < terrain.length; i += 10) {
                ctx.fillRect(terrain[i].x, terrain[i].y, 2, 2);
            }

            ctx.fillStyle = '#5a5a5a';
            terrain.forEach((point, i) => {
                if(Math.random() > 0.995 && i > 0 && i < terrain.length-1) {
                    ctx.beginPath();
                    ctx.arc(point.x, point.y - 10, 5 + Math.random()*10, 0, Math.PI*2);
                    ctx.fill();
                }
            });
        }

        // Desenha plataforma de pouso
        function drawLandingPad() {
            ctx.save();
            ctx.fillStyle = '#00ff00';
            ctx.globalAlpha = 0.3;
            ctx.fillRect(landingPad.x - 40, terrain[Math.floor(landingPad.x)].y - 5, 80, 10);

            // Efeito de holograma
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(landingPad.x, terrain[Math.floor(landingPad.x)].y - 20);
            ctx.lineTo(landingPad.x, 0);
            ctx.stroke();
            ctx.restore();
        }

        // Física do jogo
        function updatePhysics() {
            velocityY += gravity;
            velocityX += wind * 0.002;

            if (thrusting && fuel > 0) {
                const thrustForceX = thrustPower * Math.sin(angle * Math.PI / 180);
                const thrustForceY = thrustPower * Math.cos(angle * Math.PI / 180);
                velocityX += thrustForceX;
                velocityY -= thrustForceY;
                fuel = Math.max(fuel - 0.3, 0);
            }

            angularVelocity *= angularDamping;
            angle += angularVelocity;
            angle = angle % 360;

            posX += velocityX;
            posY += velocityY;

            posX = Math.max(0, Math.min(canvas.width, posX));
            posY = Math.max(0, posY);
        }

        // Verifica colisão
        function checkCollision() {
            const rocketX = posX;
            const rocketY = posY + 20;

            if (rocketY >= canvas.height - 20) return true;
            if (Math.abs(angle) > 15) return true;
            if (Math.sqrt(velocityX**2 + velocityY**2) > 5) return true;

            for(let i = 1; i < terrain.length; i++) {
                const x1 = terrain[i-1].x;
                const y1 = terrain[i-1].y;
                const x2 = terrain[i].x;
                const y2 = terrain[i].y;

                if (rocketX >= x1 && rocketX <= x2) {
                    const terrainY = y1 + (y2 - y1) * (rocketX - x1)/(x2 - x1);
                    if (rocketY >= terrainY - 5) {
                        createDust();
                        return true;
                    }
                }
            }
            return false;
        }

        // Verifica pouso na plataforma
        function checkLanding() {
            const rocketX = posX;
            const rocketY = posY + 20;

            // Verifica plataforma
            if (rocketX > landingPad.x - 40 &&
                rocketX < landingPad.x + 40 &&
                rocketY >= terrain[Math.floor(rocketX)].y - 5 &&
                Math.abs(angle) < 5 &&
                Math.sqrt(velocityX**2 + velocityY**2) < 2) {
                return 'perfect';
            }

            // Verifica terreno
            if (checkCollision()) {
                return 'crash';
            }

            return 'safe';
        }

        // Tela de resultados
        function handleLanding() {
            gameOver = true;
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#fff';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';

            const landingResult = checkLanding();

            if (landingResult === 'perfect') {
                score += 5000 + fuel * 5;
                ctx.fillStyle = '#00ff00';
                ctx.fillText('POUSO PERFEITO!', canvas.width/2, canvas.height/2 - 30);
            } else if (landingResult === 'safe') {
                score += 1000 + fuel * 2 - Math.abs(angle) * 5;
                ctx.fillText('Pouso bem-sucedido!', canvas.width/2, canvas.height/2 - 30);
            } else {
                ctx.fillStyle = '#ff0000';
                ctx.fillText('COLISÃO FATAL!', canvas.width/2, canvas.height/2 - 30);
            }

            ctx.font = '20px Arial';
            ctx.fillStyle = '#fff';
            ctx.fillText(`Pontuação: ${Math.round(score)}`, canvas.width/2, canvas.height/2);
            ctx.fillText('Pressione R para reiniciar', canvas.width/2, canvas.height/2 + 40);

            if (landingResult !== 'crash') {
                level++;
                setTimeout(() => {
                    restartGame();
                }, 2000);
            }
        }

        // Reinicia o jogo
                // Reinicia o jogo
        function restartGame() {
            posX = canvas.width / 2;
            posY = 50;
            velocityX = 0;
            velocityY = 0;
            angle = 0;
            angularVelocity = 0;
            fuel = 100;
            gameOver = false;
            dustParticles.length = 0; // Limpa as partículas de poeira
            generateTerrain(); // Gera um novo terreno
            wind = Math.random() * 10 - 5; // Define um novo valor de vento
            document.getElementById('level').textContent = level; // Atualiza o nível no HUD
            update(); // Reinicia o loop principal
        }

        // Atualiza HUD
        function updateHUD() {
            document.getElementById('fuel').textContent = Math.round(fuel);
            document.getElementById('velocityX').textContent = velocityX.toFixed(1);
            document.getElementById('velocityY').textContent = velocityY.toFixed(1);
            document.getElementById('angle').textContent = angle.toFixed(0);
            document.getElementById('wind').textContent = wind.toFixed(1);
            document.getElementById('score').textContent = Math.round(score);
            document.getElementById('target').style.left = `${landingPad.x - 40}px`;
            document.getElementById('target').textContent = 'PAD ▼';
        }

        // Loop principal
        function update() {
            if (gameOver) return;

            updatePhysics(); // Atualiza a física do jogo

            // Verifica colisão ou pouso
            if (checkCollision() || posY > canvas.height - 50) {
                handleLanding();
                return;
            }

            // Renderização
            drawBackground(); // Desenha o fundo estrelado
            drawTerrain(); // Desenha o terreno
            drawLandingPad(); // Desenha a plataforma de pouso
            drawRocket(); // Desenha a nave
            drawDust(); // Desenha as partículas de poeira
            updateDust(); // Atualiza as partículas de poeira
            updateHUD(); // Atualiza o HUD

            requestAnimationFrame(update); // Continua o loop
        }

        // Controles
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') angularVelocity = Math.max(angularVelocity - 0.2, -2); // Gira para a esquerda
            if (e.key === 'ArrowRight') angularVelocity = Math.min(angularVelocity + 0.2, 2); // Gira para a direita
            if (e.key === 'ArrowUp') thrusting = true; // Ativa o motor
            if (e.key === 'r' && gameOver) restartGame(); // Reinicia o jogo
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') thrusting = false; // Desativa o motor
        });

        // Inicialização
        function init() {
            generateTerrain(); // Gera o terreno inicial
            wind = Math.random() * 10 - 5; // Define o vento inicial
            update(); // Inicia o loop principal
        }

        init(); // Inicia o jogo
    </script>
</body>
</html>
