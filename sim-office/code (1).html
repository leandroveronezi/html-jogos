        const vec3 = { /* ... vec3 funcs ... */ subtract:(out,a,b)=>{out[0]=a[0]-b[0];out[1]=a[1]-b[1];out[2]=a[2]-b[2];return out;}, normalize:(out,a)=>{let l=Math.hypot(a[0],a[1],a[2]);if(l>1e-5){l=1/l;out[0]=a[0]*l;out[1]=a[1]*l;out[2]=a[2]*l;}else{out[0]=0;out[1]=0;out[2]=0;}return out;}, cross:(out,a,b)=>{out[0]=a[1]*b[2]-a[2]*b[1];out[1]=a[2]*b[0]-a[0]*b[2];out[2]=a[0]*b[1]-a[1]*b[0];return out;}, distance:(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]) };

        const positionAttribLocation = gl.getAttribLocation(program, 'a_position'); /* ... outros getAttribLocation/getUniformLocation como v7.4 ... */ const normalAttribLocation = gl.getAttribLocation(program, 'a_normal'); const mvpMatrixUniformLocation = gl.getUniformLocation(program, 'u_mvpMatrix'); const modelMatrixUniformLocation = gl.getUniformLocation(program, 'u_modelMatrix'); const normalMatrixUniformLocation = gl.getUniformLocation(program, 'u_normalMatrix'); const colorUniformLocation = gl.getUniformLocation(program, 'u_color'); const lightDirectionUniformLocation = gl.getUniformLocation(program, 'u_lightDirection'); const ambientColorUniformLocation = gl.getUniformLocation(program, 'u_ambientColor'); const directionalColorUniformLocation = gl.getUniformLocation(program, 'u_directionalColor'); const viewPositionUniformLocation = gl.getUniformLocation(program, 'u_viewPosition'); const shininessUniformLocation = gl.getUniformLocation(program, 'u_shininess'); const specularColorUniformLocation = gl.getUniformLocation(program, 'u_specularColor');

             if (officeTasks.filter(t=>t.status==='pending').length<workers.length/4&&officeTasks.filter(t=>t.status!=='completed').length<MAX_TASKS*0.8){generateTasks(workers.length/2);}

             workers.forEach(worker => {
                 // Lógica do banheiro (com fallback de correção)
                 if (worker.isInsideBathroom) {
                     worker.stateTimer -= dtMs;
                     if (worker.state === 'using_bathroom' && worker.stateTimer <= 0) {
                         worker.isInsideBathroom = false; // Tenta sair

                         worker.state = 'moving_to_desk';
                         // Garante que currentGrid está na porta antes de pathfind
                         const doorGrid = worldToGrid(worker.pos[0], worker.pos[2]);
                         if(!isWalkable(doorGrid[0], doorGrid[1]) && (officeLayout[doorGrid[1]]?.[doorGrid[0]] === 11 || officeLayout[doorGrid[1]]?.[doorGrid[0]] === 12)) {
                              worker.currentGrid = [...doorGrid]; // Atualiza se estava ligeiramente fora
                         } else {
                            // Se não estava na porta, pode ter sido corrigido, tenta do grid atual
                         }

                         const path = findPath(worker.currentGrid[0], worker.currentGrid[1], destinationGrid[0], destinationGrid[1]);
                         if (path && path.length > 1) {
                             worker.currentPath = path; worker.pathIndex = 1;
                             const [targetWorldX, _, targetWorldZ] = gridToWorld(path[1][0], path[1][1]);
                             worker.targetPos = [targetWorldX, 0, targetWorldZ];
                         } else {
                             console.warn(`Worker ${worker.id} no path from bathroom ${worker.currentGrid} to desk spot ${destinationGrid}. Reverting to idle.`);
                             // A função correctStuckWorkers deve pegá-lo se ele ficar preso na porta
                             worker.state = 'idle';

                             worker.currentPath = null; worker.pathIndex = 0;

                     }
                     return; // Pula o resto se está (ou acabou de sair) do banheiro
                 }

                 // *** Verifica se está no PONTO da mesa (deskSpotGrid) ***
                 const isAtDeskSpot = worker.currentGrid[0] === worker.deskSpotGrid[0] && worker.currentGrid[1] === worker.deskSpotGrid[1];

                 // Acumular necessidades
                 if (worker.state === 'working' || (worker.state === 'idle' && isAtDeskSpot )) { /* ... (inalterado) ... */ worker.timeSinceBreak+=dtMs;worker.timeSinceBathroom+=dtMs;if(worker.timeSinceBreak>WORK_TIME_BEFORE_BREAK_CHANCE)worker.needs.break+=Math.random()*0.00015*dtMs*(worker.timeSinceBreak/WORK_TIME_BEFORE_BREAK_CHANCE);if(worker.timeSinceBathroom>WORK_TIME_BEFORE_BATHROOM_CHANCE)worker.needs.bathroom+=Math.random()*0.00012*dtMs*(worker.timeSinceBathroom/WORK_TIME_BEFORE_BATHROOM_CHANCE);worker.needs.break=Math.min(worker.needs.break,1.0);worker.needs.bathroom=Math.min(worker.needs.bathroom,1.0); }
                 // Progresso da tarefa
                 if (worker.state === 'working' && worker.currentTask) { worker.taskProgress -= dtMs; worker.stateTimer = worker.taskProgress; }

                 // Lógica de Movimento (como v7.4)
                 if (worker.state.startsWith('moving_')) { if (!worker.currentPath || worker.pathIndex >= worker.currentPath.length) { if (worker.currentPath && worker.pathIndex >= worker.currentPath.length) { const finalGrid = worker.currentPath[worker.currentPath.length - 1]; const finalWorldPos = gridToWorld(finalGrid[0], finalGrid[1]); worker.pos[0] = finalWorldPos[0]; worker.pos[2] = finalWorldPos[2]; worker.currentGrid = [...finalGrid]; } worker.currentPath = null; worker.pathIndex = 0; if (worker.state === 'moving_to_desk') { worker.state = 'idle'; worker.stateTimer = 500 + Math.random()*1500; } else if (worker.state === 'moving_to_break') { worker.state = 'on_break'; worker.stateTimer = BREAK_DURATION_MIN + Math.random()*(BREAK_DURATION_MAX-BREAK_DURATION_MIN); } else if (worker.state === 'moving_to_bathroom') { worker.isInsideBathroom = true; worker.state = 'using_bathroom'; worker.stateTimer = BATHROOM_DURATION_MIN + Math.random()*(BATHROOM_DURATION_MAX-BATHROOM_DURATION_MIN); } else if (worker.state === 'moving_to_desk_for_work') { worker.state = 'working'; worker.stateTimer = worker.currentTask ? worker.taskProgress : 500; } else { worker.state = 'idle'; worker.stateTimer = 500; } } else { const targetGrid = worker.currentPath[worker.pathIndex]; const [targetWorldX, _, targetWorldZ] = gridToWorld(targetGrid[0], targetGrid[1]); worker.targetPos = [targetWorldX, 0, targetWorldZ]; const dx = worker.targetPos[0] - worker.pos[0]; const dz = worker.targetPos[2] - worker.pos[2]; const dist = Math.sqrt(dx * dx + dz * dz); const moveAmount = worker.speed * GRID_UNIT * deltaTimeSeconds; if (dist < moveAmount || dist < 0.1) { worker.pos[0] = targetWorldX; worker.pos[2] = targetWorldZ; worker.pathIndex++; if (worker.pathIndex < worker.currentPath.length) { const nextTargetGrid = worker.currentPath[worker.pathIndex]; const [nextTargetWorldX, _, nextTargetWorldZ] = gridToWorld(nextTargetGrid[0], nextTargetGrid[1]); worker.targetPos = [nextTargetWorldX, 0, nextTargetWorldZ]; } } else { worker.pos[0] += (dx / dist) * moveAmount; worker.pos[2] += (dz / dist) * moveAmount; } } }
                 // Lógica de Decisão (como v7.4, mas usando deskSpotGrid)
                 else if (worker.stateTimer <= 0 || worker.state === 'idle') {
                     let needsPath = false; let destinationGrid = null; let nextState = worker.state; let decidedAction = false;

                     if (worker.state === 'idle') {
                          if (!decidedAction && worker.needs.bathroom > NEED_THRESHOLD && Math.random() < CHANCE_TO_ACT_ON_NEED) {
                              const targetBathroomPool = Math.random() > 0.5 ? bathroomSpotsF : bathroomSpotsM;
                              if (targetBathroomPool.length > 0) { const targetSpot = targetBathroomPool[Math.floor(Math.random() * targetBathroomPool.length)]; destinationGrid = [targetSpot.gridX, targetSpot.gridZ]; nextState = 'moving_to_bathroom'; needsPath = true; worker.needs.bathroom = 0; worker.timeSinceBathroom = 0; decidedAction = true; }
                          }
                          if (!decidedAction && worker.needs.break > NEED_THRESHOLD && Math.random() < CHANCE_TO_ACT_ON_NEED) {
                              const breakPool = [...loungeSpots, ...cafeSpots]; // Combina lounge e cafe para pausas
                              if (breakPool.length > 0) { const targetSpot = breakPool[Math.floor(Math.random() * breakPool.length)]; destinationGrid = [targetSpot.gridX, targetSpot.gridZ]; nextState = 'moving_to_break'; needsPath = true; worker.needs.break = 0; worker.timeSinceBreak = 0; decidedAction = true; }
                               else { if(loungeSpots.length === 0 && cafeSpots.length === 0) console.warn("No break spots (lounge or cafe) available!"); worker.stateTimer = 1500 + Math.random()*2000; } // Espera se não houver locais
                          }
                          if (!decidedAction && worker.currentTask && worker.state !== 'working') {
                              if (!isAtDeskSpot) { // *** Precisa ir para o PONTO da mesa ***
                                  destinationGrid = worker.deskSpotGrid; nextState = 'moving_to_desk_for_work'; needsPath = true; decidedAction = true;
                              } else { worker.state = 'working'; worker.stateTimer = worker.currentTask.duration; decidedAction = true; needsPath = false; }
                          }
                          if (!decidedAction && !worker.currentTask && assignTask(worker)) {
                              if (!isAtDeskSpot) { // *** Precisa ir para o PONTO da mesa ***
                                   destinationGrid = worker.deskSpotGrid; nextState = 'moving_to_desk_for_work'; needsPath = true;
                               } else { worker.state = 'working'; worker.stateTimer = worker.currentTask.duration; needsPath = false; }
                               decidedAction = true;
                          }
                          if (!decidedAction && worker.state === 'idle') { worker.stateTimer = 1000 + Math.random()*1500; }

                     } else if (worker.stateTimer <= 0) {
                         switch (worker.state) {
                             case 'working': if (worker.currentTask) { worker.currentTask.status = 'completed'; worker.currentTask = null; } worker.taskProgress = 0; worker.state = 'idle'; worker.stateTimer = 500 + Math.random()*1000; decidedAction = true; needsPath = false; break;
                             case 'on_break': destinationGrid = worker.deskSpotGrid; nextState = 'moving_to_desk'; needsPath = true; decidedAction = true; break; // *** Volta para o PONTO da mesa ***
                         }
                     }

                     // Iniciar Pathfinding
                     if (needsPath && destinationGrid) {
                         const path = findPath(worker.currentGrid[0], worker.currentGrid[1], destinationGrid[0], destinationGrid[1]);
                         if (path && path.length > 1) { worker.currentPath = path; worker.pathIndex = 1; worker.state = nextState; const [targetWorldX, _, targetWorldZ] = gridToWorld(path[1][0], path[1][1]); worker.targetPos = [targetWorldX, 0, targetWorldZ]; }
                         else { console.warn(`Worker ${worker.id} no path from ${worker.currentGrid} to ${destinationGrid} for state ${nextState}. Reverting to idle.`); worker.state = 'idle'; worker.stateTimer = 3000 + Math.random() * 2000; if(nextState === 'moving_to_bathroom') worker.needs.bathroom = NEED_THRESHOLD; if(nextState === 'moving_to_break') worker.needs.break = NEED_THRESHOLD; if(nextState === 'moving_to_desk_for_work' && worker.currentTask) { worker.currentTask.status = 'pending'; worker.currentTask.assignedWorkerId = null; worker.currentTask = null; } }
                     } else if (needsPath && !destinationGrid) { console.error(`Worker ${worker.id} needs path but destinationGrid is null! State: ${worker.state} -> ${nextState}`); worker.state = 'idle'; worker.stateTimer = 1000; }
                 }
             }); // Fim do forEach worker
         } // Fim do updateWorkers


        // --- Controle da Câmera (como antes) ---
        let isDragging = false; let lastMouseX = 0; let lastMouseY = 0; /* ... listeners ... */ canvas.addEventListener('mousedown', (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; canvas.style.cursor = 'grabbing'; }); canvas.addEventListener('mouseup', () => { isDragging = false; canvas.style.cursor = 'grab'; }); canvas.addEventListener('mouseleave', () => { isDragging = false; canvas.style.cursor = 'grab'; }); canvas.addEventListener('mousemove', (e) => { if (!isDragging) return; const dx = e.clientX - lastMouseX; const dy = e.clientY - lastMouseY; camera.angleY -= dx * 0.005; camera.angleX -= dy * 0.005; camera.angleX = Math.max(0.01, Math.min(Math.PI / 2 - 0.01, camera.angleX)); lastMouseX = e.clientX; lastMouseY = e.clientY; }); canvas.addEventListener('wheel', (e) => { e.preventDefault(); const zoomAmount = e.deltaY * 0.1; camera.distance += zoomAmount; camera.distance = Math.max(camera.minDistance, Math.min(camera.maxDistance, camera.distance)); }); function updateCameraPosition() { const camX=camera.target[0]+camera.distance*Math.sin(camera.angleY)*Math.cos(camera.angleX); const camY=camera.target[1]+camera.distance*Math.sin(camera.angleX); const camZ=camera.target[2]+camera.distance*Math.cos(camera.angleY)*Math.cos(camera.angleX); camera.position[0]=camX; camera.position[1]=camY; camera.position[2]=camZ; }


        // --- Loop Principal de Renderização WebGL ---
        let lastTime = 0;
        const projectionMatrix = mat4.create(); const viewMatrix = mat4.create(); const modelMatrix = mat4.create();
        const normalMatrix = mat3.create(); const mvpMatrix = mat4.create();
        const lightDirection = vec3.normalize([], [-0.5, -0.8, -0.3]);
        const ambientColor = [0.3, 0.3, 0.35];
        const directionalColor = [0.7, 0.7, 0.65];
        const globalSpecularColor = [0.9, 0.9, 0.9];
        const defaultShininess = 32;
        const taskInfoDiv = document.getElementById('taskInfo');

        function renderLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            const deltaTimeSeconds = deltaTime * 0.001 || 0;
            lastTime = timestamp;

            // --- Atualizações ---
            updateWorkers(deltaTimeSeconds);
            updateCameraPosition();

             // --- Verificação Periódica de Stuck ---
             stuckCheckTimer -= deltaTime;
             if (stuckCheckTimer <= 0) {
                 correctStuckWorkers();
                 stuckCheckTimer = STUCK_CHECK_INTERVAL; // Reseta timer
             }

            // --- UI Update ---
            const pendingTasks = officeTasks.filter(t=>t.status==='pending').length; const activeTasks = officeTasks.filter(t=>t.status==='assigned').length; taskInfoDiv.textContent = `Tarefas Pendentes: ${pendingTasks} / Ativas: ${activeTasks}`;

            // --- Renderização ---
            gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
            gl.clearColor(0.18, 0.19, 0.21, 1.0);
            gl.clearDepth(1.0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            const aspect = gl.canvas.clientWidth / gl.canvas.clientHeight;
            mat4.perspective(projectionMatrix, camera.fovDegrees*Math.PI/180, aspect, camera.near, camera.far);
            mat4.lookAt(viewMatrix, camera.position, camera.target, camera.up);

            gl.useProgram(program);

            gl.uniform3fv(ambientColorUniformLocation, ambientColor);
            gl.uniform3fv(directionalColorUniformLocation, directionalColor);
            gl.uniform3fv(viewPositionUniformLocation, camera.position);

            // Renderables Dinâmicos (NPCs)
            const dynamicRenderables = [];
            workers.forEach(w => {
                if (!w.isInsideBathroom) { const torsoY = w.torsoScale[1] / 2; const headY = w.torsoScale[1] + w.headScale[1] / 2; dynamicRenderables.push({ geometryType: 'cube', position: [w.pos[0], headY, w.pos[2]], scale: w.headScale, color: w.headColor, shininess: w.shininessHead }); dynamicRenderables.push({ geometryType: 'cube', position: [w.pos[0], torsoY, w.pos[2]], scale: w.torsoScale, color: w.torsoColor, shininess: w.shininessBody }); }
            });

            // Renderizar tudo
            const allRenderables = [...staticRenderables, ...dynamicRenderables];
            allRenderables.forEach(obj => {
                const geometry = geometries[obj.geometryType]; if (!geometry) { /*console.log("Missing geom:", obj.geometryType);*/ return; } // DEBUG
                gl.bindBuffer(gl.ARRAY_BUFFER, geometry.positionBuffer); gl.vertexAttribPointer(positionAttribLocation, 3, gl.FLOAT, false, 0, 0); gl.enableVertexAttribArray(positionAttribLocation);
                gl.bindBuffer(gl.ARRAY_BUFFER, geometry.normalBuffer); gl.vertexAttribPointer(normalAttribLocation, 3, gl.FLOAT, false, 0, 0); gl.enableVertexAttribArray(normalAttribLocation);
                gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, geometry.indexBuffer);
                mat4.identity(modelMatrix); mat4.translate(modelMatrix, modelMatrix, obj.position); if(obj.rotation) { if (obj.rotation[0]!==0) mat4.multiply(modelMatrix,modelMatrix,mat4.fromXRotation(mat4.create(),obj.rotation[0])); if (obj.rotation[1]!==0) mat4.multiply(modelMatrix,modelMatrix,mat4.fromYRotation(mat4.create(),obj.rotation[1])); if (obj.rotation[2]!==0) mat4.multiply(modelMatrix,modelMatrix,mat4.fromZRotation(mat4.create(),obj.rotation[2])); } mat4.scale(modelMatrix, modelMatrix, obj.scale); mat4.multiply(mvpMatrix, viewMatrix, modelMatrix); mat4.multiply(mvpMatrix, projectionMatrix, mvpMatrix); mat3.normalFromMat4(normalMatrix, modelMatrix);
                gl.uniformMatrix4fv(mvpMatrixUniformLocation, false, mvpMatrix); gl.uniformMatrix4fv(modelMatrixUniformLocation, false, modelMatrix); gl.uniformMatrix3fv(normalMatrixUniformLocation, false, normalMatrix); gl.uniform3fv(colorUniformLocation, obj.color); gl.uniform1f(shininessUniformLocation, obj.shininess !== undefined ? obj.shininess : defaultShininess); gl.uniform3fv(specularColorUniformLocation, obj.specularColor || globalSpecularColor);
                gl.drawElements(gl.TRIANGLES, geometry.vertexCount, gl.UNSIGNED_SHORT, 0);
            });

            gl.disableVertexAttribArray(positionAttribLocation);
            gl.disableVertexAttribArray(normalAttribLocation);

            requestAnimationFrame(renderLoop);
        }

        // --- Iniciar ---
        initializeWorld();
        requestAnimationFrame(renderLoop);
