<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Escritório v8.0 (Three.js, 3D Realista)</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Import Map para Three.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="uiContainer">
        <div class="stat">
            <span class="stat-label">Tarefas Pendentes:</span>
            <span class="stat-value" id="taskPendingVal">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">Tarefas Ativas:</span>
            <span class="stat-value" id="taskActiveVal">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">Dia:</span>
            <span class="stat-value" id="timeOfDayVal">Manhã</span>
        </div>
    </div>
    <!-- Three.js vai criar o canvas automaticamente, mas podemos usar um fixo se preferir. 
         Aqui vamos deixar ele criar e sobrescrever o css. -->
    <canvas id="webglCanvas"></canvas>
    <div id="info">Use o botão esquerdo para girar, direito para mover. Use o scroll para zoom.</div>

    <script type="module" src="main.js"></script>
</body>
</html>
