<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominó Minimalista v6.4 - Lógica e Visuais Refinados</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e0e0e0; /* Fundo canvas claro */
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 1px solid #bdbdbd; /* Borda cinza claro */
            box-shadow: 0 6px 15px rgba(0,0,0,0.2); /* Sombra mais suave */
            display: block;
            cursor: default;
            max-width: 100%;
            max-height: calc(100vh - 20px);
            aspect-ratio: 20 / 11;
            background-color: #f0f0f0; /* Fundo interno do canvas um pouco diferente */
            border-radius: 4px;
        }
        canvas.esperando {
            cursor: wait;
        }
        canvas.clicavel {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Constantes ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const JOGADOR = 'jogador';
        const IA = 'ia';
        const PECA_LARGURA_BASE = 60;
        const PECA_ALTURA_BASE = 30;
        const DOT_RAIO_BASE = 3.2;
        const CANTO_RAIO_BASE = 4;
        const DELAY_IA = 750;
        const ESPACO_ENTRE_PECAS_MESA_BASE = 5;
        const ESPACO_ENTRE_PECAS_MAO_BASE = 7;
        const MARGEM_BORDA_LATERAL_BASE = 25;
        const MARGEM_BORDA_VERTICAL_BASE = 25;
        const FATOR_LIMITE_COLISAO = 0.98; // Quão perto chega da borda antes de virar

        // Cores Refinadas (Tema "Feltro Verde" Clássico/Claro)
        const COR_FUNDO_CANVAS = '#e0e0e0';           // Cinza bem claro (quase branco)
        const COR_FUNDO_MESA = '#00695c';             // Verde Feltro (Teal mais escuro)
        const COR_FUNDO_AREA_IA = '#f5f5f5';          // Fundo das áreas quase branco
        const COR_FUNDO_AREA_JOGADOR = '#f5f5f5';
        const COR_FUNDO_AREA_MONTE = '#eeeeee';       // Monte ligeiramente diferente
        const COR_BORDA_AREA = 'rgba(0, 0, 0, 0.15)'; // Borda escura sutil
        const COR_PECA = '#fafafa';                   // Peça branca
        const COR_PECA_VERSO = '#455a64';             // Verso Azul-acinzentado escuro
        const COR_DOT = '#111111';                   // Dots pretos/cinza muito escuro
        const COR_LINHA_PECA = '#bdbdbd';             // Linha divisória cinza médio
        const COR_TEXTO_UI = '#424242';               // Texto UI cinza escuro
        const COR_TEXTO_STATUS = '#212121';           // Texto status quase preto
        const COR_DESTAQUE_SELECAO = '#ff8f00';       // Laranja Âmbar para seleção/highlight
        const COR_DESTAQUE_JOGAVEL_FILL = 'rgba(255, 143, 0, 0.1)';  // Fill laranja bem transparente
        const COR_DESTAQUE_JOGAVEL_STROKE = '#ff8f00'; // Stroke laranja
        const COR_DESTAQUE_COMPRA_STROKE = '#f57c00'; // Laranja um pouco mais escuro para compra
        const COR_BOTAO_PASSAR_FILL = '#9e9e9e';       // Botão cinza médio
        const COR_BOTAO_PASSAR_TEXT = '#ffffff';       // Texto branco no botão
        const COR_BOTAO_PASSAR_HOVER_FILL = '#757575'; // Botão mais escuro no hover
        const COR_DESTAQUE_JOGAVEL_HAND = '#ff8f00';   // Destaque na mão laranja, consistente
        const COR_OVERLAY_FIM = 'rgba(255, 255, 255, 0.85)'; // Overlay de fim claro/branco
        const COR_TEXTO_FIM = '#000000';               // Texto fim preto


        // --- Variáveis Globais ---
        let CANVAS_LARGURA;
        let CANVAS_ALTURA;
        let CENTRO_X;
        let CENTRO_Y;
        let escalaDesenho = 1;
        let tamanhoFonteBase;
        let pecaLarguraH;
        let pecaAlturaH;
        let pecaLarguraV;
        let pecaAlturaV;
        let dotRaio;
        let cantoRaio;
        let espacoMesaEscalado;
        let espacoMaoEscalado;
        let margemLateralMesaEscalada;
        let margemVerticalMesaEscalada;
        let margemGeralInterface = 12;

        // Áreas Retangulares Layout
        let areaTotalRect = {};
        let areaIARect = {};
        let areaMesaRect = {};
        let areaJogadorRect = {};
        let areaMonteRect = {};
        let areaStatusRect = {};
        let areaBotaoPassarRect = {};

        let centroMesaX;
        let centroMesaY;
        let limiteSuperiorMesa;
        let limiteInferiorMesa;
        let limiteEsquerdoMesa;
        let limiteDireitoMesa;

        let areaJogarEsquerda = { ativa: false };
        let areaJogarDireita = { ativa: false };
        let areaClicarMonte = {};

        // Estado do Jogo
        let todasAsPecas = [];
        let maoJogador = [];
        let maoIA = [];
        let monte = [];
        let mesa = [];
        let pontas = { esquerda: null, direita: null };
        let pecaSelecionada = null;
        let mensagemStatus = "";
        let mensagemFimJogo = "";
        let jogoAcabou = false;
        let turnoAtual = null;
        let jogadorPodeInteragir = false;
        let passesConsecutivos = 0;
        let mostrarBotaoPassar = false;
        let hoverBotaoPassar = false;
        let direcaoLogicaEsquerda = 'esquerda'; // Não usado diretamente para desenho, mas pode ser útil
        let direcaoLogicaDireita = 'direita';  // Não usado diretamente para desenho, mas pode ser útil
        let jogadorQueIniciou = null;

        // --- Classe Peca ---
        class Peca {
            constructor(lado1, lado2) {
                this.l1 = lado1;
                this.l2 = lado2;
                const vA = Math.min(lado1, lado2);
                const vB = Math.max(lado1, lado2);
                this.id = `${vA}-${vB}`;
            }

            desenharCorpo(x, y, w, h, bg, border, highlight = null) {
                const r = cantoRaio;
                ctx.fillStyle = bg;
                ctx.strokeStyle = highlight ?? border;
                ctx.lineWidth = (highlight) ? 2.5 * escalaDesenho : 1.5 * escalaDesenho;
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            desenharFrente(x, y, ladoAVisivel, ladoBVisivel, orientacao = 'horizontal', selecionada = false, jogavel = false) {
                const ehHorizontal = (orientacao === 'horizontal');
                const w = ehHorizontal ? pecaLarguraH : pecaLarguraV;
                const h = ehHorizontal ? pecaAlturaH : pecaAlturaV;
                let corDestaque = null;
                if (selecionada) { corDestaque = COR_DESTAQUE_SELECAO; }
                else if (jogavel) { corDestaque = COR_DESTAQUE_JOGAVEL_HAND; }
                this.desenharCorpo(x, y, w, h, COR_PECA, COR_LINHA_PECA, corDestaque);
                ctx.strokeStyle = COR_LINHA_PECA; ctx.lineWidth = 1.5 * escalaDesenho; ctx.beginPath();
                if (ehHorizontal) { ctx.moveTo(x + w / 2, y + 3 * escalaDesenho); ctx.lineTo(x + w / 2, y + h - 3 * escalaDesenho); }
                else { ctx.moveTo(x + 3 * escalaDesenho, y + h / 2); ctx.lineTo(x + w - 3 * escalaDesenho, y + h / 2); }
                ctx.stroke();
                this.desenharDots(ladoAVisivel, x, y, w, h, ehHorizontal ? 'esquerda' : 'cima', orientacao);
                this.desenharDots(ladoBVisivel, x, y, w, h, ehHorizontal ? 'direita' : 'baixo', orientacao);
            }

            desenharVerso(x, y, orientacao = 'vertical') {
                 const ehHorizontal = (orientacao === 'horizontal');
                 const w = ehHorizontal ? pecaLarguraH : pecaLarguraV; const h = ehHorizontal ? pecaAlturaH : pecaAlturaV;
                 this.desenharCorpo(x, y, w, h, COR_PECA_VERSO, '#607d8b'); // Borda um pouco mais clara no verso
                 ctx.fillStyle = '#78909c'; // Pino cinza azulado mais claro
                 ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, dotRaio * 1.1, 0, Math.PI * 2); ctx.fill();
            }

            desenharDots(numero, pecaX, pecaY, larguraPeca, alturaPeca, qualMetade, orientacaoPeca) {
                if (numero < 0 || numero > 6) return;
                let halfX, halfY, halfW, halfH;
                const pecaEhHorizontal = (orientacaoPeca === 'horizontal');
                if (pecaEhHorizontal) {
                    if (qualMetade === 'esquerda') { halfX = pecaX; halfY = pecaY; halfW = larguraPeca / 2; halfH = alturaPeca; }
                    else { halfX = pecaX + larguraPeca / 2; halfY = pecaY; halfW = larguraPeca / 2; halfH = alturaPeca; }
                } else {
                    if (qualMetade === 'cima') { halfX = pecaX; halfY = pecaY; halfW = larguraPeca; halfH = alturaPeca / 2; }
                    else { halfX = pecaX; halfY = pecaY + alturaPeca / 2; halfW = larguraPeca; halfH = alturaPeca / 2; }
                }
                const centroX = halfX + halfW / 2; const centroY = halfY + halfH / 2;
                const paddingRelativo = 0.28; // Aumentar um pouco o padding (afastar mais das bordas)
                const espacoXMax = (halfW / 2) * (1 - paddingRelativo); const espacoYMax = (halfH / 2) * (1 - paddingRelativo);
                const espacoXBase = halfW / 3.8; const espacoYBase = halfH / 3.8; // Reduzir espaçamento base ligeiramente
                const minEspacoAbs = dotRaio * 1.8; // Reduzir mínimo absoluto um pouco
                const espacoX = Math.min(espacoXMax, Math.max(espacoXBase, minEspacoAbs));
                const espacoY = Math.min(espacoYMax, Math.max(espacoYBase, minEspacoAbs));

                const MULT_BORDA = 0.9; // Afastar mais ainda (era 0.85)
                const MULT_MEDIO = 0.85;

                const dotLayouts = [ [], [[0, 0]],
                    [[-MULT_BORDA, -MULT_BORDA], [MULT_BORDA, MULT_BORDA]], // 2
                    [[-MULT_BORDA, -MULT_BORDA], [0, 0], [MULT_BORDA, MULT_BORDA]], // 3
                    [[-MULT_BORDA, -MULT_BORDA], [MULT_BORDA, -MULT_BORDA], [-MULT_BORDA, MULT_BORDA], [MULT_BORDA, MULT_BORDA]], // 4
                    [[-MULT_BORDA, -MULT_BORDA], [MULT_BORDA, -MULT_BORDA], [0, 0], [-MULT_BORDA, MULT_BORDA], [MULT_BORDA, MULT_BORDA]], // 5
                ];
                const layout6HorizontalDots = [ [-MULT_BORDA, -MULT_MEDIO], [0, -MULT_MEDIO], [MULT_BORDA, -MULT_MEDIO], [-MULT_BORDA, MULT_MEDIO], [0, MULT_MEDIO], [MULT_BORDA, MULT_MEDIO] ];
                const layout6VerticalDots = [ [-MULT_MEDIO, -MULT_BORDA], [MULT_MEDIO, -MULT_BORDA], [-MULT_MEDIO, 0], [MULT_MEDIO, 0], [-MULT_MEDIO, MULT_BORDA], [MULT_MEDIO, MULT_BORDA] ];
                let currentLayout = dotLayouts[numero] || [];
                if (numero === 6) { currentLayout = pecaEhHorizontal ? layout6HorizontalDots : layout6VerticalDots; }

                ctx.fillStyle = COR_DOT;
                currentLayout.forEach(([multX, multY]) => {
                    const posX = centroX + multX * espacoX; const posY = centroY + multY * espacoY;
                    ctx.beginPath(); ctx.arc(posX, posY, dotRaio, 0, Math.PI * 2); ctx.fill();
                });
            }

            contemPontoMao(clickX, clickY, pecaPosX, pecaPosY) { return clickX >= pecaPosX && clickX <= pecaPosX + pecaLarguraV && clickY >= pecaPosY && clickY <= pecaPosY + pecaAlturaV; }
            get valorTotal() { return this.l1 + this.l2; }
            get ehDoble() { return this.l1 === this.l2; }
        }

        // --- Funções UI ---

        function ajustarTamanhoPosicoes() {
            CANVAS_LARGURA = canvas.width; CANVAS_ALTURA = canvas.height;
            areaTotalRect = { x: 0, y: 0, largura: CANVAS_LARGURA, altura: CANVAS_ALTURA };
            CENTRO_X = CANVAS_LARGURA / 2; CENTRO_Y = CANVAS_ALTURA / 2;
            escalaDesenho = CANVAS_ALTURA / 720; margemGeralInterface = 12 * escalaDesenho;
            pecaLarguraH = PECA_LARGURA_BASE * escalaDesenho * 1.05; pecaAlturaH = PECA_ALTURA_BASE * escalaDesenho * 1.05;
            pecaLarguraV = pecaAlturaH; pecaAlturaV = pecaLarguraH;
            dotRaio = DOT_RAIO_BASE * escalaDesenho; cantoRaio = CANTO_RAIO_BASE * escalaDesenho;
            espacoMesaEscalado = ESPACO_ENTRE_PECAS_MESA_BASE * escalaDesenho; espacoMaoEscalado = ESPACO_ENTRE_PECAS_MAO_BASE * escalaDesenho;
            margemLateralMesaEscalada = MARGEM_BORDA_LATERAL_BASE * escalaDesenho; margemVerticalMesaEscalada = MARGEM_BORDA_VERTICAL_BASE * escalaDesenho;
            tamanhoFonteBase = 17 * escalaDesenho;

            const alturaAreaStatus = 40 * escalaDesenho; const alturaAreaIA = pecaAlturaV * 0.85 + 2 * margemGeralInterface; const alturaAreaJogador = pecaAlturaV * 1.15 + 3 * margemGeralInterface; const alturaAreaMesa = CANVAS_ALTURA - alturaAreaIA - alturaAreaJogador - alturaAreaStatus - (2 * margemGeralInterface);
            areaIARect = { x: 0, y: 0, largura: CANVAS_LARGURA, altura: alturaAreaIA };
            areaMesaRect = { x: 0, y: areaIARect.y + areaIARect.altura + margemGeralInterface, largura: CANVAS_LARGURA, altura: alturaAreaMesa };
            areaJogadorRect = { x: 0, y: areaMesaRect.y + areaMesaRect.altura + margemGeralInterface, largura: CANVAS_LARGURA, altura: alturaAreaJogador };
            areaStatusRect = { x: 0, y: areaJogadorRect.y + areaJogadorRect.altura, largura: CANVAS_LARGURA, altura: alturaAreaStatus };
            const larguraAreaMonte = pecaLarguraV + 90 * escalaDesenho; const alturaAreaMonte = pecaAlturaV + 25 * escalaDesenho;
            areaMonteRect = { x: margemGeralInterface * 2.5, y: areaJogadorRect.y + (areaJogadorRect.altura - alturaAreaMonte) / 2, largura: larguraAreaMonte, altura: alturaAreaMonte };
            const larguraBotaoPassar = 120 * escalaDesenho; const alturaBotaoPassar = 45 * escalaDesenho; const paddingBotaoY = 12 * escalaDesenho; const paddingBotaoX = 15 * escalaDesenho;
            areaBotaoPassarRect = { x: areaJogadorRect.largura - larguraBotaoPassar - paddingBotaoX - margemGeralInterface, y: areaJogadorRect.y + paddingBotaoY, largura: larguraBotaoPassar, altura: alturaBotaoPassar };

            centroMesaX = areaMesaRect.x + areaMesaRect.largura / 2; centroMesaY = areaMesaRect.y + areaMesaRect.altura / 2;
            limiteSuperiorMesa = areaMesaRect.y + margemVerticalMesaEscalada;
            limiteEsquerdoMesa = areaMesaRect.x + margemLateralMesaEscalada;
            // Ajustar limites inferiores/direitos para considerar a posição da *próxima* peça
            limiteInferiorMesa = areaMesaRect.y + areaMesaRect.altura - margemVerticalMesaEscalada - pecaAlturaH; // Onde a base da peça colidiria
            limiteDireitoMesa = areaMesaRect.x + areaMesaRect.largura - margemLateralMesaEscalada - pecaLarguraH; // Onde a borda direita colidiria
        }

        function desenharFundosAreas() {
            ctx.fillStyle = COR_FUNDO_CANVAS; ctx.fillRect(areaTotalRect.x, areaTotalRect.y, areaTotalRect.largura, areaTotalRect.altura);
            ctx.fillStyle = COR_FUNDO_AREA_IA; ctx.fillRect(areaIARect.x, areaIARect.y, areaIARect.largura, areaIARect.altura);
            ctx.fillStyle = COR_FUNDO_MESA; ctx.fillRect(areaMesaRect.x, areaMesaRect.y, areaMesaRect.largura, areaMesaRect.altura);
            ctx.fillStyle = COR_FUNDO_AREA_JOGADOR; ctx.fillRect(areaJogadorRect.x, areaJogadorRect.y, areaJogadorRect.largura, areaJogadorRect.altura);
            ctx.strokeStyle = COR_BORDA_AREA; ctx.lineWidth = 1;
            ctx.strokeRect(areaIARect.x + 0.5, areaIARect.y + 0.5, areaIARect.largura - 1, areaIARect.altura - 1);
            ctx.strokeRect(areaMesaRect.x + 0.5, areaMesaRect.y + 0.5, areaMesaRect.largura - 1, areaMesaRect.altura - 1);
            ctx.strokeRect(areaJogadorRect.x + 0.5, areaJogadorRect.y + 0.5, areaJogadorRect.largura - 1, areaJogadorRect.altura - 1);
        }

        function desenharAreaIA() {
             if (!areaIARect) return;
             ctx.fillStyle = COR_TEXTO_UI; ctx.font = `bold ${tamanhoFonteBase * 0.85}px 'Segoe UI', Tahoma, sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
             const textoIA = `IA (${maoIA.length} peças)`; const textoIAX = areaIARect.x + margemGeralInterface * 2.5; const textoIAY = areaIARect.y + areaIARect.altura / 2;
             ctx.fillText(textoIA, textoIAX, textoIAY);
             let startXIA = textoIAX + ctx.measureText(textoIA).width + 2.5 * margemGeralInterface; const pecaYIA = areaIARect.y + (areaIARect.altura - pecaAlturaV) / 2;
             for (let i = 0; i < maoIA.length; i++) {
                 const pecaX = startXIA + i * (pecaLarguraV + espacoMaoEscalado);
                 if (pecaX + pecaLarguraV > areaIARect.x + areaIARect.largura - margemGeralInterface * 2.5) break;
                 if (jogoAcabou) { maoIA[i].desenharFrente(pecaX, pecaYIA, maoIA[i].l1, maoIA[i].l2, 'vertical'); } else { maoIA[i].desenharVerso(pecaX, pecaYIA, 'vertical'); }
             }
        }

        function desenharAreaJogador() {
             if (!areaJogadorRect || !areaMonteRect) return;
             const larguraTotalMao = maoJogador.length * (pecaLarguraV + espacoMaoEscalado) - espacoMaoEscalado;
             let startXJogador = areaJogadorRect.x + (areaJogadorRect.largura - larguraTotalMao) / 2;
             startXJogador = Math.max(startXJogador, areaMonteRect.x + areaMonteRect.largura + margemGeralInterface * 1.5);
             const limiteDireitoMao = areaJogadorRect.x + areaJogadorRect.largura - margemGeralInterface * 2; const pecaYJogador = areaJogadorRect.y + (areaJogadorRect.altura - pecaAlturaV) / 2;
             maoJogador.forEach((peca, i) => {
                 const pecaX = startXJogador + i * (pecaLarguraV + espacoMaoEscalado);
                 if (pecaX < limiteDireitoMao) {
                     if (pecaX + pecaLarguraV <= limiteDireitoMao + 5) {
                        const jogavel = isPecaJogavel(peca) && jogadorPodeInteragir && !jogoAcabou; const selecionada = (i === pecaSelecionada);
                        peca.desenharFrente(pecaX, pecaYJogador, peca.l1, peca.l2, 'vertical', selecionada, jogavel);
                     }
                 }
             });
        }

        function desenharMonte() {
            if (!areaMonteRect) return; const r = 5 * escalaDesenho; ctx.fillStyle = COR_FUNDO_AREA_MONTE; ctx.strokeStyle = COR_BORDA_AREA; ctx.lineWidth = 1; ctx.beginPath();
            if (ctx.roundRect) { ctx.roundRect(areaMonteRect.x, areaMonteRect.y, areaMonteRect.largura, areaMonteRect.altura, r); } else { ctx.rect(areaMonteRect.x, areaMonteRect.y, areaMonteRect.largura, areaMonteRect.altura); }
            ctx.fill(); ctx.stroke();
            const paddingInterno = 12 * escalaDesenho; const montePecaX = areaMonteRect.x + paddingInterno; const montePecaY = areaMonteRect.y + (areaMonteRect.altura - pecaAlturaV) / 2;
            areaClicarMonte = { x: montePecaX, y: montePecaY, largura: pecaLarguraV, altura: pecaAlturaV };
            const textoMonteX = montePecaX + pecaLarguraV + paddingInterno * 0.8; const textoMonteY = areaMonteRect.y + areaMonteRect.altura / 2;
            ctx.fillStyle = COR_TEXTO_UI; ctx.font = `${tamanhoFonteBase * 0.85}px 'Segoe UI', Tahoma, sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            if (monte.length > 0) {
                (new Peca(0, 0)).desenharVerso(montePecaX, montePecaY, 'vertical'); ctx.fillText(`Monte: ${monte.length}`, textoMonteX, textoMonteY);
                const jogadorDeveComprar = jogadorPodeInteragir && !podeJogarAlgumaPeca(maoJogador) && !jogoAcabou;
                if (jogadorDeveComprar) { ctx.strokeStyle = COR_DESTAQUE_COMPRA_STROKE; ctx.lineWidth = 3 * escalaDesenho; (new Peca(0, 0)).desenharCorpo(montePecaX, montePecaY, pecaLarguraV, pecaAlturaV, 'transparent', COR_DESTAQUE_COMPRA_STROKE, COR_DESTAQUE_COMPRA_STROKE); }
            } else {
                 ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)'; ctx.lineWidth = 1.5 * escalaDesenho; ctx.setLineDash([4 * escalaDesenho, 3 * escalaDesenho]);
                 (new Peca(0, 0)).desenharCorpo(montePecaX, montePecaY, pecaLarguraV, pecaAlturaV, 'transparent', ctx.strokeStyle, null); ctx.setLineDash([]);
                 ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; ctx.fillText("Vazio", textoMonteX, textoMonteY);
            }
        }

        function desenharMesa() {
            if (mesa.length === 0) { areaJogarEsquerda = { ativa: false }; areaJogarDireita = { ativa: false }; return; }
            const indiceMeio = Math.floor(mesa.length / 2); const { pecaVisual: pecaMeioVisual } = mesa[indiceMeio];
            const xInicial = centroMesaX - pecaLarguraH / 2; const yInicial = centroMesaY - pecaAlturaH / 2;
            pecaMeioVisual.desenharFrente(xInicial, yInicial, pecaMeioVisual.l1, pecaMeioVisual.l2, 'horizontal');
            let infoPontaEsquerda = { x: xInicial, y: yInicial, direcaoVisual: 'esquerda' }; let infoPontaDireita = { x: xInicial, y: yInicial, direcaoVisual: 'direita' };

            // Desenhar Esquerda
            let xAtualEsq = xInicial; let yAtualEsq = yInicial; let direcaoVisualEsq = 'esquerda';
            for (let i = indiceMeio - 1; i >= 0; i--) {
                const { pecaVisual: pecaAtualVisual } = mesa[i]; const largAnterior = pecaLarguraH; const altAnterior = pecaAlturaH;
                let { x: nextX, y: nextY } = calcularPosicaoProximaPecaHorizontal(xAtualEsq, yAtualEsq, largAnterior, altAnterior, direcaoVisualEsq);

            let startXJogador = areaJogadorRect.x + (areaJogadorRect.largura - larguraTotalMao) / 2;
            startXJogador = Math.max(startXJogador, areaMonteRect.x + areaMonteRect.largura + margemGeralInterface * 1.5);
            const pecaYJogador = areaJogadorRect.y + (areaJogadorRect.altura - pecaAlturaV) / 2;
            const limiteDireitoMao = areaJogadorRect.x + areaJogadorRect.largura - margemGeralInterface * 2;
            for(let i=0; i<maoJogador.length; i++){ const pX = startXJogador + i * (pecaLarguraV + espacoMaoEscalado); if(pX + pecaLarguraV < limiteDireitoMao + 5){ if(maoJogador[i] && isPecaJogavel(maoJogador[i]) && maoJogador[i].contemPontoMao(p.x,p.y,pX,pecaYJogador)){cC = true; break;} } }
            if(pecaSelecionada!==null){ if(areaJogarEsquerda.ativa&&isDentro(p,areaJogarEsquerda)) cC=true; if(areaJogarDireita.ativa&&isDentro(p,areaJogarDireita)) cC=true; }
            if(hB!==hoverBotaoPassar){hoverBotaoPassar=hB;desenharJogo();}
            if(cC&&!canvas.classList.contains('clicavel')) canvas.classList.add('clicavel'); else if(!cC&&canvas.classList.contains('clicavel')) canvas.classList.remove('clicavel');
        }

        function atualizarCursor(){ if(jogoAcabou){canvas.classList.remove('esperando'); canvas.classList.add('clicavel');} else if (!jogadorPodeInteragir || turnoAtual===IA){canvas.classList.add('esperando'); canvas.classList.remove('clicavel');} else {canvas.classList.remove('esperando');} }
        function atualizarStatus(nMsg=null,fim=false){
            // Nota: jogoAcabou é agora setado dentro de verificarFimDeJogo
            // if (fim) jogoAcabou = true; // Não precisa mais aqui
            jogadorPodeInteragir=(turnoAtual===JOGADOR&&!jogoAcabou);
            if(nMsg&&!fim){mensagemStatus=nMsg;}
            else if(!jogoAcabou){ if(turnoAtual===JOGADOR){ if(!podeJogarAlgumaPeca(maoJogador)){ mensagemStatus=monte.length>0?"Sua Vez: Compre uma peça.":"Sua Vez: Passe a vez."; }else{ mensagemStatus=pecaSelecionada===null?"Sua Vez: Escolha uma peça.":"Sua Vez: Escolha onde jogar."; } }else{ if(!mensagemStatus||!mensagemStatus.toLowerCase().includes("ia")) mensagemStatus="Vez da IA..."; } }
            else if(fim&&nMsg){mensagemStatus=nMsg;} // Atualiza msg de fim
            mostrarBotaoPassar=(jogadorPodeInteragir&&!podeJogarAlgumaPeca(maoJogador)&&monte.length===0&&!jogoAcabou);
            atualizarCursor();
        }

        function handleMouseClick(e){
            if(jogoAcabou){iniciarJogo();return;} if(!jogadorPodeInteragir)return; const pos=getMousePos(canvas,e);
            if(mostrarBotaoPassar&&areaBotaoPassarRect&&isDentro(pos,areaBotaoPassarRect)){passarVez();return;}
            if(!podeJogarAlgumaPeca(maoJogador)&&monte.length>0&&areaClicarMonte&&isDentro(pos,areaClicarMonte)){realizarCompra(JOGADOR);return;}
            if(pecaSelecionada!==null){
                const pSO=maoJogador[pecaSelecionada];
                if(pSO){ let jogou=false; if(areaJogarEsquerda.ativa&&isDentro(pos,areaJogarEsquerda)&&checarEncaixe(pSO,'esquerda').valida) jogou=realizarJogada(JOGADOR,pecaSelecionada,'esquerda'); else if(areaJogarDireita.ativa&&isDentro(pos,areaJogarDireita)&&checarEncaixe(pSO,'direita').valida) jogou=realizarJogada(JOGADOR,pecaSelecionada,'direita'); if(jogou) return; pecaSelecionada=null; atualizarStatus(); desenharJogo(); }
                else { pecaSelecionada=null; console.warn("Peca selecionada invalida ao clicar?"); atualizarStatus(); desenharJogo(); }
            }
            let idxClicado=-1; const larguraTotalMao = maoJogador.length * (pecaLarguraV + espacoMaoEscalado) - espacoMaoEscalado; let startXJogador = areaJogadorRect.x + (areaJogadorRect.largura - larguraTotalMao) / 2; startXJogador = Math.max(startXJogador, areaMonteRect.x + areaMonteRect.largura + margemGeralInterface * 1.5); const pecaYJogador = areaJogadorRect.y + (areaJogadorRect.altura - pecaAlturaV) / 2; const limiteDireitoMao = areaJogadorRect.x + areaJogadorRect.largura - margemGeralInterface * 2;
            for(let i=0; i<maoJogador.length; i++){ const pX = startXJogador + i * (pecaLarguraV + espacoMaoEscalado); if(pX + pecaLarguraV < limiteDireitoMao + 5){ if(maoJogador[i] && maoJogador[i].contemPontoMao(pos.x,pos.y,pX,pecaYJogador)){idxClicado=i; break;} } }
            if(idxClicado!==-1){ const pC=maoJogador[idxClicado]; if(isPecaJogavel(pC)){ pecaSelecionada=(pecaSelecionada===idxClicado)?null:idxClicado; atualizarStatus(); desenharJogo(); } else{ pecaSelecionada=null; atualizarStatus("Esta peça não pode ser jogada agora."); desenharJogo(); } return; }
        }

        function ajustarCanvasProporcionalmente() {
            const margemBody = 20; const viewportWidth = window.innerWidth - margemBody; const viewportHeight = window.innerHeight - margemBody; const aspectRatio = 20 / 11;
            let novoLargura = viewportWidth; let novoAltura = novoLargura / aspectRatio; if (novoAltura > viewportHeight) { novoAltura = viewportHeight; novoLargura = novoAltura * aspectRatio; }
            const minWidth = 750; const minHeight = minWidth / aspectRatio;
            if (canvas.width !== Math.round(novoLargura) || canvas.height !== Math.round(novoAltura)) { canvas.width = Math.max(minWidth, Math.round(novoLargura)); canvas.height = Math.max(minHeight, Math.round(novoAltura)); console.log(`Canvas resized: ${canvas.width}x${canvas.height}`); return true; } return false;
        }

        function iniciarJogo() {
            console.log("--- Iniciando Dominó Minimalista v6.4 ---");
            ajustarCanvasProporcionalmente(); ajustarTamanhoPosicoes(); distribuirPecas();
            const infoInicio = determinarPrimeiroJogadorEPeca();
            if (!infoInicio || infoInicio.indicePeca < 0 || (infoInicio.jogador === JOGADOR && infoInicio.indicePeca >= maoJogador.length) || (infoInicio.jogador === IA && infoInicio.indicePeca >= maoIA.length) ) { console.error("Erro crítico ao determinar jogador/peça inicial.", infoInicio); alert("Erro ao iniciar o jogo. Verifique o console."); jogadorQueIniciou = JOGADOR; infoInicio.jogador = JOGADOR; infoInicio.indicePeca = 0; if (maoJogador.length === 0) { alert("Fallback falhou: Mão do Jogador vazia!"); return; } }
            jogadorQueIniciou = infoInicio.jogador; turnoAtual = jogadorQueIniciou;
            let maoInicial = (turnoAtual === JOGADOR) ? maoJogador : maoIA; let pecaInicialOriginal = null;
            if (infoInicio.indicePeca >= 0 && infoInicio.indicePeca < maoInicial.length) { pecaInicialOriginal = maoInicial.splice(infoInicio.indicePeca, 1)[0]; } else { console.error(`Índice inicial ${infoInicio.indicePeca} inválido para mão ${maoInicial.length}.`); if (maoInicial.length > 0) { console.warn("Usando a primeira peça da mão como fallback."); pecaInicialOriginal = maoInicial.splice(0, 1)[0]; } else { alert("Erro crítico: Mão inicial vazia, não pode iniciar."); return; } }
            if (pecaInicialOriginal) { const idInicial = pecaInicialOriginal.id; console.log(`Primeiro: ${turnoAtual} com ${idInicial}`); atualizarStatus(`Início. ${turnoAtual === JOGADOR ? 'Você' : 'IA'} começa com ${idInicial}.`); pecaSelecionada = null; jogoAcabou = false; jogadorPodeInteragir = false; setTimeout(() => { realizarJogada(null, pecaInicialOriginal, null); }, 400); }
            else { alert("Erro: Não foi possível obter a peça inicial para jogar."); }
        }

        // --- Listeners ---
        canvas.addEventListener('click', handleMouseClick); canvas.addEventListener('mousemove', verificarHover);
        window.addEventListener('resize', () => { if(ajustarCanvasProporcionalmente()) { iniciarJogo(); } else { ajustarTamanhoPosicoes(); desenharJogo(); } });
        window.onload = iniciarJogo;

    </script>
