                    break; // Encontrou a peça clicada
                }
            }

            if (indiceClicado !== -1) {
                // Clicou em uma peça na mão
                const pecaClicada = maoJogador[indiceClicado];
                if (isPecaJogavel(pecaClicada)) {
                    // Se a peça é jogável, seleciona ou deseleciona
                    pecaSelecionada = (pecaSelecionada === indiceClicado) ? null : indiceClicado;
                    atualizarStatus(); // Atualiza mensagem (Escolha peça/Escolha onde jogar)
                    desenharJogo(); // Redesenha com a seleção/deseleção
                } else {
                    // Peça não jogável
                    pecaSelecionada = null; // Garante deseleção
                    atualizarStatus("Esta peça não pode ser jogada agora.");
                    desenharJogo();
                }
                return; // Ação de clique na mão foi tratada
            }

             // 7. Clicou em qualquer outro lugar (não interativo)
             // Se tinha uma peça selecionada, ela já foi deselecionada no passo 5.
             // Se não tinha, não faz nada. O status e desenho já estão atualizados.
        }

        // Ajusta o tamanho do canvas para preencher a janela mantendo a proporção
        function ajustarCanvasProporcionalmente() {
            const margemBody = 20; // Espaço total nas laterais/topo/baixo do body
            const viewportWidth = window.innerWidth - margemBody;
            const viewportHeight = window.innerHeight - margemBody;
            const aspectRatio = 20 / 9; // Proporção desejada (largura / altura)

            let novoLargura = viewportWidth;
            let novoAltura = novoLargura / aspectRatio;

            // Se a altura calculada exceder a altura disponível, recalcula baseado na altura
            if (novoAltura > viewportHeight) {
                novoAltura = viewportHeight;
                novoLargura = novoAltura * aspectRatio;
            }

            // Define tamanho mínimo para garantir legibilidade
            const minWidth = 640;
            const minHeight = minWidth / aspectRatio; // 360

            canvas.width = Math.max(minWidth, Math.round(novoLargura));
            canvas.height = Math.max(minHeight, Math.round(novoAltura));

             console.log(`Canvas resized: ${canvas.width}x${canvas.height}`);
        }

        // Configuração inicial do jogo
        function iniciarJogo() {
            console.log("--- Iniciando Dominó Minimalista v5.1 ---");
            ajustarCanvasProporcionalmente(); // Ajusta tamanho do canvas primeiro
            ajustarTamanhoPosicoes();    // Calcula posições e escalas com base no novo tamanho

            distribuirPecas(); // Cria, embaralha e distribui

            // Determina quem começa
            const infoInicio = determinarPrimeiroJogadorEPeca();
            if (!infoInicio || infoInicio.indicePeca < 0 ||
                (infoInicio.jogador === JOGADOR && infoInicio.indicePeca >= maoJogador.length) ||
                (infoInicio.jogador === IA && infoInicio.indicePeca >= maoIA.length) ) {
                 console.error("Erro crítico ao determinar jogador inicial ou peça.", infoInicio);
                 alert("Erro ao iniciar o jogo. Verifique o console.");
                 return;
            }

            jogadorQueIniciou = infoInicio.jogador;
            turnoAtual = jogadorQueIniciou; // Define o turno inicial

            // Pega a peça inicial da mão correspondente
            let maoInicial = (turnoAtual === JOGADOR) ? maoJogador : maoIA;
            let pecaInicialOriginal = null;
             // Verifica se o índice é válido antes de remover
            if (infoInicio.indicePeca >= 0 && infoInicio.indicePeca < maoInicial.length) {
                 // Remove a peça da mão e a guarda
                 pecaInicialOriginal = maoInicial.splice(infoInicio.indicePeca, 1)[0];
            } else {
                 // Fallback: se o índice for inválido, pega a primeira peça (se existir)
                 console.warn(`Índice inicial inválido (${infoInicio.indicePeca}), usando a primeira peça de ${turnoAtual}.`);
                 if (maoInicial.length > 0) {
                    pecaInicialOriginal = maoInicial.splice(0, 1)[0];
                 } else {
                     alert("Erro: Mão inicial vazia, impossível começar.");
                     return;
                 }
            }


            if (pecaInicialOriginal) {
                const idInicial = pecaInicialOriginal.id;
                console.log(`Primeiro a jogar: ${turnoAtual} com a peça ${idInicial}`);
                atualizarStatus(`Início da Partida. ${turnoAtual === JOGADOR ? 'Você começa' : 'IA começa'} com ${idInicial}.`);

                pecaSelecionada = null; // Garante que nada está selecionado
                jogoAcabou = false;
                jogadorPodeInteragir = false; // Interação só começa após a primeira peça ser colocada

                // Usa setTimeout para colocar a primeira peça após um pequeno delay (visual)
                setTimeout(() => {
                    // Chama realizarJogada com 'quem = null' para indicar a jogada inicial
                    realizarJogada(null, pecaInicialOriginal, null);
                }, 200); // 200ms de delay

            } else {
                // Não deveria acontecer se a lógica anterior estiver correta
                alert("Erro crítico: Não foi possível obter a peça inicial.");
            }
        }

        // --- Listeners ---
        canvas.addEventListener('click', handleMouseClick);
        canvas.addEventListener('mousemove', verificarHover); // Para feedback visual (cursor, botão)
        window.addEventListener('resize', () => {
             // Reinicia o jogo ao redimensionar para recalcular tudo
             console.log("Window resized, restarting game...");
             iniciarJogo();
        });
        window.onload = iniciarJogo; // Inicia o jogo quando a página carrega

    </script>
