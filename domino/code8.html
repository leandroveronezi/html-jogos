<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominó Minimalista v6.8 - Correção Virada</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e0e0e0; /* Fundo canvas claro */
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 1px solid #bdbdbd; /* Borda cinza claro */
            box-shadow: 0 6px 15px rgba(0,0,0,0.2); /* Sombra mais suave */
            display: block;
            cursor: default;
            max-width: 100%;
            max-height: calc(100vh - 20px);
            aspect-ratio: 20 / 11;
            background-color: #f0f0f0; /* Fundo interno do canvas um pouco diferente */
            border-radius: 4px;
        }
        canvas.esperando {
            cursor: wait;
        }
        canvas.clicavel {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Constantes ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- CONFIGURAÇÃO DO JOGO ---
        const NUM_IA_PLAYERS = 3; // Quantos oponentes IA (1, 2 ou 3)
        // ---------------------------

        const JOGADOR_HUMANO = 'jogador';
        const JOGADOR_IA = 'ia';
        const TOTAL_PLAYERS = 1 + NUM_IA_PLAYERS; // Total de jogadores na partida
        const PECAS_POR_JOGADOR = (TOTAL_PLAYERS <= 2) ? 7 : ((TOTAL_PLAYERS === 3) ? 7 : 6); // Ajusta peças para 4 jogadores se necessário

        const PECA_LARGURA_BASE = 60;
        const PECA_ALTURA_BASE = 30;
        const DOT_RAIO_BASE = 3.2;
        const CANTO_RAIO_BASE = 4;
        const DELAY_IA = 750;
        const ESPACO_ENTRE_PECAS_MESA_BASE = 5;
        const ESPACO_ENTRE_PECAS_MAO_BASE = 7;
        const MARGEM_BORDA_LATERAL_BASE = 25;
        const MARGEM_BORDA_VERTICAL_BASE = 25;
        const FATOR_LIMITE_COLISAO = 0.98;

        // Cores (Fundo da Mesa Verde Fixo)
        const COR_FUNDO_CANVAS = '#e0e0e0';
        const COR_FUNDO_MESA = '#00695c'; // Verde Feltro Fixo
        const COR_FUNDO_AREA_IA_TOP = '#f5f5f5'; // Área IA 1 (Topo)
        const COR_FUNDO_AREA_IA_SIDE = '#eeeeee'; // Áreas IAs Laterais (ligeiramente diferente)
        const COR_FUNDO_AREA_JOGADOR = '#f5f5f5';
        const COR_FUNDO_AREA_MONTE = '#eeeeee';
        const COR_BORDA_AREA = 'rgba(0, 0, 0, 0.15)';
        const COR_PECA = '#fafafa';
        const COR_PECA_VERSO = '#455a64';
        const COR_DOT = '#111111';
        const COR_LINHA_PECA = '#bdbdbd';
        const COR_TEXTO_UI = '#424242';
        const COR_TEXTO_STATUS = '#212121';
        const COR_DESTAQUE_SELECAO = '#ff8f00';
        const COR_DESTAQUE_JOGAVEL_FILL = 'rgba(255, 143, 0, 0.1)';
        const COR_DESTAQUE_JOGAVEL_STROKE = '#ff8f00';
        const COR_DESTAQUE_COMPRA_STROKE = '#f57c00';
        const COR_BOTAO_PASSAR_FILL = '#9e9e9e';
        const COR_BOTAO_PASSAR_TEXT = '#ffffff';
        const COR_BOTAO_PASSAR_HOVER_FILL = '#757575';
        const COR_DESTAQUE_JOGAVEL_HAND = '#ff8f00';
        const COR_OVERLAY_FIM = 'rgba(255, 255, 255, 0.85)';
        const COR_TEXTO_FIM = '#000000';

        // --- Variáveis Globais ---
        let CANVAS_LARGURA;
        let CANVAS_ALTURA;
        let CENTRO_X; // Centro geral do canvas
        let CENTRO_Y;
        let escalaDesenho = 1;
        let tamanhoFonteBase;
        let pecaLarguraH;
        let pecaAlturaH;
        let pecaLarguraV;
        let pecaAlturaV;
        let dotRaio;
        let cantoRaio;
        let espacoMesaEscalado;
        let espacoMaoEscalado;
        let margemLateralMesaEscalada;
        let margemVerticalMesaEscalada;
        let margemGeralInterface = 12;

        // Áreas Retangulares Layout
        let areaTotalRect = {};
        let areaIARect = {};        // Área IA 1 (Topo Central)
        let areaIAEsquerdaRect = null; // Área IA 2 (Esquerda)
        let areaIADireitaRect = null; // Área IA 3 (Direita)
        let areaMesaRect = {};        // Mesa Central
        let areaJogadorRect = {};     // Jogador Humano (Baixo Central)
        let areaMonteRect = {};
        let areaStatusRect = {};      // Status Bar (Abaixo Jogador Central)
        let areaBotaoPassarRect = {};

        let centroMesaX; // Centro da área da MESA
        let centroMesaY;
        let limiteSuperiorMesa;
        let limiteInferiorMesa;
        let limiteEsquerdoMesa;
        let limiteDireitoMesa;

        let areaJogarEsquerda = { ativa: false };
        let areaJogarDireita = { ativa: false };
        let areaClicarMonte = {};

        // Estado do Jogo
        let todasAsPecas = [];
        let jogadores = [];
        let monte = [];
        let mesa = [];
        let pontas = { esquerda: null, direita: null };
        let pecaSelecionada = null;
        let mensagemStatus = "";
        let mensagemFimJogo = "";
        let jogoAcabou = false;
        let indiceJogadorAtual = 0;
        let jogadorPodeInteragir = false;
        let passesConsecutivos = 0;
        let mostrarBotaoPassar = false;
        let hoverBotaoPassar = false;
        let jogadorQueIniciou = null;

        // --- Classe Peca ---
        class Peca {
             constructor(lado1, lado2) { this.l1 = lado1; this.l2 = lado2; const vA = Math.min(lado1, lado2); const vB = Math.max(lado1, lado2); this.id = `${vA}-${vB}`; }
             desenharCorpo(x, y, w, h, bg, border, highlight = null) { const r = cantoRaio; ctx.fillStyle = bg; ctx.strokeStyle = highlight ?? border; ctx.lineWidth = (highlight) ? 2.5 * escalaDesenho : 1.5 * escalaDesenho; ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath(); ctx.fill(); ctx.stroke(); }
             desenharFrente(x, y, lA, lB, orient = 'horizontal', sel = false, jog = false) { const ehH = (orient === 'horizontal'); const w = ehH ? pecaLarguraH : pecaLarguraV; const h = ehH ? pecaAlturaH : pecaAlturaV; let corD = null; if (sel) { corD = COR_DESTAQUE_SELECAO; } else if (jog) { corD = COR_DESTAQUE_JOGAVEL_HAND; } this.desenharCorpo(x, y, w, h, COR_PECA, COR_LINHA_PECA, corD); ctx.strokeStyle = COR_LINHA_PECA; ctx.lineWidth = 1.5 * escalaDesenho; ctx.beginPath(); if (ehH) { ctx.moveTo(x + w / 2, y + 3 * escalaDesenho); ctx.lineTo(x + w / 2, y + h - 3 * escalaDesenho); } else { ctx.moveTo(x + 3 * escalaDesenho, y + h / 2); ctx.lineTo(x + w - 3 * escalaDesenho, y + h / 2); } ctx.stroke(); this.desenharDots(lA, x, y, w, h, ehH ? 'esquerda' : 'cima', orient); this.desenharDots(lB, x, y, w, h, ehH ? 'direita' : 'baixo', orient); }
             desenharVerso(x, y, orient = 'vertical') { const ehH = (orient === 'horizontal'); const w = ehH ? pecaLarguraH : pecaLarguraV; const h = ehH ? pecaAlturaH : pecaAlturaV; this.desenharCorpo(x, y, w, h, COR_PECA_VERSO, '#607d8b'); ctx.fillStyle = '#78909c'; ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, dotRaio * 1.1, 0, Math.PI * 2); ctx.fill(); }
             desenharDots(num, pX, pY, pW, pH, half, orientP) { if (num < 0 || num > 6) return; let hX, hY, hW, hH; const ehH = (orientP === 'horizontal'); if (ehH) { if (half === 'esquerda') { hX = pX; hY = pY; hW = pW / 2; hH = pH; } else { hX = pX + pW / 2; hY = pY; hW = pW / 2; hH = pH; } } else { if (half === 'cima') { hX = pX; hY = pY; hW = pW; hH = pH / 2; } else { hX = pX; hY = pY + pH / 2; hW = pW; hH = pH / 2; } } const cX = hX + hW / 2; const cY = hY + hH / 2; const padR = 0.28; const spXMax = (hW / 2) * (1 - padR); const spYMax = (hH / 2) * (1 - padR); const spXB = hW / 3.8; const spYB = hH / 3.8; const minSpAbs = dotRaio * 1.8; const spX = Math.min(spXMax, Math.max(spXB, minSpAbs)); const spY = Math.min(spYMax, Math.max(spYB, minSpAbs)); const MB = 0.9; const MM = 0.85; const layouts = [ [], [[0, 0]], [[-MB, -MB], [MB, MB]], [[-MB, -MB], [0, 0], [MB, MB]], [[-MB, -MB], [MB, -MB], [-MB, MB], [MB, MB]], [[-MB, -MB], [MB, -MB], [0, 0], [-MB, MB], [MB, MB]] ]; const l6H = [ [-MB, -MM], [0, -MM], [MB, -MM], [-MB, MM], [0, MM], [MB, MM] ]; const l6V = [ [-MM, -MB], [MM, -MB], [-MM, 0], [MM, 0], [-MM, MB], [MM, MB] ]; let curL = layouts[num] || []; if (num === 6) { curL = ehH ? l6H : l6V; } ctx.fillStyle = COR_DOT; curL.forEach(([mX, mY]) => { const posX = cX + mX * spX; const posY = cY + mY * spY; ctx.beginPath(); ctx.arc(posX, posY, dotRaio, 0, Math.PI * 2); ctx.fill(); }); }
             contemPontoMao(cX, cY, pX, pY) { return cX >= pX && cX <= pX + pecaLarguraV && cY >= pY && cY <= pY + pecaAlturaV; }
             get valorTotal() { return this.l1 + this.l2; } get ehDoble() { return this.l1 === this.l2; }
        }

        // --- Funções UI ---

        function ajustarTamanhoPosicoes() {
            CANVAS_LARGURA = canvas.width;
            CANVAS_ALTURA = canvas.height;
            areaTotalRect = { x: 0, y: 0, largura: CANVAS_LARGURA, altura: CANVAS_ALTURA };
            CENTRO_X = CANVAS_LARGURA / 2;
            CENTRO_Y = CANVAS_ALTURA / 2;
            escalaDesenho = CANVAS_ALTURA / 720;
            margemGeralInterface = 12 * escalaDesenho;
            pecaLarguraH = PECA_LARGURA_BASE * escalaDesenho * 1.05;
            pecaAlturaH = PECA_ALTURA_BASE * escalaDesenho * 1.05;
            pecaLarguraV = pecaAlturaH; // Largura da peça em pé
            pecaAlturaV = pecaLarguraH; // Altura da peça em pé
            dotRaio = DOT_RAIO_BASE * escalaDesenho;
            cantoRaio = CANTO_RAIO_BASE * escalaDesenho;
            espacoMesaEscalado = ESPACO_ENTRE_PECAS_MESA_BASE * escalaDesenho;
            espacoMaoEscalado = ESPACO_ENTRE_PECAS_MAO_BASE * escalaDesenho;
            margemLateralMesaEscalada = MARGEM_BORDA_LATERAL_BASE * escalaDesenho;
            margemVerticalMesaEscalada = MARGEM_BORDA_VERTICAL_BASE * escalaDesenho;
            tamanhoFonteBase = 17 * escalaDesenho;

            // --- Calcular Layout com Laterais ---
            let larguraAreaLateral = 0;
            if (NUM_IA_PLAYERS >= 2) {
                larguraAreaLateral = pecaLarguraV + 2.5 * margemGeralInterface;
            }

            let xCentral = 0;
            let larguraCentral = CANVAS_LARGURA;
            areaIAEsquerdaRect = null;
            areaIADireitaRect = null;

            if (NUM_IA_PLAYERS >= 2) {
                xCentral = larguraAreaLateral;
                larguraCentral -= larguraAreaLateral;
                areaIAEsquerdaRect = { x: 0, y: 0, largura: larguraAreaLateral, altura: 0 };
            }
            if (NUM_IA_PLAYERS >= 3) {
                larguraCentral -= larguraAreaLateral;
                areaIADireitaRect = { x: xCentral + larguraCentral, y: 0, largura: larguraAreaLateral, altura: 0 };
            }

            // --- Definir Áreas Centrais ---
            const alturaAreaStatus = 40 * escalaDesenho;
            const alturaAreaIA = pecaAlturaV * 0.85 + 2 * margemGeralInterface;
            const alturaAreaJogador = pecaAlturaV * 1.15 + 3 * margemGeralInterface;
            const alturaAreaMesa = CANVAS_ALTURA - alturaAreaIA - alturaAreaJogador - alturaAreaStatus - (2 * margemGeralInterface);

            areaIARect = { x: xCentral, y: 0, largura: larguraCentral, altura: alturaAreaIA };
            areaMesaRect = { x: xCentral, y: areaIARect.y + areaIARect.altura + margemGeralInterface, largura: larguraCentral, altura: alturaAreaMesa };
            areaJogadorRect = { x: xCentral, y: areaMesaRect.y + areaMesaRect.altura + margemGeralInterface, largura: larguraCentral, altura: alturaAreaJogador };
            areaStatusRect = { x: xCentral, y: areaJogadorRect.y + areaJogadorRect.altura, largura: larguraCentral, altura: alturaAreaStatus };

            // --- Preencher Altura das Áreas Laterais ---
            if (areaIAEsquerdaRect) {
                areaIAEsquerdaRect.y = areaMesaRect.y;
                areaIAEsquerdaRect.altura = areaMesaRect.altura;
            }
            if (areaIADireitaRect) {
                areaIADireitaRect.y = areaMesaRect.y;
                areaIADireitaRect.altura = areaMesaRect.altura;
            }

            // --- Ajustar Monte e Botão Passar ---
            const larguraAreaMonte = pecaLarguraV + 90 * escalaDesenho;
            const alturaAreaMonte = pecaAlturaV + 25 * escalaDesenho;
            areaMonteRect = {
                x: areaJogadorRect.x + margemGeralInterface * 2.5,
                y: areaJogadorRect.y + (areaJogadorRect.altura - alturaAreaMonte) / 2,
                largura: larguraAreaMonte,
                altura: alturaAreaMonte
            };

            const larguraBotaoPassar = 120 * escalaDesenho;
            const alturaBotaoPassar = 45 * escalaDesenho;
            const paddingBotaoY = 12 * escalaDesenho;
            const paddingBotaoX = 15 * escalaDesenho;
            areaBotaoPassarRect = {
                x: areaJogadorRect.x + areaJogadorRect.largura - larguraBotaoPassar - paddingBotaoX - margemGeralInterface,
                y: areaJogadorRect.y + paddingBotaoY,
                largura: larguraBotaoPassar,
                altura: alturaBotaoPassar
            };

            // --- Ajustar Limites da Mesa ---
            centroMesaX = areaMesaRect.x + areaMesaRect.largura / 2;
            centroMesaY = areaMesaRect.y + areaMesaRect.altura / 2;
            // Adiciona um pequeno buffer aos limites para evitar que a peça *toque* exatamente na borda antes de virar
            const bufferLimite = 2 * escalaDesenho;
            limiteSuperiorMesa = areaMesaRect.y + margemVerticalMesaEscalada + bufferLimite;
            limiteEsquerdoMesa = areaMesaRect.x + margemLateralMesaEscalada + bufferLimite;
            limiteInferiorMesa = areaMesaRect.y + areaMesaRect.altura - margemVerticalMesaEscalada - pecaAlturaH - bufferLimite; // Base da peça horizontal
            limiteDireitoMesa = areaMesaRect.x + areaMesaRect.largura - margemLateralMesaEscalada - pecaLarguraH - bufferLimite; // Borda dir peça horizontal
        }

        function desenharFundosAreas() {
            ctx.fillStyle = COR_FUNDO_CANVAS;
            ctx.fillRect(areaTotalRect.x, areaTotalRect.y, areaTotalRect.largura, areaTotalRect.altura);

            ctx.fillStyle = COR_FUNDO_AREA_IA_TOP;
            ctx.fillRect(areaIARect.x, areaIARect.y, areaIARect.largura, areaIARect.altura);
            ctx.fillStyle = COR_FUNDO_MESA;
            ctx.fillRect(areaMesaRect.x, areaMesaRect.y, areaMesaRect.largura, areaMesaRect.altura);
            ctx.fillStyle = COR_FUNDO_AREA_JOGADOR;
            ctx.fillRect(areaJogadorRect.x, areaJogadorRect.y, areaJogadorRect.largura, areaJogadorRect.altura);

            if (areaIAEsquerdaRect) {
                ctx.fillStyle = COR_FUNDO_AREA_IA_SIDE;
                ctx.fillRect(areaIAEsquerdaRect.x, areaIAEsquerdaRect.y, areaIAEsquerdaRect.largura, areaIAEsquerdaRect.altura);
            }
            if (areaIADireitaRect) {
                ctx.fillStyle = COR_FUNDO_AREA_IA_SIDE;
                ctx.fillRect(areaIADireitaRect.x, areaIADireitaRect.y, areaIADireitaRect.largura, areaIADireitaRect.altura);
            }

            ctx.strokeStyle = COR_BORDA_AREA;
            ctx.lineWidth = 1;
            ctx.strokeRect(areaIARect.x + 0.5, areaIARect.y + 0.5, areaIARect.largura - 1, areaIARect.altura - 1);
            ctx.strokeRect(areaMesaRect.x + 0.5, areaMesaRect.y + 0.5, areaMesaRect.largura - 1, areaMesaRect.altura - 1);
            ctx.strokeRect(areaJogadorRect.x + 0.5, areaJogadorRect.y + 0.5, areaJogadorRect.largura - 1, areaJogadorRect.altura - 1);
            if (areaIAEsquerdaRect) {
                ctx.strokeRect(areaIAEsquerdaRect.x + 0.5, areaIAEsquerdaRect.y + 0.5, areaIAEsquerdaRect.largura - 1, areaIAEsquerdaRect.altura - 1);
            }
             if (areaIADireitaRect) {
                ctx.strokeRect(areaIADireitaRect.x + 0.5, areaIADireitaRect.y + 0.5, areaIADireitaRect.largura - 1, areaIADireitaRect.altura - 1);
            }
        }

        function desenharAreaIA() { // Desenha IA 1 (Topo)
             if (!areaIARect || jogadores.length <= 1) return;
             const oponente = jogadores[1];
             if (!oponente) return;

             ctx.fillStyle = COR_TEXTO_UI;
             ctx.font = `bold ${tamanhoFonteBase * 0.85}px 'Segoe UI', Tahoma, sans-serif`;
             ctx.textAlign = 'left';
             ctx.textBaseline = 'middle';

             const nomeOponente = `IA ${oponente.id}`;
             const contagemPecas = `(${oponente.mao.length} peças)`;
             const textoCompleto = `${nomeOponente} ${contagemPecas}`;
             const textoIAX = areaIARect.x + margemGeralInterface * 1.5;
             const textoIAY = areaIARect.y + areaIARect.altura / 2;
             ctx.fillText(textoCompleto, textoIAX, textoIAY);

             let startXIA = textoIAX + ctx.measureText(textoCompleto).width + 2.5 * margemGeralInterface;
             const pecaYIA = areaIARect.y + (areaIARect.altura - pecaAlturaV) / 2;
             const limiteDireitoArea = areaIARect.x + areaIARect.largura - margemGeralInterface * 1.5;

             for (let i = 0; i < oponente.mao.length; i++) {
                 const pecaX = startXIA + i * (pecaLarguraV + espacoMaoEscalado);
                 if (pecaX + pecaLarguraV > limiteDireitoArea) break;
                 if (jogoAcabou) {
                    oponente.mao[i].desenharFrente(pecaX, pecaYIA, oponente.mao[i].l1, oponente.mao[i].l2, 'vertical');
                 } else {
                    oponente.mao[i].desenharVerso(pecaX, pecaYIA, 'vertical');
                 }
             }
        }

        function desenharAreaIAEsquerda() { // Desenha IA 2 (Lateral Esquerda)
            if (!areaIAEsquerdaRect || jogadores.length <= 2) return;
            const oponente = jogadores[2];
            if (!oponente) return;

            ctx.fillStyle = COR_TEXTO_UI;
            ctx.font = `bold ${tamanhoFonteBase * 0.80}px 'Segoe UI', Tahoma, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';

            const nomeOponente = `IA ${oponente.id} (${oponente.mao.length}) `;
            const textoX = areaIAEsquerdaRect.x + areaIAEsquerdaRect.largura / 2;
            const textoY = areaIAEsquerdaRect.y + margemGeralInterface;
            ctx.fillText(nomeOponente, textoX, textoY);

            const pecaX = areaIAEsquerdaRect.x + (areaIAEsquerdaRect.largura - pecaLarguraV) / 2;
            let startY = textoY + tamanhoFonteBase * 1.5;
            const espacoVertical = espacoMaoEscalado * 0.8;
            const limiteInferiorArea = areaIAEsquerdaRect.y + areaIAEsquerdaRect.altura - margemGeralInterface;

             for (let i = 0; i < oponente.mao.length; i++) {
                 const pecaY = startY + i * (pecaAlturaV + espacoVertical);
                 if (pecaY + pecaAlturaV > limiteInferiorArea) break;
                 if (jogoAcabou) {
                    oponente.mao[i].desenharFrente(pecaX, pecaY, oponente.mao[i].l1, oponente.mao[i].l2, 'vertical');
                 } else {
                    oponente.mao[i].desenharVerso(pecaX, pecaY, 'vertical');
                 }
             }
        }

         function desenharAreaIADireita() { // Desenha IA 3 (Lateral Direita)
            if (!areaIADireitaRect || jogadores.length <= 3) return;
            const oponente = jogadores[3];
            if (!oponente) return;

             ctx.fillStyle = COR_TEXTO_UI;
             ctx.font = `bold ${tamanhoFonteBase * 0.80}px 'Segoe UI', Tahoma, sans-serif`;
             ctx.textAlign = 'center';
             ctx.textBaseline = 'top';

             const nomeOponente = `IA ${oponente.id} (${oponente.mao.length}) `;
             const textoX = areaIADireitaRect.x + areaIADireitaRect.largura / 2;
             const textoY = areaIADireitaRect.y + margemGeralInterface;
             ctx.fillText(nomeOponente, textoX, textoY);

             const pecaX = areaIADireitaRect.x + (areaIADireitaRect.largura - pecaLarguraV) / 2;
             let startY = textoY + tamanhoFonteBase * 1.5;
             const espacoVertical = espacoMaoEscalado * 0.8;
             const limiteInferiorArea = areaIADireitaRect.y + areaIADireitaRect.altura - margemGeralInterface;

             for (let i = 0; i < oponente.mao.length; i++) {
                 const pecaY = startY + i * (pecaAlturaV + espacoVertical);
                 if (pecaY + pecaAlturaV > limiteInferiorArea) break;
                 if (jogoAcabou) {
                     oponente.mao[i].desenharFrente(pecaX, pecaY, oponente.mao[i].l1, oponente.mao[i].l2, 'vertical');
                 } else {
                     oponente.mao[i].desenharVerso(pecaX, pecaY, 'vertical');
                 }
             }
        }

        function desenharAreaJogador() { // Jogador Humano (Baixo Central)
             if (!areaJogadorRect || !areaMonteRect || jogadores.length === 0) return;
             const maoHumano = jogadores[0].mao;
             const larguraTotalMao = maoHumano.length * (pecaLarguraV + espacoMaoEscalado) - espacoMaoEscalado;
             let startXJogador = areaJogadorRect.x + (areaJogadorRect.largura - larguraTotalMao) / 2;
             startXJogador = Math.max(startXJogador, areaMonteRect.x + areaMonteRect.largura + margemGeralInterface * 1.5);

        function checarEncaixe(pMao,lado){ if(!pMao||jogoAcabou) return{valida:false,conectaQualLado:null}; if(mesa.length===0) return{valida:true,conectaQualLado:'l1'}; const vP=(lado==='esquerda')?pontas.esquerda:pontas.direita; if(vP===null){ console.error(`Erro: Tentando encaixar no lado ${lado} mas a ponta lógica é null.`); return{valida:false,conectaQualLado:null}; } if(pMao.l1===vP) return{valida:true,conectaQualLado:'l1'}; if(pMao.l2===vP) return{valida:true,conectaQualLado:'l2'}; return{valida:false,conectaQualLado:null}; }

        function distribuirPecas(){
            criarTodasAsPecas(); embaralhar(todasAsPecas); jogadores = []; monte = []; mesa = [];
            pontas = {esquerda: null, direita: null}; pecaSelecionada = null; jogoAcabou = false;
            mensagemFimJogo = ""; passesConsecutivos = 0; indiceJogadorAtual = 0;
            jogadorPodeInteragir = false; mostrarBotaoPassar = false; jogadorQueIniciou = null;

            jogadores.push({ tipo: JOGADOR_HUMANO, mao: [] });
            for (let i = 0; i < NUM_IA_PLAYERS; i++) { jogadores.push({ tipo: JOGADOR_IA, id: i + 1, mao: [] }); }

            let indicePecaAtual = 0;
            for (let i = 0; i < PECAS_POR_JOGADOR; i++) {
                for (let j = 0; j < TOTAL_PLAYERS; j++) {
                    if (indicePecaAtual < todasAsPecas.length) {
                        jogadores[j].mao.push(todasAsPecas[indicePecaAtual]); indicePecaAtual++;
                    }
                }
            }
            monte = todasAsPecas.slice(indicePecaAtual);
        }

        function determinarPrimeiroJogadorEPeca() {
            let melhorInfo = { indiceJogador: -1, indicePeca: -1, valor: -1 };
            const calcularValor = (p) => p.ehDoble ? 100 + Math.min(p.l1, p.l2) : p.valorTotal;
            for (let i = 0; i < jogadores.length; i++) {
                const maoAtual = jogadores[i].mao;
                for (let j = 0; j < maoAtual.length; j++) {
                    const peca = maoAtual[j]; const valor = calcularValor(peca);
                    if (valor > melhorInfo.valor) { melhorInfo = { indiceJogador: i, indicePeca: j, valor: valor }; }
                }
            }
            if (melhorInfo.indiceJogador === -1) { return { indiceJogador: 0, indicePeca: 0 }; }
            return { indiceJogador: melhorInfo.indiceJogador, indicePeca: melhorInfo.indicePeca };
        }

        function podeJogarAlgumaPeca(mao){ if(mesa.length===0) return mao.length > 0; for(const p of mao){ if(isPecaJogavel(p)) return true; } return false; }

        function realizarJogada(indiceDoJogador, indiceDaPecaNaMao, lado) {
            if (jogoAcabou && indiceDoJogador !== null) return false;
            let jogador, mao, pOrigMao;
            if (indiceDoJogador !== null) { jogador = jogadores[indiceDoJogador]; mao = jogador.mao; pOrigMao = mao?.[indiceDaPecaNaMao]; }
            else { jogador = null; mao = null; pOrigMao = indiceDaPecaNaMao; }
            if (!pOrigMao) { console.error(`Peca original invalida. Jogador ${indiceDoJogador}, Peça ${indiceDaPecaNaMao}`); return false; }
            const { valida, conectaQualLado } = checarEncaixe(pOrigMao, lado);
            if (!valida && mesa.length > 0) { if (jogador?.tipo === JOGADOR_HUMANO) { atualizarStatus("Jogada inválida!"); pecaSelecionada = null; desenharJogo(); } return false; }
            let lCon, lExp; if (mesa.length === 0) { lCon = pOrigMao.l1; lExp = pOrigMao.l2; } else { lCon = (conectaQualLado === 'l1') ? pOrigMao.l1 : pOrigMao.l2; lExp = (conectaQualLado === 'l1') ? pOrigMao.l2 : pOrigMao.l1; }
            let pVis; if (lado === 'esquerda') { pVis = new Peca(lExp, lCon); } else { pVis = new Peca(lCon, lExp); }
            if (indiceDoJogador !== null && mao && indiceDaPecaNaMao >= 0 && indiceDaPecaNaMao < mao.length) { mao.splice(indiceDaPecaNaMao, 1); }
            else if (indiceDoJogador !== null) { console.error(`Erro ao remover peça ${indiceDaPecaNaMao}.`); return false; }
            const itemMesa = { pecaOriginal: pOrigMao, pecaVisual: pVis, jogador: indiceDoJogador };
            if (mesa.length === 0) { mesa.push(itemMesa); pontas.esquerda = pOrigMao.l1; pontas.direita = pOrigMao.l2; }
            else if (lado === 'esquerda') { mesa.unshift(itemMesa); pontas.esquerda = lExp; }
            else { mesa.push(itemMesa); pontas.direita = lExp; }

            if (indiceDoJogador !== null) {
                 passesConsecutivos = 0; pecaSelecionada = null; mostrarBotaoPassar = false;
                 if (!verificarFimDeJogo()) { proximoTurno(indiceDoJogador); } else { desenharJogo(); }
            } else {
                 indiceJogadorAtual = (jogadorQueIniciou + 1) % TOTAL_PLAYERS; atualizarStatus(); desenharJogo();
                 if (jogadores[indiceJogadorAtual].tipo === JOGADOR_IA) { jogadorPodeInteragir = false; setTimeout(jogarTurnoIA, DELAY_IA); }
                 else { jogadorPodeInteragir = true; atualizarCursor(); if (!podeJogarAlgumaPeca(jogadores[0].mao)) { mostrarBotaoPassar = (monte.length === 0); atualizarStatus(monte.length > 0 ? "Sua Vez: Compre." : "Sua Vez: Passe."); } desenharJogo(); }
            } return true;
        }

        function realizarCompra(indiceDoJogador){
            if(jogoAcabou||monte.length===0) return false;
            const jogador = jogadores[indiceDoJogador]; const mao = jogador.mao;
            if(jogador.tipo === JOGADOR_HUMANO && podeJogarAlgumaPeca(mao)){ atualizarStatus("Você pode jogar! Não precisa comprar."); desenharJogo(); return false; }
            const nP=monte.pop(); mao.push(nP); passesConsecutivos=0;
            if(jogador.tipo === JOGADOR_HUMANO){
                pecaSelecionada=null;
                if(!podeJogarAlgumaPeca(mao)){ mostrarBotaoPassar=(monte.length===0); atualizarStatus(monte.length>0 ? "Comprou. Compre ou Passe." : "Comprou. Sem jogada. Passe."); }
                else{ mostrarBotaoPassar=false; atualizarStatus("Comprou. Agora jogue."); }
                desenharJogo();
            } return true;
        }

        function passarVez(){
            if(jogoAcabou || indiceJogadorAtual !== 0 || !mostrarBotaoPassar) return;
            passesConsecutivos++; atualizarStatus(`Você passou a vez.`);
            mostrarBotaoPassar=false; pecaSelecionada=null; desenharJogo();
            if(!verificarFimDeJogo()){ proximoTurno(0); }
        }

        function proximoTurno(indiceJogadorQueJogou){
            if(jogoAcabou) return;
            indiceJogadorAtual = (indiceJogadorQueJogou + 1) % TOTAL_PLAYERS;
            atualizarStatus(); desenharJogo();
            const jogadorAtual = jogadores[indiceJogadorAtual];
            if(jogadorAtual.tipo === JOGADOR_IA){ jogadorPodeInteragir = false; atualizarCursor(); setTimeout(jogarTurnoIA, DELAY_IA); }
            else { jogadorPodeInteragir = true; if(!podeJogarAlgumaPeca(jogadorAtual.mao)){ mostrarBotaoPassar=(monte.length===0); atualizarStatus(monte.length>0 ? "Sua Vez: Compre uma peça." : "Sua Vez: Passe a vez."); } else { mostrarBotaoPassar = false; } desenharJogo(); atualizarCursor(); }
        }

        function verificarFimDeJogo(){
            let fim = false; let msg = ""; let vencedor = -1;
            for (let i = 0; i < jogadores.length; i++) { if (jogadores[i].mao.length === 0) { fim = true; vencedor = i; const nomeVencedor = (i === 0) ? "Você" : `IA ${jogadores[i].id}`; msg = `${nomeVencedor} Bateu!\n${nomeVencedor} Venceu!`; break; } }
            if (!fim) {
                let todosBloqueados = true; for (let i = 0; i < jogadores.length; i++) { if (podeJogarAlgumaPeca(jogadores[i].mao)) { todosBloqueados = false; break; } }
                if ((todosBloqueados && monte.length === 0) || passesConsecutivos >= TOTAL_PLAYERS) {
                    fim = true; msg = "Jogo Bloqueado!\n"; let pontos = jogadores.map(j => j.mao.reduce((s, p) => s + p.valorTotal, 0));
                    let minPontos = Math.min(...pontos); let vencedores = [];
                    for (let i = 0; i < pontos.length; i++) { if (pontos[i] === minPontos) { vencedores.push(i); } }
                    if (vencedores.length === 1) { vencedor = vencedores[0]; const nomeVencedor = (vencedor === 0) ? "Você" : `IA ${jogadores[vencedor].id}`; msg += `${nomeVencedor} venceu por pontos (${minPontos} pts)`; }
                    else { let nomesEmpate = vencedores.map(idx => (idx === 0) ? "Você" : `IA ${jogadores[idx].id}`); msg += `Empate entre ${nomesEmpate.join(' e ')} (${minPontos} pts cada)`; vencedor = -2; }
                }
            }
            if(fim){ msg+="\n\nClique para jogar novamente."; mensagemFimJogo=msg; jogoAcabou=true; atualizarStatus("Fim de Jogo.", true); return true; }
            return false;
        }

        function jogarTurnoIA(){
            const indiceIA = indiceJogadorAtual; if(jogoAcabou || jogadores[indiceIA].tipo !== JOGADOR_IA) return;
            const jogadorIA = jogadores[indiceIA]; const nomeIA = `IA ${jogadorIA.id}`;
            atualizarStatus(`${nomeIA} pensando...`); desenharJogo();
            let mj=null; let mV=-1; const maoIA = jogadorIA.mao;
            for(let i=0;i<maoIA.length;i++){ const pO=maoIA[i]; const vO=pO.ehDoble?100+Math.min(pO.l1,pO.l2):pO.valorTotal; const eD=checarEncaixe(pO,'direita'); if(eD.valida&&vO>mV){mV=vO;mj={indice:i,lado:'direita'};} const eE=checarEncaixe(pO,'esquerda'); if(eE.valida&&vO>=mV){mV=vO;mj={indice:i,lado:'esquerda'};} } // Prioriza direita se valor igual
            if(mj){ const pId=maoIA[mj.indice].id; atualizarStatus(`${nomeIA} jogando ${pId}...`); desenharJogo(); setTimeout(()=>{realizarJogada(indiceIA, mj.indice, mj.lado);},DELAY_IA*0.6); }
            else {
                if(monte.length > 0){ atualizarStatus(`${nomeIA} comprando...`); desenharJogo(); setTimeout(()=>{ if(realizarCompra(indiceIA)){ setTimeout(jogarTurnoIA, DELAY_IA * 0.5); } else { console.error(`${nomeIA} falhou compra.`); passesConsecutivos++; atualizarStatus(`${nomeIA} passou (erro compra).`); desenharJogo(); if(!verificarFimDeJogo()) proximoTurno(indiceIA); else desenharJogo(); } },DELAY_IA*0.4); }
                else { passesConsecutivos++; atualizarStatus(`${nomeIA} passou.`); desenharJogo(); let todosBloqueados = true; for (let i = 0; i < jogadores.length; i++) { if (podeJogarAlgumaPeca(jogadores[i].mao)) { todosBloqueados = false; break; } } if (todosBloqueados && monte.length === 0) { verificarFimDeJogo(); desenharJogo(); } else { if (!verificarFimDeJogo()) { proximoTurno(indiceIA); } else { desenharJogo(); } } }
            }
        }

        // --- Eventos & Inicialização ---
        function getMousePos(el,evt){ const r=el.getBoundingClientRect(); const sX=el.width/r.width; const sY=el.height/r.height; return{x:(evt.clientX-r.left)*sX,y:(evt.clientY-r.top)*sY}; }
        function isDentro(p,r){ return r&&p&&r.largura>0&&r.altura>0&&p.x>=r.x&&p.x<=r.x+r.largura&&p.y>=r.y&&p.y<=r.y+r.altura; }

        function verificarHover(e){
            if(jogoAcabou){ if(!canvas.classList.contains('clicavel')) canvas.classList.add('clicavel'); if(canvas.classList.contains('esperando')) canvas.classList.remove('esperando'); hoverBotaoPassar=false; return; }
            if(indiceJogadorAtual !== 0 || !jogadorPodeInteragir){ hoverBotaoPassar=false; if(canvas.classList.contains('clicavel')) canvas.classList.remove('clicavel'); if(!canvas.classList.contains('esperando')) canvas.classList.add('esperando'); return; }
            if(canvas.classList.contains('esperando')) canvas.classList.remove('esperando');
            const p=getMousePos(canvas,e); const maoHumano = jogadores[0].mao; let cC=false; let hB=false;
            if(mostrarBotaoPassar && areaBotaoPassarRect && isDentro(p,areaBotaoPassarRect)){ cC=true; hB=true; }
            if(!podeJogarAlgumaPeca(maoHumano) && monte.length>0 && areaClicarMonte && isDentro(p,areaClicarMonte)){ cC=true; }
            const larguraTotalMao = maoHumano.length * (pecaLarguraV + espacoMaoEscalado) - espacoMaoEscalado; let startXJogador = areaJogadorRect.x + (areaJogadorRect.largura - larguraTotalMao) / 2; startXJogador = Math.max(startXJogador, areaMonteRect.x + areaMonteRect.largura + margemGeralInterface * 1.5); const pecaYJogador = areaJogadorRect.y + (areaJogadorRect.altura - pecaAlturaV) / 2; const limiteDireitoMao = areaJogadorRect.x + areaJogadorRect.largura - margemGeralInterface * 2;
            for(let i=0; i<maoHumano.length; i++){ const pX = startXJogador + i * (pecaLarguraV + espacoMaoEscalado); if(pX + pecaLarguraV < limiteDireitoMao + 5){ if(maoHumano[i] && isPecaJogavel(maoHumano[i]) && maoHumano[i].contemPontoMao(p.x,p.y,pX,pecaYJogador)){ cC = true; break; } } }
            if(pecaSelecionada!==null){ if(areaJogarEsquerda.ativa && isDentro(p,areaJogarEsquerda)) cC=true; if(areaJogarDireita.ativa && isDentro(p,areaJogarDireita)) cC=true; }
            if(hB!==hoverBotaoPassar){ hoverBotaoPassar=hB; desenharJogo(); }
            if(cC&&!canvas.classList.contains('clicavel')) canvas.classList.add('clicavel'); else if(!cC&&canvas.classList.contains('clicavel')) canvas.classList.remove('clicavel');
        }

        function atualizarCursor(){ if(jogoAcabou){ canvas.classList.remove('esperando'); canvas.classList.add('clicavel'); } else if (!jogadorPodeInteragir || indiceJogadorAtual !== 0){ canvas.classList.add('esperando'); canvas.classList.remove('clicavel'); } else { canvas.classList.remove('esperando'); } }
        function atualizarStatus(nMsg=null,fim=false){
            jogadorPodeInteragir=(indiceJogadorAtual === 0 && !jogoAcabou);
            if(nMsg && !fim){ mensagemStatus=nMsg; }
            else if(!jogoAcabou){ const jogadorAtual = jogadores[indiceJogadorAtual]; if(jogadorAtual.tipo === JOGADOR_HUMANO){ const maoHumano = jogadorAtual.mao; if(!podeJogarAlgumaPeca(maoHumano)){ mensagemStatus=monte.length>0 ? "Sua Vez: Compre uma peça." : "Sua Vez: Passe a vez."; } else { mensagemStatus=pecaSelecionada===null ? "Sua Vez: Escolha uma peça." : "Sua Vez: Escolha onde jogar."; } } else { const nomeIA = `IA ${jogadorAtual.id}`; if(!mensagemStatus || !mensagemStatus.includes(nomeIA)) { mensagemStatus=`Vez da ${nomeIA}...`; } } }
            else if(fim && nMsg){ mensagemStatus=nMsg; }
            mostrarBotaoPassar=(jogadorPodeInteragir && !podeJogarAlgumaPeca(jogadores[0].mao) && monte.length===0 && !jogoAcabou);
            atualizarCursor();
        }

        function handleMouseClick(e){
            if(jogoAcabou){ iniciarJogo(); return; } if(indiceJogadorAtual !== 0 || !jogadorPodeInteragir) return;
            const pos=getMousePos(canvas,e); const maoHumano = jogadores[0].mao;
            if(mostrarBotaoPassar && areaBotaoPassarRect && isDentro(pos,areaBotaoPassarRect)){ passarVez(); return; }
            if(!podeJogarAlgumaPeca(maoHumano) && monte.length>0 && areaClicarMonte && isDentro(pos,areaClicarMonte)){ realizarCompra(0); return; }
            if(pecaSelecionada!==null){ const pSO=maoHumano[pecaSelecionada]; if(pSO){ let jogou=false; if(areaJogarEsquerda.ativa && isDentro(pos,areaJogarEsquerda) && checarEncaixe(pSO,'esquerda').valida) { jogou=realizarJogada(0, pecaSelecionada, 'esquerda'); } else if(areaJogarDireita.ativa && isDentro(pos,areaJogarDireita) && checarEncaixe(pSO,'direita').valida) { jogou=realizarJogada(0, pecaSelecionada, 'direita'); } if(jogou) return; if (!isDentro(pos, areaJogarEsquerda) && !isDentro(pos, areaJogarDireita)) { pecaSelecionada=null; atualizarStatus(); desenharJogo(); } } else { pecaSelecionada=null; console.warn("Peca selecionada invalida?"); atualizarStatus(); desenharJogo(); } if (pecaSelecionada !== null && !jogou) return; }
            let idxClicado=-1; const larguraTotalMao = maoHumano.length * (pecaLarguraV + espacoMaoEscalado) - espacoMaoEscalado; let startXJogador = areaJogadorRect.x + (areaJogadorRect.largura - larguraTotalMao) / 2; startXJogador = Math.max(startXJogador, areaMonteRect.x + areaMonteRect.largura + margemGeralInterface * 1.5); const pecaYJogador = areaJogadorRect.y + (areaJogadorRect.altura - pecaAlturaV) / 2; const limiteDireitoMao = areaJogadorRect.x + areaJogadorRect.largura - margemGeralInterface * 2;
            for(let i=0; i<maoHumano.length; i++){ const pX = startXJogador + i * (pecaLarguraV + espacoMaoEscalado); if(pX + pecaLarguraV < limiteDireitoMao + 5){ if(maoHumano[i] && maoHumano[i].contemPontoMao(pos.x,pos.y,pX,pecaYJogador)){ idxClicado=i; break; } } }
            if(idxClicado!==-1){ const pC=maoHumano[idxClicado]; if(isPecaJogavel(pC)){ pecaSelecionada=(pecaSelecionada===idxClicado)?null:idxClicado; atualizarStatus(); desenharJogo(); } else{ pecaSelecionada=null; atualizarStatus("Esta peça não pode ser jogada agora."); desenharJogo(); } return; }
        }

        function ajustarCanvasProporcionalmente() {
            const margemBody = 20; const viewportWidth = window.innerWidth - margemBody; const viewportHeight = window.innerHeight - margemBody; const aspectRatio = 20 / 11;
            let novoLargura = viewportWidth; let novoAltura = novoLargura / aspectRatio; if (novoAltura > viewportHeight) { novoAltura = viewportHeight; novoLargura = novoAltura * aspectRatio; }
            const minWidth = 750; const minHeight = minWidth / aspectRatio; novoLargura = Math.max(minWidth, Math.round(novoLargura)); novoAltura = Math.max(minHeight, Math.round(novoAltura));
            if (canvas.width !== novoLargura || canvas.height !== novoAltura) { canvas.width = novoLargura; canvas.height = novoAltura; console.log(`Canvas resized: ${canvas.width}x${canvas.height}`); return true; } return false;
        }

        function iniciarJogo() {
            console.log(`--- Iniciando Dominó Minimalista v6.8 (${TOTAL_PLAYERS} jogadores) ---`);
            ajustarCanvasProporcionalmente(); ajustarTamanhoPosicoes(); distribuirPecas();
            const infoInicio = determinarPrimeiroJogadorEPeca(); jogadorQueIniciou = infoInicio.indiceJogador; indiceJogadorAtual = jogadorQueIniciou;
            let maoInicial = jogadores[jogadorQueIniciou].mao; let pecaInicialOriginal = null;
            if (infoInicio.indicePeca >= 0 && infoInicio.indicePeca < maoInicial.length) { pecaInicialOriginal = maoInicial.splice(infoInicio.indicePeca, 1)[0]; } else { if (maoInicial.length > 0) pecaInicialOriginal = maoInicial.splice(0, 1)[0]; else { alert("Erro crítico: Mão inicial vazia!"); return; } }
            if (pecaInicialOriginal) { const idInicial = pecaInicialOriginal.id; const nomeIniciador = (jogadorQueIniciou === 0) ? "Você" : `IA ${jogadores[jogadorQueIniciou].id}`; console.log(`Primeiro Jogador: ${nomeIniciador} (Índice ${jogadorQueIniciou}) com a peça ${idInicial}`); atualizarStatus(`Início. ${nomeIniciador} começa com ${idInicial}.`); pecaSelecionada = null; jogoAcabou = false; jogadorPodeInteragir = false; setTimeout(() => { realizarJogada(null, pecaInicialOriginal, null); }, 400); }
            else { alert("Erro: Não foi possível obter a peça inicial."); }
        }

        // --- Listeners ---
        canvas.addEventListener('click', handleMouseClick); canvas.addEventListener('mousemove', verificarHover);
        window.addEventListener('resize', () => { if(ajustarCanvasProporcionalmente()) { iniciarJogo(); } else { ajustarTamanhoPosicoes(); desenharJogo(); } });
        window.onload = iniciarJogo;

    </script>
