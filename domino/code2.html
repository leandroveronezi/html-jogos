<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominó Minimalista v6.1 - Layout Moderno</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a; /* Fundo escuro geral */
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #555; /* Borda mais sutil */
            /* background-color set dynamically */
            box-shadow: 0 6px 15px rgba(0,0,0,0.5); /* Sombra mais pronunciada */
            display: block;
            cursor: default;
            max-width: 100%;
            max-height: calc(100vh - 20px); /* Considera padding do body */
            aspect-ratio: 20 / 11; /* Proporção um pouco mais alta para acomodar layout */
            background-color: #222; /* Cor de fundo padrão do canvas se JS falhar */
        }
        canvas.esperando {
            cursor: wait;
        }
        canvas.clicavel {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Constantes ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const JOGADOR = 'jogador';
        const IA = 'ia';
        const PECA_LARGURA_BASE = 60; // Base para cálculo, será escalado
        const PECA_ALTURA_BASE = 30;
        const DOT_RAIO_BASE = 3;
        const CANTO_RAIO_BASE = 3;
        const DELAY_IA = 800;
        const ESPACO_ENTRE_PECAS_MESA_BASE = 4;
        const ESPACO_ENTRE_PECAS_MAO_BASE = 6;
        const MARGEM_BORDA_LATERAL_BASE = 20; // Aumentar margens laterais da mesa
        const MARGEM_BORDA_VERTICAL_BASE = 20; // Aumentar margens verticais da mesa

        // Cores Modernizadas
        const COR_FUNDO_CANVAS = '#2a2a2a'; // Fundo geral mais escuro
        const COR_FUNDO_MESA = '#004d00'; // Verde mais escuro para mesa
        const COR_FUNDO_AREA_IA = '#333333'; // Cinza escuro para área IA
        const COR_FUNDO_AREA_JOGADOR = '#3f3f3f'; // Cinza um pouco mais claro para área Jogador
        const COR_FUNDO_AREA_MONTE = '#444444'; // Cinza para área Monte
        const COR_BORDA_AREA = 'rgba(255, 255, 255, 0.1)'; // Bordas bem sutis
        const COR_PECA = '#f0f0f0'; // Peça quase branca
        const COR_PECA_VERSO = '#222222'; // Verso bem escuro
        const COR_DOT = '#050505'; // Dots pretos
        const COR_LINHA_PECA = '#bbbbbb'; // Linha divisória mais clara
        const COR_TEXTO_UI = '#e0e0e0'; // Texto UI claro
        const COR_TEXTO_STATUS = '#ffffff';
        const COR_DESTAQUE_SELECAO = '#ffdd44'; // Amarelo mais vibrante
        const COR_DESTAQUE_JOGAVEL_FILL = 'rgba(255, 221, 68, 0.15)'; // Fill do highlight sutil
        const COR_DESTAQUE_JOGAVEL_STROKE = '#ffdd44'; // Stroke do highlight igual seleção
        const COR_DESTAQUE_COMPRA_STROKE = '#ffaa00'; // Laranja para compra
        const COR_BOTAO_PASSAR_FILL = '#cccccc'; // Botão cinza claro
        const COR_BOTAO_PASSAR_TEXT = '#111111'; // Texto preto no botão
        const COR_BOTAO_PASSAR_HOVER_FILL = '#ffffff'; // Botão branco no hover
        const COR_DESTAQUE_JOGAVEL_HAND = '#ffdd44'; // Destaque na mão igual seleção
        const COR_OVERLAY_FIM = 'rgba(0, 0, 0, 0.8)'; // Overlay de fim mais escuro
        const COR_TEXTO_FIM = '#FFFFFF';

        // --- Variáveis Globais ---
        let CANVAS_LARGURA;
        let CANVAS_ALTURA;
        let CENTRO_X; // Centro total do canvas
        let CENTRO_Y;
        let escalaDesenho = 1;
        let tamanhoFonteBase;
        let pecaLarguraH; // Peça Horizontal (na mesa e metades verticais)
        let pecaAlturaH;
        let pecaLarguraV; // Peça Vertical (na mão e metades horizontais)
        let pecaAlturaV;
        let dotRaio;
        let cantoRaio;
        let espacoMesaEscalado;
        let espacoMaoEscalado;
        let margemLateralMesaEscalada; // Margens DENTRO da área da mesa
        let margemVerticalMesaEscalada;
        let margemGeralInterface = 10; // Margem entre áreas principais

        // Áreas Retangulares Layout
        let areaTotalRect = {}; // Área total do canvas
        let areaIARect = {};    // Topo
        let areaMesaRect = {};  // Centro
        let areaJogadorRect = {};// Base
        let areaMonteRect = {}; // Dentro ou ao lado da área do jogador
        let areaStatusRect = {}; // Barra inferior
        let areaBotaoPassarRect = {};

        let centroMesaX; // Centro da área da mesa
        let centroMesaY;
        let limiteSuperiorMesa; // Limites para desenho das peças na mesa
        let limiteInferiorMesa;
        let limiteEsquerdoMesa;
        let limiteDireitoMesa;

        let areaJogarEsquerda = { ativa: false };
        let areaJogarDireita = { ativa: false };
        let areaClicarMonte = {};

        // Estado do Jogo
        let todasAsPecas = [];
        let maoJogador = [];
        let maoIA = [];
        let monte = [];
        let mesa = []; // Array de { pecaVisual: Peca } - Peças sempre horizontais aqui
        let pontas = { esquerda: null, direita: null }; // Valores das pontas
        let pecaSelecionada = null; // Índice da peça na mão do jogador
        let mensagemStatus = "";
        let mensagemFimJogo = "";
        let jogoAcabou = false;
        let turnoAtual = null;
        let jogadorPodeInteragir = false;
        let passesConsecutivos = 0;
        let mostrarBotaoPassar = false;
        let hoverBotaoPassar = false;
        let direcaoLogicaEsquerda = 'esquerda'; // Direção de crescimento da corrente
        let direcaoLogicaDireita = 'direita';
        let jogadorQueIniciou = null;

        // --- Classe Peca ---
        class Peca {
            constructor(lado1, lado2) {
                this.l1 = lado1; // Representa o valor visualmente à esquerda (ou em cima)
                this.l2 = lado2; // Representa o valor visualmente à direita (ou embaixo)
                const vA = Math.min(lado1, lado2);
                const vB = Math.max(lado1, lado2);
                this.id = `${vA}-${vB}`; // ID canônico para referência
            }

            desenharCorpo(x, y, w, h, bg, border, highlight = null) {
                const r = cantoRaio; // Já escalado
                ctx.fillStyle = bg;
                ctx.strokeStyle = highlight ?? border;
                ctx.lineWidth = (highlight) ? 2 * escalaDesenho : 1 * escalaDesenho;
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // Desenha a frente da peça (mesa ou mão)
            // Os parâmetros ladoAVisivel e ladoBVisivel são os valores a serem mostrados
            // ladoAVisivel sempre será desenhado na metade Esquerda/Cima
            // ladoBVisivel sempre será desenhado na metade Direita/Baixo
            desenharFrente(x, y, ladoAVisivel, ladoBVisivel, orientacao = 'horizontal', selecionada = false, jogavel = false) {
                const ehHorizontal = (orientacao === 'horizontal');
                const w = ehHorizontal ? pecaLarguraH : pecaLarguraV;
                const h = ehHorizontal ? pecaAlturaH : pecaAlturaV;

                let corDestaque = null;
                if (selecionada) {
                    corDestaque = COR_DESTAQUE_SELECAO;
                } else if (jogavel) {
                    corDestaque = COR_DESTAQUE_JOGAVEL_HAND;
                }

                this.desenharCorpo(x, y, w, h, COR_PECA, COR_LINHA_PECA, corDestaque);

                // Linha divisória
                ctx.strokeStyle = COR_LINHA_PECA;
                ctx.lineWidth = 1 * escalaDesenho;
                ctx.beginPath();
                if (ehHorizontal) {
                    ctx.moveTo(x + w / 2, y + 2 * escalaDesenho);
                    ctx.lineTo(x + w / 2, y + h - 2 * escalaDesenho);
                } else { // Vertical
                    ctx.moveTo(x + 2 * escalaDesenho, y + h / 2);
                    ctx.lineTo(x + w - 2 * escalaDesenho, y + h / 2);
                }
                ctx.stroke();

                // Dots - Passa a orientação GERAL da peça para desenharDots saber o layout do 6
                this.desenharDots(ladoAVisivel, x, y, w, h, ehHorizontal ? 'esquerda' : 'cima', orientacao);
                this.desenharDots(ladoBVisivel, x, y, w, h, ehHorizontal ? 'direita' : 'baixo', orientacao);
            }

            desenharVerso(x, y, orientacao = 'vertical') {
                 const ehHorizontal = (orientacao === 'horizontal');
                 const w = ehHorizontal ? pecaLarguraH : pecaLarguraV;
                 const h = ehHorizontal ? pecaAlturaH : pecaAlturaV;
                 this.desenharCorpo(x, y, w, h, COR_PECA_VERSO, COR_BORDA_AREA); // Borda sutil no verso
                 // Pino central
                 ctx.fillStyle = COR_LINHA_PECA;
                 ctx.beginPath();
                 ctx.arc(x + w / 2, y + h / 2, dotRaio * 1.1, 0, Math.PI * 2); // Usar dotRaio escalado
                 ctx.fill();
            }

            // Desenha os pontos (dots) em uma das metades da peça
            // orientacaoPeca indica se a peça INTEIRA está H ou V
            desenharDots(numero, pecaX, pecaY, larguraPeca, alturaPeca, qualMetade, orientacaoPeca) {
                if (numero < 0 || numero > 6) return;

                let halfX, halfY, halfW, halfH;
                const pecaEhHorizontal = (orientacaoPeca === 'horizontal');

                // 1. Define a área da metade
                if (qualMetade === 'esquerda') { // Metade esquerda de H ou V
                    halfX = pecaX; halfY = pecaY; halfW = larguraPeca / 2; halfH = alturaPeca;
                } else if (qualMetade === 'direita') { // Metade direita de H ou V
                    halfX = pecaX + larguraPeca / 2; halfY = pecaY; halfW = larguraPeca / 2; halfH = alturaPeca;
                } else if (qualMetade === 'cima') { // Metade superior de H ou V
                    halfX = pecaX; halfY = pecaY; halfW = larguraPeca; halfH = alturaPeca / 2;
                } else { // baixo // Metade inferior de H ou V
                    halfX = pecaX; halfY = pecaY + alturaPeca / 2; halfW = larguraPeca; halfH = alturaPeca / 2;
                }

                // 2. Calcula centro e espaçamentos na metade
                const centroX = halfX + halfW / 2;
                const centroY = halfY + halfH / 2;
                const espacoXRel = halfW / 4; // Espaçamento relativo
                const espacoYRel = halfH / 4;
                const raioDot = dotRaio; // Já escalado globalmente

                // Garante espaçamento mínimo absoluto para não colar
                const minEspacoAbs = raioDot * 1.8;
                const espacoX = Math.max(espacoXRel, minEspacoAbs);
                const espacoY = Math.max(espacoYRel, minEspacoAbs);


                // 3. Layouts padrão
                const dotLayouts = [
                     [], // 0
                     [[0, 0]], // 1: Centro
                     [[-1, -1], [1, 1]], // 2: Diagonal sup-esq -> inf-dir (relativo ao centro da metade)
                     [[-1, -1], [0, 0], [1, 1]], // 3: Diagonal + Centro
                     [[-1, -1], [1, -1], [-1, 1], [1, 1]], // 4: Cantos
                     [[-1, -1], [1, -1], [0, 0], [-1, 1], [1, 1]], // 5: Cantos + Centro
                ];

                // Layout 6: 3 linhas x 2 colunas (para metades ALTAS - como as metades Esq/Dir de uma peça H)
                 // Ajustado multiplicadores para não colar nas bordas verticais
                const layout6Vertical = [
                    [-0.7, -1], [0.7, -1], // Linha cima
                    [-0.7,  0], [0.7,  0], // Linha meio
                    [-0.7,  1], [0.7,  1]  // Linha baixo
                ];
                // Layout 6: 2 linhas x 3 colunas (para metades LARGAS - como as metades Cima/Baixo de uma peça V)
                 // Ajustado multiplicadores para não colar nas bordas horizontais
                const layout6Horizontal = [
                    [-1, -0.7], [0, -0.7], [1, -0.7], // Linha cima
                    [-1,  0.7], [0,  0.7], [1,  0.7]  // Linha baixo
                ];

                let currentLayout = dotLayouts[numero] || [];

                // 4. Tratamento especial para o 6 baseado na ORIENTAÇÃO DA PEÇA INTEIRA
                if (numero === 6) {
                    if (pecaEhHorizontal) {
                        // Peça Horizontal (na mesa): Suas metades (esquerda/direita) são ALTAS.
                         currentLayout = layout6Vertical; // 3 Linhas, 2 Colunas
                    } else {
                        // Peça Vertical (na mão): Suas metades (cima/baixo) são LARGAS.
                         currentLayout = layout6Horizontal; // 2 Linhas, 3 Colunas
                    }
                }

                // 5. Desenha os pontos usando os multiplicadores e espaçamentos calculados
                ctx.fillStyle = COR_DOT;
                currentLayout.forEach(([multX, multY]) => {
                    const posX = centroX + multX * espacoX; // Usa espaçamento calculado
                    const posY = centroY + multY * espacoY;
                    ctx.beginPath();
                    ctx.arc(posX, posY, raioDot, 0, Math.PI * 2);
                    ctx.fill();
                });
            }


            contemPontoMao(clickX, clickY, pecaPosX, pecaPosY) {
                // Peças na mão são sempre verticais
                return clickX >= pecaPosX && clickX <= pecaPosX + pecaLarguraV &&
                       clickY >= pecaPosY && clickY <= pecaPosY + pecaAlturaV;
            }

            get valorTotal() { return this.l1 + this.l2; }
            get ehDoble() { return this.l1 === this.l2; }
        }

        // --- Funções UI ---

        function ajustarTamanhoPosicoes() {
            // 1. Ajustar tamanho do Canvas (feito via CSS aspect-ratio e window resize)
            CANVAS_LARGURA = canvas.width;
            CANVAS_ALTURA = canvas.height;
            areaTotalRect = { x: 0, y: 0, largura: CANVAS_LARGURA, altura: CANVAS_ALTURA };
            CENTRO_X = CANVAS_LARGURA / 2;
            CENTRO_Y = CANVAS_ALTURA / 2;

            // 2. Calcular Escala e Tamanhos Base Escalados
            // Escala baseada na altura para garantir que o layout vertical caiba
            escalaDesenho = CANVAS_ALTURA / 720; // Baseado em altura 720p
            margemGeralInterface = 10 * escalaDesenho;

            pecaLarguraH = PECA_LARGURA_BASE * escalaDesenho * 1.1; // Um pouco menor que antes
            pecaAlturaH = PECA_ALTURA_BASE * escalaDesenho * 1.1;
            pecaLarguraV = pecaAlturaH; // Vertical = Horizontal 'de pé'
            pecaAlturaV = pecaLarguraH;
            dotRaio = DOT_RAIO_BASE * escalaDesenho;
            cantoRaio = CANTO_RAIO_BASE * escalaDesenho;
            espacoMesaEscalado = ESPACO_ENTRE_PECAS_MESA_BASE * escalaDesenho;
            espacoMaoEscalado = ESPACO_ENTRE_PECAS_MAO_BASE * escalaDesenho;
            margemLateralMesaEscalada = MARGEM_BORDA_LATERAL_BASE * escalaDesenho;
            margemVerticalMesaEscalada = MARGEM_BORDA_VERTICAL_BASE * escalaDesenho;
            tamanhoFonteBase = 16 * escalaDesenho;

            // 3. Definir Layout das Áreas Principais (IA, Mesa, Jogador)
            const alturaAreaStatus = 35 * escalaDesenho;
            const alturaAreaIA = pecaAlturaV * 0.8 + 2 * margemGeralInterface; // Altura para peça verso + margens
            const alturaAreaJogador = pecaAlturaV * 1.1 + 3 * margemGeralInterface; // Altura para peça + botão + margens
            const alturaAreaMesa = CANVAS_ALTURA - alturaAreaIA - alturaAreaJogador - alturaAreaStatus - (2 * margemGeralInterface); // Espaço restante

            areaIARect = {
                x: 0,
                y: 0,
                largura: CANVAS_LARGURA,
                altura: alturaAreaIA
            };
            areaMesaRect = {
                x: 0,
                y: areaIARect.y + areaIARect.altura + margemGeralInterface,
                largura: CANVAS_LARGURA,
                altura: alturaAreaMesa
            };
             areaJogadorRect = {
                x: 0,
                y: areaMesaRect.y + areaMesaRect.altura + margemGeralInterface,
                largura: CANVAS_LARGURA,
                altura: alturaAreaJogador
            };
             areaStatusRect = {
                x: 0,
                y: areaJogadorRect.y + areaJogadorRect.altura, // Colado abaixo do jogador
                largura: CANVAS_LARGURA,
                altura: alturaAreaStatus
            };

             // 4. Definir Áreas Secundárias (Monte, Botão)
             const larguraAreaMonte = pecaLarguraV + 80 * escalaDesenho; // Largura da peça V + texto
             const alturaAreaMonte = pecaAlturaV + 20 * escalaDesenho;
             areaMonteRect = {
                 x: margemGeralInterface * 2, // Canto esquerdo da área do jogador
                 y: areaJogadorRect.y + (areaJogadorRect.altura - alturaAreaMonte) / 2, // Centralizado verticalmente na área do jogador
                 largura: larguraAreaMonte,
                 altura: alturaAreaMonte
             };

             const larguraBotaoPassar = 110 * escalaDesenho;
             const alturaBotaoPassar = 40 * escalaDesenho;
             const paddingBotao = 10 * escalaDesenho;
             areaBotaoPassarRect = {
                 x: areaJogadorRect.largura - larguraBotaoPassar - paddingBotao - margemGeralInterface, // Canto direito da área do jogador
                 y: areaJogadorRect.y + paddingBotao, // Próximo ao topo da área do jogador
                 largura: larguraBotaoPassar,
                 altura: alturaBotaoPassar
             };

             // 5. Definir Centro e Limites da Mesa (para desenho das peças)
             centroMesaX = areaMesaRect.x + areaMesaRect.largura / 2;
             centroMesaY = areaMesaRect.y + areaMesaRect.altura / 2;
             limiteSuperiorMesa = areaMesaRect.y + margemVerticalMesaEscalada;
             // Ajustar limite inferior/direito para colisão antes de sobrepor totalmente
             limiteInferiorMesa = areaMesaRect.y + areaMesaRect.altura - margemVerticalMesaEscalada - pecaAlturaH * 0.8;
             limiteEsquerdoMesa = areaMesaRect.x + margemLateralMesaEscalada;
             limiteDireitoMesa = areaMesaRect.x + areaMesaRect.largura - margemLateralMesaEscalada - pecaLarguraH * 0.8;
        }

        // Desenha os fundos das áreas principais
        function desenharFundosAreas() {
            ctx.fillStyle = COR_FUNDO_CANVAS;
            ctx.fillRect(areaTotalRect.x, areaTotalRect.y, areaTotalRect.largura, areaTotalRect.altura);

            ctx.fillStyle = COR_FUNDO_AREA_IA;
            ctx.fillRect(areaIARect.x, areaIARect.y, areaIARect.largura, areaIARect.altura);

            ctx.fillStyle = COR_FUNDO_MESA;
            ctx.fillRect(areaMesaRect.x, areaMesaRect.y, areaMesaRect.largura, areaMesaRect.altura);

            ctx.fillStyle = COR_FUNDO_AREA_JOGADOR;
            ctx.fillRect(areaJogadorRect.x, areaJogadorRect.y, areaJogadorRect.largura, areaJogadorRect.altura);

            // Bordas sutis (opcional)
            ctx.strokeStyle = COR_BORDA_AREA;
            ctx.lineWidth = 1;
            ctx.strokeRect(areaIARect.x, areaIARect.y, areaIARect.largura, areaIARect.altura);
            ctx.strokeRect(areaMesaRect.x, areaMesaRect.y, areaMesaRect.largura, areaMesaRect.altura);
            ctx.strokeRect(areaJogadorRect.x, areaJogadorRect.y, areaJogadorRect.largura, areaJogadorRect.altura);
        }

        // Desenha apenas a área da IA (Topo)
        function desenharAreaIA() {
             if (!areaIARect) return;

             // Texto IA
             ctx.fillStyle = COR_TEXTO_UI;
             ctx.font = `bold ${tamanhoFonteBase * 0.9}px sans-serif`;
             ctx.textAlign = 'left';
             ctx.textBaseline = 'middle';
             const textoIA = `IA (${maoIA.length} peças)`;
             const textoIAX = areaIARect.x + margemGeralInterface * 2;
             const textoIAY = areaIARect.y + areaIARect.altura / 2;
             ctx.fillText(textoIA, textoIAX, textoIAY);

             // Peças da IA (Verso ou Frente no Fim)
             let startXIA = textoIAX + ctx.measureText(textoIA).width + 2 * margemGeralInterface;
             const pecaYIA = areaIARect.y + (areaIARect.altura - pecaAlturaV) / 2; // Centraliza peça V verticalmente

             for (let i = 0; i < maoIA.length; i++) {
                 const pecaX = startXIA + i * (pecaLarguraV + espacoMaoEscalado);
                 // Não desenha peças que ultrapassam a área
                 if (pecaX + pecaLarguraV > areaIARect.x + areaIARect.largura - margemGeralInterface * 2) break;

                 if (jogoAcabou) {
                     // Passa os lados l1 e l2 da peça da IA para desenharFrente
                     maoIA[i].desenharFrente(pecaX, pecaYIA, maoIA[i].l1, maoIA[i].l2, 'vertical');
                 } else {
                     maoIA[i].desenharVerso(pecaX, pecaYIA, 'vertical');
                 }
             }
        }

        // Desenha apenas a área do Jogador (Base)
        function desenharAreaJogador() {
             if (!areaJogadorRect) return;

             // Peças do Jogador (Sempre Verticais)
             const larguraTotalMao = maoJogador.length * (pecaLarguraV + espacoMaoEscalado) - espacoMaoEscalado;
             // Tenta centralizar, mas respeita a área do Monte à esquerda
             let startXJogador = areaJogadorRect.x + (areaJogadorRect.largura - larguraTotalMao) / 2;
             startXJogador = Math.max(startXJogador, areaMonteRect.x + areaMonteRect.largura + margemGeralInterface);

             // Garante que não saia pela direita (considerando a última peça)
             const limiteDireitoMao = areaJogadorRect.x + areaJogadorRect.largura - margemGeralInterface * 2;


             // Calcula Y para centralizar verticalmente na área do jogador
             const pecaYJogador = areaJogadorRect.y + (areaJogadorRect.altura - pecaAlturaV) / 2;

             maoJogador.forEach((peca, i) => {
                 const pecaX = startXJogador + i * (pecaLarguraV + espacoMaoEscalado);
                 // Só desenha se a peça começar antes do limite direito
                 if (pecaX < limiteDireitoMao) {
                     // Corta o desenho se a peça ultrapassar o limite (evita overflow visual)
                     let drawWidth = pecaLarguraV;
                     if (pecaX + drawWidth > limiteDireitoMao) {
                         // Isso exigiria clipping ou não desenhar, mais simples não desenhar parcialmente por enquanto
                         // Não desenha peças que não cabem inteiramente para simplificar
                         if (pecaX + pecaLarguraV <= limiteDireitoMao) {
                           // Desenha normal
                         } else {
                             return; // Pula o desenho desta peça e das seguintes
                         }
                     }

                     const jogavel = isPecaJogavel(peca) && jogadorPodeInteragir && !jogoAcabou;
                     const selecionada = (i === pecaSelecionada);
                     // Passa os lados l1 e l2 da peça do jogador para desenharFrente
                     peca.desenharFrente(pecaX, pecaYJogador, peca.l1, peca.l2, 'vertical', selecionada, jogavel);

                    nextY = yAnterior + altAnterior + espacoMesaEscalado;

                 mostrarBotaoPassar=false;
                 if(!verificarFimDeJogo()){proximoTurno(quem);}
                 else{desenharJogo();}
             } else {
                 // Primeira jogada
                 turnoAtual=(jogadorQueIniciou===JOGADOR)?IA:JOGADOR;
                 atualizarStatus();
                 desenharJogo();
                 if(turnoAtual===IA){
                     jogadorPodeInteragir=false;
                     setTimeout(jogarTurnoIA,DELAY_IA);
                 } else {
                     jogadorPodeInteragir=true;
                     atualizarCursor();
                     if(!podeJogarAlgumaPeca(maoJogador)){
                         mostrarBotaoPassar=(monte.length===0);
                         atualizarStatus(monte.length>0?"Vez:Compre.":"Vez:Passe.");
                     }
                     desenharJogo();
                 }
             }
            return true;
        }


        function realizarCompra(quem){if(jogoAcabou||monte.length===0)return false;const m=(quem===JOGADOR)?maoJogador:maoIA;if(quem===JOGADOR&&podeJogarAlgumaPeca(m)){atualizarStatus("Voce pode jogar! Nao precisa comprar.");desenharJogo();return false;}const nP=monte.pop();m.push(nP);passesConsecutivos=0;if(quem===JOGADOR){pecaSelecionada=null;if(!podeJogarAlgumaPeca(maoJogador)){mostrarBotaoPassar=(monte.length===0);atualizarStatus(monte.length>0?"Comprou. Compre ou Passe.":"Comprou. Sem jogada. Passe.");}else{mostrarBotaoPassar=false;atualizarStatus("Comprou. Agora jogue.");}desenharJogo();}return true;} // Ajuste na msg "Compre ou Passe"
        function passarVez(){if(jogoAcabou||turnoAtual!==JOGADOR||!mostrarBotaoPassar)return;passesConsecutivos++;atualizarStatus(`Voce passou a vez.`);mostrarBotaoPassar=false;pecaSelecionada=null;desenharJogo();if(!verificarFimDeJogo()){proximoTurno(JOGADOR);}}
        function proximoTurno(quemJogou){if(jogoAcabou)return;turnoAtual=(quemJogou===JOGADOR)?IA:JOGADOR;atualizarStatus();desenharJogo();if(turnoAtual===IA){jogadorPodeInteragir=false;atualizarCursor();setTimeout(jogarTurnoIA,DELAY_IA);}else{jogadorPodeInteragir=true;if(!podeJogarAlgumaPeca(maoJogador)){mostrarBotaoPassar=(monte.length===0);atualizarStatus(monte.length>0?"Sua Vez: Compre uma peça.":"Sua Vez: Passe a vez.");}else{mostrarBotaoPassar=false;atualizarStatus(); /* Define msg padrão */}desenharJogo();atualizarCursor();}}
        function verificarFimDeJogo(){let fim=false;let msg="";let pJ=0,pI=0;if(maoJogador.length===0){msg="Você Bateu!\nVenceu!";fim=true;}else if(maoIA.length===0){msg="IA Bateu!\nIA Venceu!";fim=true;}else if(passesConsecutivos>=2||(!podeJogarAlgumaPeca(maoJogador)&&!podeJogarAlgumaPeca(maoIA)&&monte.length===0)){pJ=maoJogador.reduce((s,p)=>s+p.valorTotal,0);pI=maoIA.reduce((s,p)=>s+p.valorTotal,0);msg="Jogo Bloqueado!\n";if(pJ<pI)msg+=`Você venceu por pontos (${pJ} vs ${pI})`;else if(pI<pJ)msg+=`IA venceu por pontos (${pI} vs ${pJ})`;else msg+=`Empate (${pJ} pontos cada)`;fim=true;} if(fim){msg+="\n\nClique para jogar novamente.";mensagemFimJogo=msg;atualizarStatus("Fim de Jogo.",true);return true;} return false;}
        function jogarTurnoIA(){if(jogoAcabou||turnoAtual!==IA)return;atualizarStatus("IA pensando...");desenharJogo();let mj=null;let mV=-1;for(let i=0;i<maoIA.length;i++){const pO=maoIA[i];const vO=pO.ehDoble?100+Math.min(pO.l1,pO.l2):pO.valorTotal;const eD=checarEncaixe(pO,'direita');if(eD.valida&&vO>mV){mV=vO;mj={indice:i,lado:'direita'};}const eE=checarEncaixe(pO,'esquerda');if(eE.valida&&vO>=mV){mV=vO;mj={indice:i,lado:'esquerda'};}} if(mj){const pId=maoIA[mj.indice].id;atualizarStatus(`IA jogando ${pId}...`);desenharJogo();setTimeout(()=>{realizarJogada(IA,mj.indice,mj.lado);},DELAY_IA/2);}else{if(monte.length>0){atualizarStatus("IA comprando...");desenharJogo();setTimeout(()=>{if(realizarCompra(IA))setTimeout(jogarTurnoIA,DELAY_IA/2);else{console.error("IA falhou compra.");passesConsecutivos++;atualizarStatus("IA passou(erro).");desenharJogo();if(!verificarFimDeJogo())proximoTurno(IA);}},DELAY_IA/3);}else{passesConsecutivos++;atualizarStatus("IA passou.");desenharJogo();if(!verificarFimDeJogo())proximoTurno(IA);}}}

        // --- Eventos & Inicialização ---

        function getMousePos(el,evt){const r=el.getBoundingClientRect();const sX=el.width/r.width;const sY=el.height/r.height;return{x:(evt.clientX-r.left)*sX,y:(evt.clientY-r.top)*sY};}
        function isDentro(p,r){return r&&p&&r.largura>0&&r.altura>0&&p.x>=r.x&&p.x<=r.x+r.largura&&p.y>=r.y&&p.y<=r.y+r.altura;}

        function verificarHover(e){
            if(jogoAcabou){
                if(!canvas.classList.contains('clicavel')) canvas.classList.add('clicavel');
                 if(canvas.classList.contains('esperando')) canvas.classList.remove('esperando');
                hoverBotaoPassar=false; return;
            }
            if(!jogadorPodeInteragir){
                hoverBotaoPassar=false;
                if(canvas.classList.contains('clicavel')) canvas.classList.remove('clicavel');
                if(!canvas.classList.contains('esperando')) canvas.classList.add('esperando');
                return;
            }
             if(canvas.classList.contains('esperando')) canvas.classList.remove('esperando');

            const p=getMousePos(canvas,e);
            let cC=false; // Cursor Clicavel
            let hB=false; // Hover Botao

            // Botão Passar
            if(mostrarBotaoPassar&&areaBotaoPassarRect&&isDentro(p,areaBotaoPassarRect)){cC=true;hB=true;}
            // Monte para Comprar
            if(!podeJogarAlgumaPeca(maoJogador)&&monte.length>0&&areaClicarMonte&&isDentro(p,areaClicarMonte)){cC=true;}

            // Peças na Mão Jogador
             const larguraTotalMao = maoJogador.length * (pecaLarguraV + espacoMaoEscalado) - espacoMaoEscalado;
             let startXJogador = areaJogadorRect.x + (areaJogadorRect.largura - larguraTotalMao) / 2;
             startXJogador = Math.max(startXJogador, areaMonteRect.x + areaMonteRect.largura + margemGeralInterface);
             const pecaYJogador = areaJogadorRect.y + (areaJogadorRect.altura - pecaAlturaV) / 2;
             const limiteDireitoMao = areaJogadorRect.x + areaJogadorRect.largura - margemGeralInterface * 2;

             for(let i=0; i<maoJogador.length; i++){
                 const pX = startXJogador + i * (pecaLarguraV + espacoMaoEscalado);
                 if(pX + pecaLarguraV < limiteDireitoMao){
                     if(maoJogador[i] && isPecaJogavel(maoJogador[i]) && maoJogador[i].contemPontoMao(p.x,p.y,pX,pecaYJogador)){
                        cC = true;
                        break;
                     }
                 }
             }

             // Áreas de Jogada na Mesa
             if(pecaSelecionada!==null){
                if(areaJogarEsquerda.ativa&&isDentro(p,areaJogarEsquerda)) cC=true;
                if(areaJogarDireita.ativa&&isDentro(p,areaJogarDireita)) cC=true;
             }

             // Atualiza hover do botão e cursor
             if(hB!==hoverBotaoPassar){hoverBotaoPassar=hB;desenharJogo();}
             if(cC&&!canvas.classList.contains('clicavel')) canvas.classList.add('clicavel');
             else if(!cC&&canvas.classList.contains('clicavel')) canvas.classList.remove('clicavel');
        }

        function atualizarCursor(){
             if(jogoAcabou){
                canvas.classList.remove('esperando'); canvas.classList.add('clicavel');
             } else if (!jogadorPodeInteragir || turnoAtual===IA){
                 canvas.classList.add('esperando'); canvas.classList.remove('clicavel');
             } else {
                 canvas.classList.remove('esperando');
                 // 'clicavel' é tratado pelo verificarHover
             }
        }

        function atualizarStatus(nMsg=null,fim=false){
            jogoAcabou=fim;
            jogadorPodeInteragir=(turnoAtual===JOGADOR&&!jogoAcabou);
            if(nMsg&&!fim){mensagemStatus=nMsg;}
            else if(!jogoAcabou){
                if(turnoAtual===JOGADOR){
                    if(!podeJogarAlgumaPeca(maoJogador)){
                        mensagemStatus=monte.length>0?"Sua Vez: Compre uma peça.":"Sua Vez: Passe a vez.";
                    }else{
                        mensagemStatus=pecaSelecionada===null?"Sua Vez: Escolha uma peça.":"Sua Vez: Escolha onde jogar.";
                    }
                }else{
                    if(!mensagemStatus||!mensagemStatus.toLowerCase().includes("ia")) mensagemStatus="Vez da IA...";
                }
            } else if(fim&&nMsg){mensagemStatus=nMsg;}
            mostrarBotaoPassar=(jogadorPodeInteragir&&!podeJogarAlgumaPeca(maoJogador)&&monte.length===0&&!jogoAcabou);
            atualizarCursor();
        }

        function handleMouseClick(e){
            if(jogoAcabou){iniciarJogo();return;}
            if(!jogadorPodeInteragir)return;
            const pos=getMousePos(canvas,e);

            // 1. Botão Passar
            if(mostrarBotaoPassar&&areaBotaoPassarRect&&isDentro(pos,areaBotaoPassarRect)){passarVez();return;}
            // 2. Comprar Peça
            if(!podeJogarAlgumaPeca(maoJogador)&&monte.length>0&&areaClicarMonte&&isDentro(pos,areaClicarMonte)){realizarCompra(JOGADOR);return;}

            // 3. Jogar Peça Selecionada
            if(pecaSelecionada!==null){
                const pSO=maoJogador[pecaSelecionada];
                if(pSO){
                    let jogou=false;
                    if(areaJogarEsquerda.ativa&&isDentro(pos,areaJogarEsquerda)&&checarEncaixe(pSO,'esquerda').valida) jogou=realizarJogada(JOGADOR,pecaSelecionada,'esquerda');
                    else if(areaJogarDireita.ativa&&isDentro(pos,areaJogarDireita)&&checarEncaixe(pSO,'direita').valida) jogou=realizarJogada(JOGADOR,pecaSelecionada,'direita');

                    if(jogou) return; // Jogada feita, encerra clique

                    // Se clicou fora das áreas de jogar, deseleciona
                    pecaSelecionada=null;
                    atualizarStatus();
                    desenharJogo();
                    // Não retorna ainda, pode ter clicado em outra peça
                } else {
                     pecaSelecionada=null; console.warn("Peca selecionada invalida ao clicar?");
                     atualizarStatus(); desenharJogo();
                     // Continua para checar clique em outra peça
                }
            }

            // 4. Selecionar/Deselecionar Peça na Mão
            let idxClicado=-1;
            const larguraTotalMao = maoJogador.length * (pecaLarguraV + espacoMaoEscalado) - espacoMaoEscalado;
            let startXJogador = areaJogadorRect.x + (areaJogadorRect.largura - larguraTotalMao) / 2;
            startXJogador = Math.max(startXJogador, areaMonteRect.x + areaMonteRect.largura + margemGeralInterface);
            const pecaYJogador = areaJogadorRect.y + (areaJogadorRect.altura - pecaAlturaV) / 2;
            const limiteDireitoMao = areaJogadorRect.x + areaJogadorRect.largura - margemGeralInterface * 2;

            for(let i=0; i<maoJogador.length; i++){
                 const pX = startXJogador + i * (pecaLarguraV + espacoMaoEscalado);
                 if(pX + pecaLarguraV < limiteDireitoMao){ // Somente peças visíveis
                    if(maoJogador[i] && maoJogador[i].contemPontoMao(pos.x,pos.y,pX,pecaYJogador)){
                        idxClicado=i;
                        break;
                    }
                 }
            }

            if(idxClicado!==-1){
                const pC=maoJogador[idxClicado];
                if(isPecaJogavel(pC)){
                    pecaSelecionada=(pecaSelecionada===idxClicado)?null:idxClicado;
                    atualizarStatus();
                    desenharJogo();
                }else{
                    pecaSelecionada=null; // Garante deseleção se não for jogável
                    atualizarStatus("Esta peça não pode ser jogada agora.");
                    desenharJogo();
                }
                return; // Ação do clique na mão concluída
            }

            // 5. Clicou em área não interativa (e não estava jogando peça)
            // Se tinha peça selecionada, já foi deselecionada no passo 3.
            // Se não clicou em nada interativo, não faz nada.
        }


        // Ajusta o tamanho do canvas para preencher a janela mantendo a proporção
        function ajustarCanvasProporcionalmente() {
            const margemBody = 20; // Espaço total nas laterais/topo/baixo do body
            const viewportWidth = window.innerWidth - margemBody;
            const viewportHeight = window.innerHeight - margemBody;
            const aspectRatio = 20 / 11; // Proporção do layout (W/H)

            let novoLargura = viewportWidth;
            let novoAltura = novoLargura / aspectRatio;

            if (novoAltura > viewportHeight) {
                novoAltura = viewportHeight;
                novoLargura = novoAltura * aspectRatio;
            }

            const minWidth = 700; // Aumentar mínimo para layout
            const minHeight = minWidth / aspectRatio;

            // Aplica ao canvas e força re-render se necessário
            if (canvas.width !== Math.round(novoLargura) || canvas.height !== Math.round(novoAltura)) {
                canvas.width = Math.max(minWidth, Math.round(novoLargura));
                canvas.height = Math.max(minHeight, Math.round(novoAltura));
                 console.log(`Canvas resized: ${canvas.width}x${canvas.height}`);
                 return true; // Indica que houve mudança
            }
            return false; // Sem mudança
        }

        // Função de inicialização/reinício
        function iniciarJogo() {
            console.log("--- Iniciando Dominó Minimalista v6.1 ---");
            ajustarCanvasProporcionalmente(); // Ajusta tamanho do canvas
            ajustarTamanhoPosicoes();    // Calcula posições e escalas

            distribuirPecas(); // Cria, embaralha e distribui

            const infoInicio = determinarPrimeiroJogadorEPeca();
            if (!infoInicio || infoInicio.indicePeca < 0 ||
               (infoInicio.jogador === JOGADOR && infoInicio.indicePeca >= maoJogador.length) ||
               (infoInicio.jogador === IA && infoInicio.indicePeca >= maoIA.length) ) {
                 console.error("Erro crítico ao determinar jogador inicial ou peça.", infoInicio);
                 alert("Erro ao iniciar o jogo. Verifique o console.");
                 return;
            }


            jogadorQueIniciou = infoInicio.jogador;
            turnoAtual = jogadorQueIniciou;

            let maoInicial = (turnoAtual === JOGADOR) ? maoJogador : maoIA;
            let pecaInicialOriginal = null;
            if (infoInicio.indicePeca >= 0 && infoInicio.indicePeca < maoInicial.length) {
                 pecaInicialOriginal = maoInicial.splice(infoInicio.indicePeca, 1)[0];
            } else {
                 console.warn(`Índice inicial inválido (${infoInicio.indicePeca}), usando a primeira peça.`);
                 if (maoInicial.length > 0) pecaInicialOriginal = maoInicial.splice(0, 1)[0];
                 else { alert("Mão inicial vazia!"); return; }
            }

            if (pecaInicialOriginal) {
                const idInicial = pecaInicialOriginal.id;
                console.log(`Primeiro: ${turnoAtual} com ${idInicial}`);
                atualizarStatus(`Início. ${turnoAtual === JOGADOR ? 'Você' : 'IA'} começa com ${idInicial}.`);
                pecaSelecionada = null;
                jogoAcabou = false;
                jogadorPodeInteragir = false;

                // Delay para primeira jogada
                setTimeout(() => {
                    realizarJogada(null, pecaInicialOriginal, null); // null indica primeira jogada
                }, 300);

            } else {
                alert("Erro: Não foi possível obter a peça inicial.");
            }
        }

        // --- Listeners ---
        canvas.addEventListener('click', handleMouseClick);
        canvas.addEventListener('mousemove', verificarHover);
        window.addEventListener('resize', () => {
            console.log("Window resized.");
             if(ajustarCanvasProporcionalmente()) { // Se o tamanho mudou
                 console.log("Canvas size changed, restarting game...");
                 iniciarJogo();
             } else {
                 // Se o tamanho não mudou, apenas recalcula posições e redesenha
                 ajustarTamanhoPosicoes();
                 desenharJogo();
             }
        });
        window.onload = iniciarJogo;

    </script>
