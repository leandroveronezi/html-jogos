<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominó Minimalista v6.6 - Múltiplas IAs</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e0e0e0;
            /* Fundo canvas claro */
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        canvas {
            border: 1px solid #bdbdbd;
            /* Borda cinza claro */
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            /* Sombra mais suave */
            display: block;
            cursor: default;
            max-width: 100%;
            max-height: calc(100vh - 20px);
            aspect-ratio: 20 / 11;
            background-color: #f0f0f0;
            /* Fundo interno do canvas um pouco diferente */
            border-radius: 4px;
        }

        canvas.esperando {
            cursor: wait;
        }

        canvas.clicavel {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Constantes ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- CONFIGURAÇÃO DO JOGO ---
        const NUM_IA_PLAYERS = 2; // Quantos oponentes IA (1, 2 ou 3)
        // ---------------------------

        const JOGADOR_HUMANO = 'jogador';
        const JOGADOR_IA = 'ia';
        const TOTAL_PLAYERS = 1 + NUM_IA_PLAYERS; // Total de jogadores na partida
        const PECAS_POR_JOGADOR = 7;

        const PECA_LARGURA_BASE = 60;
        const PECA_ALTURA_BASE = 30;
        const DOT_RAIO_BASE = 3.2;
        const CANTO_RAIO_BASE = 4;
        const DELAY_IA = 750;
        const ESPACO_ENTRE_PECAS_MESA_BASE = 5;
        const ESPACO_ENTRE_PECAS_MAO_BASE = 7;
        const MARGEM_BORDA_LATERAL_BASE = 25;
        const MARGEM_BORDA_VERTICAL_BASE = 25;
        const FATOR_LIMITE_COLISAO = 0.98;

        // Cores (Fundo da Mesa Verde Fixo)
        const COR_FUNDO_CANVAS = '#e0e0e0';
        const COR_FUNDO_MESA = '#00695c'; // Verde Feltro Fixo
        const COR_FUNDO_AREA_IA = '#f5f5f5';
        const COR_FUNDO_AREA_JOGADOR = '#f5f5f5';
        const COR_FUNDO_AREA_MONTE = '#eeeeee';
        const COR_BORDA_AREA = 'rgba(0, 0, 0, 0.15)';
        const COR_PECA = '#fafafa';
        const COR_PECA_VERSO = '#455a64';
        const COR_DOT = '#111111';
        const COR_LINHA_PECA = '#bdbdbd';
        const COR_TEXTO_UI = '#424242';
        const COR_TEXTO_STATUS = '#212121';
        const COR_DESTAQUE_SELECAO = '#ff8f00';
        const COR_DESTAQUE_JOGAVEL_FILL = 'rgba(255, 143, 0, 0.1)';
        const COR_DESTAQUE_JOGAVEL_STROKE = '#ff8f00';
        const COR_DESTAQUE_COMPRA_STROKE = '#f57c00';
        const COR_BOTAO_PASSAR_FILL = '#9e9e9e';
        const COR_BOTAO_PASSAR_TEXT = '#ffffff';
        const COR_BOTAO_PASSAR_HOVER_FILL = '#757575';
        const COR_DESTAQUE_JOGAVEL_HAND = '#ff8f00';
        const COR_OVERLAY_FIM = 'rgba(255, 255, 255, 0.85)';
        const COR_TEXTO_FIM = '#000000';

        // --- Variáveis Globais ---
        let CANVAS_LARGURA;
        let CANVAS_ALTURA;
        let CENTRO_X;
        let CENTRO_Y;
        let escalaDesenho = 1;
        let tamanhoFonteBase;
        let pecaLarguraH;
        let pecaAlturaH;
        let pecaLarguraV;
        let pecaAlturaV;
        let dotRaio;
        let cantoRaio;
        let espacoMesaEscalado;
        let espacoMaoEscalado;
        let margemLateralMesaEscalada;
        let margemVerticalMesaEscalada;
        let margemGeralInterface = 12;

        // Áreas Retangulares Layout
        let areaTotalRect = {};
        let areaIARect = {};
        let areaMesaRect = {};
        let areaJogadorRect = {};
        let areaMonteRect = {};
        let areaStatusRect = {};
        let areaBotaoPassarRect = {};

        let centroMesaX;
        let centroMesaY;
        let limiteSuperiorMesa;
        let limiteInferiorMesa;
        let limiteEsquerdoMesa;
        let limiteDireitoMesa;

        let areaJogarEsquerda = { ativa: false };
        let areaJogarDireita = { ativa: false };
        let areaClicarMonte = {};

        // Estado do Jogo
        let todasAsPecas = [];
        let jogadores = []; // Array para guardar info de cada jogador { tipo, id (para IA), mao }
        let monte = [];
        let mesa = [];
        let pontas = { esquerda: null, direita: null };
        let pecaSelecionada = null; // Índice da peça na mão do jogador humano (jogadores[0].mao)
        let mensagemStatus = "";
        let mensagemFimJogo = "";
        let jogoAcabou = false;
        let indiceJogadorAtual = 0; // Índice do jogador atual no array 'jogadores'
        let jogadorPodeInteragir = false; // Se o jogador humano (índice 0) pode clicar
        let passesConsecutivos = 0;
        let mostrarBotaoPassar = false;
        let hoverBotaoPassar = false;
        let jogadorQueIniciou = null; // Guarda o índice de quem iniciou

        // --- Classe Peca ---
        class Peca {
            constructor(lado1, lado2) {
                this.l1 = lado1;
                this.l2 = lado2;
                const vA = Math.min(lado1, lado2);
                const vB = Math.max(lado1, lado2);
                this.id = `${vA}-${vB}`;
            }

            desenharCorpo(x, y, w, h, bg, border, highlight = null) {
                const r = cantoRaio;
                ctx.fillStyle = bg;
                ctx.strokeStyle = highlight ?? border;
                ctx.lineWidth = (highlight) ? 2.5 * escalaDesenho : 1.5 * escalaDesenho;
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            desenharFrente(x, y, ladoAVisivel, ladoBVisivel, orientacao = 'horizontal', selecionada = false, jogavel = false) {
                const ehHorizontal = (orientacao === 'horizontal');
                const w = ehHorizontal ? pecaLarguraH : pecaLarguraV;
                const h = ehHorizontal ? pecaAlturaH : pecaAlturaV;
                let corDestaque = null;
                if (selecionada) { corDestaque = COR_DESTAQUE_SELECAO; }
                else if (jogavel) { corDestaque = COR_DESTAQUE_JOGAVEL_HAND; }
                this.desenharCorpo(x, y, w, h, COR_PECA, COR_LINHA_PECA, corDestaque);
                ctx.strokeStyle = COR_LINHA_PECA;
                ctx.lineWidth = 1.5 * escalaDesenho;
                ctx.beginPath();
                if (ehHorizontal) {
                    ctx.moveTo(x + w / 2, y + 3 * escalaDesenho);
                    ctx.lineTo(x + w / 2, y + h - 3 * escalaDesenho);
                }
                else {
                    ctx.moveTo(x + 3 * escalaDesenho, y + h / 2);
                    ctx.lineTo(x + w - 3 * escalaDesenho, y + h / 2);
                }
                ctx.stroke();
                this.desenharDots(ladoAVisivel, x, y, w, h, ehHorizontal ? 'esquerda' : 'cima', orientacao);
                this.desenharDots(ladoBVisivel, x, y, w, h, ehHorizontal ? 'direita' : 'baixo', orientacao);
            }

            desenharVerso(x, y, orientacao = 'vertical') {
                const ehHorizontal = (orientacao === 'horizontal');
                const w = ehHorizontal ? pecaLarguraH : pecaLarguraV;
                const h = ehHorizontal ? pecaAlturaH : pecaAlturaV;
                this.desenharCorpo(x, y, w, h, COR_PECA_VERSO, '#607d8b'); // Borda um pouco mais clara no verso
                ctx.fillStyle = '#78909c'; // Pino cinza azulado mais claro
                ctx.beginPath();
                ctx.arc(x + w / 2, y + h / 2, dotRaio * 1.1, 0, Math.PI * 2);
                ctx.fill();
            }

            desenharDots(numero, pecaX, pecaY, larguraPeca, alturaPeca, qualMetade, orientacaoPeca) {
                if (numero < 0 || numero > 6) return;
                let halfX, halfY, halfW, halfH;
                const pecaEhHorizontal = (orientacaoPeca === 'horizontal');
                if (pecaEhHorizontal) {
                    if (qualMetade === 'esquerda') {
                        halfX = pecaX; halfY = pecaY; halfW = larguraPeca / 2; halfH = alturaPeca;
                    }
                    else {
                        halfX = pecaX + larguraPeca / 2; halfY = pecaY; halfW = larguraPeca / 2; halfH = alturaPeca;
                    }
                } else {
                    if (qualMetade === 'cima') {
                        halfX = pecaX; halfY = pecaY; halfW = larguraPeca; halfH = alturaPeca / 2;
                    }
                    else {
                        halfX = pecaX; halfY = pecaY + alturaPeca / 2; halfW = larguraPeca; halfH = alturaPeca / 2;
                    }
                }
                const centroX = halfX + halfW / 2;
                const centroY = halfY + halfH / 2;
                const paddingRelativo = 0.28;
                const espacoXMax = (halfW / 2) * (1 - paddingRelativo);
                const espacoYMax = (halfH / 2) * (1 - paddingRelativo);
                const espacoXBase = halfW / 3.8;
                const espacoYBase = halfH / 3.8;
                const minEspacoAbs = dotRaio * 1.8;
                const espacoX = Math.min(espacoXMax, Math.max(espacoXBase, minEspacoAbs));
                const espacoY = Math.min(espacoYMax, Math.max(espacoYBase, minEspacoAbs));

                const MULT_BORDA = 0.9;
                const MULT_MEDIO = 0.85;

                const dotLayouts = [
                    [], // 0
                    [[0, 0]], // 1
                    [[-MULT_BORDA, -MULT_BORDA], [MULT_BORDA, MULT_BORDA]], // 2
                    [[-MULT_BORDA, -MULT_BORDA], [0, 0], [MULT_BORDA, MULT_BORDA]], // 3
                    [[-MULT_BORDA, -MULT_BORDA], [MULT_BORDA, -MULT_BORDA], [-MULT_BORDA, MULT_BORDA], [MULT_BORDA, MULT_BORDA]], // 4
                    [[-MULT_BORDA, -MULT_BORDA], [MULT_BORDA, -MULT_BORDA], [0, 0], [-MULT_BORDA, MULT_BORDA], [MULT_BORDA, MULT_BORDA]], // 5
                ];
                const layout6HorizontalDots = [
                    [-MULT_BORDA, -MULT_MEDIO], [0, -MULT_MEDIO], [MULT_BORDA, -MULT_MEDIO],
                    [-MULT_BORDA, MULT_MEDIO], [0, MULT_MEDIO], [MULT_BORDA, MULT_MEDIO]
                ];
                const layout6VerticalDots = [
                    [-MULT_MEDIO, -MULT_BORDA], [MULT_MEDIO, -MULT_BORDA],
                    [-MULT_MEDIO, 0], [MULT_MEDIO, 0],
                    [-MULT_MEDIO, MULT_BORDA], [MULT_MEDIO, MULT_BORDA]
                ];
                let currentLayout = dotLayouts[numero] || [];
                if (numero === 6) {
                    currentLayout = pecaEhHorizontal ? layout6HorizontalDots : layout6VerticalDots;
                }

                ctx.fillStyle = COR_DOT;
                currentLayout.forEach(([multX, multY]) => {
                    const posX = centroX + multX * espacoX;
                    const posY = centroY + multY * espacoY;
                    ctx.beginPath();
                    ctx.arc(posX, posY, dotRaio, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            contemPontoMao(clickX, clickY, pecaPosX, pecaPosY) {
                return clickX >= pecaPosX && clickX <= pecaPosX + pecaLarguraV &&
                    clickY >= pecaPosY && clickY <= pecaPosY + pecaAlturaV;
            }
            get valorTotal() {
                return this.l1 + this.l2;
            }
            get ehDoble() {
                return this.l1 === this.l2;
            }
        }

        // --- Funções UI ---

        function ajustarTamanhoPosicoes() {
            CANVAS_LARGURA = canvas.width;
            CANVAS_ALTURA = canvas.height;
            areaTotalRect = { x: 0, y: 0, largura: CANVAS_LARGURA, altura: CANVAS_ALTURA };
            CENTRO_X = CANVAS_LARGURA / 2;
            CENTRO_Y = CANVAS_ALTURA / 2;
            escalaDesenho = CANVAS_ALTURA / 720;
            margemGeralInterface = 12 * escalaDesenho;
            pecaLarguraH = PECA_LARGURA_BASE * escalaDesenho * 1.05;
            pecaAlturaH = PECA_ALTURA_BASE * escalaDesenho * 1.05;
            pecaLarguraV = pecaAlturaH;
            pecaAlturaV = pecaLarguraH;
            dotRaio = DOT_RAIO_BASE * escalaDesenho;
            cantoRaio = CANTO_RAIO_BASE * escalaDesenho;
            espacoMesaEscalado = ESPACO_ENTRE_PECAS_MESA_BASE * escalaDesenho;
            espacoMaoEscalado = ESPACO_ENTRE_PECAS_MAO_BASE * escalaDesenho;
            margemLateralMesaEscalada = MARGEM_BORDA_LATERAL_BASE * escalaDesenho;
            margemVerticalMesaEscalada = MARGEM_BORDA_VERTICAL_BASE * escalaDesenho;
            tamanhoFonteBase = 17 * escalaDesenho;

            // Ajustar altura da área IA/Oponentes se necessário (pode ser fixa por enquanto)
            const alturaAreaStatus = 40 * escalaDesenho;
            const alturaAreaIA = pecaAlturaV * 0.85 + 2 * margemGeralInterface; // Mantém altura fixa por simplicidade
            const alturaAreaJogador = pecaAlturaV * 1.15 + 3 * margemGeralInterface;
            const alturaAreaMesa = CANVAS_ALTURA - alturaAreaIA - alturaAreaJogador - alturaAreaStatus - (2 * margemGeralInterface);
            areaIARect = { x: 0, y: 0, largura: CANVAS_LARGURA, altura: alturaAreaIA };
            areaMesaRect = { x: 0, y: areaIARect.y + areaIARect.altura + margemGeralInterface, largura: CANVAS_LARGURA, altura: alturaAreaMesa };
            areaJogadorRect = { x: 0, y: areaMesaRect.y + areaMesaRect.altura + margemGeralInterface, largura: CANVAS_LARGURA, altura: alturaAreaJogador };
            areaStatusRect = { x: 0, y: areaJogadorRect.y + areaJogadorRect.altura, largura: CANVAS_LARGURA, altura: alturaAreaStatus };
            const larguraAreaMonte = pecaLarguraV + 90 * escalaDesenho;
            const alturaAreaMonte = pecaAlturaV + 25 * escalaDesenho;
            areaMonteRect = { x: margemGeralInterface * 2.5, y: areaJogadorRect.y + (areaJogadorRect.altura - alturaAreaMonte) / 2, largura: larguraAreaMonte, altura: alturaAreaMonte };
            const larguraBotaoPassar = 120 * escalaDesenho;
            const alturaBotaoPassar = 45 * escalaDesenho;
            const paddingBotaoY = 12 * escalaDesenho;
            const paddingBotaoX = 15 * escalaDesenho;
            areaBotaoPassarRect = { x: areaJogadorRect.largura - larguraBotaoPassar - paddingBotaoX - margemGeralInterface, y: areaJogadorRect.y + paddingBotaoY, largura: larguraBotaoPassar, altura: alturaBotaoPassar };

            centroMesaX = areaMesaRect.x + areaMesaRect.largura / 2;
            centroMesaY = areaMesaRect.y + areaMesaRect.altura / 2;
            limiteSuperiorMesa = areaMesaRect.y + margemVerticalMesaEscalada;
            limiteEsquerdoMesa = areaMesaRect.x + margemLateralMesaEscalada;
            limiteInferiorMesa = areaMesaRect.y + areaMesaRect.altura - margemVerticalMesaEscalada - pecaAlturaH;
            limiteDireitoMesa = areaMesaRect.x + areaMesaRect.largura - margemLateralMesaEscalada - pecaLarguraH;
        }

        function desenharFundosAreas() {
            ctx.fillStyle = COR_FUNDO_CANVAS;
            ctx.fillRect(areaTotalRect.x, areaTotalRect.y, areaTotalRect.largura, areaTotalRect.altura);
            ctx.fillStyle = COR_FUNDO_AREA_IA;
            ctx.fillRect(areaIARect.x, areaIARect.y, areaIARect.largura, areaIARect.altura);
            ctx.fillStyle = COR_FUNDO_MESA; // Cor verde fixa
            ctx.fillRect(areaMesaRect.x, areaMesaRect.y, areaMesaRect.largura, areaMesaRect.altura);
            ctx.fillStyle = COR_FUNDO_AREA_JOGADOR;
            ctx.fillRect(areaJogadorRect.x, areaJogadorRect.y, areaJogadorRect.largura, areaJogadorRect.altura);
            ctx.strokeStyle = COR_BORDA_AREA;
            ctx.lineWidth = 1;
            ctx.strokeRect(areaIARect.x + 0.5, areaIARect.y + 0.5, areaIARect.largura - 1, areaIARect.altura - 1);
            ctx.strokeRect(areaMesaRect.x + 0.5, areaMesaRect.y + 0.5, areaMesaRect.largura - 1, areaMesaRect.altura - 1);
            ctx.strokeRect(areaJogadorRect.x + 0.5, areaJogadorRect.y + 0.5, areaJogadorRect.largura - 1, areaJogadorRect.altura - 1);
        }

        function desenharAreaIA() { // Agora desenha informações dos oponentes
            if (!areaIARect || jogadores.length <= 1) return;
            ctx.fillStyle = COR_TEXTO_UI;
            ctx.font = `bold ${tamanhoFonteBase * 0.85}px 'Segoe UI', Tahoma, sans-serif`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';

            let textoOponentes = "";
            let pecasDesenhadas = 0;
            const maxPecasVisuais = 7; // Mostrar no máximo N versos
            const espacoEntreTextos = 25 * escalaDesenho;
            let xAtual = areaIARect.x + margemGeralInterface * 2.5;
            const yTexto = areaIARect.y + areaIARect.altura / 2 - (tamanhoFonteBase * 0.5); // Ajuste Y para texto
            const yPecas = areaIARect.y + (areaIARect.altura - pecaAlturaV) / 2;

            for (let i = 1; i < jogadores.length; i++) { // Começa do índice 1 (primeira IA)
                const oponente = jogadores[i];
                const nomeOponente = `IA ${oponente.id}`;
                const contagemPecas = `(${oponente.mao.length} peças)`;
                const textoCompleto = `${nomeOponente} ${contagemPecas}`;

                // Desenha Texto
                if (xAtual + ctx.measureText(textoCompleto).width < areaIARect.largura - margemGeralInterface * 2.5) {
                    ctx.fillStyle = COR_TEXTO_UI;
                    ctx.fillText(textoCompleto, xAtual, yTexto);
                    xAtual += ctx.measureText(textoCompleto).width + espacoEntreTextos;
                } else {
                    break; // Não cabe mais texto
                }

                // Desenha Versos (apenas se o jogo não acabou)
                if (!jogoAcabou) {
                    const numVersosMostrar = Math.min(oponente.mao.length, maxPecasVisuais - pecasDesenhadas);
                    for (let p = 0; p < numVersosMostrar; p++) {
                        const pecaX = xAtual;
                        if (pecaX + pecaLarguraV < areaIARect.largura - margemGeralInterface * 2.5) {
                            oponente.mao[p].desenharVerso(pecaX, yPecas, 'vertical');
                            xAtual += pecaLarguraV + espacoMaoEscalado * 0.5; // Menor espaço entre versos
                            pecasDesenhadas++;
                        } else {
                            break; // Não cabe mais peça visual
                        }
                    }
                    xAtual += espacoEntreTextos * 0.8; // Espaço após as peças de um IA
                } else { // Se jogo acabou, mostra as mãos das IAs
                    const numFrentesMostrar = oponente.mao.length;
                    for (let p = 0; p < numFrentesMostrar; p++) {
                        const pecaX = xAtual;
                        if (pecaX + pecaLarguraV < areaIARect.largura - margemGeralInterface * 2.5) {
                            oponente.mao[p].desenharFrente(pecaX, yPecas, oponente.mao[p].l1, oponente.mao[p].l2, 'vertical');
                            xAtual += pecaLarguraV + espacoMaoEscalado * 0.5;
                            pecasDesenhadas++;
                        } else {
                            break;
                        }
                    }
                    xAtual += espacoEntreTextos * 0.8;
                }

                if (pecasDesenhadas >= maxPecasVisuais && !jogoAcabou) break; // Limite de versos
            }
        }

        function desenharAreaJogador() {
            if (!areaJogadorRect || !areaMonteRect || jogadores.length === 0) return;
            const maoHumano = jogadores[0].mao; // Acessa a mão do jogador humano
            const larguraTotalMao = maoHumano.length * (pecaLarguraV + espacoMaoEscalado) - espacoMaoEscalado;
            let startXJogador = areaJogadorRect.x + (areaJogadorRect.largura - larguraTotalMao) / 2;
            startXJogador = Math.max(startXJogador, areaMonteRect.x + areaMonteRect.largura + margemGeralInterface * 1.5);
            const limiteDireitoMao = areaJogadorRect.x + areaJogadorRect.largura - margemGeralInterface * 2;
            const pecaYJogador = areaJogadorRect.y + (areaJogadorRect.altura - pecaAlturaV) / 2;

            maoHumano.forEach((peca, i) => {
                const pecaX = startXJogador + i * (pecaLarguraV + espacoMaoEscalado);
                if (pecaX < limiteDireitoMao) {
                    if (pecaX + pecaLarguraV <= limiteDireitoMao + 5) {
                        const jogavel = isPecaJogavel(peca) && jogadorPodeInteragir && !jogoAcabou;
                        const selecionada = (i === pecaSelecionada);
                        peca.desenharFrente(pecaX, pecaYJogador, peca.l1, peca.l2, 'vertical', selecionada, jogavel);
                    }
                }
            });
        }

        function desenharMonte() {
            if (!areaMonteRect || jogadores.length === 0) return;
            const maoHumano = jogadores[0].mao;
            const r = 5 * escalaDesenho;
            ctx.fillStyle = COR_FUNDO_AREA_MONTE;
            ctx.strokeStyle = COR_BORDA_AREA;
            ctx.lineWidth = 1;
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(areaMonteRect.x, areaMonteRect.y, areaMonteRect.largura, areaMonteRect.altura, r);
            } else {
                ctx.rect(areaMonteRect.x, areaMonteRect.y, areaMonteRect.largura, areaMonteRect.altura);
            }
            ctx.fill();
            ctx.stroke();
            const paddingInterno = 12 * escalaDesenho;
            const montePecaX = areaMonteRect.x + paddingInterno;
            const montePecaY = areaMonteRect.y + (areaMonteRect.altura - pecaAlturaV) / 2;
            areaClicarMonte = { x: montePecaX, y: montePecaY, largura: pecaLarguraV, altura: pecaAlturaV };
            const textoMonteX = montePecaX + pecaLarguraV + paddingInterno * 0.8;
            const textoMonteY = areaMonteRect.y + areaMonteRect.altura / 2;
            ctx.fillStyle = COR_TEXTO_UI;
            ctx.font = `${tamanhoFonteBase * 0.85}px 'Segoe UI', Tahoma, sans-serif`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            if (monte.length > 0) {
                (new Peca(0, 0)).desenharVerso(montePecaX, montePecaY, 'vertical');
                ctx.fillText(`Monte: ${monte.length}`, textoMonteX, textoMonteY);
                const jogadorDeveComprar = jogadorPodeInteragir && !podeJogarAlgumaPeca(maoHumano) && !jogoAcabou;
                if (jogadorDeveComprar) {
                    ctx.strokeStyle = COR_DESTAQUE_COMPRA_STROKE;
                    ctx.lineWidth = 3 * escalaDesenho;
                    (new Peca(0, 0)).desenharCorpo(montePecaX, montePecaY, pecaLarguraV, pecaAlturaV, 'transparent', COR_DESTAQUE_COMPRA_STROKE, COR_DESTAQUE_COMPRA_STROKE);
                }
            } else {
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.lineWidth = 1.5 * escalaDesenho;
                ctx.setLineDash([4 * escalaDesenho, 3 * escalaDesenho]);
                (new Peca(0, 0)).desenharCorpo(montePecaX, montePecaY, pecaLarguraV, pecaAlturaV, 'transparent', ctx.strokeStyle, null);
                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillText("Vazio", textoMonteX, textoMonteY);
            }
        }

        function desenharMesa() {
            if (mesa.length === 0) {
                areaJogarEsquerda = { ativa: false };
                areaJogarDireita = { ativa: false };
                return;
            }
            const indiceMeio = Math.floor(mesa.length / 2);
            const { pecaVisual: pecaMeioVisual } = mesa[indiceMeio];
            const xInicial = centroMesaX - pecaLarguraH / 2;
            const yInicial = centroMesaY - pecaAlturaH / 2;
            pecaMeioVisual.desenharFrente(xInicial, yInicial, pecaMeioVisual.l1, pecaMeioVisual.l2, 'horizontal');
            let infoPontaEsquerda = { x: xInicial, y: yInicial, direcaoVisual: 'esquerda' };
            let infoPontaDireita = { x: xInicial, y: yInicial, direcaoVisual: 'direita' };

            // Desenhar Esquerda
            let xAtualEsq = xInicial;
            let yAtualEsq = yInicial;
            let direcaoVisualEsq = 'esquerda';
            for (let i = indiceMeio - 1; i >= 0; i--) {
                const { pecaVisual: pecaAtualVisual } = mesa[i];
                const largAnterior = (i + 1 === indiceMeio) ? pecaLarguraH : ((mesa[i + 1].direcaoVisual === 'esquerda' || mesa[i + 1].direcaoVisual === 'direita') ? pecaLarguraH : pecaLarguraV);
                const altAnterior = (i + 1 === indiceMeio) ? pecaAlturaH : ((mesa[i + 1].direcaoVisual === 'esquerda' || mesa[i + 1].direcaoVisual === 'direita') ? pecaAlturaH : pecaAlturaV);
                let { x: nextX, y: nextY, novaOrientacao } = calcularPosicaoProximaPeca(xAtualEsq, yAtualEsq, largAnterior, altAnterior, direcaoVisualEsq, pecaAtualVisual);
                let mudouDirecao = false;

                // Lógica de colisão e virada (simplificada para teste)
                if (direcaoVisualEsq === 'esquerda' && nextX < limiteEsquerdoMesa) {
                    direcaoVisualEsq = (yAtualEsq < centroMesaY) ? 'baixo' : 'cima'; mudouDirecao = true;
                } else if (direcaoVisualEsq === 'cima' && nextY < limiteSuperiorMesa) {
                    direcaoVisualEsq = 'direita'; mudouDirecao = true;
                } else if (direcaoVisualEsq === 'baixo' && nextY + (novaOrientacao === 'vertical' ? pecaAlturaV : pecaAlturaH) > limiteInferiorMesa + (novaOrientacao === 'vertical' ? pecaAlturaV : pecaAlturaH)) {
                    direcaoVisualEsq = 'direita'; mudouDirecao = true;
                }

                if (mudouDirecao) {
                    ({ x: nextX, y: nextY, novaOrientacao } = calcularPosicaoProximaPeca(xAtualEsq, yAtualEsq, largAnterior, altAnterior, direcaoVisualEsq, pecaAtualVisual));
                }
                pecaAtualVisual.desenharFrente(nextX, nextY, pecaAtualVisual.l1, pecaAtualVisual.l2, novaOrientacao);
                mesa[i].direcaoVisual = direcaoVisualEsq; // Guarda a direção para o próximo cálculo
                mesa[i].orientacao = novaOrientacao; // Guarda orientação

                xAtualEsq = nextX; yAtualEsq = nextY;
                if (i === 0) { infoPontaEsquerda = { x: xAtualEsq, y: yAtualEsq, direcaoVisual: direcaoVisualEsq, orientacao: novaOrientacao }; }
            }

            // Desenhar Direita (similar à esquerda, ajustar lógica de cálculo e colisão)
            let xAtualDir = xInicial;
            let yAtualDir = yInicial;
            let direcaoVisualDir = 'direita';
            for (let i = indiceMeio + 1; i < mesa.length; i++) {
                const { pecaVisual: pecaAtualVisual } = mesa[i];
                const largAnterior = (i - 1 === indiceMeio) ? pecaLarguraH : ((mesa[i - 1].direcaoVisual === 'esquerda' || mesa[i - 1].direcaoVisual === 'direita') ? pecaLarguraH : pecaLarguraV);
                const altAnterior = (i - 1 === indiceMeio) ? pecaAlturaH : ((mesa[i - 1].direcaoVisual === 'esquerda' || mesa[i - 1].direcaoVisual === 'direita') ? pecaAlturaH : pecaAlturaV);
                let { x: nextX, y: nextY, novaOrientacao } = calcularPosicaoProximaPeca(xAtualDir, yAtualDir, largAnterior, altAnterior, direcaoVisualDir, pecaAtualVisual);
                let mudouDirecao = false;

                if (direcaoVisualDir === 'direita' && nextX + (novaOrientacao === 'horizontal' ? pecaLarguraH : pecaLarguraV) > limiteDireitoMesa + (novaOrientacao === 'horizontal' ? pecaLarguraH : pecaLarguraV)) {
                    direcaoVisualDir = (yAtualDir < centroMesaY) ? 'baixo' : 'cima'; mudouDirecao = true;
                } else if (direcaoVisualDir === 'cima' && nextY < limiteSuperiorMesa) {
                    direcaoVisualDir = 'esquerda'; mudouDirecao = true;
                } else if (direcaoVisualDir === 'baixo' && nextY + (novaOrientacao === 'vertical' ? pecaAlturaV : pecaAlturaH) > limiteInferiorMesa + (novaOrientacao === 'vertical' ? pecaAlturaV : pecaAlturaH)) {
                    direcaoVisualDir = 'esquerda'; mudouDirecao = true;
                }

                if (mudouDirecao) {
                    ({ x: nextX, y: nextY, novaOrientacao } = calcularPosicaoProximaPeca(xAtualDir, yAtualDir, largAnterior, altAnterior, direcaoVisualDir, pecaAtualVisual));
                }
                pecaAtualVisual.desenharFrente(nextX, nextY, pecaAtualVisual.l1, pecaAtualVisual.l2, novaOrientacao);
                mesa[i].direcaoVisual = direcaoVisualDir; // Guarda a direção
                mesa[i].orientacao = novaOrientacao; // Guarda orientação

                xAtualDir = nextX; yAtualDir = nextY;
                if (i === mesa.length - 1) { infoPontaDireita = { x: xAtualDir, y: yAtualDir, direcaoVisual: direcaoVisualDir, orientacao: novaOrientacao }; }
            }

            // Desenhar Áreas Clicáveis (considera pontas com orientações variadas)
            areaJogarEsquerda = { ativa: false };
            areaJogarDireita = { ativa: false };
            if (pecaSelecionada !== null && jogadorPodeInteragir && !jogoAcabou) {
                const pecaDaMao = jogadores[0].mao[pecaSelecionada];
                if (pecaDaMao) {
                    const encaixeEsquerda = checarEncaixe(pecaDaMao, 'esquerda');
                    const encaixeDireita = checarEncaixe(pecaDaMao, 'direita');
                    const tamanhoAreaClick = Math.min(pecaLarguraH, pecaAlturaH) * 0.8;
                    const margemAreaClick = 8 * escalaDesenho;
                    const desenharArea = (infoPonta, ladoLogico) => {
                        if (!infoPonta) return null;
                        const { x: pX, y: pY, direcaoVisual: dV, orientacao: pOrient } = infoPonta;
                        const pW = (pOrient === 'horizontal') ? pecaLarguraH : pecaLarguraV;
                        const pH = (pOrient === 'horizontal') ? pecaAlturaH : pecaAlturaV;
                        let areaX, areaY;
                        // Ajustar cálculo da posição da área clicável baseado na direção E orientação da ponta
                        switch (dV) {
                            case 'esquerda': areaX = pX - tamanhoAreaClick - margemAreaClick; areaY = pY + pH / 2 - tamanhoAreaClick / 2; break;
                            case 'direita': areaX = pX + pW + margemAreaClick; areaY = pY + pH / 2 - tamanhoAreaClick / 2; break;
                            case 'cima': areaX = pX + pW / 2 - tamanhoAreaClick / 2; areaY = pY - tamanhoAreaClick - margemAreaClick; break;
                            case 'baixo': areaX = pX + pW / 2 - tamanhoAreaClick / 2; areaY = pY + pH + margemAreaClick; break;
                            default: return null;
                        }
                        const areaRect = { x: areaX, y: areaY, largura: tamanhoAreaClick, altura: tamanhoAreaClick, ativa: true };
                        ctx.fillStyle = COR_DESTAQUE_JOGAVEL_FILL;
                        ctx.strokeStyle = COR_DESTAQUE_JOGAVEL_STROKE;
                        ctx.lineWidth = 2.5 * escalaDesenho; ctx.beginPath();
                        if (ctx.roundRect) ctx.roundRect(areaX, areaY, tamanhoAreaClick, tamanhoAreaClick, 5 * escalaDesenho);
                        else ctx.rect(areaX, areaY, tamanhoAreaClick, tamanhoAreaClick);
                        ctx.fill(); ctx.stroke(); return areaRect;
                    };
                    if (encaixeEsquerda.valida) { const rect = desenharArea(infoPontaEsquerda, 'esquerda'); if (rect) areaJogarEsquerda = rect; }
                    if (encaixeDireita.valida) { const rect = desenharArea(infoPontaDireita, 'direita'); if (rect) areaJogarDireita = rect; }
                } else { pecaSelecionada = null; }
            }
        }

        // Função ajustada para calcular posição e orientação da próxima peça
        function calcularPosicaoProximaPeca(xAnterior, yAnterior, largAnterior, altAnterior, direcao, pecaNova) {
            let nextX = xAnterior; let nextY = yAnterior;
            const espaco = espacoMesaEscalado;
            let novaOrientacao = 'horizontal'; // Padrão

            // Define a orientação da nova peça baseada na direção e se é doble
            if (direcao === 'cima' || direcao === 'baixo') {
                novaOrientacao = pecaNova.ehDoble ? 'horizontal' : 'vertical';
            } else { // esquerda ou direita
                novaOrientacao = pecaNova.ehDoble ? 'vertical' : 'horizontal';
            }

            const largAtual = (novaOrientacao === 'horizontal') ? pecaLarguraH : pecaLarguraV;
            const altAtual = (novaOrientacao === 'horizontal') ? pecaAlturaH : pecaAlturaV;

            // Calcula a posição baseada na peça anterior e na nova peça
            switch (direcao) {
                case 'esquerda':
                    nextX = xAnterior - largAtual - espaco;
                    nextY = yAnterior + (altAnterior / 2) - (altAtual / 2); // Alinha centros Y
                    break;
                case 'direita':
                    nextX = xAnterior + largAnterior + espaco;
                    nextY = yAnterior + (altAnterior / 2) - (altAtual / 2); // Alinha centros Y
                    break;
                case 'baixo':
                    nextY = yAnterior + altAnterior + espaco;
                    nextX = xAnterior + (largAnterior / 2) - (largAtual / 2); // Alinha centros X
                    break;
                case 'cima':
                    nextY = yAnterior - altAtual - espaco;
                    nextX = xAnterior + (largAnterior / 2) - (largAtual / 2); // Alinha centros X
                    break;
            }
            return { x: nextX, y: nextY, novaOrientacao: novaOrientacao };
        }


        function desenharBotaoPassar() {
            if (!mostrarBotaoPassar || !areaBotaoPassarRect || !jogadorPodeInteragir || jogoAcabou) return;
            ctx.fillStyle = hoverBotaoPassar ? COR_BOTAO_PASSAR_HOVER_FILL : COR_BOTAO_PASSAR_FILL;
            ctx.strokeStyle = COR_BOTAO_PASSAR_HOVER_FILL;
            ctx.lineWidth = 1 * escalaDesenho;
            const raioCanto = 6 * escalaDesenho;
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(areaBotaoPassarRect.x, areaBotaoPassarRect.y, areaBotaoPassarRect.largura, areaBotaoPassarRect.altura, raioCanto);
            } else {
                ctx.rect(areaBotaoPassarRect.x, areaBotaoPassarRect.y, areaBotaoPassarRect.largura, areaBotaoPassarRect.altura);
            }
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = COR_BOTAO_PASSAR_TEXT;
            ctx.font = `bold ${tamanhoFonteBase * 0.9}px 'Segoe UI', Tahoma, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("Passar", areaBotaoPassarRect.x + areaBotaoPassarRect.largura / 2, areaBotaoPassarRect.y + areaBotaoPassarRect.altura / 2 + 1 * escalaDesenho);
        }

        function desenharStatus() {
            if (!areaStatusRect) return;
            ctx.fillStyle = 'rgba(250, 250, 250, 0.7)';
            ctx.fillRect(areaStatusRect.x, areaStatusRect.y, areaStatusRect.largura, areaStatusRect.altura);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(areaStatusRect.x, areaStatusRect.y + 0.5);
            ctx.lineTo(areaStatusRect.x + areaStatusRect.largura, areaStatusRect.y + 0.5);
            ctx.stroke();
            ctx.fillStyle = COR_TEXTO_STATUS;
            ctx.font = `${tamanhoFonteBase * 0.95}px 'Segoe UI', Tahoma, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(mensagemStatus, CENTRO_X, areaStatusRect.y + areaStatusRect.altura / 2 + 1 * escalaDesenho);
        }

        function desenharMensagemFimJogo() {
            if (!jogoAcabou || !mensagemFimJogo) return;
            ctx.save();
            ctx.fillStyle = COR_OVERLAY_FIM;
            ctx.fillRect(0, 0, CANVAS_LARGURA, CANVAS_ALTURA);
            ctx.font = `bold ${tamanhoFonteBase * 2.1}px 'Segoe UI', Tahoma, sans-serif`;
            ctx.fillStyle = COR_TEXTO_FIM;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 6 * escalaDesenho;
            ctx.shadowOffsetX = 1 * escalaDesenho;
            ctx.shadowOffsetY = 1 * escalaDesenho;
            const linhas = mensagemFimJogo.split('\n');
            const alturaLinha = tamanhoFonteBase * 2.6;
            const yInicial = CENTRO_Y - (linhas.length - 1) * alturaLinha / 2;
            linhas.forEach((linha, i) => {
                ctx.fillText(linha, CENTRO_X, yInicial + i * alturaLinha);
            });
            ctx.restore();
        }

        function desenharJogo() {
            ctx.clearRect(0, 0, CANVAS_LARGURA, CANVAS_ALTURA);
            ctx.imageSmoothingEnabled = true;
            desenharFundosAreas();
            desenharAreaIA(); // Mostra oponentes
            desenharMesa();
            desenharMonte();
            desenharAreaJogador(); // Mostra mão do jogador humano
            desenharBotaoPassar();
            desenharStatus();
            desenharMensagemFimJogo();
            atualizarCursor();
        }

        // --- Lógica do Jogo (Funções Core Adaptadas) ---

        function criarTodasAsPecas() {
            todasAsPecas = [];
            for (let i = 0; i <= 6; i++) {
                for (let j = i; j <= 6; j++) {
                    todasAsPecas.push(new Peca(i, j));
                }
            }
        }
        function embaralhar(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
        }
        function distribuirPecas() {
            criarTodasAsPecas();
            embaralhar(todasAsPecas);
            jogadores = []; // Limpa array de jogadores
            monte = [];
            mesa = [];
            pontas = { esquerda: null, direita: null };
            pecaSelecionada = null;
            jogoAcabou = false;
            mensagemFimJogo = "";
            passesConsecutivos = 0;
            indiceJogadorAtual = 0;
            jogadorPodeInteragir = false;
            mostrarBotaoPassar = false;
            jogadorQueIniciou = null;

            // Adiciona jogador humano
            jogadores.push({ tipo: JOGADOR_HUMANO, mao: [] });
            // Adiciona IAs
            for (let i = 0; i < NUM_IA_PLAYERS; i++) {
                jogadores.push({ tipo: JOGADOR_IA, id: i + 1, mao: [] });
            }

            // Distribui peças
            let indicePecaAtual = 0;
            for (let i = 0; i < PECAS_POR_JOGADOR; i++) {
                for (let j = 0; j < TOTAL_PLAYERS; j++) {
                    if (indicePecaAtual < todasAsPecas.length) {
                        jogadores[j].mao.push(todasAsPecas[indicePecaAtual]);
                        indicePecaAtual++;
                    }
                }
            }
            // O resto vai para o monte
            monte = todasAsPecas.slice(indicePecaAtual);
        }

        function determinarPrimeiroJogadorEPeca() {
            let melhorInfo = { indiceJogador: -1, indicePeca: -1, valor: -1 };
            const calcularValor = (p) => p.ehDoble ? 100 + Math.min(p.l1, p.l2) : p.valorTotal;

            for (let i = 0; i < jogadores.length; i++) {
                const maoAtual = jogadores[i].mao;
                for (let j = 0; j < maoAtual.length; j++) {
                    const peca = maoAtual[j];
                    const valor = calcularValor(peca);
                    if (valor > melhorInfo.valor) {
                        melhorInfo = { indiceJogador: i, indicePeca: j, valor: valor };
                    }
                }
            }

            if (melhorInfo.indiceJogador === -1) { // Caso raro/erro
                console.warn("Nenhuma peça encontrada para início? Usando Jogador 0, Peça 0.");
                return { indiceJogador: 0, indicePeca: 0 };
            }
            return { indiceJogador: melhorInfo.indiceJogador, indicePeca: melhorInfo.indicePeca };
        }

        function isPecaJogavel(pMao) { // Recebe a peça, não precisa saber de qual mão
            if (!pMao) return false;
            if (mesa.length === 0) return true;
            const pE = pontas.esquerda;
            const pD = pontas.direita;
            const l1 = pMao.l1;
            const l2 = pMao.l2;
            const cE = (pE !== null) && (l1 === pE || l2 === pE);
            const cD = (pD !== null) && (l1 === pD || l2 === pD);
            return cE || cD;
        }

        // Recebe a mão específica a ser checada
        function podeJogarAlgumaPeca(mao) {
            if (mesa.length === 0) return mao.length > 0;
            for (const p of mao) {
                if (isPecaJogavel(p)) return true;
            }
            return false;
        }

        function checarEncaixe(pMao, lado) {
            if (!pMao || jogoAcabou) return { valida: false, conectaQualLado: null };
            if (mesa.length === 0) return { valida: true, conectaQualLado: 'l1' };
            const vP = (lado === 'esquerda') ? pontas.esquerda : pontas.direita;
            if (vP === null) {
                console.error(`Erro: Tentando encaixar no lado ${lado} mas a ponta lógica é null.`);
                return { valida: false, conectaQualLado: null };
            }
            if (pMao.l1 === vP) return { valida: true, conectaQualLado: 'l1' };
            if (pMao.l2 === vP) return { valida: true, conectaQualLado: 'l2' };
            return { valida: false, conectaQualLado: null };
        }

        // Realiza jogada para um jogador específico (pelo índice)
        function realizarJogada(indiceDoJogador, indiceDaPecaNaMao, lado) {
            if (jogoAcabou && indiceDoJogador !== null) return false; // Null é para jogada inicial

            let jogador, mao, pOrigMao;
            if (indiceDoJogador !== null) { // Jogada normal
                jogador = jogadores[indiceDoJogador];
                mao = jogador.mao;
                pOrigMao = mao?.[indiceDaPecaNaMao];
            } else { // Jogada inicial
                jogador = null; // Não associado a um jogador específico ainda
                mao = null;
                pOrigMao = indiceDaPecaNaMao; // A própria peça é passada
            }

            if (!pOrigMao) {
                console.error(`Peca original invalida para jogada. Jogador ${indiceDoJogador}, Peça ${indiceDaPecaNaMao}`);
                return false;
            }

            const { valida, conectaQualLado } = checarEncaixe(pOrigMao, lado);

            if (!valida && mesa.length > 0) {
                if (jogador?.tipo === JOGADOR_HUMANO) { // Mostra erro só para humano
                    atualizarStatus("Jogada inválida!");
                    pecaSelecionada = null;
                    desenharJogo();
                }
                return false;
            }

            let lCon, lExp;
            if (mesa.length === 0) {
                lCon = pOrigMao.l1; lExp = pOrigMao.l2;
            } else {
                lCon = (conectaQualLado === 'l1') ? pOrigMao.l1 : pOrigMao.l2;
                lExp = (conectaQualLado === 'l1') ? pOrigMao.l2 : pOrigMao.l1;
            }

            // Cria a peça visual (orientação será definida no desenho da mesa)
            let pVis;
            if (lado === 'esquerda') { pVis = new Peca(lExp, lCon); }
            else { pVis = new Peca(lCon, lExp); } // Centro ou Direita

            // Remove da mão (se for jogada normal)
            if (indiceDoJogador !== null && mao && indiceDaPecaNaMao >= 0 && indiceDaPecaNaMao < mao.length) {
                mao.splice(indiceDaPecaNaMao, 1);
            } else if (indiceDoJogador !== null) {
                console.error(`Erro ao remover peça ${indiceDaPecaNaMao} da mão do jogador ${indiceDoJogador}.`);
                return false;
            }

            // Adiciona na mesa e atualiza pontas
            const itemMesa = {
                pecaOriginal: pOrigMao, // Pode ser útil guardar a original
                pecaVisual: pVis,
                jogador: indiceDoJogador // Quem jogou (null para inicial)
                // Orientação e direção serão definidas no desenho
            };
            if (mesa.length === 0) {
                mesa.push(itemMesa);
                pontas.esquerda = pOrigMao.l1; pontas.direita = pOrigMao.l2;
                mesa[0].orientacao = 'horizontal'; // Primeira peça é sempre H
                mesa[0].direcaoVisual = 'direita'; // Define uma direção inicial arbitrária
            } else if (lado === 'esquerda') {
                mesa.unshift(itemMesa);
                pontas.esquerda = lExp;
            } else {
                mesa.push(itemMesa);
                pontas.direita = lExp;
            }

            if (indiceDoJogador !== null) { // Jogada normal
                passesConsecutivos = 0;
                pecaSelecionada = null; // Desseleciona se for humano
                mostrarBotaoPassar = false;
                if (!verificarFimDeJogo()) {
                    proximoTurno(indiceDoJogador); // Passa o turno a partir de quem jogou
                } else {
                    desenharJogo(); // Jogo acabou
                }
            } else { // Jogada inicial
                // O próximo turno é o jogador seguinte ao que iniciou
                indiceJogadorAtual = (jogadorQueIniciou + 1) % TOTAL_PLAYERS;
                atualizarStatus();
                desenharJogo();
                // Verifica se o próximo é IA para iniciar o turno dela
                if (jogadores[indiceJogadorAtual].tipo === JOGADOR_IA) {
                    jogadorPodeInteragir = false;
                    setTimeout(jogarTurnoIA, DELAY_IA);
                } else { // Próximo é humano
                    jogadorPodeInteragir = true;
                    atualizarCursor();
                    if (!podeJogarAlgumaPeca(jogadores[0].mao)) {
                        mostrarBotaoPassar = (monte.length === 0);
                        atualizarStatus(monte.length > 0 ? "Sua Vez: Compre." : "Sua Vez: Passe.");
                    }
                    desenharJogo();
                }
            }
            return true;
        }

        // Realiza compra para um jogador específico
        function realizarCompra(indiceDoJogador) {
            if (jogoAcabou || monte.length === 0) return false;
            const jogador = jogadores[indiceDoJogador];
            const mao = jogador.mao;

            // Impede compra se o jogador pode jogar (apenas para humano)
            if (jogador.tipo === JOGADOR_HUMANO && podeJogarAlgumaPeca(mao)) {
                atualizarStatus("Você pode jogar! Não precisa comprar.");
                desenharJogo();
                return false;
            }

            const nP = monte.pop();
            mao.push(nP);
            passesConsecutivos = 0; // Compra reseta passes

            if (jogador.tipo === JOGADOR_HUMANO) {
                pecaSelecionada = null;
                if (!podeJogarAlgumaPeca(mao)) { // Ainda não pode jogar?
                    mostrarBotaoPassar = (monte.length === 0);
                    atualizarStatus(monte.length > 0 ? "Comprou. Compre ou Passe." : "Comprou. Sem jogada. Passe.");
                } else { // Agora pode jogar
                    mostrarBotaoPassar = false;
                    atualizarStatus("Comprou. Agora jogue.");
                }
                desenharJogo();
            } else {
                // IA comprou, não precisa redesenhar aqui, a lógica da IA continua
            }
            return true;
        }

        // Passar a vez (só para jogador humano, índice 0)
        function passarVez() {
            if (jogoAcabou || indiceJogadorAtual !== 0 || !mostrarBotaoPassar) return;
            passesConsecutivos++;
            atualizarStatus(`Você passou a vez.`);
            mostrarBotaoPassar = false;
            pecaSelecionada = null;
            desenharJogo();
            if (!verificarFimDeJogo()) {
                proximoTurno(0); // Passa o turno a partir do jogador 0
            }
        }

        function proximoTurno(indiceJogadorQueJogou) {
            if (jogoAcabou) return;
            indiceJogadorAtual = (indiceJogadorQueJogou + 1) % TOTAL_PLAYERS;
            atualizarStatus(); // Define mensagem padrão para o novo turno
            desenharJogo(); // Mostra quem é a vez antes do delay da IA

            const jogadorAtual = jogadores[indiceJogadorAtual];
            if (jogadorAtual.tipo === JOGADOR_IA) {
                jogadorPodeInteragir = false;
                atualizarCursor();
                setTimeout(jogarTurnoIA, DELAY_IA); // Chama a IA correspondente
            } else { // Vez do Jogador Humano
                jogadorPodeInteragir = true;
                if (!podeJogarAlgumaPeca(jogadorAtual.mao)) {
                    mostrarBotaoPassar = (monte.length === 0);
                    atualizarStatus(monte.length > 0 ? "Sua Vez: Compre uma peça." : "Sua Vez: Passe a vez.");
                } else {
                    mostrarBotaoPassar = false;
                    // Status já foi atualizado para "Sua vez: Escolha..."
                }
                desenharJogo();
                atualizarCursor();
            }
        }

        function verificarFimDeJogo() {
            let fim = false;
            let msg = "";
            let vencedor = -1; // Índice do vencedor ou -1 para empate/bloqueio

            // 1. Alguém bateu?
            for (let i = 0; i < jogadores.length; i++) {
                if (jogadores[i].mao.length === 0) {
                    fim = true;
                    vencedor = i;
                    const nomeVencedor = (i === 0) ? "Você" : `IA ${jogadores[i].id}`;
                    msg = `${nomeVencedor} Bateu!\n${nomeVencedor} Venceu!`;
                    break;
                }
            }

            // 2. Bloqueio?
            if (!fim) {
                let todosBloqueados = true;
                for (let i = 0; i < jogadores.length; i++) {
                    if (podeJogarAlgumaPeca(jogadores[i].mao)) {
                        todosBloqueados = false;
                        break;
                    }
                }

                if ((todosBloqueados && monte.length === 0) || passesConsecutivos >= TOTAL_PLAYERS) {
                    fim = true;
                    msg = "Jogo Bloqueado!\n";
                    let pontos = jogadores.map(j => j.mao.reduce((s, p) => s + p.valorTotal, 0));
                    let minPontos = Math.min(...pontos);
                    let vencedores = [];
                    for (let i = 0; i < pontos.length; i++) {
                        if (pontos[i] === minPontos) {
                            vencedores.push(i);
                        }
                    }

                    if (vencedores.length === 1) {
                        vencedor = vencedores[0];
                        const nomeVencedor = (vencedor === 0) ? "Você" : `IA ${jogadores[vencedor].id}`;
                        msg += `${nomeVencedor} venceu por pontos (${minPontos} pts)`;
                    } else { // Empate
                        let nomesEmpate = vencedores.map(idx => (idx === 0) ? "Você" : `IA ${jogadores[idx].id}`);
                        msg += `Empate entre ${nomesEmpate.join(' e ')} (${minPontos} pts cada)`;
                        vencedor = -2; // Código para empate
                    }
                }
            }

            if (fim) {
                msg += "\n\nClique para jogar novamente.";
                mensagemFimJogo = msg;
                jogoAcabou = true;
                atualizarStatus("Fim de Jogo.", true);
                return true;
            }
            return false;
        }

        // Lógica da IA (chamada quando indiceJogadorAtual é de uma IA)
        function jogarTurnoIA() {
            const indiceIA = indiceJogadorAtual; // Pega o índice da IA atual
            if (jogoAcabou || jogadores[indiceIA].tipo !== JOGADOR_IA) return;

            const jogadorIA = jogadores[indiceIA];
            const nomeIA = `IA ${jogadorIA.id}`;
            atualizarStatus(`${nomeIA} pensando...`);
            desenharJogo();

            let mj = null; let mV = -1;
            const maoIA = jogadorIA.mao;

            // Lógica de decisão (igual para todas as IAs por enquanto)
            for (let i = 0; i < maoIA.length; i++) {
                const pO = maoIA[i]; const vO = pO.ehDoble ? 100 + Math.min(pO.l1, pO.l2) : pO.valorTotal;
                const eD = checarEncaixe(pO, 'direita'); if (eD.valida && vO > mV) { mV = vO; mj = { indice: i, lado: 'direita' }; }
                const eE = checarEncaixe(pO, 'esquerda'); if (eE.valida && vO >= mV) { mV = vO; mj = { indice: i, lado: 'esquerda' }; }
            }

            if (mj) { // IA tem jogada
                const pId = maoIA[mj.indice].id;
                atualizarStatus(`${nomeIA} jogando ${pId}...`);
                desenharJogo();
                setTimeout(() => { realizarJogada(indiceIA, mj.indice, mj.lado); }, DELAY_IA * 0.6);
            } else { // IA não tem jogada
                if (monte.length > 0) { // Tenta comprar
                    atualizarStatus(`${nomeIA} comprando...`);
                    desenharJogo();
                    setTimeout(() => {
                        if (realizarCompra(indiceIA)) {
                            setTimeout(jogarTurnoIA, DELAY_IA * 0.5); // Tenta jogar de novo após comprar
                        } else {
                            console.error(`${nomeIA} falhou compra.`); passesConsecutivos++;
                            atualizarStatus(`${nomeIA} passou (erro compra).`); desenharJogo();
                            if (!verificarFimDeJogo()) proximoTurno(indiceIA); else desenharJogo();
                        }
                    }, DELAY_IA * 0.4);
                } else { // Monte vazio, IA passa
                    passesConsecutivos++;
                    atualizarStatus(`${nomeIA} passou.`);
                    desenharJogo();
                    // Verifica bloqueio GERAL após o passe da IA
                    let todosBloqueados = true;
                    for (let i = 0; i < jogadores.length; i++) {
                        if (podeJogarAlgumaPeca(jogadores[i].mao)) {
                            todosBloqueados = false;
                            break;
                        }
                    }
                    if (todosBloqueados && monte.length === 0) {
                        console.log(`Fim de jogo detectado após passe de ${nomeIA}: Todos bloqueados.`);
                        verificarFimDeJogo();
                        desenharJogo();
                    } else { // Jogo continua ou já acabou por outra razão
                        if (!verificarFimDeJogo()) {
                            proximoTurno(indiceIA);
                        } else {
                            desenharJogo();
                        }
                    }
                }
            }
        }

        // --- Eventos & Inicialização ---

        function getMousePos(el, evt) {
            const r = el.getBoundingClientRect();
            const sX = el.width / r.width;
            const sY = el.height / r.height;
            return { x: (evt.clientX - r.left) * sX, y: (evt.clientY - r.top) * sY };
        }
        function isDentro(p, r) {
            return r && p && r.largura > 0 && r.altura > 0 &&
                p.x >= r.x && p.x <= r.x + r.largura &&
                p.y >= r.y && p.y <= r.y + r.altura;
        }

        function verificarHover(e) {
            if (jogoAcabou) {
                if (!canvas.classList.contains('clicavel')) canvas.classList.add('clicavel');
                if (canvas.classList.contains('esperando')) canvas.classList.remove('esperando');
                hoverBotaoPassar = false; return;
            }
            // Só verifica hover se for a vez do jogador humano (índice 0)
            if (indiceJogadorAtual !== 0 || !jogadorPodeInteragir) {
                hoverBotaoPassar = false;
                if (canvas.classList.contains('clicavel')) canvas.classList.remove('clicavel');
                if (!canvas.classList.contains('esperando')) canvas.classList.add('esperando');
                return;
            }
            // Vez do humano e pode interagir
            if (canvas.classList.contains('esperando')) canvas.classList.remove('esperando');

            const p = getMousePos(canvas, e);
            const maoHumano = jogadores[0].mao;
            let cC = false; let hB = false;

            if (mostrarBotaoPassar && areaBotaoPassarRect && isDentro(p, areaBotaoPassarRect)) { cC = true; hB = true; }
            if (!podeJogarAlgumaPeca(maoHumano) && monte.length > 0 && areaClicarMonte && isDentro(p, areaClicarMonte)) { cC = true; }

            const larguraTotalMao = maoHumano.length * (pecaLarguraV + espacoMaoEscalado) - espacoMaoEscalado;
            let startXJogador = areaJogadorRect.x + (areaJogadorRect.largura - larguraTotalMao) / 2;
            startXJogador = Math.max(startXJogador, areaMonteRect.x + areaMonteRect.largura + margemGeralInterface * 1.5);
            const pecaYJogador = areaJogadorRect.y + (areaJogadorRect.altura - pecaAlturaV) / 2;
            const limiteDireitoMao = areaJogadorRect.x + areaJogadorRect.largura - margemGeralInterface * 2;
            for (let i = 0; i < maoHumano.length; i++) {
                const pX = startXJogador + i * (pecaLarguraV + espacoMaoEscalado);
                if (pX + pecaLarguraV < limiteDireitoMao + 5) {
                    if (maoHumano[i] && isPecaJogavel(maoHumano[i]) && maoHumano[i].contemPontoMao(p.x, p.y, pX, pecaYJogador)) {
                        cC = true; break;
                    }
                }
            }
            if (pecaSelecionada !== null) {
                if (areaJogarEsquerda.ativa && isDentro(p, areaJogarEsquerda)) cC = true;
                if (areaJogarDireita.ativa && isDentro(p, areaJogarDireita)) cC = true;
            }

            if (hB !== hoverBotaoPassar) { hoverBotaoPassar = hB; desenharJogo(); }
            if (cC && !canvas.classList.contains('clicavel')) canvas.classList.add('clicavel');
            else if (!cC && canvas.classList.contains('clicavel')) canvas.classList.remove('clicavel');
        }

        function atualizarCursor() {
            if (jogoAcabou) {
                canvas.classList.remove('esperando'); canvas.classList.add('clicavel');
            } else if (!jogadorPodeInteragir || indiceJogadorAtual !== 0) { // Espera se não for humano ou não puder interagir
                canvas.classList.add('esperando'); canvas.classList.remove('clicavel');
            } else { // Vez do humano e pode interagir
                canvas.classList.remove('esperando');
                // 'clicavel' é definido pelo hover
            }
        }

        function atualizarStatus(nMsg = null, fim = false) {
            jogadorPodeInteragir = (indiceJogadorAtual === 0 && !jogoAcabou);

            if (nMsg && !fim) {
                mensagemStatus = nMsg;
            } else if (!jogoAcabou) {
                const jogadorAtual = jogadores[indiceJogadorAtual];
                if (jogadorAtual.tipo === JOGADOR_HUMANO) {
                    const maoHumano = jogadorAtual.mao;
                    if (!podeJogarAlgumaPeca(maoHumano)) {
                        mensagemStatus = monte.length > 0 ? "Sua Vez: Compre uma peça." : "Sua Vez: Passe a vez.";
                    } else {
                        mensagemStatus = pecaSelecionada === null ? "Sua Vez: Escolha uma peça." : "Sua Vez: Escolha onde jogar.";
                    }
                } else { // Vez da IA
                    const nomeIA = `IA ${jogadorAtual.id}`;
                    if (!mensagemStatus || !mensagemStatus.includes(nomeIA)) {
                        mensagemStatus = `Vez da ${nomeIA}...`;
                    } // Mantém "pensando" ou "jogando" se já estiver
                }
            } else if (fim && nMsg) {
                mensagemStatus = nMsg;
            }

            mostrarBotaoPassar = (jogadorPodeInteragir && !podeJogarAlgumaPeca(jogadores[0].mao) && monte.length === 0 && !jogoAcabou);
            atualizarCursor();
        }

        function handleMouseClick(e) {
            if (jogoAcabou) { iniciarJogo(); return; }
            // Só processa clique se for a vez do jogador humano (0) e ele puder interagir
            if (indiceJogadorAtual !== 0 || !jogadorPodeInteragir) return;

            const pos = getMousePos(canvas, e);
            const maoHumano = jogadores[0].mao;

            if (mostrarBotaoPassar && areaBotaoPassarRect && isDentro(pos, areaBotaoPassarRect)) { passarVez(); return; }
            if (!podeJogarAlgumaPeca(maoHumano) && monte.length > 0 && areaClicarMonte && isDentro(pos, areaClicarMonte)) { realizarCompra(0); return; } // Compra para jogador 0

            if (pecaSelecionada !== null) {
                const pSO = maoHumano[pecaSelecionada];
                if (pSO) {
                    let jogou = false;
                    if (areaJogarEsquerda.ativa && isDentro(pos, areaJogarEsquerda) && checarEncaixe(pSO, 'esquerda').valida) {
                        jogou = realizarJogada(0, pecaSelecionada, 'esquerda'); // Jogada do humano (0)
                    } else if (areaJogarDireita.ativa && isDentro(pos, areaJogarDireita) && checarEncaixe(pSO, 'direita').valida) {
                        jogou = realizarJogada(0, pecaSelecionada, 'direita'); // Jogada do humano (0)
                    }
                    if (jogou) return;
                    // Se clicou fora das áreas válidas, deseleciona
                    if (!isDentro(pos, areaJogarEsquerda) && !isDentro(pos, areaJogarDireita)) {
                        pecaSelecionada = null;
                        atualizarStatus();
                        desenharJogo();
                    }
                } else { pecaSelecionada = null; console.warn("Peca selecionada invalida?"); atualizarStatus(); desenharJogo(); }
                if (pecaSelecionada !== null && !jogou) return;
            }

            // Clicou na mão?
            let idxClicado = -1;
            const larguraTotalMao = maoHumano.length * (pecaLarguraV + espacoMaoEscalado) - espacoMaoEscalado;
            let startXJogador = areaJogadorRect.x + (areaJogadorRect.largura - larguraTotalMao) / 2;
            startXJogador = Math.max(startXJogador, areaMonteRect.x + areaMonteRect.largura + margemGeralInterface * 1.5);
            const pecaYJogador = areaJogadorRect.y + (areaJogadorRect.altura - pecaAlturaV) / 2;
            const limiteDireitoMao = areaJogadorRect.x + areaJogadorRect.largura - margemGeralInterface * 2;
            for (let i = 0; i < maoHumano.length; i++) {
                const pX = startXJogador + i * (pecaLarguraV + espacoMaoEscalado);
                if (pX + pecaLarguraV < limiteDireitoMao + 5) {
                    if (maoHumano[i] && maoHumano[i].contemPontoMao(pos.x, pos.y, pX, pecaYJogador)) {
                        idxClicado = i; break;
                    }
                }
            }

            if (idxClicado !== -1) {
                const pC = maoHumano[idxClicado];
                if (isPecaJogavel(pC)) {
                    pecaSelecionada = (pecaSelecionada === idxClicado) ? null : idxClicado;
                    atualizarStatus(); desenharJogo();
                } else {
                    pecaSelecionada = null;
                    atualizarStatus("Esta peça não pode ser jogada agora.");
                    desenharJogo();
                }
                return;
            }
        }

        function ajustarCanvasProporcionalmente() {
            const margemBody = 20;
            const viewportWidth = window.innerWidth - margemBody;
            const viewportHeight = window.innerHeight - margemBody;
            const aspectRatio = 20 / 11;
            let novoLargura = viewportWidth;
            let novoAltura = novoLargura / aspectRatio;
            if (novoAltura > viewportHeight) {
                novoAltura = viewportHeight; novoLargura = novoAltura * aspectRatio;
            }
            const minWidth = 750; const minHeight = minWidth / aspectRatio;
            novoLargura = Math.max(minWidth, Math.round(novoLargura));
            novoAltura = Math.max(minHeight, Math.round(novoAltura));
            if (canvas.width !== novoLargura || canvas.height !== novoAltura) {
                canvas.width = novoLargura; canvas.height = novoAltura;
                console.log(`Canvas resized: ${canvas.width}x${canvas.height}`);
                return true;
            } return false;
        }

        function iniciarJogo() {
            console.log(`--- Iniciando Dominó Minimalista v6.6 (${TOTAL_PLAYERS} jogadores) ---`);
            ajustarCanvasProporcionalmente();
            ajustarTamanhoPosicoes();
            distribuirPecas();

            const infoInicio = determinarPrimeiroJogadorEPeca();
            jogadorQueIniciou = infoInicio.indiceJogador;
            indiceJogadorAtual = jogadorQueIniciou; // Quem começa tem o primeiro turno

            let maoInicial = jogadores[jogadorQueIniciou].mao;
            let pecaInicialOriginal = null;

            if (infoInicio.indicePeca >= 0 && infoInicio.indicePeca < maoInicial.length) {
                pecaInicialOriginal = maoInicial.splice(infoInicio.indicePeca, 1)[0];
            } else { // Fallback extremo
                console.error("Erro crítico ao obter peça inicial, usando a primeira da mão inicial.");
                if (maoInicial.length > 0) pecaInicialOriginal = maoInicial.splice(0, 1)[0];
                else { alert("Erro crítico: Mão inicial vazia, não pode iniciar."); return; }
            }

            if (pecaInicialOriginal) {
                const idInicial = pecaInicialOriginal.id;
                const nomeIniciador = (jogadorQueIniciou === 0) ? "Você" : `IA ${jogadores[jogadorQueIniciou].id}`;
                console.log(`Primeiro Jogador: ${nomeIniciador} (Índice ${jogadorQueIniciou}) com a peça ${idInicial}`);
                atualizarStatus(`Início. ${nomeIniciador} começa com ${idInicial}.`);
                pecaSelecionada = null;
                jogoAcabou = false;
                jogadorPodeInteragir = false; // Ninguém interage durante a 1a jogada

                setTimeout(() => {
                    realizarJogada(null, pecaInicialOriginal, null); // Jogada inicial
                }, 400);
            } else {
                alert("Erro: Não foi possível obter a peça inicial para jogar.");
            }
        }

        // --- Listeners ---
        canvas.addEventListener('click', handleMouseClick);
        canvas.addEventListener('mousemove', verificarHover);
        window.addEventListener('resize', () => {
            if (ajustarCanvasProporcionalmente()) {
                iniciarJogo();
            } else {
                ajustarTamanhoPosicoes();
                desenharJogo();
            }
        });
        window.onload = iniciarJogo;

    </script>
