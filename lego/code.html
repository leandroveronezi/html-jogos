<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construtor Lego Avançado v9.2 (Placement por Stud)</title>
    <style>
        /* --- CSS (Sem alterações) --- */
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; background-color: #eee; overflow: hidden; }
        #sidebar { width: 180px; background-color: #e0e0e0; border-right: 1px solid #ccc; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; }
        #sidebar h3 { margin: 0 0 5px 0; font-size: 1em; text-align: center; width: 100%; }
        #category-select { width: 100%; padding: 5px; margin-bottom: 10px; box-sizing: border-box; }
        #palette { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding-right: 5px; }
        .palette-item { width: 95%; min-height: 55px; border: 2px solid #aaa; background-color: #f8f8f8; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; text-align: left; font-size: .8em; position: relative; overflow: hidden; transition: border-color .2s, background-color .2s; padding: 5px; box-sizing: border-box; }
        .palette-item canvas { width: 45px; height: 45px; border: 1px solid #ccc; background-color: #e8f0f8; flex-shrink: 0; margin-right: 8px; }
        .palette-item span { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: normal; }
        .palette-item::before { display: none; }
        .palette-item:hover { border-color: #777; background-color: #fff; }
        .palette-item.selected { border-color: #3498db; border-width: 3px; background-color: #d0e8f8; }
        #main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; overflow: hidden; position: relative; }
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(200, 200, 200, 0.7); display: flex;
            justify-content: center; align-items: center; font-size: 1.2em;
            color: #333; z-index: 10; display: none;
        }
        #controls { padding: 8px; background: #f8f8f8; border-bottom: 1px solid #ccc; width: 100%; box-sizing: border-box; text-align: center; flex-shrink: 0; }
        #controls label, #controls select, #controls button { margin: 0 5px; font-size: .9em; }
        #info { font-size: .85em; margin-top: 3px; color: #555; }
        canvas#gameCanvas { display: block; margin: 10px; background-color: #d0e0f0; cursor: pointer; border: 1px solid #aaa; max-width: calc(100% - 20px); max-height: calc(100% - 20px); box-sizing: border-box; }
    </style>
</head>
<body>
    <!-- HTML Estrutura -->
    <div id="sidebar">
        <h3>Categoria</h3>
        <select id="category-select"></select>
        <h3>Peças</h3>
        <div id="palette"></div>
    </div>

    <div id="main-content">
        <div id="loading-overlay">Carregando definições de peças...</div>
        <div id="controls">
            <label for="color-select">Cor:</label>
            <select id="color-select">
                <option value="#D90000">Vermelho</option><option value="#0050A0">Azul</option><option value="#257A25">Verde</option><option value="#FFCF00">Amarelo</option><option value="#000000">Preto</option><option value="#A0A5A9">Cinza Claro</option><option value="#6B6B6B">Cinza Escuro</option><option value="#FFFFFF">Branco</option><option value="#FFA500">Laranja</option>
            </select>
            <button id="clear-all">Limpar Tudo</button>
            <div id="info">Hover: Preview. Clique Esq: Add. Clique Dir: Remove. Drag Esq: Gira. Roda: Zoom.</div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        // --- Variáveis Globais e Constantes ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        // ... (outras constantes e variáveis globais como antes) ...
        const sidebar = document.getElementById('sidebar');
        const paletteContainer = document.getElementById('palette');
        const categorySelect = document.getElementById('category-select');
        const colorSelect = document.getElementById('color-select');
        const clearAllButton = document.getElementById('clear-all');
        const controlsDiv = document.getElementById('controls');
        const infoDiv = document.getElementById('info');
        const loadingOverlay = document.getElementById('loading-overlay');

        const BRICK_HEIGHT = 1.0;
        const PLATE_HEIGHT = BRICK_HEIGHT / 3.0;
        let pieceDefinitions = {};
        let selectedPieceType = null;

        const blockSize = 20;
        const blockVisualHeightUnit = blockSize * 0.8;
        const studRadiusFactor = 0.3; const studHeightFactor = 0.15;
        const projectionAngle = Math.PI / 6;
        const cosProjectionAngle = Math.cos(projectionAngle);
        const sinProjectionAngle = Math.sin(projectionAngle);
        const gridMaxX = 24; const gridMaxY = 24; const gridMaxZ = 30;

        const SHADING_FACTOR_TOP = 1.0; const SHADING_FACTOR_SIDE_LIGHT = 0.85; const SHADING_FACTOR_SIDE_DARK = 0.65; const SHADING_FACTOR_BOTTOM = 0.5; const SHADING_FACTOR_STUD_TOP = 1.1; const SHADING_FACTOR_STUD_SIDE = 0.75; const SHADING_FACTOR_OUTLINE = 0.4;

        let blocks = {};
        let cameraAngleX = Math.PI / 4;
        let scaleFactor = 1.0;
        const minScaleFactor = 0.2; const maxScaleFactor = 5.0; const zoomStep = 1.1;
        let originX = 0, originY = 0;
        let isDragging = false, isRotating = false;
        let lastMouseX = 0, lastMouseY = 0;
        let previewBlockData = null;
        const previewOpacity = 0.6;


        // --- Funções Auxiliares ---
        function getPieceDefinition(type) {
            const defaultDef = {width:1, depth:1, height:1.0, shape:'brick', category:'Fallback', name:'Fallback 1x1'};
            if (!type || typeof type !== 'string') { /*console.warn(`Tipo inválido: ${type}`);*/ return defaultDef; }
            if (Object.keys(pieceDefinitions).length === 0) { /*console.warn(`Defs não carregadas p/ ${type}`);*/ return defaultDef; }
            const definition = pieceDefinitions[type];
            if (definition && typeof definition.width === 'number') { return definition; }
            else { /*console.warn(`Def não encontrada/inválida p/ ${type}`);*/ const firstKey = Object.keys(pieceDefinitions)[0]; const firstDef = firstKey ? pieceDefinitions[firstKey] : null; return (firstDef && typeof firstDef.width === 'number') ? firstDef : defaultDef; }
        }

        function getBlockKey(x, y, z) { return `${x.toFixed(3)},${y.toFixed(3)},${z.toFixed(3)}`; } // Arredonda para evitar problemas de float

        function getPieceHeight(def) {
             return def.height === 1.0 ? BRICK_HEIGHT : (def.height === 0.333 ? PLATE_HEIGHT : def.height * BRICK_HEIGHT);
        }

        // --- ALTERADO: Verifica se um bloco COBRE a célula (x, y) no nível z ---
        function findBlockCoveringCell(targetX, targetY, targetZ) {
            const checkX = Math.floor(targetX); // Célula da grade
            const checkY = Math.floor(targetY);
            for (const key in blocks) {
                const block = blocks[key];
                const def = getPieceDefinition(block.type);
                const blockHeight = getPieceHeight(def);
                // Verifica se o Z do bloco corresponde e se a célula está dentro dos limites do bloco
                if (Math.abs(block.z - targetZ) < 0.01 &&
                    checkX >= block.x && checkX < block.x + def.width &&
                    checkY >= block.y && checkY < block.y + def.depth) {
                    return block; // Encontrou um bloco que cobre a célula no Z correto
                }
            }
            return null; // Nenhum bloco cobre essa célula nesse Z
        }

        // --- Função auxiliar para obter a pegada de studs de uma peça ---
        function getStudFootprint(blockData) {
            const studs = [];
            const def = getPieceDefinition(blockData.type);
            const blockHeight = getPieceHeight(def);
            for (let dx = 0; dx < def.width; dx++) {
                for (let dy = 0; dy < def.depth; dy++) {
                    // TODO: Ignorar studs em peças complexas (como cantos, arcos) se necessário
                    if (def.shape === 'corner_1x2x2' && dx === 0 && dy === 0) continue;

                    studs.push({
                        x: blockData.x + dx + 0.5, // Centro X do stud
                        y: blockData.y + dy + 0.5, // Centro Y do stud
                        z: blockData.z + blockHeight // Z do topo do stud (superfície)
                    });
                }
            }
            return studs;
        }


        function adjustColor(hexColor, factor, alpha = 1.0) { if (!hexColor) { console.warn("AdjustColor: Cor inválida", hexColor); hexColor = "#FF00FF"; } let r = parseInt(hexColor.slice(1, 3), 16); let g = parseInt(hexColor.slice(3, 5), 16); let b = parseInt(hexColor.slice(5, 7), 16); r = Math.max(0, Math.min(255, Math.round(r * factor))); g = Math.max(0, Math.min(255, Math.round(g * factor))); b = Math.max(0, Math.min(255, Math.round(b * factor))); const clampedAlpha = Math.max(0, Math.min(1, alpha)); return `rgba(${r}, ${g}, ${b}, ${clampedAlpha})`; }
        function hexToRgba(hexColor, alpha = 1.0) { if (!hexColor) { console.warn("HexToRgba: Cor inválida", hexColor); hexColor = "#FF00FF"; } const r = parseInt(hexColor.slice(1, 3), 16); const g = parseInt(hexColor.slice(3, 5), 16); const b = parseInt(hexColor.slice(5, 7), 16); const clampedAlpha = Math.max(0, Math.min(1, alpha)); return `rgba(${r}, ${g}, ${b}, ${clampedAlpha})`; }

        // --- Projeção ---
        function project(x, y, z, currentOriginX, currentOriginY, currentScale, currentAngleX) {
            const scaledX = x * blockSize * currentScale;
            const scaledY = y * blockSize * currentScale;
            const scaledZ = z * blockVisualHeightUnit * currentScale;
            const rotatedY = scaledY * Math.cos(currentAngleX) - scaledZ * Math.sin(currentAngleX);
            // const rotatedZ = scaledY * Math.sin(currentAngleX) + scaledZ * Math.cos(currentAngleX); // Z rotacionado (útil para ordenação Z real)
            const projectedX = scaledX * cosProjectionAngle - rotatedY * sinProjectionAngle;
            const projectedY = scaledX * sinProjectionAngle + rotatedY * cosProjectionAngle;
            // Retorna também o Z original para possível uso em ordenação mais fina
            return { x: currentOriginX + projectedX, y: currentOriginY - projectedY, z_orig: z };
        }
        function projectMain(x, y, z) { return project(x, y, z, originX, originY, scaleFactor, cameraAngleX); }

        // --- Funções Auxiliares para Desenho ---
        function calculateSignedArea(points) { let area = 0; for (let i = 0; i < points.length; i++) { const p1 = points[i]; const p2 = points[(i + 1) % points.length]; area += (p1.x * p2.y - p2.x * p1.y); } return area / 2; }
        // Removido getFaceAverageZ pois a ordenação agora usa outro método

        // --- drawBlock (sem grandes mudanças na lógica interna) ---
        function drawBlock(block, targetCtx, projectionFn, drawStuds = true, baseScale = 1.0, isPreview = false) {
            const def = getPieceDefinition(block.type);
            const baseColor = block.color;
            const baseX = block.x, baseY = block.y, baseZ = block.z;
            const width = def.width, depth = def.depth;
            const height = getPieceHeight(def); // Usa função auxiliar
            let corners = [];
            let faces = [];
            const effectiveOpacity = isPreview ? previewOpacity : 1.0;

            // Define corners and faces (mantendo placeholders como antes)
            switch (def.shape) {
                 // Placeholders como antes... cai para default
                 case 'arch_1x3x1': /*...*/ case 'corner_1x2x2': /*...*/ case 'brick_1x1_round': /*...*/
                 case 'plate_2x2_round': /*...*/ case 'slope_fwd_1x2_45': /*...*/ case 'slope_inv_1x2_45': /*...*/
                 case 'slope_fwd_2x2_45': /*...*/
                 case 'panel': case 'technic_brick': case 'tile': case 'brick': case 'plate':
                 default:
                    corners = [ { x: baseX, y: baseY, z: baseZ }, { x: baseX + width, y: baseY, z: baseZ }, { x: baseX + width, y: baseY + depth, z: baseZ }, { x: baseX, y: baseY + depth, z: baseZ }, { x: baseX, y: baseY, z: baseZ + height }, { x: baseX + width, y: baseY, z: baseZ + height }, { x: baseX + width, y: baseY + depth, z: baseZ + height }, { x: baseX, y: baseY + depth, z: baseZ + height } ];
                    faces = [ { indices: [4, 5, 6, 7], color: adjustColor(baseColor, SHADING_FACTOR_TOP, effectiveOpacity), type: 'top' }, { indices: [0, 3, 2, 1], color: adjustColor(baseColor, SHADING_FACTOR_BOTTOM, effectiveOpacity), type: 'bottom' }, { indices: [0, 1, 5, 4], color: adjustColor(baseColor, SHADING_FACTOR_SIDE_LIGHT, effectiveOpacity), type: 'side' }, { indices: [1, 2, 6, 5], color: adjustColor(baseColor, SHADING_FACTOR_SIDE_LIGHT, effectiveOpacity), type: 'side' }, { indices: [2, 3, 7, 6], color: adjustColor(baseColor, SHADING_FACTOR_SIDE_DARK, effectiveOpacity), type: 'side' }, { indices: [3, 0, 4, 7], color: adjustColor(baseColor, SHADING_FACTOR_SIDE_DARK, effectiveOpacity), type: 'side' } ];
                    break;
            }

            // Projeção, Culling, Ordenação de Faces (sem alteração)
             const projectedCorners = corners.map(corner => projectionFn(corner.x, corner.y, corner.z));
             const visibleFaces = [];
             let faceAvgZ_for_sort = 0; // Para ordenação de blocos
             faces.forEach(face => {
                 const facePoints = face.indices.map(index => projectedCorners[index]);
                 const area = calculateSignedArea(facePoints);
                 if (area < -0.1) { // Culling
                      let avgZ = 0;
                      face.indices.forEach(index => avgZ += corners[index].z);
                      avgZ /= face.indices.length;
                      if (face.type === 'top') faceAvgZ_for_sort = avgZ; // Guarda Z médio do topo para sorteio
                      visibleFaces.push({ points: facePoints, color: face.color, avgZ: avgZ });
                  }
             });
             visibleFaces.sort((a, b) => a.avgZ - b.avgZ); // Ordena faces do bloco

             // Desenho das Faces (sem alteração)
             const outlineColor = adjustColor(baseColor, SHADING_FACTOR_OUTLINE, effectiveOpacity);
             targetCtx.lineWidth = Math.max(0.2, 0.6 * Math.sqrt(baseScale));
             targetCtx.strokeStyle = outlineColor;
             visibleFaces.forEach(face => {
                  targetCtx.fillStyle = face.color;
                  targetCtx.beginPath();
                  targetCtx.moveTo(face.points[0].x, face.points[0].y);
                  for (let i = 1; i < face.points.length; i++) { targetCtx.lineTo(face.points[i].x, face.points[i].y); }
                  targetCtx.closePath();
                  targetCtx.fill();
                  targetCtx.stroke();
              });

             // Desenho dos Studs (sem alteração na lógica interna, mas usa getPieceHeight)
             const shouldDrawStuds = drawStuds && !isPreview && def.shape !== 'tile' && def.shape !== 'technic_brick' && !def.shape.startsWith('slope');
             if (shouldDrawStuds) {
                  const studRadius = blockSize * studRadiusFactor;
                  const studBaseZ = baseZ + height; // Usa altura calculada
                  const studTopZ = studBaseZ + studHeightFactor * BRICK_HEIGHT; // Altura do stud é fixa
                  const studTopColor = adjustColor(baseColor, SHADING_FACTOR_STUD_TOP, effectiveOpacity);
                  const studSideColor = adjustColor(baseColor, SHADING_FACTOR_STUD_SIDE, effectiveOpacity);
                  const studOutlineColor = adjustColor(baseColor, SHADING_FACTOR_OUTLINE, effectiveOpacity);
                  targetCtx.lineWidth = Math.max(0.1, 0.4 * Math.sqrt(baseScale));

                 for (let dx = 0; dx < width; dx++) {
                     for (let dy = 0; dy < depth; dy++) {
                         if (def.shape === 'corner_1x2x2' && dx === 0 && dy === 0) continue;
                         const studCenterX = baseX + dx + 0.5;
                         const studCenterY = baseY + dy + 0.5;
                         const projectedBaseCenter = projectionFn(studCenterX, studCenterY, studBaseZ);
                         const projectedTopCenter = projectionFn(studCenterX, studCenterY, studTopZ);
                         const projectedRadius = Math.max(0.5, studRadius * baseScale * cosProjectionAngle);
                         if (projectedRadius < 0.5) continue;
                         // Desenha base
                         targetCtx.fillStyle = studSideColor; targetCtx.strokeStyle = studOutlineColor; targetCtx.beginPath();
                         targetCtx.arc(projectedBaseCenter.x, projectedBaseCenter.y, projectedRadius, 0, Math.PI * 2); targetCtx.fill(); if (projectedRadius > 0.8) { targetCtx.stroke(); }
                         // Desenha topo
                         targetCtx.fillStyle = studTopColor; targetCtx.beginPath();
                         targetCtx.arc(projectedTopCenter.x, projectedTopCenter.y, projectedRadius, 0, Math.PI * 2); targetCtx.fill(); if (projectedRadius > 0.8) { targetCtx.stroke(); }
                     }
                 }
             }
        } // --- Fim drawBlock ---


        // --- REVISADO: drawGrid com base sutil e linhas mais visíveis ---
        function drawGrid() {
            // --- Desenha um plano base sutil ---
            const baseColor = 'rgba(180, 200, 220, 0.3)'; // Cor semi-transparente
            ctx.fillStyle = baseColor;
            const p00 = projectMain(0, 0, 0);
            const pX0 = projectMain(gridMaxX, 0, 0);
            const pXY = projectMain(gridMaxX, gridMaxY, 0);
            const p0Y = projectMain(0, gridMaxY, 0);
            ctx.beginPath();
            ctx.moveTo(p00.x, p00.y);
            ctx.lineTo(pX0.x, pX0.y);
            ctx.lineTo(pXY.x, pXY.y);
            ctx.lineTo(p0Y.x, p0Y.y);
            ctx.closePath();
            ctx.fill();

            // --- Desenha as linhas da grade ---
            ctx.strokeStyle = 'rgba(120, 150, 170, 0.6)'; // Mais opaco
            ctx.lineWidth = 0.6; // Ligeiramente mais grosso
            const maxDim = Math.max(gridMaxX, gridMaxY);
             for (let i = 0; i <= maxDim; i++) {
                 // Linhas X (variando Y)
                 if (i <= gridMaxY) {
                     const p1 = projectMain(0, i, 0); const p2 = projectMain(gridMaxX, i, 0);
                     ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                 }
                 // Linhas Y (variando X)
                 if (i <= gridMaxX) {
                     const p1 = projectMain(i, 0, 0); const p2 = projectMain(i, gridMaxY, 0);
                     ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                 }
             }
        }

        // --- sortBlocksForDrawing (usando a versão robusta anterior) ---
        function sortBlocksForDrawing() {
            const blockSortData = {};
            function getSortData(block) { /* ...código interno igual à versão 9.1 ... */
                const key = getBlockKey(block.x, block.y, block.z);
                if (blockSortData[key]) { return blockSortData[key]; }
                const def = getPieceDefinition(block.type);
                const width = (def && typeof def.width === 'number') ? def.width : 1;
                const depth = (def && typeof def.depth === 'number') ? def.depth : 1;
                const heightValue = (def && typeof def.height === 'number') ? def.height : 1.0;
                const interpretedHeight = getPieceHeight(def); // Usa função auxiliar
                const centerX = block.x + width / 2.0;
                const centerY = block.y + depth / 2.0;
                const centerZ = block.z + interpretedHeight / 2.0;
                let projectedCenter;
                try { projectedCenter = projectMain(centerX, centerY, centerZ); }
                catch(projError) { console.error("Erro proj Sort:", projError); projectedCenter = { x: 0, y: 0 }; }
                const data = { baseZ: block.z || 0, centerProjectedY: (projectedCenter && typeof projectedCenter.y === 'number') ? projectedCenter.y : 0, centerProjectedX: (projectedCenter && typeof projectedCenter.x === 'number') ? projectedCenter.x : 0 };
                blockSortData[key] = data;
                return data;
            }
            const sorted = Object.values(blocks).sort((a, b) => { /* ...lógica de comparação igual v9.1... */
                const dataA = getSortData(a); const dataB = getSortData(b);
                if (Math.abs(dataA.baseZ - dataB.baseZ) > 0.01) { return dataA.baseZ - dataB.baseZ; }
                else { if (Math.abs(dataA.centerProjectedY - dataB.centerProjectedY) > 0.1) { return dataB.centerProjectedY - dataA.centerProjectedY; }
                       else { return dataB.centerProjectedX - dataA.centerProjectedX; } }
            });
            return sorted;
        }


        // --- Loop Principal (sem alterações) ---
        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            const sortedBlocks = sortBlocksForDrawing();
            sortedBlocks.forEach(block => drawBlock(block, ctx, projectMain, true, scaleFactor, false));

            if (previewBlockData && !isDragging) {
                drawBlock(previewBlockData, ctx, projectMain, true, scaleFactor, true);
            }
            requestAnimationFrame(drawScene);
        }

        // --- REVISADO: getGridCoordsFromScreen -> findNearestStudLocation ---
        // Encontra o centro do stud mais próximo do mouse na superfície mais alta
        function findNearestStudLocation(mouseX, mouseY) {
            let closestStud = null;
            let minDistanceSq = Infinity;
            let targetZ = 0;
            let blockBelow = null; // Bloco sobre o qual estamos mirando

            // 1. Verificar studs de blocos existentes
            const sortedBlocks = sortBlocksForDrawing().reverse(); // Do mais alto para mais baixo visualmente
            for (const block of sortedBlocks) {
                const def = getPieceDefinition(block.type);
                if (def.shape === 'tile') continue; // Ignora tiles como superfície de colocação

                const studsOnBlock = getStudFootprint(block); // Pega os centros dos studs no topo do bloco
                for (const stud of studsOnBlock) {
                    const projectedStud = projectMain(stud.x, stud.y, stud.z);
                    const dx = mouseX - projectedStud.x;
                    const dy = mouseY - projectedStud.y;
                    const distSq = dx * dx + dy * dy;

                    // Verifica se está dentro de um raio razoável e mais próximo que o anterior
                    // O raio pode ser ajustado, aqui usamos ~metade do tamanho do bloco projetado
                    const clickRadius = (blockSize * scaleFactor * 0.6) ** 2;
                    if (distSq < clickRadius && distSq < minDistanceSq) {
                        minDistanceSq = distSq;
                        closestStud = { x: stud.x, y: stud.y, z: stud.z }; // Coords do centro do stud
                        blockBelow = block; // Guarda o bloco que tem este stud
                    }
                }
                // Se encontramos um stud em um bloco, não precisamos verificar blocos abaixo dele naquela área (otimização simples)
                // Uma lógica mais complexa poderia verificar se o mouse está realmente "sobre" a área projetada do bloco
                if (closestStud && blockBelow === block) break;
            }


            // 2. Se nenhum stud de bloco foi encontrado perto o suficiente, verificar a grade Z=0
            if (!closestStud || minDistanceSq > (blockSize * scaleFactor * 0.8) ** 2 ) { // Aumenta um pouco o limiar para pegar o chão
                 blockBelow = null; // Reset, estamos mirando no chão
                 targetZ = 0; // Superfície alvo é o chão
                 // Encontra a célula da grade mais próxima no chão
                 // Iteração simplificada para achar célula próxima (pode ser melhorada com back-projection)
                 let closestGridX = -1, closestGridY = -1;
                 let minDistGridSq = Infinity;

                 // Define uma área de busca na grade ao redor de uma projeção inversa aproximada
                 // Projeta o centro da tela no Z=0 para ter um ponto de partida
                 const centerProj = projectMain(gridMaxX/2, gridMaxY/2, 0);
                 // Estimativa MUITO básica da célula baseada na diferença do mouse para o centro projetado
                 const estX = gridMaxX/2 + (mouseX - centerProj.x) / (blockSize * scaleFactor * cosProjectionAngle);
                 const estY = gridMaxY/2 - (mouseY - centerProj.y - (mouseX - centerProj.x)*sinProjectionAngle) / (blockSize * scaleFactor * cosProjectionAngle) ; // Bem complexo sem matriz inversa

                 const searchRadius = 5; // Procura em um raio de 5 células ao redor da estimada
                 const startX = Math.max(0, Math.floor(estX) - searchRadius);
                 const endX = Math.min(gridMaxX, Math.ceil(estX) + searchRadius);
                 const startY = Math.max(0, Math.floor(estY) - searchRadius);
                 const endY = Math.min(gridMaxY, Math.ceil(estY) + searchRadius);


                 for (let gx = startX; gx < endX; gx++) {
                     for (let gy = startY; gy < endY; gy++) {
                         const studCenterX = gx + 0.5;
                         const studCenterY = gy + 0.5;
                         const projectedStud = projectMain(studCenterX, studCenterY, targetZ);
                         const dx = mouseX - projectedStud.x;
                         const dy = mouseY - projectedStud.y;
                         const distSq = dx * dx + dy * dy;

                         if (distSq < minDistGridSq) {
                             minDistGridSq = distSq;
                             closestGridX = studCenterX;
                             closestGridY = studCenterY;
                         }
                     }
                 }

                 // Se encontrou uma célula na grade E ela está perto o suficiente do mouse
                 const gridClickRadius = (blockSize * scaleFactor * 0.7)**2;
                 if (closestGridX !== -1 && minDistGridSq < gridClickRadius) {
                      closestStud = { x: closestGridX, y: closestGridY, z: targetZ };
                      minDistanceSq = minDistGridSq; // Atualiza para referência, se necessário
                 } else {
                     // Se nem no chão encontrou, retorna null
                      closestStud = null;
                 }

            }

            if (closestStud) {
                 // Retorna o centro do stud encontrado e o bloco abaixo (se houver)
                 return { studCenter: closestStud, blockBelow: blockBelow };
            } else {
                 return null; // Nenhum ponto de encaixe válido encontrado
             }
        }


        // --- Manipuladores de Eventos Mouse ---
        function handleMouseDown(event) {
            event.preventDefault();
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;

            if (event.button === 0) { // Botão Esquerdo
                isDragging = true;
                isRotating = true;
            } else if (event.button === 2) { // Botão Direito (Remover)
                const rect = canvas.getBoundingClientRect();
                const mouseX = event.clientX - rect.left;
                const mouseY = event.clientY - rect.top;
                // Para remover, tentamos encontrar o *bloco* mais próximo, não o stud
                let blockToRemove = null;
                let minDistanceSq = Infinity;
                const sortedBlocks = sortBlocksForDrawing().reverse(); // Top-down

                for (const block of sortedBlocks) {
                     const def = getPieceDefinition(block.type);
                     const height = getPieceHeight(def);
                     // Ponto central do topo do bloco para teste de distância
                     const blockCenterX = block.x + def.width / 2;
                     const blockCenterY = block.y + def.depth / 2;
                     const blockCenterZ = block.z + height / 2; // Centro geométrico Z
                     const projectedCenter = projectMain(blockCenterX, blockCenterY, blockCenterZ);

                     const dx = mouseX - projectedCenter.x;
                     const dy = mouseY - projectedCenter.y;
                     const distSq = dx * dx + dy * dy;

                     // Raio de clique maior para facilitar a remoção
                     const removeRadiusSq = (blockSize * scaleFactor * Math.max(def.width, def.depth) * 0.6) ** 2;

                     if (distSq < removeRadiusSq && distSq < minDistanceSq) {
                          minDistanceSq = distSq;
                          blockToRemove = block;
                     }
                 }


                if (blockToRemove) {
                    const key = getBlockKey(blockToRemove.x, blockToRemove.y, blockToRemove.z);
                    delete blocks[key];
                    previewBlockData = null; // Limpa preview ao remover
                }
            }
        }

        // --- REVISADO: handleMouseMove usa findNearestStudLocation ---
        function handleMouseMove(event) {
            event.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            if (isDragging && isRotating) {
                const deltaX = event.clientX - lastMouseX; const deltaY = event.clientY - lastMouseY;
                cameraAngleX += deltaY * 0.005;
                cameraAngleX = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, cameraAngleX));
                // Rotação Y (yaw) pode ser adicionada aqui se necessário
                lastMouseX = event.clientX; lastMouseY = event.clientY;
                previewBlockData = null; // Esconde preview durante rotação
            } else if (!isDragging) { // Hovering
                const location = findNearestStudLocation(mouseX, mouseY);

                if (location && selectedPieceType) {
                    const targetStud = location.studCenter; // { x, y, z } do centro do stud alvo
                    const def = getPieceDefinition(selectedPieceType);

                    // Calcula a posição da quina (x,y) da nova peça
                    // para que seu stud (0.5, 0.5) alinhe com o stud alvo
                    const placeX = targetStud.x - 0.5;
                    const placeY = targetStud.y - 0.5;
                    const placeZ = targetStud.z; // O Z do stud alvo é a base da nova peça

                    // Verifica limites da grade
                     if (placeX >= 0 && placeY >= 0 &&
                         placeX + def.width <= gridMaxX &&
                         placeY + def.depth <= gridMaxY &&
                         placeZ < gridMaxZ)
                     {
                        previewBlockData = {
                            x: placeX, y: placeY, z: placeZ,
                            type: selectedPieceType,
                            color: colorSelect.value
                        };
                    } else {
                        previewBlockData = null; // Fora dos limites
                    }

                } else {
                    previewBlockData = null; // Mouse fora de local válido ou sem peça selecionada
                }
            }
        }

        // --- REVISADO: handleMouseUp com verificação de suporte adaptada ---
        function handleMouseUp(event) {
            event.preventDefault();
            if (event.button === 0) { // Botão Esquerdo
                if (isDragging && !isRotating) { /* Panning logic (if added) */ }
                else if (isRotating) {
                    const dx = event.clientX - lastMouseX; const dy = event.clientY - lastMouseY;
                    const dragThreshold = 5 * 5;
                    if (dx * dx + dy * dy < dragThreshold && previewBlockData) {
                        // --- CLIQUE - Adicionar Bloco ---
                        const newBlock = { ...previewBlockData };
                        const def = getPieceDefinition(newBlock.type);
                        const key = getBlockKey(newBlock.x, newBlock.y, newBlock.z);

                        let canPlace = true;

                        // 1. Verificação de Colisão (simplificada: verifica se alguma célula base está ocupada)
                        for (let dx = 0; dx < def.width; dx++) {
                            for (let dy = 0; dy < def.depth; dy++) {
                                const cellX = Math.floor(newBlock.x + dx);
                                const cellY = Math.floor(newBlock.y + dy);
                                // Verifica se já existe um bloco *começando* exatamente na mesma posição Z
                                // Esta verificação pode ser aprimorada para colisões mais complexas
                                if (findBlockCoveringCell(cellX + 0.5, cellY + 0.5, newBlock.z)) {
                                     // Verifica se o bloco encontrado é exatamente o mesmo (permitir sobreposição se Z for diferente)
                                     // A verificação atual previne sobreposição no mesmo Z.
                                     console.log(`Colisão detectada em (${cellX}, ${cellY}, ${newBlock.z.toFixed(3)})`);
                                     canPlace = false;
                                     break;
                                }
                            }
                            if (!canPlace) break;
                        }


                        // 2. Verificação de Suporte (simplificada: verifica se *abaixo* de cada stud base existe um bloco)
                        if (canPlace && newBlock.z > 0.01) { // Só precisa de suporte se não estiver no chão
                             let hasSupport = true;
                             const targetZBelow = newBlock.z - PLATE_HEIGHT; // Assume que colocamos sobre plates ou bricks
                             const targetZBelowBrick = newBlock.z - BRICK_HEIGHT;

                             for (let dx = 0; dx < def.width; dx++) {
                                 for (let dy = 0; dy < def.depth; dy++) {
                                     const studBaseX = newBlock.x + dx;
                                     const studBaseY = newBlock.y + dy;

                                     // Verifica se a célula da grade abaixo do centro deste stud base está coberta por um bloco
                                     const checkX = studBaseX + 0.5;
                                     const checkY = studBaseY + 0.5;

                                     // Procura por um bloco na altura de plate ou brick abaixo
                                     const blockDirectlyBelow = findBlockCoveringCell(checkX, checkY, targetZBelow) ||
                                                                findBlockCoveringCell(checkX, checkY, targetZBelowBrick);

                                     if (!blockDirectlyBelow) {
                                         // Se *nenhum* bloco for encontrado abaixo desta parte da base
                                         // Talvez outra parte da *mesma peça* forneça suporte (ex: 2x2 sobre 1x1 centralizado)?
                                         // Esta lógica é complexa. Simplificação: Requer bloco diretamente abaixo por enquanto.
                                         console.log(`Falta suporte abaixo de (${studBaseX.toFixed(1)}, ${studBaseY.toFixed(1)}, ${newBlock.z.toFixed(3)})`);
                                         hasSupport = false;
                                         break;
                                     }
                                 }
                                 if (!hasSupport) break;
                             }
                             if (!hasSupport) {
                                 canPlace = false;
                             }
                        }

                        // --- Adiciona se tudo OK ---
                        if (canPlace) {
                            blocks[key] = newBlock;
                            // Força atualização do preview
                            const rect = canvas.getBoundingClientRect();
                            handleMouseMove({ clientX: event.clientX, clientY: event.clientY, preventDefault: () => {} });
                        } else {
                            console.log("Não é possível colocar a peça aqui (colisão ou falta de suporte).");
                            previewBlockData = null; // Limpa preview inválido
                        }
                    }
                    // Se foi drag de rotação, apenas termina
                }
                isDragging = false;
                isRotating = false;
            }
        }

        function handleMouseLeave(event) { if (isDragging) { isDragging = false; isRotating = false; } previewBlockData = null; }
        function handleMouseWheel(event) { /* ...código de zoom igual v9.1 ... */
            event.preventDefault(); const scaleAmount = (event.deltaY < 0) ? zoomStep : 1 / zoomStep;
            const newScaleFactor = Math.max(minScaleFactor, Math.min(maxScaleFactor, scaleFactor * scaleAmount));
            const rect = canvas.getBoundingClientRect(); const mouseX = event.clientX - rect.left; const mouseY = event.clientY - rect.top;
            const worldXBefore = (mouseX - originX) / scaleFactor; const worldYBefore = (mouseY - originY) / scaleFactor;
            scaleFactor = newScaleFactor;
            originX = mouseX - worldXBefore * scaleFactor; originY = mouseY - worldYBefore * scaleFactor;
            if (!isDragging) { handleMouseMove(event); }
         }

        // --- Paleta e Categorias (sem alterações lógicas) ---
        function setupCategorySelector() { /* ... igual v9.1 ... */
            const categories = [...new Set(Object.values(pieceDefinitions).map(p => p.category || 'Uncategorized'))].sort();
            categorySelect.innerHTML = '<option value="All">Todas</option>';
            categories.forEach(cat => { const option = document.createElement('option'); option.value = cat; option.textContent = cat; categorySelect.appendChild(option); });
            categorySelect.addEventListener('change', () => { setupPalette(categorySelect.value); });
        }
        function drawPalettePreview(previewCtx, pieceType, color) { /* ... igual v9.1 ... */
             previewCtx.clearRect(0, 0, previewCtx.canvas.width, previewCtx.canvas.height); const def = getPieceDefinition(pieceType); if (!def) return;
             const previewScale = Math.min( (previewCtx.canvas.width * 0.6) / (Math.max(def.width, def.depth) * blockSize), (previewCtx.canvas.height * 0.5) / (getPieceHeight(def) * blockVisualHeightUnit) );
             const previewOriginX = previewCtx.canvas.width / 2;
             const blockHeightVisual = getPieceHeight(def) * blockVisualHeightUnit * previewScale;
             const previewOriginY = previewCtx.canvas.height * 0.6 + blockHeightVisual * 0.2;
             const previewBlock = { x: -def.width / 2, y: -def.depth / 2, z: 0, type: pieceType, color: color };
             const projectPreview = (x, y, z) => project(x, y, z, previewOriginX, previewOriginY, previewScale, Math.PI / 6);
             drawBlock(previewBlock, previewCtx, projectPreview, true, previewScale, false);
        }
        function setupPalette(filterCategory = 'All') { /* ... igual v9.1 ... */
            paletteContainer.innerHTML = ''; const currentSelectedColor = colorSelect.value; const pieceKeys = Object.keys(pieceDefinitions);
            if (pieceKeys.length === 0) { paletteContainer.innerHTML = '<div>Erro ao carregar peças.</div>'; return; }
            if (!selectedPieceType || !pieceDefinitions[selectedPieceType]) { selectedPieceType = pieceKeys[0]; }
            pieceKeys.forEach(type => { const def = pieceDefinitions[type]; if (filterCategory === 'All' || def.category === filterCategory) {
                const item = document.createElement('div'); item.classList.add('palette-item'); item.dataset.type = type;
                const previewCanvas = document.createElement('canvas'); previewCanvas.width = 45; previewCanvas.height = 45; previewCanvas.dataset.pieceType = type; item.appendChild(previewCanvas);
                const nameSpan = document.createElement('span'); nameSpan.textContent = def.name || type.replace(/_/g, ' '); item.appendChild(nameSpan);
                if (type === selectedPieceType) { item.classList.add('selected'); }
                item.addEventListener('click', () => { const currentSelected = paletteContainer.querySelector('.palette-item.selected'); if (currentSelected) { currentSelected.classList.remove('selected'); } item.classList.add('selected'); selectedPieceType = type; if (!isDragging) { const rect = canvas.getBoundingClientRect(); const fakeEvent = { clientX: lastMouseX || rect.left + canvas.width / 2, clientY: lastMouseY || rect.top + canvas.height / 2, preventDefault: () => {} }; handleMouseMove(fakeEvent); } });
                paletteContainer.appendChild(item);
                const previewCtx = previewCanvas.getContext('2d'); drawPalettePreview(previewCtx, type, currentSelectedColor);
            }});
            colorSelect.removeEventListener('change', updateAllPalettePreviews); colorSelect.addEventListener('change', updateAllPalettePreviews);
        }
        function updateAllPalettePreviews() { /* ... igual v9.1 ... */
            const newColor = colorSelect.value; const items = paletteContainer.querySelectorAll('.palette-item');
            items.forEach(item => { const previewCanvas = item.querySelector('canvas'); const type = item.dataset.type; if (previewCanvas && type) { const previewCtx = previewCanvas.getContext('2d'); drawPalettePreview(previewCtx, type, newColor); } });
            if (previewBlockData) { previewBlockData.color = newColor; }
        }

        // --- Carregamento JSON e Inicialização (sem alterações lógicas) ---
        async function loadPieceDefinitions() { /* ... igual v9.1 ... */
            loadingOverlay.style.display = 'flex'; try { const response = await fetch('pieces.json'); if (!response.ok) { throw new Error(`HTTP error! status: ${response.status}`); } pieceDefinitions = await response.json(); console.log("Defs carregadas:", Object.keys(pieceDefinitions).length); if (Object.keys(pieceDefinitions).length > 0) { selectedPieceType = Object.keys(pieceDefinitions)[0]; } else { throw new Error("JSON vazio/inválido."); } } catch (error) { console.error("Erro load JSON:", error); infoDiv.textContent = `ERRO: Falha ao carregar peças (${error.message}).`; infoDiv.style.color = 'red'; pieceDefinitions = {}; alert(`Erro ao carregar peças: ${error.message}`); } finally { loadingOverlay.style.display = 'none'; }
        }
        async function init() { /* ... igual v9.1 ... */
            infoDiv.textContent = "Carregando..."; await loadPieceDefinitions();
            if (Object.keys(pieceDefinitions).length > 0) {
                infoDiv.textContent = "Hover: Preview. Clique Esq: Add. Clique Dir: Remove. Drag Esq: Gira. Roda: Zoom."; setupCategorySelector(); setupPalette();
                clearAllButton.addEventListener('click', () => { if (confirm("Limpar tudo?")) { blocks = {}; previewBlockData = null; } });
                canvas.addEventListener('mousedown', handleMouseDown); canvas.addEventListener('mousemove', handleMouseMove); canvas.addEventListener('mouseup', handleMouseUp); canvas.addEventListener('mouseleave', handleMouseLeave); canvas.addEventListener('contextmenu', (e) => e.preventDefault()); canvas.addEventListener('wheel', handleMouseWheel);
                function resizeCanvas() { const mainContent = document.getElementById('main-content'); const overlayHeight = 0; /*loadingOverlay.offsetHeight > 0 ? loadingOverlay.offsetHeight : 0;*/ const availableWidth = mainContent.clientWidth - 20; const availableHeight = mainContent.clientHeight - controlsDiv.offsetHeight - overlayHeight - 20; const aspectRatio = 4 / 3; let canvasWidth = availableWidth; let canvasHeight = availableWidth / aspectRatio; if (canvasHeight > availableHeight) { canvasHeight = availableHeight; canvasWidth = canvasHeight * aspectRatio; } canvas.width = Math.max(400, Math.floor(canvasWidth)); canvas.height = Math.max(300, Math.floor(canvasHeight));
                    originX = canvas.width / 2; originY = canvas.height * 0.65; // <-- AJUSTADO ORIGEM Y
                 }
                window.addEventListener('resize', resizeCanvas); resizeCanvas(); requestAnimationFrame(drawScene);
            } else { console.error("Init abortado."); controlsDiv.style.display = 'none'; canvas.style.display = 'none'; }
        }

        // --- Garanta que pieces.json exista ---
        init();

    </script>
