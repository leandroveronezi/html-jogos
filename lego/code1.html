<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construtor Lego Avançado v7 (Estética Revisada)</title>
    <style>
        /* --- CSS (Sem alterações) --- */
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; background-color: #eee; overflow: hidden; }
        #sidebar { width: 180px; /* Aumentar um pouco para caber preview+texto */ background-color: #e0e0e0; border-right: 1px solid #ccc; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; }
        #sidebar h3 { margin: 0 0 5px 0; font-size: 1em; text-align: center; width: 100%; }
        #category-select { width: 100%; padding: 5px; margin-bottom: 10px; box-sizing: border-box; }
        #palette { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding-right: 5px; /* Espaço para scrollbar */ }
        .palette-item {
            width: 95%; /* Usar quase toda largura */
            min-height: 55px; /* Aumentar altura para preview */
            border: 2px solid #aaa; background-color: #f8f8f8; margin-bottom: 8px; cursor: pointer;
            display: flex; /* Usar flexbox */
            align-items: center; /* Alinhar itens verticalmente */
            justify-content: space-between; /* Espaçar preview e texto */
            text-align: left; /* Alinhar texto à esquerda */
            font-size: .8em; position: relative; overflow: hidden;
            transition: border-color .2s, background-color .2s; padding: 5px; box-sizing: border-box;
        }
        .palette-item canvas { /* Estilo para a miniatura */
            width: 45px; height: 45px;
            border: 1px solid #ccc;
            background-color: #e8f0f8; /* Fundo levemente diferente */
            flex-shrink: 0; /* Não encolher o canvas */
            margin-right: 8px; /* Espaço entre canvas e texto */
        }
        .palette-item span { /* Para o nome da peça */
            flex-grow: 1; /* Ocupar espaço restante */
            overflow: hidden; text-overflow: ellipsis; white-space: normal; /* Permitir quebra de linha se necessário */
        }

        .palette-item::before { display: none; /* Remover o quadradinho de cor antigo */ }
        .palette-item:hover { border-color: #777; background-color: #fff; }
        .palette-item.selected { border-color: #3498db; border-width: 3px; background-color: #d0e8f8; }

        #main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        #controls { padding: 8px; background: #f8f8f8; border-bottom: 1px solid #ccc; width: 100%; box-sizing: border-box; text-align: center; flex-shrink: 0; }
        #controls label, #controls select, #controls button { margin: 0 5px; font-size: .9em; }
        #info { font-size: .85em; margin-top: 3px; color: #555; }
        canvas#gameCanvas { /* Estilo específico para o canvas principal */
             display: block; margin: 10px; background-color: #d0e0f0; cursor: pointer; border: 1px solid #aaa;
             max-width: calc(100% - 20px); max-height: calc(100% - 20px); box-sizing: border-box;
        }
    </style>
</head>
<body>
    <!-- HTML Estrutura (Sem alterações) -->
    <div id="sidebar">
        <h3>Categoria</h3>
        <select id="category-select"></select>
        <h3>Peças</h3>
        <div id="palette"></div>
    </div>

    <div id="main-content">
        <div id="controls">
            <label for="color-select">Cor:</label>
            <select id="color-select">
                <option value="#D90000">Vermelho</option><option value="#0050A0">Azul</option><option value="#257A25">Verde</option><option value="#FFCF00">Amarelo</option><option value="#000000">Preto</option><option value="#A0A5A9">Cinza Claro</option><option value="#6B6B6B">Cinza Escuro</option><option value="#FFFFFF">Branco</option><option value="#FFA500">Laranja</option>
            </select>
            <button id="clear-all">Limpar Tudo</button>
            <div id="info">Clique esquerdo para adicionar, direito para remover. Arraste esquerdo para girar. Roda do mouse para Zoom.</div>
        </div>
        <canvas id="gameCanvas"></canvas> <!-- Canvas Principal -->
    </div>

    <script>
        // --- Variáveis Globais e Constantes ---
        const canvas = document.getElementById('gameCanvas'); // Canvas principal
        const ctx = canvas.getContext('2d');
        const sidebar = document.getElementById('sidebar');
        const paletteContainer = document.getElementById('palette');
        const categorySelect = document.getElementById('category-select');
        const colorSelect = document.getElementById('color-select');
        const clearAllButton = document.getElementById('clear-all');
        const controlsDiv = document.getElementById('controls');
        const infoDiv = document.getElementById('info');

        const BRICK_HEIGHT = 1.0; const PLATE_HEIGHT = BRICK_HEIGHT / 3.0;
        // --- DEFINIÇÕES DE PEÇAS EXPANDIDAS (Sem alterações) ---
        const pieceDefinitions = {
             // Bricks Básicos
             '1x1_brick':{width:1,depth:1,height:BRICK_HEIGHT,shape:'brick',category:'Bricks',name:'Brick 1x1'},
             '2x1_brick':{width:2,depth:1,height:BRICK_HEIGHT,shape:'brick',category:'Bricks',name:'Brick 2x1'},
             '1x2_brick':{width:1,depth:2,height:BRICK_HEIGHT,shape:'brick',category:'Bricks',name:'Brick 1x2'},
             '2x2_brick':{width:2,depth:2,height:BRICK_HEIGHT,shape:'brick',category:'Bricks',name:'Brick 2x2'},
             '4x1_brick':{width:4,depth:1,height:BRICK_HEIGHT,shape:'brick',category:'Bricks',name:'Brick 4x1'},
             '1x4_brick':{width:1,depth:4,height:BRICK_HEIGHT,shape:'brick',category:'Bricks',name:'Brick 1x4'},
             '2x4_brick':{width:2,depth:4,height:BRICK_HEIGHT,shape:'brick',category:'Bricks',name:'Brick 2x4'},
             // Plates Básicos
             '1x1_plate':{width:1,depth:1,height:PLATE_HEIGHT,shape:'plate',category:'Plates',name:'Plate 1x1'},
             '2x1_plate':{width:2,depth:1,height:PLATE_HEIGHT,shape:'plate',category:'Plates',name:'Plate 2x1'},
             '1x2_plate':{width:1,depth:2,height:PLATE_HEIGHT,shape:'plate',category:'Plates',name:'Plate 1x2'},
             '2x2_plate':{width:2,depth:2,height:PLATE_HEIGHT,shape:'plate',category:'Plates',name:'Plate 2x2'},
             '4x1_plate':{width:4,depth:1,height:PLATE_HEIGHT,shape:'plate',category:'Plates',name:'Plate 4x1'},
             '1x4_plate':{width:1,depth:4,height:PLATE_HEIGHT,shape:'plate',category:'Plates',name:'Plate 1x4'},
             '2x4_plate':{width:2,depth:4,height:PLATE_HEIGHT,shape:'plate',category:'Plates',name:'Plate 2x4'},
             // Slopes (Inclinados) - Renderização padrão por enquanto
             'slope_fwd_2x1_45':{width:2,depth:1,height:BRICK_HEIGHT,shape:'slope_fwd_2x1_45',category:'Slopes',name:'Slope 2x1'},
             'slope_fwd_1x2_45':{width:1,depth:2,height:BRICK_HEIGHT,shape:'slope_fwd_1x2_45',category:'Slopes',name:'Slope 1x2'},
             'slope_inv_2x1_45':{width:2,depth:1,height:BRICK_HEIGHT,shape:'slope_inv_2x1_45',category:'Slopes',name:'Inv Slope 2x1'},
             'slope_inv_1x2_45':{width:1,depth:2,height:BRICK_HEIGHT,shape:'slope_inv_1x2_45',category:'Slopes',name:'Inv Slope 1x2'},
             // Peças Especiais - Renderização padrão por enquanto
             'corner_1x2x2':{width:2,depth:2,height:BRICK_HEIGHT,shape:'corner_1x2x2',category:'Special Bricks',name:'Corner 1x2x2'},
             'arch_1x3x1':{width:1,depth:3,height:BRICK_HEIGHT,shape:'arch_1x3x1',category:'Special Bricks',name:'Arch 1x3'},
             'brick_1x1_round':{width:1,depth:1,height:BRICK_HEIGHT,shape:'brick_1x1_round',category:'Special Bricks',name:'Brick 1x1 Round'},
             'plate_2x2_round':{width:2,depth:2,height:PLATE_HEIGHT,shape:'plate_2x2_round',category:'Special Plates',name:'Plate 2x2 Round'},
        };
        let selectedPieceType = '1x1_brick';

        // --- Configurações ---
        const blockSize = 20;
        const blockVisualHeightUnit = blockSize * 0.8;
        const studRadiusFactor = 0.3; const studHeightFactor = 0.15;
        const projectionAngle = Math.PI / 6;
        const cosProjectionAngle = Math.cos(projectionAngle);
        const sinProjectionAngle = Math.sin(projectionAngle);
        const gridMaxX = 24; const gridMaxY = 24; const gridMaxZ = 30;

        // --- *** NOVAS CONSTANTES PARA SHADING *** ---
        const SHADING_FACTOR_TOP = 1.0;       // Base para cor do topo
        const SHADING_FACTOR_SIDE_LIGHT = 0.85; // Lado mais iluminado (e.g., Direita/Frontal dependendo do ângulo)
        const SHADING_FACTOR_SIDE_DARK = 0.65;  // Lado menos iluminado (e.g., Esquerda/Traseiro)
        const SHADING_FACTOR_BOTTOM = 0.5;    // Base (geralmente não visível)
        const SHADING_FACTOR_STUD_TOP = 1.1;    // Topo do stud (levemente mais claro que topo do bloco)
        const SHADING_FACTOR_STUD_SIDE = 0.75;  // Lado do stud
        const SHADING_FACTOR_OUTLINE = 0.4;   // Escuridão do contorno relativo à cor base

        // --- Estado (Sem alterações) ---
        let blocks = {};
        let cameraAngleX = Math.PI / 4;
        let scaleFactor = 1.0;
        const minScaleFactor = 0.2; const maxScaleFactor = 5.0; const zoomStep = 1.1;
        let originX = 0, originY = 0;
        let isDragging = false, isRotating = false;
        let lastMouseX = 0, lastMouseY = 0;

        // --- Funções Auxiliares (Sem alterações) ---
        function getPieceDefinition(type) { return pieceDefinitions[type] || pieceDefinitions['1x1_brick']; }
        function getBlockKey(x, y, z) { return `${x},${y},${z}`; }
        function getBaseFootprint(blockData) { const cells = []; const def = getPieceDefinition(blockData.type); for (let dx = 0; dx < def.width; dx++) { for (let dy = 0; dy < def.depth; dy++) { cells.push({ x: blockData.x + dx, y: blockData.y + dy, z: blockData.z }); } } return cells; }
        function findBlockAtCell(targetX, targetY, targetZ) { for (const key in blocks) { const block = blocks[key]; const def = getPieceDefinition(block.type); if (Math.abs(block.z - targetZ) < 0.01 && targetX >= block.x && targetX < block.x + def.width && targetY >= block.y && targetY < block.y + def.depth) { return block; } } return null; }
        function adjustColor(hexColor, factor) { if (!hexColor || hexColor.length < 6) hexColor = '#CCCCCC'; const r = parseInt(hexColor.slice(1, 3), 16); const g = parseInt(hexColor.slice(3, 5), 16); const b = parseInt(hexColor.slice(5, 7), 16); const clamp = (val) => Math.min(255, Math.max(0, Math.round(val))); const newR = clamp(r * factor); const newG = clamp(g * factor); const newB = clamp(b * factor); return `#${newR.toString(16).padStart(2, '0')}${newG.toString(16).padStart(2, '0')}${newB.toString(16).padStart(2, '0')}`; }

        // --- Projeção (Sem alterações) ---
        function project(x, y, z, currentOriginX, currentOriginY, currentScale, currentAngleX) {
            const worldX = x * blockSize; const worldY = y * blockSize; const worldZ = z * blockVisualHeightUnit;
            const x1 = worldX * Math.cos(currentAngleX) + worldY * Math.sin(currentAngleX);
            const y1 = -worldX * Math.sin(currentAngleX) + worldY * Math.cos(currentAngleX);
            const z1 = worldZ;
            const screenX = (x1 - y1) * cosProjectionAngle * currentScale;
            const screenY = ((x1 + y1) * sinProjectionAngle - z1) * currentScale;
            return { x: currentOriginX + screenX, y: currentOriginY + screenY };
        }
        function projectMain(x, y, z) {
            return project(x, y, z, originX, originY, scaleFactor, cameraAngleX);
        }


        // --- Funções Auxiliares para Desenho (Sem alterações) ---
        function calculateSignedArea(points) { let area = 0; for (let i = 0; i < points.length; i++) { const p1 = points[i]; const p2 = points[(i + 1) % points.length]; area += (p1.x * p2.y - p2.x * p1.y); } return area / 2; }
        function getFaceAverageZ(faceIndices, allCorners) { let sumZ = 0; faceIndices.forEach(index => sumZ += allCorners[index].z); return sumZ / faceIndices.length; }


        // --- *** drawBlock REVISADA (Estética Lego) *** ---
        function drawBlock(block, targetCtx, projectionFn, drawStuds = true, baseScale = 1.0) {
            const def = getPieceDefinition(block.type);
            const baseColor = block.color;
            const baseX = block.x, baseY = block.y, baseZ = block.z;
            const width = def.width, depth = def.depth, height = def.height;
            let corners = [];
            let faces = [];

            // Define corners based on shape (simplificado por enquanto para shapes complexos)
            // Usaremos a mesma definição de cantos para a maioria por enquanto
            // !! TODO: Implementar geometria real para shapes complexos (slopes, arches, etc.) !!
            corners = [
                { x: baseX,         y: baseY,         z: baseZ },          // 0: F L B
                { x: baseX + width, y: baseY,         z: baseZ },          // 1: F R B
                { x: baseX + width, y: baseY + depth, z: baseZ },          // 2: B R B
                { x: baseX,         y: baseY + depth, z: baseZ },          // 3: B L B
                { x: baseX,         y: baseY,         z: baseZ + height }, // 4: F L T
                { x: baseX + width, y: baseY,         z: baseZ + height }, // 5: F R T
                { x: baseX + width, y: baseY + depth, z: baseZ + height }, // 6: B R T
                { x: baseX,         y: baseY + depth, z: baseZ + height }  // 7: B L T
            ];


            // Define faces e suas cores baseadas nos fatores de shading
            // A decisão de qual lado é "light" vs "dark" pode depender do cameraAngleX,
            // mas simplificamos com uma regra fixa baseada na projeção isométrica padrão.
            // Ajustes podem ser necessários se a rotação mudar muito a percepção da luz.
            faces = [
                // Topo
                { indices: [4, 5, 6, 7], color: adjustColor(baseColor, SHADING_FACTOR_TOP), type: 'top' },
                // Fundo (geralmente oculto)
                { indices: [0, 3, 2, 1], color: adjustColor(baseColor, SHADING_FACTOR_BOTTOM), type: 'bottom' },
                // Lados (assumindo luz vindo de "cima-direita" na projeção padrão)
                { indices: [0, 1, 5, 4], color: adjustColor(baseColor, SHADING_FACTOR_SIDE_LIGHT), type: 'side' }, // Frontal -> Mais claro
                { indices: [1, 2, 6, 5], color: adjustColor(baseColor, SHADING_FACTOR_SIDE_LIGHT), type: 'side' }, // Direita -> Mais claro
                { indices: [2, 3, 7, 6], color: adjustColor(baseColor, SHADING_FACTOR_SIDE_DARK), type: 'side' },  // Traseira -> Mais escuro
                { indices: [3, 0, 4, 7], color: adjustColor(baseColor, SHADING_FACTOR_SIDE_DARK), type: 'side' }   // Esquerda -> Mais escuro
            ];

            // --- Projeção, Culling, Ordenação de Faces ---
            const projectedCorners = corners.map(corner => projectionFn(corner.x, corner.y, corner.z));
            const visibleFaces = [];
            faces.forEach(face => {
                if (face.indices.length < 3) return;
                const facePoints = face.indices.map(index => projectedCorners[index]);
                const area = calculateSignedArea(facePoints);
                // Ajuste o limiar da área se necessário (e.g., para evitar renderizar faces muito pequenas no zoom out)
                if (area > 0.5) { // Culling (área > 0) + evita faces degeneradas/minúsculas
                    face.points = facePoints;
                    face.avgZ = getFaceAverageZ(face.indices, corners);
                    visibleFaces.push(face);
                }
            });
            visibleFaces.sort((a, b) => a.avgZ - b.avgZ); // Ordena faces do bloco (back-to-front dentro do bloco)

            // --- Desenho das Faces ---
            const outlineColor = adjustColor(baseColor, SHADING_FACTOR_OUTLINE);
            targetCtx.lineWidth = Math.max(0.2, 0.6 * Math.sqrt(baseScale)); // Linha mais fina em zoom out, com mínimo
            targetCtx.strokeStyle = outlineColor; // Cor de contorno escura e consistente

            visibleFaces.forEach(face => {
                targetCtx.fillStyle = face.color; // Cor da face preenchida
                targetCtx.beginPath();
                targetCtx.moveTo(face.points[0].x, face.points[0].y);
                for (let i = 1; i < face.points.length; i++) {
                    targetCtx.lineTo(face.points[i].x, face.points[i].y);
                }
                targetCtx.closePath();
                targetCtx.fill();
                // Só desenha contorno se não for muito pequeno (evita borrão no zoom out)
                if (baseScale > 0.3) { // Limiar pode precisar de ajuste
                    targetCtx.stroke(); // Desenha o contorno da face
                }
            });

            // --- Desenho dos Studs (REVISADO para parecer mais Lego) ---
            if (drawStuds && (def.shape === 'brick' || def.shape === 'plate' || def.shape.includes('round'))) { // Inclui shapes 'round' para ter studs
                 const studRadius = blockSize * studRadiusFactor;
                 const studBaseZ = baseZ + height; // Z da base do stud (topo do bloco)
                 const studTopZ = studBaseZ + studHeightFactor * BRICK_HEIGHT; // Z do topo do stud
                 const studTopColor = adjustColor(baseColor, SHADING_FACTOR_STUD_TOP);
                 const studSideColor = adjustColor(baseColor, SHADING_FACTOR_STUD_SIDE);
                 // outlineColor já definido acima para as faces
                 targetCtx.lineWidth = Math.max(0.1, 0.4 * Math.sqrt(baseScale)); // Linha do stud ainda mais fina

                for (let dx = 0; dx < width; dx++) {
                    for (let dy = 0; dy < depth; dy++) {
                         // Simplificação para peças redondas: desenha só o stud central se for 1x1 base
                         // Peças maiores (e.g. plate 2x2 round) ainda usam a lógica de stud quadrado por enquanto.
                         // TODO: Lógica de posicionamento de stud para peças redondas maiores.
                         if (def.width === 1 && def.depth === 1 && (def.shape.includes('round')) && (dx > 0 || dy > 0)) continue;

                        const studCenterX = baseX + dx + 0.5;
                        const studCenterY = baseY + dy + 0.5;

                        // Projetar pontos centrais da base e topo do stud
                        const projectedBaseCenter = projectionFn(studCenterX, studCenterY, studBaseZ);
                        const projectedTopCenter = projectionFn(studCenterX, studCenterY, studTopZ);

                        // Raio projetado (não pode ser menor que ~0.5px para ser visível)
                        // A escala do raio já está implícita na projeção geral * baseScale
                        // Usar cosProjectionAngle aqui ajuda a achatar um pouco na perspectiva, como um stud real.
                        const projectedRadius = Math.max(0.5, studRadius * baseScale * cosProjectionAngle);

                         // Não desenhar se for muito pequeno para ser visível
                         if (projectedRadius < 0.5) continue;

                        // 1. Desenhar a base/lado do stud (primeiro, para ficar embaixo)
                        // Usamos um círculo preenchido na posição da BASE projetada como aproximação da lateral visível.
                         targetCtx.fillStyle = studSideColor;
                         targetCtx.strokeStyle = outlineColor; // Usa o mesmo contorno escuro
                         targetCtx.beginPath();
                         targetCtx.arc(projectedBaseCenter.x, projectedBaseCenter.y, projectedRadius, 0, Math.PI * 2);
                         targetCtx.fill();
                         if (projectedRadius > 0.8) { // Só contorna a base se não for minúscula
                            targetCtx.stroke();
                         }


                        // 2. Desenhar o topo do stud (depois, para ficar em cima)
                         targetCtx.fillStyle = studTopColor;
                         // Stroke já definido
                         targetCtx.beginPath();
                         // Desenha na posição do TOPO projetado
                         targetCtx.arc(projectedTopCenter.x, projectedTopCenter.y, projectedRadius, 0, Math.PI * 2);
                         targetCtx.fill();
                         if (projectedRadius > 0.8) { // Só contorna o topo se não for minúsculo
                            targetCtx.stroke(); // Contorno do topo
                         }
                    }
                }
            }
        } // --- Fim da função drawBlock REVISADA ---


        // --- drawGrid (Sem alterações) ---
        function drawGrid() { ctx.strokeStyle = '#aaa'; ctx.lineWidth = 0.5; const halfGridX = Math.ceil(gridMaxX * 1.5 / 2); const halfGridY = Math.ceil(gridMaxY * 1.5 / 2); for (let i = -halfGridX; i <= halfGridX; i++) { const p1 = projectMain(i, -halfGridY, 0); const p2 = projectMain(i, halfGridY, 0); ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); } for (let j = -halfGridY; j <= halfGridY; j++) { const p1 = projectMain(-halfGridX, j, 0); const p2 = projectMain(halfGridX, j, 0); ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); } }

        // --- Ordenação sortBlocksForDrawing (Sem alterações) ---
        function sortBlocksForDrawing() {
             const blockSortData = {};
             function getSortData(block) { const key = getBlockKey(block.x, block.y, block.z); if (blockSortData[key]) { return blockSortData[key]; } const def = getPieceDefinition(block.type); const centerX = block.x + def.width / 2.0; const centerY = block.y + def.depth / 2.0; const centerZ = block.z + def.height / 2.0;
             const projectedCenter = projectMain(centerX, centerY, centerZ);
             const data = { baseZ: block.z, centerProjectedY: projectedCenter.y, centerProjectedX: projectedCenter.x }; blockSortData[key] = data; return data; }
             return Object.values(blocks).sort((a, b) => { const dataA = getSortData(a); const dataB = getSortData(b); if (Math.abs(dataA.baseZ - dataB.baseZ) > 0.01) { return dataA.baseZ - dataB.baseZ; } else { if (Math.abs(dataA.centerProjectedY - dataB.centerProjectedY) > 0.1) { return dataB.centerProjectedY - dataA.centerProjectedY; } else { return dataB.centerProjectedX - dataA.centerProjectedX; } } });
        }

        // --- Loop Principal (Sem alterações) ---
        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            const sortedBlocks = sortBlocksForDrawing();
            sortedBlocks.forEach(block => drawBlock(block, ctx, projectMain, true, scaleFactor)); // Passa scaleFactor
            requestAnimationFrame(drawScene);
        }

        // --- Interação Picking (Sem alterações) ---
        function getGridCoordsFromScreen(mouseX, mouseY) {
            let bestMatch={distSq:Infinity,targetCellX:0,targetCellY:0,targetLevelZ:-1,clickedOnBlock:null,type:'none'};
             const checkRadius = blockSize * 1.0 * scaleFactor; const checkRadiusSq = checkRadius * checkRadius;
             const studClickRadius = blockSize * 0.5 * scaleFactor; const studClickRadiusSq = studClickRadius * studClickRadius;
             const groundCheckRadius = blockSize * 0.9 * scaleFactor; const groundCheckRadiusSq = groundCheckRadius * groundCheckRadius;
             const sortedBlocksDesc = Object.values(blocks).sort((a,b)=>(b.z+getPieceDefinition(b.type).height)-(a.z+getPieceDefinition(a.type).height));

             for(const block of sortedBlocksDesc){
                 const def=getPieceDefinition(block.type); const topZ=block.z+def.height;
                 for(let dx=0;dx<def.width;dx++){ for(let dy=0;dy<def.depth;dy++){
                         const cellX=block.x+dx; const cellY=block.y+dy;
                         const projectedCellCenter=projectMain(cellX+.5,cellY+.5,topZ);
                         const dx_c=mouseX-projectedCellCenter.x; const dy_c=mouseY-projectedCellCenter.y;
                         const distSq=dx_c*dx_c+dy_c*dy_c;
                         if(distSq < checkRadiusSq && distSq < bestMatch.distSq){ bestMatch = {distSq, targetCellX:cellX, targetCellY:cellY, targetLevelZ:topZ, clickedOnBlock:block, type:'block_top'}; }
                 } }
                  if(bestMatch.distSq < studClickRadiusSq) { break; }
             }
             if(bestMatch.type !=='block_top' || bestMatch.distSq > checkRadiusSq * 0.8) {
                const groundZ=0; const searchRadius = Math.max(gridMaxX, gridMaxY) / 2;
                for(let x = -Math.ceil(searchRadius); x < Math.ceil(searchRadius); x++) { for(let y = -Math.ceil(searchRadius); y < Math.ceil(searchRadius); y++) {
                         const projectedBaseCenter=projectMain(x+.5,y+.5,groundZ);
                         const dx_g=mouseX-projectedBaseCenter.x; const dy_g=mouseY-projectedBaseCenter.y;
                         const distSq=dx_g*dx_g+dy_g*dy_g;
                         if(distSq < groundCheckRadiusSq && distSq < bestMatch.distSq){ bestMatch = {distSq, targetCellX:x, targetCellY:y, targetLevelZ:groundZ, clickedOnBlock:null, type:'ground'}; }
                 } }
             }
             return bestMatch.type !== 'none' ? bestMatch : null;
        }


        // --- Manipuladores de Eventos Mouse (Sem alterações) ---
        function handleMouseDown(event) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;
            lastMouseX = mouseX; lastMouseY = mouseY;
            isDragging = false;
            isRotating = false;

            const target = getGridCoordsFromScreen(mouseX, mouseY);

            if (event.button === 0) { // Botão Esquerdo
                if (target) {
                    event.preventDefault();
                    canvas.dataset.pendingPlacementTarget = JSON.stringify(target);
                } else {
                    event.preventDefault();
                    isRotating = true;
                }
            } else if (event.button === 2) { // Botão Direito: Remover
                if (target && target.clickedOnBlock) {
                    event.preventDefault();
                     const blockToRemove=target.clickedOnBlock; const blockKey=getBlockKey(blockToRemove.x,blockToRemove.y,blockToRemove.z); const def=getPieceDefinition(blockToRemove.type); let canRemove=true; const footprintToRemove=getBaseFootprint(blockToRemove); const zLevelAbove=blockToRemove.z+def.height;
                     for(const key in blocks){ if(key===blockKey)continue; const otherBlock=blocks[key]; if(Math.abs(otherBlock.z-zLevelAbove)<.01){ const otherFootprint=getBaseFootprint(otherBlock); for(const cellBelow of footprintToRemove){ for(const otherCell of otherFootprint){ if(cellBelow.x===otherCell.x&&cellBelow.y===otherCell.y){ canRemove=false; alert("Remova os blocos de cima primeiro!"); break; } } if(!canRemove)break; } } if(!canRemove)break; }
                     if(canRemove){ delete blocks[blockKey]; updateAllPalettePreviews(); }
                } else {
                     event.preventDefault();
                 }
            }
            isDragging = isRotating;
        }

        function handleMouseMove(event) {
             if (!isDragging) return;
             const rect = canvas.getBoundingClientRect();
             const mouseX = event.clientX - rect.left;
             const mouseY = event.clientY - rect.top;
             const deltaX = mouseX - lastMouseX;
             const deltaY = mouseY - lastMouseY;

             if (isRotating) {
                 if (Math.abs(deltaX) > 0) {
                     cameraAngleX += deltaX * 0.008;
                 }
             }
             lastMouseX = mouseX;
             lastMouseY = mouseY;
        }

        function handleMouseUp(event) {
             if (event.button === 0 && !isDragging) {
                 const pendingTargetJSON = canvas.dataset.pendingPlacementTarget;
                 if (pendingTargetJSON) {
                     const target = JSON.parse(pendingTargetJSON);
                     canvas.dataset.pendingPlacementTarget = '';

                     let placeX = target.targetCellX, placeY = target.targetCellY, placeZ = target.targetLevelZ;
                     const pieceDef=getPieceDefinition(selectedPieceType);
                     let canPlace=true;
                     if(placeZ+pieceDef.height>gridMaxZ){ canPlace=false; }
                     const newFootprintCells=[]; for(let dx=0;dx<pieceDef.width;dx++){ for(let dy=0;dy<pieceDef.depth;dy++){ newFootprintCells.push({cx:placeX+dx,cy:placeY+dy}); } }
                     if(canPlace){ for(const cell of newFootprintCells){ if(cell.cx<-gridMaxX/2||cell.cx>=gridMaxX/2||cell.cy<-gridMaxY/2||cell.cy>=gridMaxY/2){ canPlace=false; break; } if(findBlockAtCell(cell.cx,cell.cy,placeZ)){ canPlace=false; break; } } }
                     if(canPlace&&placeZ>0){ let allCellsSupported=true; for(const cell of newFootprintCells){ let cellSupported=false; for(const key in blocks){ const belowBlock=blocks[key]; const belowDef=getPieceDefinition(belowBlock.type); const belowTopZ=belowBlock.z+belowDef.height; if(Math.abs(belowTopZ-placeZ)<.01){ if(cell.cx>=belowBlock.x&&cell.cx<belowBlock.x+belowDef.width&&cell.cy>=belowBlock.y&&cell.cy<belowBlock.y+belowDef.depth){ cellSupported=true; break; } } } if(!cellSupported){ allCellsSupported=false; break; } } if(!allCellsSupported){ canPlace=false; } }
                     if(canPlace){ const newKey=getBlockKey(placeX,placeY,placeZ); if(!blocks[newKey]){ blocks[newKey]={x:placeX,y:placeY,z:placeZ,color:colorSelect.value,type:selectedPieceType}; updateAllPalettePreviews(); } }
                 }
             }
             isDragging = false;
             isRotating = false;
             canvas.dataset.pendingPlacementTarget = '';
        }

        function handleMouseLeave(event) {
             if (isDragging) { console.log("Ending drag (leave canvas)"); }
             isDragging = false;
             isRotating = false;
             canvas.dataset.pendingPlacementTarget = '';
        }

        // --- Handler Roda do Mouse (Zoom - sem mudanças) ---
        function handleMouseWheel(event) {
            event.preventDefault(); const rect = canvas.getBoundingClientRect(); const mouseX = event.clientX - rect.left; const mouseY = event.clientY - rect.top; const mouseOffsetX = mouseX - originX; const mouseOffsetY = mouseY - originY; const oldScaleFactor = scaleFactor;
            if (event.deltaY < 0) { scaleFactor *= zoomStep; } else if (event.deltaY > 0) { scaleFactor /= zoomStep; }
            scaleFactor = Math.max(minScaleFactor, Math.min(maxScaleFactor, scaleFactor));
            if (scaleFactor !== oldScaleFactor) { const scaleRatio = scaleFactor / oldScaleFactor; const deltaOriginX = mouseOffsetX - (mouseOffsetX * scaleRatio); const deltaOriginY = mouseOffsetY - (mouseOffsetY * scaleRatio); originX += deltaOriginX; originY += deltaOriginY; }
        }

        // --- Paleta e Categorias (Sem alterações na lógica, mas usará o drawBlock revisado) ---
        function setupCategorySelector() {
             const categories = [...new Set(Object.values(pieceDefinitions).map(p => p.category || 'Uncategorized'))].sort();
             categorySelect.innerHTML = '<option value="All">Todas</option>';
             categories.forEach(cat => {
                 const option = document.createElement('option');
                 option.value = cat; option.textContent = cat;
                 categorySelect.appendChild(option);
             });
             categorySelect.addEventListener('change', () => {
                 setupPalette(categorySelect.value);
             });
        }

        // --- Função para desenhar miniatura (Usa o drawBlock revisado) ---
        function drawPalettePreview(previewCtx, pieceType, color) {
            const canvasWidth = previewCtx.canvas.width;
            const canvasHeight = previewCtx.canvas.height;
            previewCtx.clearRect(0, 0, canvasWidth, canvasHeight);

            const def = getPieceDefinition(pieceType);
            if (!def) return;

            const previewScale = Math.min(canvasWidth / (Math.max(def.width, def.depth) * blockSize * 1.8), canvasHeight / (def.height * blockVisualHeightUnit * 1.5), 1.5);
            const previewAngleX = Math.PI / 5;
            const previewOriginX = canvasWidth / 2;
            const previewOriginY = canvasHeight * 0.75;

            const projectPreview = (x, y, z) => project(x, y, z, previewOriginX, previewOriginY, previewScale, previewAngleX);

            const previewBlock = {
                x: -def.width / 2,
                y: -def.depth / 2,
                z: 0,
                color: color,
                type: pieceType
            };

            // Desenha o bloco na miniatura, *SEM STUDS* (drawStuds = false) para simplificar preview
            // Mas usa a nova lógica de shading e contorno do drawBlock revisado.
            drawBlock(previewBlock, previewCtx, projectPreview, false, previewScale);
        }


        function setupPalette(filterCategory = 'All') {
             paletteContainer.innerHTML = '';
             const currentSelectedColor = colorSelect.value;

             for (const type in pieceDefinitions) {
                 const def = pieceDefinitions[type];
                 if (filterCategory === 'All' || def.category === filterCategory) {
                     const item = document.createElement('div');
                     item.classList.add('palette-item');
                     item.dataset.type = type;

                     const previewCanvas = document.createElement('canvas');
                     previewCanvas.width = 45;
                     previewCanvas.height = 45;
                     previewCanvas.dataset.pieceType = type;
                     item.appendChild(previewCanvas);

                     const nameSpan = document.createElement('span');
                     nameSpan.textContent = def.name;
                     item.appendChild(nameSpan);


                     if (type === selectedPieceType) {
                         item.classList.add('selected');
                     }

                     item.addEventListener('click', () => {
                         const currentSelected = paletteContainer.querySelector('.palette-item.selected');
                         if (currentSelected) { currentSelected.classList.remove('selected'); }
                         item.classList.add('selected');
                         selectedPieceType = type;
                     });

                     paletteContainer.appendChild(item);

                     const previewCtx = previewCanvas.getContext('2d');
                     drawPalettePreview(previewCtx, type, currentSelectedColor); // Chama função que usa o drawBlock revisado
                 }
             }

             colorSelect.removeEventListener('change', updateAllPalettePreviews);
             colorSelect.addEventListener('change', updateAllPalettePreviews);
        }

        // --- Função para atualizar TODAS as miniaturas (Sem alterações) ---
        function updateAllPalettePreviews() {
             const newColor = colorSelect.value;
             const previewCanvases = paletteContainer.querySelectorAll('.palette-item canvas');
             previewCanvases.forEach(pCanvas => {
                 const type = pCanvas.dataset.pieceType;
                 const pCtx = pCanvas.getContext('2d');
                 if (type && pCtx) {
                     drawPalettePreview(pCtx, type, newColor);
                 }
             });
        }


        // --- Inicialização (Sem alterações) ---
        function init() {
            infoDiv.textContent = "Clique esquerdo para adicionar, direito para remover. Arraste esquerdo para girar. Roda do mouse para Zoom.";
            setupCategorySelector();
            setupPalette();

            clearAllButton.addEventListener('click', () => { if (confirm("Limpar toda a construção?")) { blocks = {}; updateAllPalettePreviews();} }); // Atualiza previews no clear

            // Event Listeners do Canvas Principal
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('mouseleave', handleMouseLeave);
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            canvas.addEventListener('wheel', handleMouseWheel);

            // Resize Logic
            function resizeCanvas() {
                const mainContent = document.getElementById('main-content');
                const availableWidth = mainContent.clientWidth - 20; const availableHeight = mainContent.clientHeight - controlsDiv.offsetHeight - 20;
                const aspectRatio = 4 / 3; let canvasWidth = availableWidth; let canvasHeight = availableWidth / aspectRatio;
                if (canvasHeight > availableHeight) { canvasHeight = availableHeight; canvasWidth = canvasHeight * aspectRatio; }
                canvas.width = Math.max(400, Math.floor(canvasWidth)); canvas.height = Math.max(300, Math.floor(canvasHeight));
                 originX = canvas.width / 2; originY = canvas.height * 0.70;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            drawScene();
        }

        init();
    </script>
